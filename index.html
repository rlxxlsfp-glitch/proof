<text x="214" y="70">y=3</text><text x="44" y="159">y=−3</text><text x="216" y="200" class="tb">f</text><text x="216" y="56" class="tb">g</text>
<text x="90" y="125" text-anchor="middle">−4</text><text x="210" y="125" text-anchor="middle">4</text></svg>
<figcaption>점선 직사각형: 가로 8, 세로 6</figcaption></figure>
<div class="step">\(y=-3\)과 \(f\) 사이 조각 A는 \(y=\sqrt{x+4}\) 아래 넓이와 같고, \(y=3\)과 \(g\) 사이 조각 B는 \(y=\sqrt{4-x}\) 아래 넓이와 같아요. 이 둘은 \(y\)축 대칭이라 넓이가 같아요.</div>
<div class="step">구하는 넓이 = 직사각형 − B + A = 직사각형 = \(8\times6=48\).</div>`,
  v:{ q:R`두 함수 \(f(x)=\sqrt{x+2}+1\), \(g(x)=\sqrt{2-x}-3\)의 그래프와 두 직선 \(x=-2,\ x=2\)로 둘러싸인 도형의 넓이는?`, ch:['8','12','16','20','24'], a:2, hint:R`\(y=1\)과 \(y=-3\) 사이 직사각형.`,
      sol:R`<div class="step">\(f\)는 \(y=1\) 위로 \(\sqrt{x+2}\)만큼, \(g\)는 \(y=-3\) 위로 \(\sqrt{2-x}\)만큼. 두 조각의 넓이가 같아 서로 상쇄돼요.</div><div class="step">넓이 = 가로 4 × 세로 4 = 16.</div>` } },

{ id:'1411', tag:'그래프가 지나는 사분면', c:'c4', t:100, src:'유형 해결의 법칙 공통수학2 p.194, 1411번 (STEP 3 내신 마스터)',
  q:R`정의역이 \(\{x\mid x>a\}\)인 함수 \(y=\sqrt{2x-2a}-a^2+1\)의 그래프가 오직 하나의 사분면을 지나도록 하는 실수 \(a\)의 최댓값은?`,
  ch:['−2','−1','0','1','2'], a:3,
  hint:R`시작점 \((a,\ 1-a^2)\)이 어디 있어야 1사분면만 지날까요?`,
  sol:R`<div class="step">\(y=\sqrt{2(x-a)}+(1-a^2)\): 시작점 \((a,\ 1-a^2)\)에서 오른쪽 위로 뻗어요 (시작점 자체는 정의역에서 빠짐).</div>
<div class="step">오른쪽 위로 끝없이 가니 결국 1사분면에 들어가요. 그래서 1사분면만 지나야 해요.</div>
<div class="step">시작점이 \(x\ge0\), \(y\ge0\)에 있어야 함: \(a\ge0\), \(1-a^2\ge0\) → \(0\le a\le1\).</div>
<div class="step">최댓값 1.</div>
<div class="warn"><b>경계</b>\(a=1\)이면 시작점 \((1,0)\)이 \(x\)축 위지만 정의역이 \(x>1\)이라 그래프는 1사분면 안에만 있어요.</div>`,
  v:{ q:R`정의역이 \(\{x\mid x>a\}\)인 함수 \(y=\sqrt{3x-3a}-a+2\)의 그래프가 오직 하나의 사분면을 지나도록 하는 실수 \(a\)의 최댓값은?`, ch:['−2','0','1','2','3'], a:3, hint:R`시작점 \((a,\ 2-a)\).`,
      sol:R`<div class="step">\(a\ge0\), \(2-a\ge0\) → \(0\le a\le2\). 최댓값 2.</div>` } },
],
sheet:[
 ['실수 조건', R`근호 안 \(\ge0\), 분모 \(\ne0\)`],
 ['음수 제곱근', R`\(\sqrt a\sqrt b=-\sqrt{ab}\) → \(a<0,\ b<0\) / \(\dfrac{\sqrt a}{\sqrt b}=-\sqrt{\dfrac ab}\) → \(a\ge0,\ b<0\)`],
 ['그래프', R`\(y=\sqrt{a(x-p)}+q\): 시작점 \((p,q)\)`],
 ['역함수', R`\(y=\sqrt{x-p}+q\) ↔ \(y=(x-q)^2+p\ (x\ge q)\)`],
]
});

</script>
<script>
/* ===== 일타 강사 스타일 개념 설명 ===== */
const RC = (t)=>`<div class="recall"><b>📍 어디서 봤더라?</b>${t}</div>`;
const SUM = (t)=>`<div class="sum"><b>한 줄 정리</b>${t}</div>`;
const NEWC = {
prop:[
{ id:'c1', title:'명제, 조건, 진리집합', body: R`
${RC(R`바로 앞 단원 <b>집합</b>에서 원소, 부분집합, 여집합 배웠죠? 명제 단원은 사실 그 집합 얘기를 <b>문장</b>으로 다시 하는 거예요. 집합 잘했으면 이미 반은 먹고 들어간 거예요.`)}
<p><b>1. 명제가 뭐냐면</b></p>
<p>참인지 거짓인지 <b>딱 잘라 말할 수 있는</b> 문장이에요.</p>
<ul><li>‘2는 소수이다’ → 참. 명제 O</li><li>‘3 &gt; 5’ → 거짓. 그래도 명제 O (거짓도 명제예요!)</li><li>‘수학은 재밌다’ → 사람마다 달라요. 명제 X</li></ul>
<p><b>2. 조건은 뭐냐면</b></p>
<p>‘\(x+1=3\)’은 \(x\)가 2면 참, 아니면 거짓이죠. 이렇게 <b>\(x\) 값에 따라 참·거짓이 바뀌는</b> 문장을 조건이라고 하고, \(p\), \(q\)처럼 이름을 붙여요.</p>
<p><b>3. 진리집합: 조건을 집합으로 번역</b></p>
<p>조건을 참으로 만드는 애들만 모은 집합이에요. 예를 들어 \(U=\{1,2,3,4,5,6\}\)에서 \(p\): \(x\)는 짝수 → \(P=\{2,4,6\}\).</p>
<p>이 단원은 결국 “조건 → 집합으로 바꾸고, 집합으로 판단하기”예요. 이것만 기억해도 반은 끝나요.</p>
<p><b>4. 부정 \(\sim p\)</b></p>
<p>‘\(p\)가 아니다’예요. 진리집합은 여집합 \(P^C\). 위 예에서 \(\sim p\): \(x\)는 홀수 → \(\{1,3,5\}\).</p>
<div class="key"><b>‘또는’, ‘그리고’의 부정</b>집합에서 \((A\cup B)^C=A^C\cap B^C\) 배운 거 기억나요? 그거랑 똑같아요.<br>‘\(p\) 또는 \(q\)’의 부정 → ‘\(\sim p\) 그리고 \(\sim q\)’<br>‘\(p\) 그리고 \(q\)’의 부정 → ‘\(\sim p\) 또는 \(\sim q\)’</div>
<p>예) \(x\ge1\)의 부정은 \(x<1\). 등호는 반대편으로 넘어가요.<br>\(-1<x\le2\)는 ‘\(x>-1\) 그리고 \(x\le2\)’라서 부정은 ‘\(x\le-1\) 또는 \(x>2\)’.</p>
<div class="warn"><b>시험에 자주 나오는 함정</b>\(ab=0\)은 ‘\(a=0\) <b>또는</b> \(b=0\)’ → 부정은 ‘\(a\ne0\) 그리고 \(b\ne0\)’<br>\(a^2+b^2=0\)은 ‘\(a=0\) <b>그리고</b> \(b=0\)’ → 부정은 ‘\(a\ne0\) 또는 \(b\ne0\)’</div>
${SUM(R`조건은 집합으로 번역한다. 부정은 여집합.`)}`},

{ id:'c2', title:'명제 p → q 의 참, 거짓', body: R`
${RC(R`중학교 도형 단원에서 ‘이등변삼각형<b>이면</b> 두 밑각의 크기가 같다’ 같은 문장 많이 썼죠? 그게 다 ‘\(p\)이면 \(q\)이다’ 꼴이에요. 이제 이걸 집합 그림으로 참·거짓을 판정해요.`)}
<p>‘\(p\)이면 \(q\)이다’에서 \(p\)는 <b>가정</b>, \(q\)는 <b>결론</b>이에요.</p>
<p><b>쉬운 예로 감 잡기</b></p>
<p>‘우리 반 학생이면 김포고 학생이다’ → 우리 반은 김포고 안에 쏙 들어가죠. 참!<br>‘김포고 학생이면 우리 반 학생이다’ → 옆 반 친구는요? 거짓! 옆 반 친구가 바로 <b>반례</b>예요.</p>
${FIG.vennSub}
<div class="key"><b>판정법 딱 하나</b>\(P\subset Q\) 이면 참, 아니면 거짓.<br>작은 쪽에서 큰 쪽으로 가는 화살표만 참이에요.</div>
${FIG.vennCex}
<p>거짓이라고 말하려면 <b>반례 하나</b>만 찾으면 돼요. 반례는 가정은 만족하는데 결론은 안 만족하는 것, 즉 \(P-Q\)에 있는 원소예요.</p>
<div class="tip"><b>반례 찾는 요령</b>제곱이 보이면 <b>음수</b>부터 넣어 보세요. (\(x^2=4\)이면 \(x=2\)? → \(x=-2\)!)<br>‘둘 다 무리수’ 같은 말엔 하나만 무리수인 경우를 넣어 보세요. (\(x=\sqrt2,\ y=0\))<br>0, 1, −1, 2 정도만 넣어 봐도 대부분 걸려요.</div>
${SUM(R`포함되면 참, 삐져나온 게 있으면 그게 반례.`)}`},

{ id:'c3', title:'‘모든’과 ‘어떤’', body: R`
${RC(R`공통수학1 이차부등식에서 ‘모든 실수 \(x\)에 대하여 성립할 조건’ 문제 풀었죠? 그때 판별식 \(D<0\) 쓴 거, 그게 바로 이 개념이에요.`)}
<p><b>교실로 생각해 보세요</b></p>
<ul><li>‘우리 반 <b>모든</b> 학생은 휴대폰이 있다’ → 한 명이라도 없으면 거짓이에요.</li><li>‘우리 반 <b>어떤</b> 학생은 안경을 쓴다’ → 딱 한 명만 써도 참이에요.</li></ul>
<div class="key"><b>집합으로 말하면</b>‘모든 \(x\)에 대하여 \(p\)’는 \(P=U\)일 때 참 (전부 다 만족)<br>‘어떤 \(x\)에 대하여 \(p\)’는 \(P\ne\varnothing\)일 때 참 (하나라도 있으면)</div>
<p><b>부정하는 법</b>: ‘모든’ ↔ ‘어떤’을 바꾸고, 뒤의 조건도 부정해요.</p>
<p>‘모든 학생이 휴대폰이 있다’의 부정은 ‘휴대폰이 <b>없는</b> 학생이 <b>있다</b>’, 즉 ‘어떤 학생은 휴대폰이 없다’예요. ‘모든 학생이 휴대폰이 없다’가 아니에요!</p>
<p>수식으로: ‘모든 실수 \(x\)에 대하여 \(x^2\ge0\)’ → 부정은 ‘어떤 실수 \(x\)에 대하여 \(x^2<0\)’.</p>
${SUM(R`모든은 전부, 어떤은 하나라도. 부정하면 서로 바뀐다.`)}`},

{ id:'c4', title:'역과 대우', body: R`
${RC(R`처음 보는 용어지만 생활에서 늘 쓰는 논리예요. 국어 시간 논증 단원에서 ‘전제가 참이면 결론도 참인가’ 따졌던 것과 같은 결이에요.`)}
<p><b>예시 하나로 전부 이해하기</b>: ‘비가 오면 땅이 젖는다’ (참)</p>
<ul><li><b>역</b>(앞뒤 바꾸기): ‘땅이 젖으면 비가 왔다’ → 누가 물을 뿌렸을 수도 있죠. 거짓!</li><li><b>대우</b>(앞뒤 바꾸고 둘 다 부정): ‘땅이 안 젖었으면 비가 안 왔다’ → 맞아요. 참!</li></ul>
${FIG.contra}
<div class="key"><b>핵심</b>원래 명제와 <b>대우</b>는 참·거짓이 항상 같다.<br>역은 그때그때 따로 확인해야 한다.</div>
<p><b>왜 대우는 같을까?</b> 집합 그림에서 \(P\subset Q\)이면, 밖에서 보면 \(Q\) 바깥(\(Q^C\))은 \(P\) 바깥(\(P^C\)) 안에 들어가요. 그래서 \(Q^C\subset P^C\), 즉 \(\sim q\to\sim p\)도 참이에요.</p>
<div class="tip"><b>문제에서 대우 쓰는 타이밍</b>조건에 <b>‘\(\ne\)’</b>가 보이면 대우로 바꾸세요. ‘\(\ne\)’가 ‘\(=\)’로 바뀌어서 대입만 하면 끝나요.<br>예) ‘\(x^2-ax+3\ne0\)이면 \(x-1\ne0\)’이 참<br>→ 대우: ‘\(x=1\)이면 \(x^2-ax+3=0\)’<br>→ \(1-a+3=0\), \(a=4\)</div>
${SUM(R`대우는 원래 명제랑 운명 공동체, 역은 남남.`)}`},

{ id:'c5', title:'충분조건과 필요조건', body: R`
${RC(R`앞에서 배운 ‘\(p\to q\)가 참 = \(P\subset Q\)’를 그대로 이름만 바꿔 부르는 거예요. 새로운 계산은 없어요.`)}
<p><b>예시로 이해하기</b>: ‘서울에 산다 ⇒ 한국에 산다’ (참)</p>
<ul><li>서울에 산다는 건, 한국에 산다는 걸 알기에 <b>충분</b>해요. → 서울은 한국이기 위한 <b>충분조건</b></li><li>한국에 살지 않으면 서울에 살 수가 없죠. 한국은 서울이기 위해 <b>필요</b>해요. → 한국은 서울이기 위한 <b>필요조건</b></li></ul>
${FIG.vennSub}
<div class="key"><b>정리</b>\(p\Rightarrow q\)이면 \(p\)는 \(q\)이기 위한 충분조건, \(q\)는 \(p\)이기 위한 필요조건.<br><b>작은 집합이 충분, 큰 집합이 필요.</b><br>둘 다 성립(\(P=Q\))하면 필요충분조건.</div>
<div class="warn"><b>문장 읽는 법 (제일 많이 헷갈림)</b>‘\(q\)는 \(p\)이기 위한 필요조건’ → 주어가 \(q\)라도, 화살표는 \(p\Rightarrow q\)예요.<br>요령: ‘<b>A는 B이기 위한 충분</b>’이면 A → B, ‘<b>A는 B이기 위한 필요</b>’면 B → A.</div>
<div class="tip"><b>여러 개 이어 붙이기</b>\(p\Rightarrow q\), \(q\Rightarrow r\)이면 \(p\Rightarrow r\) (삼단논법). 화살표가 안 이어지면 대우로 뒤집어서 이어 보세요.</div>
${SUM(R`작은 게 충분, 큰 게 필요.`)}`},

{ id:'c6', title:'증명: 대우 증명법, 귀류법', body: R`
${RC(R`중2 때 삼각형 합동 증명하면서 ‘가정 → 결론’ 순서로 썼던 거 기억나요? 이번엔 정면 돌파가 어려울 때 쓰는 우회로 두 가지를 배워요.`)}
<p><b>1. 대우를 이용한 증명</b>: 원래 명제가 어려우면 대우를 증명해요. (대우가 참이면 원래도 참이니까!)</p>
<p>예) ‘\(n^2\)이 짝수이면 \(n\)은 짝수’ → 바로는 막막하죠.<br>대우: ‘\(n\)이 홀수이면 \(n^2\)은 홀수’ → \(n=2k+1\)이면 \(n^2=4k^2+4k+1=2(2k^2+2k)+1\), 홀수! 끝.</p>
<p><b>2. 귀류법</b>: “일단 결론이 틀렸다고 쳐 보자 → 말이 안 되는 상황(모순)이 생기네 → 그러니까 결론이 맞다.”</p>
<p>예) \(\sqrt2\)는 무리수다.<br>유리수라고 치면 \(\sqrt2=\dfrac{m}{n}\) (\(m, n\)은 서로소) → \(m^2=2n^2\) → \(m\)은 짝수 → \(m=2k\)를 넣으면 \(n^2=2k^2\) → \(n\)도 짝수 → 둘 다 짝수면 서로소가 아니잖아요! 모순.</p>
<div class="tip"><b>서술형 포인트</b>빈칸 채우기로 자주 나와요. ‘\(m^2\)이 짝수이므로 \(m\)도 짝수’라는 줄이 바로 위 대우 증명 결과를 쓰는 부분이에요.</div>
${SUM(R`정면이 막히면 대우로 돌아가거나, 반대로 가정해서 모순을 찾는다.`)}`},
],

ineq:[
{ id:'c1', title:'절대부등식이 뭐냐면', body: R`
${RC(R`공통수학1 부등식 단원에서는 ‘\(x>3\)’처럼 <b>\(x\)의 범위를 구하는</b> 게 목표였죠. 이번엔 반대예요. 아무 수나 넣어도 <b>항상 참인</b> 부등식을 다뤄요.`)}
<p>‘\(x^2+1>0\)’을 보세요. \(x\)에 뭘 넣어도 참이죠? 이런 게 <b>절대부등식</b>이에요. 반면 ‘\(x>3\)’은 \(x=1\)이면 거짓이라 절대부등식이 아니에요.</p>
<p><b>모든 것의 출발점: (실수)\(^2\ge0\)</b></p>
<p>실수를 제곱하면 절대 음수가 안 되죠. 이 사실 하나로 거의 다 증명돼요.</p>
<p>예) \(a^2+b^2\ge2ab\) 증명: 빼 보면 \(a^2+b^2-2ab=(a-b)^2\ge0\). 끝! 등호는 \(a=b\)일 때.</p>
<div class="key"><b>증명 공식</b>(좌변) − (우변)을 만들어서 완전제곱식으로 바꾼다 → \(\ge0\) 이면 증명 끝.<br>양변이 양수면 제곱해서 비교해도 돼요.</div>
<ul><li>\(a^2\pm ab+b^2\ge0\)</li><li>\(|a|+|b|\ge|a+b|\) (등호는 \(ab\ge0\))</li></ul>
${SUM(R`빼서 완전제곱 만들면 증명 끝.`)}`},

{ id:'c2', title:'산술평균과 기하평균의 관계', body: R`
${RC(R`평균 내는 법은 초등학교 때부터 알죠? \(\dfrac{a+b}{2}\), 이게 <b>산술평균</b>이에요. 오늘은 친구 하나가 더 나와요. 바로 <b>기하평균</b> \(\sqrt{ab}\).`)}
<p><b>기하평균은 뭘까?</b> 가로 \(a\), 세로 \(b\)인 직사각형이 있을 때, 넓이가 똑같은 정사각형의 한 변이 \(\sqrt{ab}\)예요.</p>
<div class="key"><b>공식</b>\(a>0,\ b>0\)일 때 \(\dfrac{a+b}{2}\ge\sqrt{ab}\), 등호는 \(a=b\)일 때.<br>시험에서는 이 모양으로 써요: \(a+b\ge2\sqrt{ab}\)</div>
${FIG.amgm}
<p>그림에서 반지름(산술평균)이 높이(기하평균)보다 항상 길거나 같죠. 딱 가운데(\(a=b\))일 때만 같아요.</p>
<p><b>언제 쓰냐면</b></p>
<ul><li><b>곱이 일정</b> → 합의 최솟값: \(x+\dfrac9x\ge2\sqrt{x\cdot\dfrac9x}=2\sqrt9=6\) (\(x=3\)일 때)</li><li><b>합이 일정</b> → 곱의 최댓값: \(a+b=10\)이면 \(10\ge2\sqrt{ab}\), \(ab\le25\)</li></ul>
<div class="warn"><b>쓰기 전에 체크 2개</b>① 두 수가 둘 다 양수인가?<br>② 등호(\(a=b\))가 실제로 될 수 있나? 안 되면 그 값은 최솟값이 아니에요.</div>
${SUM(R`곱이 일정하면 합의 최소, 합이 일정하면 곱의 최대. 양수랑 등호 확인!`)}`},

{ id:'c3', title:'산술·기하 활용 기술', body: R`
${RC(R`바로 앞 개념의 응용이에요. 문제에서는 공식이 바로 보이게 안 주고, 살짝 꼬아서 줘요. 꼬인 걸 푸는 기술 두 개만 알면 돼요.`)}
<p><b>기술 1. 곱해서 상수 만들기</b></p>
<p>\(x>1\)일 때 \(x+\dfrac{4}{x-1}\)의 최솟값? \(x\cdot\dfrac{4}{x-1}\)은 상수가 아니라서 바로 못 써요.<br>그래서 \(x\)를 \((x-1)+1\)로 쪼개요.</p>
<p>\((x-1)+\dfrac{4}{x-1}+1\ge2\sqrt4+1=5\). 이제 곱하면 4로 상수죠!</p>
<p><b>기술 2. 조건식을 곱해서 펼치기</b></p>
<p>\(x+2y=4\)일 때 \(\dfrac1x+\dfrac2y\)의 최솟값?<br>→ \(\left(\dfrac1x+\dfrac2y\right)(x+2y)\)를 전개하면 \(5+\dfrac{2y}{x}+\dfrac{2x}{y}\)가 나와요. 뒤의 두 항은 곱하면 4, 산술·기하 쓸 수 있어요.</p>
<div class="warn"><b>함정</b>산술·기하를 두 번 쓰면 등호 조건이 서로 달라서 동시에 성립 못 할 수 있어요. 그럴 땐 한 번에 쓸 수 있게 식을 다시 묶으세요.</div>
${SUM(R`곱했을 때 문자가 사라지게 쪼개거나 곱해서 펼친다.`)}`},

{ id:'c4', title:'코시-슈바르츠 부등식', body: R`
${RC(R`이건 진짜 처음 보는 공식이에요. 근데 겁먹을 필요 없어요. 모양만 외우면 대입이 끝이에요.`)}
<div class="key"><b>공식 모양</b>(제곱의 합) × (제곱의 합) ≥ (짝끼리 곱해서 더한 것)\(^2\)<br>\((a^2+b^2)(x^2+y^2)\ge(ax+by)^2\)<br>등호는 \(\dfrac{x}{a}=\dfrac{y}{b}\)일 때 (짝끼리 비율이 같을 때)</div>
<p><b>언제 꺼내냐면</b></p>
<ul><li>일차식 값(\(x+2y=\cdots\))이 주어지고 <b>제곱의 합</b>(\(x^2+y^2\))의 최솟값을 물을 때</li><li>제곱의 합이 주어지고 <b>일차식</b>의 최댓값·최솟값을 물을 때</li></ul>
<p>예) \(x^2+y^2=5\)일 때 \(x+2y\)의 범위<br>\((1^2+2^2)(x^2+y^2)\ge(1\cdot x+2\cdot y)^2\) → \(25\ge(x+2y)^2\) → \(-5\le x+2y\le5\)</p>
<div class="tip"><b>요령</b>계수 맞추기가 전부예요. \(4x^2\)이 보이면 \((2x)^2\)으로 보고 짝을 정하세요.<br>참고로 이 예시는 원 \(x^2+y^2=5\)와 직선 \(x+2y=k\)가 만나는 조건이랑 같아요. 도형의 방정식이랑 연결돼요.</div>
${SUM(R`제곱합 × 제곱합 ≥ (짝곱의 합)².`)}`},
],

func:[
{ id:'c1', title:'함수의 뜻, 정의역·공역·치역', body: R`
${RC(R`중1 때 정비례 \(y=2x\), 반비례 \(y=\dfrac{6}{x}\), 중2 일차함수, 중3 이차함수까지 다 ‘함수’였어요. 그때 “\(x\)를 하나 정하면 \(y\)가 하나 정해지는 관계”라고 배웠죠. 이번엔 그걸 <b>집합</b>으로 다시 보는 거예요.`)}
<p><b>자판기로 생각해 보세요</b></p>
<ul><li>버튼(\(x\))을 누르면 음료(\(y\))가 <b>딱 하나</b> 나와야 정상이에요.</li><li>버튼 하나에 음료 두 개 → 고장! 함수 아님</li><li>아무것도 안 나오는 버튼이 있다 → 고장! 함수 아님</li><li>다른 버튼인데 같은 음료가 나온다 → 괜찮아요. 함수 맞음</li></ul>
${mapDiagram(['1','2','3'],['a','b','c'],[[0,0],[1,0],[2,1]],'함수 O: 1, 2가 같은 곳으로 가도 OK. c가 남아도 OK.')}
${mapDiagram(['1','2','3'],['a','b','c'],[[0,0],[0,1],[1,2]],'함수 X: 1이 두 군데로, 3은 갈 곳이 없음.')}
<div class="key"><b>용어 (자판기 버전)</b><b>정의역 \(X\)</b> = 버튼 전체<br><b>공역 \(Y\)</b> = 진열장에 있는 음료 전체<br><b>치역</b> = 실제로 나오는 음료들 (\(\subset\) 공역)</div>
<p><b>그래프로 판정</b>: 세로선(\(x=k\))을 쭉 그어서 그래프와 항상 한 점에서만 만나면 함수예요.</p>
<div class="tip"><b>문제 유형</b>‘\(X\)에서 \(Y\)로의 함수인가?’ → \(X\)의 원소를 하나씩 다 넣어 보고, 결과가 전부 \(Y\) 안에 있는지 확인.</div>
${SUM(R`버튼 하나에 음료 하나. 남는 음료는 괜찮다.`)}`},

{ id:'c2', title:'서로 같은 함수', body: R`
${RC(R`집합에서 ‘두 집합이 같다’는 원소가 완전히 같다는 뜻이었죠. 함수도 비슷해요.`)}
<p>두 함수 \(f, g\)가 같으려면 세 가지가 다 같아야 해요.</p>
<ul><li>정의역이 같고</li><li>공역이 같고</li><li>정의역의 모든 \(x\)에서 \(f(x)=g(x)\)</li></ul>
<p>예) \(X=\{-1,1\}\)에서 \(f(x)=x^2\), \(g(x)=|x|\) → 식은 다르게 생겼는데 넣어 보면 둘 다 1이에요. 그래서 같은 함수!</p>
${SUM(R`식 모양 말고, 넣었을 때 결과가 같은지 본다.`)}`},

{ id:'c3', title:'일대일함수와 일대일대응', body: R`
${RC(R`중2 일차함수 그래프 기억나요? 계속 올라가거나 계속 내려가는 직선이었죠. 그런 그래프가 바로 일대일대응의 대표 선수예요.`)}
<p><b>교실 사물함으로 생각하기</b></p>
<ul><li><b>일대일함수</b>: 학생마다 <b>서로 다른</b> 사물함을 써요. 두 명이 한 사물함을 같이 쓰면 안 돼요. (빈 사물함은 남아도 OK)</li><li><b>일대일대응</b>: 일대일함수인데, 빈 사물함도 <b>하나도 없어요</b>. 학생 수 = 사물함 수, 딱 맞게 짝지어짐.</li></ul>
<div class="key"><b>정의</b>일대일함수: \(x_1\ne x_2\)이면 \(f(x_1)\ne f(x_2)\)<br>일대일대응: 일대일함수 + 치역 = 공역</div>
${FIG.hline}
<p><b>그래프로 판정</b>: 가로선을 그어서 두 번 이상 만나면 일대일이 아니에요. 이차함수(포물선)는 가로선이 두 번 만나니까 일대일 X.</p>
<div class="warn"><b>구간별 함수 문제</b>\(x\ge0\)과 \(x<0\)에서 식이 다른 함수가 일대일대응이려면<br>① 두 직선 기울기의 <b>부호가 같고</b> (둘 다 올라가거나 둘 다 내려가거나)<br>② 경계에서 <b>끊기지 않고 이어져야</b> 해요.</div>
${SUM(R`가로선 테스트 통과 + 빈자리 없음 = 일대일대응.`)}`},

{ id:'c4', title:'항등함수, 상수함수, 함수의 개수', body: R`
${RC(R`공통수학1 경우의 수에서 순열 \(_n\mathrm{P}_r\), 팩토리얼 \(n!\) 배웠죠? 함수 개수 세는 데 그대로 써요.`)}
<ul><li><b>항등함수</b>: 넣은 그대로 나와요. \(f(x)=x\)</li><li><b>상수함수</b>: 뭘 넣어도 같은 값. \(f(x)=c\)</li></ul>
<p><b>함수 개수 세기</b> (\(n(X)=m\), \(n(Y)=n\))</p>
<p>\(X\)의 원소 하나하나가 \(Y\)의 어디로 갈지 고르는 문제예요.</p>
<ul><li><b>함수</b>: 각자 \(n\)곳 중 아무 데나 → \(n\times n\times\cdots=n^m\)</li><li><b>일대일함수</b>: 겹치면 안 되니까 하나씩 줄어요 → \(n(n-1)(n-2)\cdots=\,_n\mathrm{P}_m\)</li><li><b>일대일대응</b> (\(m=n\)): \(n!\)</li></ul>
<div class="tip"><b>항등함수 문제 꿀팁</b>‘\(f\)가 \(X\)에서 \(X\)로의 항등함수’라고 하면 \(f(x)=x\)를 푸세요. 그 해들이 곧 \(X\)의 원소예요.</div>
${SUM(R`함수 \(n^m\), 일대일 \(_n\mathrm{P}_m\), 일대일대응 \(n!\).`)}`},
],

inv:[
{ id:'c1', title:'합성함수', body: R`
${RC(R`바로 앞의 ‘함수’ 개념에서 이어져요. 함수 두 개를 기계처럼 연결하는 거예요.`)}
<p><b>공장 컨베이어 벨트를 떠올려 보세요</b></p>
<p>재료 \(x\)가 먼저 <b>\(g\) 기계</b>를 통과해서 \(g(x)\)가 되고, 그다음 <b>\(f\) 기계</b>를 통과해서 \(f(g(x))\)가 돼요. 이걸 \((f\circ g)(x)\)라고 써요.</p>
<div class="key"><b>정의</b>\((f\circ g)(x)=f(g(x))\)<br><b>오른쪽(안쪽) \(g\)부터</b> 계산한다!</div>
<p>예) \(f(x)=2x+1,\ g(x)=x^2\)<br>\((f\circ g)(2)=f(g(2))=f(4)=9\)<br>\((g\circ f)(2)=g(f(2))=g(5)=25\) → 순서 바꾸면 결과가 달라요.</p>
<ul><li>교환법칙 X: \(f\circ g\ne g\circ f\) (보통)</li><li>결합법칙 O: \((f\circ g)\circ h=f\circ(g\circ h)\)</li></ul>
<div class="tip"><b>\(f\circ g=h\)에서 \(f(\square)\) 구하기</b>\(f\) 식 전체를 구할 필요 없어요. \(g(x)=\square\)가 되는 \(x\)를 찾아서 \(h(x)\)에 넣으면 끝.</div>
${SUM(R`안쪽부터 차례로 통과.`)}`},

{ id:'c2', title:'역함수의 뜻과 구하는 법', body: R`
${RC(R`일대일대응 개념 기억나죠? 그게 여기서 필요해요. 역함수는 함수를 ‘되감기’하는 거예요.`)}
<p><b>되감기로 생각하기</b>: \(f\)가 “2배 하고 1 더하기”라면, 되돌리는 \(f^{-1}\)은 “1 빼고 2로 나누기”예요.<br>\(f(3)=7\)이면 \(f^{-1}(7)=3\).</p>
<div class="key"><b>핵심 한 줄</b>\(f(a)=b\) ⟺ \(f^{-1}(b)=a\)</div>
<p><b>왜 일대일대응이어야 할까?</b> \(f(1)=5\), \(f(2)=5\)라면 5를 되감을 때 1로 가야 할지 2로 가야 할지 모르잖아요. 그래서 일대일대응일 때만 역함수가 있어요.</p>
<p><b>역함수 구하는 순서</b></p>
<ul><li>① \(y=f(x)\)를 \(x=\cdots\) 꼴로 정리</li><li>② \(x\)와 \(y\)를 바꾸기</li><li>③ 정의역 ↔ 치역도 바뀐다</li></ul>
<p>예) \(y=3x-6\) → \(x=\dfrac{y}{3}+2\) → \(f^{-1}(x)=\dfrac{x}{3}+2\)</p>
<div class="tip"><b>값만 물어보면?</b>\(f^{-1}(5)\)를 구하라고 하면 역함수 식 만들지 말고 \(f(x)=5\)를 풀어요. 훨씬 빨라요.</div>
${SUM(R`\(f(a)=b\)면 \(f^{-1}(b)=a\). 일대일대응만 되감기 가능.`)}`},

{ id:'c3', title:'역함수의 성질', body: R`
${RC(R`합성함수랑 역함수를 섞으면 어떻게 될까요? 성질 3개만 챙기면 돼요.`)}
<ul><li>\((f^{-1})^{-1}=f\) → 되감기를 되감으면 원래대로</li><li>\(f^{-1}\circ f=I\), \(f\circ f^{-1}=I\) → 했다가 되감으면 제자리</li><li>\((f\circ g)^{-1}=g^{-1}\circ f^{-1}\) → <b>순서가 뒤집혀요</b></li></ul>
<p><b>순서가 왜 뒤집힐까? 양말과 신발!</b> 신을 땐 양말(\(g\)) → 신발(\(f\)). 벗을 땐? 신발 먼저 벗고(\(f^{-1}\)), 그다음 양말(\(g^{-1}\)). 그래서 \(g^{-1}\circ f^{-1}\).</p>
<div class="warn"><b>자주 틀림</b>\((g\circ f)^{-1}(2)=f^{-1}(g^{-1}(2))\). \(g^{-1}\)부터 계산해요.</div>
<p>예) \((f\circ g)^{-1}(3x-1)=x\)이면, 양쪽에 \(f\circ g\)를 씌워서 \((f\circ g)(x)=3x-1\).</p>
${SUM(R`벗을 땐 신발부터.`)}`},

{ id:'c4', title:'역함수의 그래프', body: R`
${RC(R`<b>도형의 이동</b> 단원에서 직선 \(y=x\)에 대한 대칭이동은 \(x\)와 \(y\)를 바꾸는 거였죠? 역함수 구할 때도 \(x, y\)를 바꿨어요. 그래서 역함수 그래프는 \(y=x\)에 대칭이에요!`)}
${FIG.inverse}
<div class="key"><b>대칭</b>\(y=f(x)\)와 \(y=f^{-1}(x)\)의 그래프는 직선 \(y=x\)에 대해 대칭.</div>
<p><b>두 그래프의 교점 찾기</b>: \(f\)가 <b>증가함수</b>(계속 올라가는 함수)이면, 두 그래프는 꼭 \(y=x\) 위에서 만나요. 그래서 \(f(x)=x\)만 풀면 돼요.</p>
<div class="warn"><b>감소함수는 예외</b>내려가는 함수는 \(y=x\) 밖에서도 만날 수 있어요. 이 방법 그대로 쓰면 안 돼요.</div>
<p>보너스: 자기 자신이 역함수인 일차함수는 \(y=x\) 또는 기울기가 \(-1\)인 직선(\(y=-x+k\))이에요. \(y=x\)로 접어도 그대로니까요.</p>
${SUM(R`역함수는 \(y=x\)로 접은 그림. 증가함수면 교점은 \(f(x)=x\).`)}`},
],

rat:[
{ id:'c1', title:'유리식 계산과 부분분수', body: R`
${RC(R`중학교 때 분수 통분, 약분 했죠? <b>유리식</b>은 분모에 문자가 있는 분수식일 뿐이에요. 계산 방법은 똑같아요. 공통수학1의 항등식(계수비교법, 수치대입법)도 여기서 다시 써요.`)}
<p>\(\dfrac{1}{x}+\dfrac{1}{x+1}\)처럼 분모에 문자가 들어간 식이 유리식이에요. 덧셈·뺄셈은 통분, 곱셈·나눗셈은 인수분해 후 약분.</p>
<p><b>부분분수: 분수 하나를 두 조각으로 쪼개기</b></p>
<p>통분의 반대 방향이에요. \(\dfrac1x-\dfrac1{x+2}\)를 통분하면 \(\dfrac{2}{x(x+2)}\)이죠? 그러니까 거꾸로 이렇게 쪼갤 수 있어요.</p>
<div class="key"><b>부분분수 공식</b>\[\frac{1}{AB}=\frac{1}{B-A}\left(\frac1A-\frac1B\right)\]분모의 차(\(B-A\))로 나눠 주는 것만 기억!</div>
<p><b>망원 합</b>: 쪼갠 걸 여러 개 더하면 가운데가 다 지워지고 <b>처음과 끝만</b> 남아요. 망원경 접듯이요.</p>
<div class="tip"><b>미정계수 구하기</b>\(\dfrac ax+\dfrac b{x-1}+\dfrac c{x-2}=\dfrac{4}{x(x-1)(x-2)}\) 같은 꼴은 양변에 분모를 곱하고 \(x=0,1,2\)를 하나씩 넣으면 바로 나와요. (공통수학1 수치대입법!)</div>
${SUM(R`쪼개고 더하면 처음과 끝만 남는다.`)}`},

{ id:'c2', title:'y = k/(x−p) + q 의 그래프', body: R`
${RC(R`중1 때 <b>반비례</b> \(y=\dfrac{a}{x}\) 그래프 그렸죠? 두 갈래로 휘어진 곡선. 그게 유리함수의 기본형이에요. 그리고 <b>도형의 이동</b>에서 평행이동은 \(x\to x-p\), \(y\to y-q\)였죠. 이 둘을 합치면 끝이에요.`)}
<p>\(y=\dfrac{k}{x-p}+q\)는 반비례 그래프 \(y=\dfrac kx\)를 <b>오른쪽으로 \(p\), 위로 \(q\)</b>만큼 옮긴 거예요.</p>
${FIG.rational}
<p><b>점근선이 뭐냐면</b>: 그래프가 한없이 가까이 가지만 절대 닿지 않는 선이에요.</p>
<ul><li>세로 점근선 \(x=p\): 분모가 0이 되면 안 되니까 \(x=p\)에서는 그래프가 없어요.</li><li>가로 점근선 \(y=q\): \(\dfrac{k}{x-p}\)는 절대 0이 안 되니까 \(y\)는 \(q\)가 될 수 없어요.</li></ul>
<div class="key"><b>바로 읽기</b>점근선 \(x=p,\ y=q\) / 정의역 \(x\ne p\) / 치역 \(y\ne q\)<br>\(k>0\)이면 1, 3사분면 방향, \(k<0\)이면 2, 4사분면 방향<br>\(|k|\)가 클수록 점근선 교점에서 멀어짐</div>
<div class="tip"><b>대칭</b>그래프는 점근선 교점 \((p,q)\)에 대해 점대칭이고, \((p,q)\)를 지나는 기울기 \(1\), \(-1\)인 두 직선에 대해 선대칭이에요.<br>그래서 ‘직선 \(y=x-1\)에 대해 대칭’이라는 말이 나오면 → \((p,q)\)가 그 직선 위에 있다!</div>
${SUM(R`반비례 그래프를 \((p,q)\)로 옮긴 것. 점근선 교점이 중심.`)}`},

{ id:'c3', title:'y = (ax+b)/(cx+d) 의 변형과 치역', body: R`
${RC(R`공통수학1 다항식의 나눗셈 기억나요? 분자를 분모로 나누는 그 방법으로 모양을 바꿔요.`)}
<p>\(y=\dfrac{5x-6}{x-2}\)처럼 생긴 건 바로 그래프가 안 보이죠. 분자를 분모로 나눠서 \(\dfrac{k}{x-p}+q\) 꼴로 바꿔요.</p>
<p>\(5x-6=5(x-2)+4\)이니까 \(y=\dfrac{5(x-2)+4}{x-2}=5+\dfrac{4}{x-2}\). 이제 점근선 \(x=2,\ y=5\)가 보이죠!</p>
<div class="key"><b>빠른 길</b>\(y=\dfrac{ax+b}{cx+d}\)의 점근선은 \(x=-\dfrac dc\), \(y=\dfrac ac\).<br>(분모가 0 되는 \(x\), 그리고 \(x\)의 계수끼리 나눈 값)</div>
<p><b>정의역이 일부만 주어지면?</b> 그 구간이 점근선 한쪽에만 있으면 그래프가 계속 올라가거나 계속 내려가요. 그래서 <b>양 끝값만 넣으면</b> 치역이 나와요.</p>
${SUM(R`나눠서 \(\dfrac{k}{x-p}+q\)로. 구간이면 양 끝값.`)}`},

{ id:'c4', title:'평행이동, 역함수', body: R`
${RC(R`평행이동은 도형의 이동, 역함수는 바로 앞 단원. 배운 걸 유리함수에 적용만 하면 돼요.`)}
<p><b>평행이동</b>: \(y=\dfrac kx\)를 \(x\)축 방향으로 \(p\), \(y\)축 방향으로 \(q\)만큼 옮기면 \(y=\dfrac{k}{x-p}+q\). 점근선 교점이 \((0,0)\)에서 \((p,q)\)로 이사 가는 거예요.</p>
<div class="tip"><b>문제 패턴</b>원이나 점의 이동으로 ‘얼마나 옮겼는지’를 알려 주는 문제가 많아요. 먼저 이동량부터 구하세요. 원 중심이 \((2,-1)\)에서 \((4,2)\)로 갔다면 이동량은 \((2,3)\).</div>
<div class="key"><b>역함수 공식</b>\(y=\dfrac{ax+b}{cx+d}\)의 역함수는 \(y=\dfrac{-dx+b}{cx-a}\)<br>\(a\)와 \(d\)의 자리를 바꾸고 둘 다 부호를 바꾼다.</div>
${SUM(R`이동량 먼저, 역함수는 \(a\)와 \(d\) 자리 바꾸고 부호 반대.`)}`},
],

irr:[
{ id:'c1', title:'무리식의 조건과 계산', body: R`
${RC(R`중3 때 <b>제곱근</b> 배웠죠? 근호 안에 음수는 안 된다, 분모에 근호가 있으면 유리화한다. 그리고 공통수학1 <b>복소수</b>에서 \(\sqrt{-2}=\sqrt2\,i\)도 했어요. 이게 전부 다시 나와요.`)}
<p><b>무리식</b>은 근호 안에 문자가 있는 식이에요. 예: \(\sqrt{x-1}\)</p>
<div class="key"><b>값이 실수가 되려면</b>근호 안 \(\ge0\), 분모 \(\ne0\). 이 두 개가 정의역을 정해요.</div>
<p><b>분모의 유리화</b> (중3 그대로):</p>
\[\frac{1}{\sqrt a+\sqrt b}=\frac{\sqrt a-\sqrt b}{a-b}\]
<div class="warn"><b>음수의 제곱근 (시험 단골)</b>보통은 \(\sqrt a\sqrt b=\sqrt{ab}\)인데, 이게 깨지는 경우가 딱 하나예요.<br>\(\sqrt a\sqrt b=-\sqrt{ab}\)이면 → \(a<0,\ b<0\)<br>\(\dfrac{\sqrt a}{\sqrt b}=-\sqrt{\dfrac ab}\)이면 → \(a\ge0,\ b<0\)<br>예) \(\sqrt{-8}\sqrt{-2}=(2\sqrt2 i)(\sqrt2 i)=4i^2=-4\)</div>
<p>\(\sqrt{x^2}=|x|\). 절댓값은 \(x\)의 범위를 알아야 풀 수 있어요.</p>
<div class="tip"><b>망원 합 (유리화 버전)</b>\[\frac{1}{\sqrt{n+1}+\sqrt n}=\sqrt{n+1}-\sqrt n\]여러 개 더하면 처음과 끝만 남아요.</div>
${SUM(R`근호 안 0 이상, 음수끼리 곱하면 마이너스가 붙는다.`)}`},

{ id:'c2', title:'y = √(a(x−p)) + q 의 그래프', body: R`
${RC(R`\(y=\sqrt x\)는 사실 중3 이차함수 \(y=x^2\)의 오른쪽 반쪽(\(x\ge0\))을 \(y=x\)로 접은 거예요. 바로 앞에서 배운 역함수! 그래서 모양이 <b>옆으로 누운 포물선 반쪽</b>이에요.`)}
${FIG.sqrt4}
<p>기본 모양 4개만 머리에 넣으세요. 시작점은 다 원점이고, 뻗는 방향만 달라요.</p>
<div class="key"><b>읽는 법 3단계</b>① 시작점은 \((p,q)\)<br>② 근호 <b>안</b> \(a\)의 부호: \(+\)면 오른쪽, \(-\)면 왼쪽<br>③ 근호 <b>앞</b> 부호: \(+\)면 위, \(-\)면 아래</div>
<ul><li>\(y=\sqrt{a(x-p)}+q\) (\(a>0\)): 정의역 \(x\ge p\), 치역 \(y\ge q\)</li><li>\(y=\sqrt{a(x-p)}+q\) (\(a<0\)): 정의역 \(x\le p\), 치역 \(y\ge q\)</li></ul>
<div class="warn"><b>꼭 먼저 묶기</b>\(\sqrt{2x+2}\)는 \(\sqrt{2(x+1)}\)로 묶어야 시작점 \(x=-1\)이 보여요. 안 묶고 \(x=-2\)라고 읽는 실수 진짜 많아요.</div>
${SUM(R`시작점 \((p,q)\), 안쪽 부호는 좌우, 바깥 부호는 위아래.`)}`},

{ id:'c3', title:'평행이동과 대칭이동', body: R`
${RC(R`<b>도형의 이동</b> 단원 내용을 무리함수에 그대로 써요. 식에서 뭘 바꾸면 되는지만 기억하면 돼요.`)}
<ul><li><b>평행이동</b> \((m,n)\): \(x\) 대신 \(x-m\), \(y\) 대신 \(y-n\)</li><li><b>\(x\)축 대칭</b>: \(y\) 대신 \(-y\) → 근호 앞 부호가 바뀜 (위아래 뒤집기)</li><li><b>\(y\)축 대칭</b>: \(x\) 대신 \(-x\) → 근호 안 부호가 바뀜 (좌우 뒤집기)</li><li><b>원점 대칭</b>: 둘 다</li></ul>
<div class="warn"><b>순서 주의</b>‘대칭이동 후 평행이동’과 ‘평행이동 후 대칭이동’은 결과가 달라요. 문제에 적힌 순서대로 식에 하나씩 적용하세요.</div>
<div class="tip"><b>넓이 문제 꿀팁</b>모양이 같은 무리함수 그래프 두 개 사이 넓이는, 한쪽을 잘라서 반대편에 붙이면 <b>직사각형</b>이 되는 경우가 많아요. 적분 없이 풀려요.</div>
${SUM(R`안쪽 바꾸면 좌우, 바깥 바꾸면 위아래.`)}`},

{ id:'c4', title:'역함수와 교점', body: R`
${RC(R`역함수 단원 + 공통수학1 판별식의 합작이에요. 처음엔 어려워 보여도 패턴이 정해져 있어요.`)}
<p><b>역함수</b>: \(y=\sqrt{x-p}+q\)의 역함수는 \(y=(x-q)^2+p\) (\(x\ge q\)). 이차함수의 <b>반쪽</b>이 돼요. 정의역 조건 꼭 붙이세요!</p>
<p><b>직선과 몇 번 만나는지</b>: 직선을 위아래로 움직여 본다고 상상하세요. 개수가 바뀌는 순간이 딱 두 개예요.</p>
<div class="key"><b>경계 두 개</b>① 직선이 그래프의 <b>시작점</b>을 지날 때<br>② 직선이 그래프에 <b>접할 때</b> (양변 제곱해서 판별식 \(D=0\))</div>

/* ========== 기록·통계 ========== */
function record(pid, variant, ok, sec){
  const k = pid + (variant ? 'v' : '');
  const a = S.att[k] || { n:0, ok:0, t:0, last:null, streak:0 };
  a.n++; if (ok) { a.ok++; a.streak++; } else a.streak = 0;
  a.t += sec; a.last = ok;
  S.att[k] = a;
  S.log.push({ k, ok, sec, at:Date.now() });
  if (S.log.length > 500) S.log = S.log.slice(-500);
  save();
}
function unitStats(u){
  let n=0, ok=0, t=0, tgt=0, solved=0; const tagWrong = {}; const why = {};
  u.problems.forEach(p=>{
    ['', 'v'].forEach(s=>{
      const a = S.att[p.id+s]; if (!a) return;
      n += a.n; ok += a.ok; t += a.t; tgt += p.t * a.n;
      if (a.n - a.ok > 0) tagWrong[p.tag] = (tagWrong[p.tag]||0) + (a.n - a.ok);
    });
    if (S.att[p.id]) solved++;
    const w = S.why[p.id]; if (w) w.forEach(x=>why[x]=(why[x]||0)+1);
  });
  return { n, ok, acc: n ? ok/n : null, avg: n ? t/n : 0, ratio: tgt ? t/tgt : 0, solved, tagWrong, why };
}
function conceptWrongCount(u, cid){
  let w = 0;
  u.problems.filter(p=>p.c===cid).forEach(p=>{ ['', 'v'].forEach(s=>{ const a=S.att[p.id+s]; if (a) w += a.n-a.ok; }); });
  const ck = u.checks.filter(c=>c.c===cid);
  ck.forEach((c,i)=>{ const r = S.checks[u.id+':'+u.checks.indexOf(c)]; if (r===false) w++; });
  return w;
}
function advice(u){
  const s = unitStats(u);
  const out = [];
  if (!s.n) return ['아직 푼 기록이 없어요. 개념 카드를 한 번 훑고, 개념 확인 문제부터 풀어 보세요.'];
  const pct = Math.round(s.acc*100);
  const topTag = Object.entries(s.tagWrong).sort((a,b)=>b[1]-a[1])[0];
  const topWhy = Object.entries(s.why).sort((a,b)=>b[1]-a[1])[0];
  if (s.acc < .5) {
    out.push(`정답률 ${pct}%면 문제를 더 푸는 것보다 개념으로 돌아가는 게 빨라요. 개념 카드를 다시 읽고, 해설을 덮은 채 직접 설명할 수 있을 때 실전으로 넘어오세요.`);
  } else if (s.acc < .8) {
    out.push(`정답률 ${pct}%. 기본은 잡혔는데 구멍이 있어요.` + (topTag ? ` 가장 많이 틀린 건 '${topTag[0]}' 유형이니 그 개념 카드와 변형 문제를 먼저 처리하세요.` : ''));
  } else {
    out.push(`정답률 ${pct}%, 안정권이에요.` + (s.ratio > 1.3 ? ' 다만 목표 시간보다 꽤 오래 걸려요.' : ' 이 단원은 오답만 한 번 더 돌리고 다음 단원으로 가도 돼요.'));
  }
  if (s.ratio > 1.3) out.push(`평균 풀이 시간이 목표의 ${Math.round(s.ratio*100)}%예요. 풀이 첫 줄(무슨 개념을 쓸지)을 30초 안에 정하는 연습을 하세요. 막히면 1분 넘기기 전에 힌트를 보고, 해설의 첫 줄만 외워 두는 것도 방법이에요.`);
  else if (s.ratio && s.ratio < .6 && s.acc < .8) out.push('너무 빨리 풀고 틀리는 편이에요. 보기 고르기 전에 조건(정의역, 양수 조건, 등호 성립)을 한 번 더 확인하세요.');
  if (topWhy) {
    const m = {
      '개념을 몰랐다':'틀린 이유로 개념 부족을 가장 많이 골랐어요. 실전 문제는 잠깐 멈추고 개념 확인 문제를 다시 맞혀 보세요.',
      '공식·성질이 헷갈렸다':'공식이 헷갈린다고 자주 골랐어요. 공식 탭의 내용을 손으로 3번 써 보고, 각 공식이 언제 쓰이는지 한 줄씩 적어 두세요.',
      '문제 해석을 잘못했다':'문제 해석 실수가 많아요. 조건에 밑줄을 치고, "구하는 것"을 문제 옆에 따로 적고 시작하세요.',
      '계산 실수':'계산 실수가 많아요. 검산은 끝에 몰아서 하지 말고 한 줄 넘어갈 때마다 부호와 괄호만 확인하세요.',
      '시간이 부족했다':'시간 부족을 자주 골랐어요. 아는 문제는 목표 시간 안에 끊는 연습부터. 모르는 문제는 2분 넘기면 넘기는 습관을 들이세요.'
    };
    out.push(m[topWhy[0]]);
  }
  return out;
}

      const fb = $('.fb', box);
      fb.innerHTML = ok
        ? `<div class="result ok">정답이에요<small>한 단계 더 들어가 볼게요.</small></div><div class="sol"><h4>심화</h4>${q.deep}</div><div class="btnrow"><button class="btn line retry">다시 풀기</button></div>`
        : `<div class="result no">아쉬워요<small>정답은 ${NUM[q.a]}. 개념을 다시 짚고 갈게요.</small></div><div class="sol"><h4>개념 복습</h4>${q.review}</div><div class="btnrow"><button class="btn ghost goC">개념 카드 다시 보기</button><button class="btn line retry">다시 풀기</button></div>`;
      const gc = $('.goC', fb); if (gc) gc.onclick = ()=>{ stack[stack.length-1] = ()=>renderUnit(u.id,'concept',q.c); renderUnit(u.id,'concept',q.c); };
      $('.retry', fb).onclick = ()=>{ renderUnit(u.id, 'check'); setTimeout(()=>$('#ck'+i)?.scrollIntoView({block:'start'}),50); };
      typeset(box);
    });
  });
  $('#toPrac').onclick = ()=>{ stack[stack.length-1] = ()=>renderUnit(u.id,'practice'); renderUnit(u.id,'practice'); window.scrollTo(0,0); };
}

/* 실전 목록 */
function renderPracticeList(u, c){
  const s = unitStats(u);
  c.innerHTML = `
    <div class="stat"><div><b>${s.solved}/${u.problems.length}</b><span>푼 문제</span></div><div><b>${s.acc===null?'—':Math.round(s.acc*100)+'%'}</b><span>정답률</span></div><div><b>${s.n?fmt(s.avg):'—'}</b><span>평균 시간</span></div></div>
    <div class="btnrow" style="margin-top:0"><button class="btn" id="startAll">처음부터 풀기</button><button class="btn ghost" id="startNew">안 푼 문제만</button><button class="btn line" id="startWrong">틀린 문제만</button></div>
    <h2 class="sec">문제 목록</h2>
    <div class="plist">${u.problems.map(p=>{
      const a = S.att[p.id];
      const st = !a ? '<span class="st new">안 풂</span>' : a.last ? '<span class="st ok">맞힘</span>' : '<span class="st no">틀림</span>';
      return `<button class="pitem" data-p="${p.id}"><span class="id">${p.id}</span><span><span>${p.tag}</span><br><span class="m">목표 ${fmt(p.t)}${a?`, ${a.n}회 풀이`:''}</span></span>${st}</button>`;
    }).join('')}</div>`;
  $('#startAll').onclick = ()=>startSession(u.id, 'all');
  $('#startNew').onclick = ()=>startSession(u.id, 'new');
  $('#startWrong').onclick = ()=>startSession(u.id, 'wrong');
  c.querySelectorAll('.pitem').forEach(b=>b.onclick=()=>startSession(u.id, 'one', b.dataset.p));
}

/* ========== 풀이 세션 ========== */
let SES = null;
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startSession(uid, mode, one){
  let list = [];
  const pool = uid ? unitById(uid).problems.map(p=>p.id) : UNITS.flatMap(u=>u.problems.map(p=>p.id));
  if (mode==='all') list = pool;
  else if (mode==='new') list = pool.filter(id=>!S.att[id]);
  else if (mode==='wrong') list = pool.filter(id=>S.att[id] && S.att[id].last===false);
  else if (mode==='one') list = [one];
  else if (mode==='mix') list = shuffle(pool.slice()).slice(0,10);
  if (!list.length) { alert(mode==='wrong' ? '지금 다시 풀 오답이 없어요.' : '풀 문제가 없어요. 처음부터 풀기를 눌러 보세요.'); return; }
  SES = { uid, mode, queue: list.map(id=>({ id, variant:false, retry:false })), i:0, ok:0, done:0, requeued:{}, conceptAlerted:{} };
  go(renderSolve);
}
function curItem(){ return SES.queue[SES.i]; }
function renderSolve(){
  const it = curItem();
  if (!it) return renderSessionEnd();
  const { u, p } = findProblem(it.id);
  const P = it.variant ? Object.assign({}, p, { input:undefined }, p.v, { id:p.id, t:p.t }) : p;
  setTitle(`${SES.i+1} / ${SES.queue.length}`, true);
  const src = it.variant ? `자체 제작 — ${p.id}번 변형 문제` : p.src;
  app.innerHTML = `
    <div class="progress"><i style="width:${SES.i/SES.queue.length*100}%"></i></div>
    <div class="q-meta">
      <span class="chip">${u.name}</span><span class="chip g">${p.tag}</span>
      ${it.variant?'<span class="chip r">변형 문제</span>':''}${it.retry?'<span class="chip r">다시 풀기</span>':''}
    </div>
    <div class="src">출처: ${src}</div>
    <div class="timer" id="tmr">
      <svg viewBox="0 0 46 46"><circle class="trk" cx="23" cy="23" r="19" fill="none" stroke-width="5"/><circle class="arc" id="arc" cx="23" cy="23" r="19" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4"/></svg>
      <div><div class="tt" id="tt">0:00</div><div class="tg">목표 ${fmt(P.t)}</div></div>
      <button class="btn line pz" id="hintBtn">힌트</button>
    </div>
    <div class="qtext">${P.q}</div>
    ${P.qfig||''}
    <div id="ans">${P.input!==undefined
      ? `<div class="inputrow"><input id="inp" inputmode="decimal" placeholder="답 입력" aria-label="답 입력"><button class="btn" id="sub">제출</button></div>`
      : `<div class="choices">${P.ch.map((x,j)=>`<button class="choice" data-j="${j}"><span class="n">${NUM[j]}</span><span>${x}</span></button>`).join('')}</div>`}
    </div>
    <div id="hint"></div>
    <div id="after"></div>`;
  const t0 = Date.now(); let paused = 0;
  const tick = ()=>{
    const sec = (Date.now()-t0)/1000;
    $('#tt').textContent = fmt(sec);
    const r = Math.min(1, sec/P.t);
    $('#arc').style.strokeDashoffset = 119.4*(1-r);
    $('#tmr').classList.toggle('over', sec > P.t);
  };
  tickTimer = setInterval(tick, 1000); tick();
  $('#hintBtn').onclick = ()=>{ $('#hint').innerHTML = `<div class="tip"><b>힌트</b>${P.hint}</div>`; $('#hintBtn').disabled = true; typeset($('#hint')); };
  const finish = (ok, chosen)=>{
    stopTick();
    const sec = (Date.now()-t0)/1000;
    record(p.id, it.variant, ok, sec);
    SES.done++; if (ok) SES.ok++;
    showAfter(u, p, P, it, ok, sec, chosen);
    if (ok) sparkle();
  };
  if (P.input!==undefined) {
    const sub = ()=>{ const v = $('#inp').value.trim().replace(/\s/g,''); if (!v) return; $('#inp').disabled = true; $('#sub').disabled = true; finish(v===String(P.input), v); };
    $('#sub').onclick = sub; $('#inp').onkeydown = e=>{ if (e.key==='Enter') sub(); };
  } else {
    app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      const j = +b.dataset.j;
      app.querySelectorAll('.choice').forEach(x=>{ x.disabled = true; const jj=+x.dataset.j; if (jj===P.a) x.classList.add('right'); else if (jj===j) x.classList.add('wrong'); });
      finish(j===P.a, j);
    });
  }
  typeset(app);
}
function showAfter(u, p, P, it, ok, sec, chosen){
  const over = sec > P.t;
  const ansText = P.input!==undefined ? P.input : NUM[P.a];
  const af = $('#after');
  let html = ok
    ? `<div class="result ok">정답 (${fmt(sec)})<small>${over ? `목표 시간 ${fmt(P.t)}을 넘겼어요. 해설에서 더 짧은 길을 확인하세요.` : '목표 시간 안에 풀었어요.'}</small></div>`
    : `<div class="result no">오답 (${fmt(sec)})<small>정답은 ${ansText}${P.input!==undefined?` (입력한 답: ${esc(chosen)})`:''}</small></div>`;
  if (!ok) {
    html += `<div class="why"><p>어디서 틀렸나요? 고르면 리포트의 훈수에 반영돼요.</p><div class="opts">${WHY.map(w=>`<button data-w="${w}">${w}</button>`).join('')}</div></div>`;
  }
  html += `<div class="sol"><h4>풀이</h4>${P.sol}</div>`;
  html += `<div id="cAlert"></div><div class="btnrow" id="nav"></div>`;
  af.innerHTML = html;

  // 같은 개념에서 반복해서 틀리면 개념 복습 권장
  const cw = conceptWrongCount(u, p.c);
  const needConcept = !ok && (cw >= 2 || over && sec > P.t*2);
  const showConcept = ()=>{
    $('#cAlert').innerHTML = `<div class="alert"><b>개념 복습을 먼저 권해요</b>'${conceptTitle(u,p.c)}'에서 ${cw>=2?`벌써 ${cw}번 틀렸어요`:'시간이 목표의 두 배를 넘겼어요'}. 문제를 더 푸는 것보다 개념 카드를 다시 보는 게 빨라요.<div class="btnrow"><button class="btn ghost" id="goConcept">개념 카드 보기</button></div></div>`;
    $('#goConcept').onclick = ()=>{ stopTick(); stack.push(()=>renderUnit(u.id,'concept',p.c)); renderUnit(u.id,'concept',p.c); };
  };
  if (needConcept) showConcept();

  af.querySelectorAll('.why button').forEach(b=>b.onclick=()=>{
    b.classList.toggle('on');
    const sel = [...af.querySelectorAll('.why button.on')].map(x=>x.dataset.w);
    S.why[p.id] = sel; save();
    if (sel.includes('개념을 몰랐다')) showConcept();
  });

  // 오답이면 변형 문제 → 그리고 원래 문제를 뒤에 다시
  const nav = $('#nav');
  if (!ok && !it.variant) {
    nav.innerHTML = `<button class="btn warnb" id="toVar">변형 문제 풀기</button><button class="btn line" id="next">다음 문제</button>`;
    $('#toVar').onclick = ()=>{ SES.queue.splice(SES.i+1, 0, { id:p.id, variant:true, retry:false }); requeue(p.id); SES.i++; renderSolve(); window.scrollTo(0,0); };
    $('#next').onclick = ()=>{ requeue(p.id); SES.i++; renderSolve(); window.scrollTo(0,0); };
  } else {
    nav.innerHTML = `<button class="btn" id="next">${SES.i+1 >= SES.queue.length ? '결과 보기' : '다음 문제'}</button>`;
    $('#next').onclick = ()=>{ if (!ok && it.variant) requeue(p.id, true); SES.i++; renderSolve(); window.scrollTo(0,0); };
  }
  typeset(af);
  af.scrollIntoView({ block:'start', behavior:'smooth' });
}
function sparkle(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = document.querySelector('.choice.right, #after .result')?.getBoundingClientRect(); if (!r) return;
  const cx = r.left + r.width/2, cy = r.top + r.height/2, cols = ['#7452F7','#A06DFF','#FFC94D','#4FD1A5','#FF7AB6'];
  for (let i=0;i<18;i++){ const s=document.createElement('i'); s.className='spark'; const a=Math.random()*Math.PI*2, d=40+Math.random()*70;
    s.style.left=cx+'px'; s.style.top=cy+'px'; s.style.background=cols[i%5]; s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),850); }
}
function requeue(pid, asVariant){
  const k = pid + (asVariant?'v':'');
  if (SES.requeued[k]) return; SES.requeued[k] = true;
  const pos = Math.min(SES.queue.length, SES.i + 3);
  SES.queue.splice(pos, 0, { id:pid, variant:!!asVariant, retry:true });
}
function renderSessionEnd(){
  setTitle('결과', true);
  const pct = SES.done ? Math.round(SES.ok/SES.done*100) : 0;
  const u = SES.uid ? unitById(SES.uid) : null;
  const adv = u ? advice(u) : (pct < 60 ? ['섞어 풀기 정답률이 낮아요. 리포트에서 가장 약한 단원을 골라 개념부터 다시 보세요.'] : ['좋아요. 리포트에서 단원별 시간도 함께 확인하세요.']);
  app.innerHTML = `
    <div class="panel" style="margin-top:20px">
      <div class="stat" style="margin:0"><div><b>${SES.ok}/${SES.done}</b><span>맞힌 문제</span></div><div><b>${pct}%</b><span>정답률</span></div><div><b>${SES.queue.filter(q=>q.retry).length}</b><span>다시 푼 문제</span></div></div>
    </div>
    <div class="todo"><b>훈수</b>${adv.map(a=>`<p style="margin:6px 0">${a}</p>`).join('')}</div>
    <div class="btnrow"><button class="btn" id="home2">홈으로</button>${u?`<button class="btn ghost" id="again">이 단원 오답만 다시</button>`:''}</div>`;
  $('#home2').onclick = ()=>{ stack=[]; go(renderHome); };
  if (u) $('#again').onclick = ()=>startSession(u.id, 'wrong');
}

/* ========== 오답노트 ========== */
function renderWrong(){
  setTitle('복습', stack.length>1); if(stack.length<=1) document.querySelector('.fab')?.remove();
  const items = [];
  UNITS.forEach(u=>u.problems.forEach(p=>{ const a=S.att[p.id]; if (a && a.n-a.ok>0) items.push({u,p,a}); }));
  if (!items.length) { app.innerHTML = `<section class="phead"><h2>복습</h2><p>틀린 문제는 다시 맞힐 때까지 여기 남아요</p></section><div class="empty"><b>아직 틀린 문제가 없어요</b><p>실전 문제를 풀면 틀린 문제가 여기 모여요.</p><button class="btn" id="g">문제 풀러 가기</button></div>`; $('#g').onclick=()=>{ setTab('home'); stack=[]; go(renderHome); }; return; }
  const still = items.filter(x=>x.a.last===false);
  app.innerHTML = `<section class="phead"><h2>복습</h2><p>틀린 문제는 다시 맞힐 때까지 여기 남아요</p></section>
    <div class="btnrow" style="margin-top:0"><button class="btn" id="rw">아직 못 맞힌 ${still.length}문제 다시 풀기</button></div>
    <h2 class="sec">틀린 적 있는 문제</h2>
    <div class="plist">${items.map(({u,p,a})=>`<button class="pitem" data-p="${p.id}" data-u="${u.id}"><span class="id">${p.id}</span><span><span>${u.name}, ${p.tag}</span><br><span class="m">${a.n-a.ok}번 틀림${S.why[p.id]&&S.why[p.id].length?`, 이유: ${S.why[p.id].join(', ')}`:''}</span></span>${a.last?'<span class="st ok">극복</span>':'<span class="st no">미해결</span>'}</button>`).join('')}</div>`;
  $('#rw').onclick = ()=>startSession(null,'wrong');
  if (!still.length) $('#rw').disabled = true;
  app.querySelectorAll('.pitem').forEach(b=>b.onclick=()=>startSession(b.dataset.u,'one',b.dataset.p));
}

/* ========== 리포트 ========== */
function renderReport(){
  setTitle('학습 리포트', stack.length>1); document.querySelector('.fab')?.remove();
  let N=0, OK=0, T=0;
  UNITS.forEach(u=>{ const s=unitStats(u); N+=s.n; OK+=s.ok; T+=s.avg*s.n; });
  const whyAll = {};
  Object.values(S.why).forEach(arr=>arr.forEach(w=>whyAll[w]=(whyAll[w]||0)+1));
  const whyTot = Object.values(whyAll).reduce((a,b)=>a+b,0);
  app.innerHTML = `<section class="phead"><h2>코치</h2><p>푼 기록을 보고 단원별로 훈수를 둬요</p></section>
    <div class="stat"><div><b>${N}</b><span>총 풀이</span></div><div><b>${N?Math.round(OK/N*100)+'%':'—'}</b><span>전체 정답률</span></div><div><b>${N?fmt(T/N):'—'}</b><span>평균 시간</span></div></div>
    <h2 class="sec">단원별 진단과 훈수</h2>
    <div class="panel">${UNITS.map(u=>{
      const s = unitStats(u); const pct = s.acc===null?0:Math.round(s.acc*100);
      const col = s.acc===null ? 'var(--line)' : s.acc<.5 ? 'var(--bad)' : s.acc<.8 ? 'var(--gold)' : 'var(--ok)';
      return `<div class="rrow"><div class="h"><span>${u.name}</span><span>${s.acc===null?'기록 없음':pct+'%'}${s.n?`, 평균 ${fmt(s.avg)}`:''}</span></div>
        <div class="bars"><i style="width:${pct}%;background:${col}"></i></div>
        <div class="adv">${advice(u).join(' ')}</div></div>`;
    }).join('')}</div>
    <h2 class="sec">틀린 이유</h2>
    <div class="panel">${whyTot ? WHY.map(w=>{ const n=whyAll[w]||0; return `<div class="rrow"><div class="h"><span>${w}</span><span>${n}번</span></div><div class="bars"><i style="width:${n/whyTot*100}%;background:var(--bad)"></i></div></div>`; }).join('') : '<p class="small" style="margin:0">틀린 문제에서 이유를 고르면 여기에 모여요.</p>'}</div>
    <div class="btnrow"><button class="btn line" id="reset">기록 전체 지우기</button></div>`;
  $('#reset').onclick = ()=>{ if (confirm('풀이 기록을 모두 지울까요? 되돌릴 수 없어요.')) { S = { att:{}, checks:{}, why:{}, log:[] }; save(); renderReport(); } };
}

/* ========== 공식 ========== */
function renderSheet(){
  setTitle('공식 모아보기', true);
  app.innerHTML = `<section class="phead"><h2>공식 모아보기</h2><p>시험 직전에 한 번 훑기</p></section>` + UNITS.map(u=>`<h2 class="sec">${u.name}</h2><div class="formula">${u.sheet.map(([t,f])=>`<div class="f"><b>${t}</b><div class="fx">${f}</div></div>`).join('')}</div>`).join('');
  typeset(app);
}

function renderOnboard(i=0){
  setTitle('', false); document.querySelector('.fab')?.remove();
  const ic = d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const steps = [
    [ic('<path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-4a2 2 0 0 0-2 2"/>'),'개념부터','단원마다 개념을 먼저 정리하고, 바로 확인 문제로 이해했는지 체크해요.'],
    [ic('<path d="M15 4l5 5L9 20H4v-5z"/>'),'실전 문제 풀기','교재 문제를 시간 재며 풀어요. 틀리면 상세 풀이와 변형 문제가 바로 나와요.'],
    [ic('<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>'),'복습하고 코치 받기','틀린 문제는 복습 탭에 모이고, 코치가 오답 패턴을 보고 훈수를 둬요.']
  ];
  const [svg,t,d] = steps[i];
  app.innerHTML = `<section class="phead"><h2>반가워요 👋</h2><p>Proof는 이렇게 써요.</p></section>
  <div class="onb"><div class="oc"><div class="oi">${svg}</div><span class="step">${i+1} / 3</span><h3>${t}</h3><p>${d}</p></div>
  <div class="dots">${steps.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
  <div class="obtn"><button class="btn line" id="oPrev" ${i===0?'disabled':''}>이전</button><button class="btn" id="oNext">${i===2?'시작하기':'다음'}</button></div></div>`;
  $('#oPrev').onclick = ()=>{ renderOnboard(i-1); anim('enter-r'); };
  $('#oNext').onclick = ()=>{ if (i<2) { renderOnboard(i+1); anim('enter-l'); } else { try{ localStorage.setItem(KEY+'-onb','1'); }catch(e){} stack=[renderHome]; renderHome(); anim('enter-up'); } };
}
let seenOnb = false; try { seenOnb = !!localStorage.getItem(KEY+'-onb'); } catch(e) {}
if (seenOnb) { stack = [renderHome]; renderHome(); } else { stack = [()=>renderOnboard(0)]; renderOnboard(0); }
setTimeout(()=>{ $('#splash').classList.add('hide'); anim('enter-up'); setTimeout(()=>$('#splash')?.remove(), 500); }, 1150);
</script>

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
