<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] }, svg: { fontCache: 'global' }, startup: { typeset: false } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" async></script>
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F5F4FA; --tile:#ECE8FE; --ink:#17181C; --ink2:#5E606B; --ink3:#9A9CA8;
  --line:#ECECF2; --mint:#7452F7; --mintSoft:#EEEBFE; --teal:#6447F0; --grad1:#6655FF; --grad2:#A06DFF;
  --ok:#17A673; --okSoft:#E6F6EF; --bad:#E5484D; --badSoft:#FDECEC; --gold:#C98A12; --goldSoft:#FBF3E2;
  --shadow:0 10px 24px -10px rgba(116,82,247,.55);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121218; --surface:#121218; --soft:#1C1B25; --tile:#2A2542; --ink:#ECECF3; --ink2:#B4B5C2; --ink3:#7C7E8C;
    --line:#26252F; --mint:#8F74FF; --mintSoft:#2A2542; --teal:#A792FF; --grad1:#7563FF; --grad2:#A67CFF;
    --ok:#3CCB8F; --okSoft:#15302A; --bad:#FF6B70; --badSoft:#3A1C1F; --gold:#F0B94B; --goldSoft:#3A2F17;
    --shadow:0 10px 24px -12px rgba(143,116,255,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121218; --surface:#121218; --soft:#1C1B25; --tile:#2A2542; --ink:#ECECF3; --ink2:#B4B5C2; --ink3:#7C7E8C;
  --line:#26252F; --mint:#8F74FF; --mintSoft:#2A2542; --teal:#A792FF; --grad1:#7563FF; --grad2:#A67CFF;
  --ok:#3CCB8F; --okSoft:#15302A; --bad:#FF6B70; --badSoft:#3A1C1F; --gold:#F0B94B; --goldSoft:#3A2F17;
  --shadow:0 10px 24px -12px rgba(143,116,255,.6);
  color-scheme: dark;
}
html{ font-size:16px; scroll-padding-top:env(safe-area-inset-top,0px); }
html[data-fs="l"]{ font-size:17.5px; } html[data-fs="xl"]{ font-size:19px; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size:1rem; line-height:1.6; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--mint); outline-offset:2px; }
.wrap{ max-width:760px; margin:0 auto; padding:0 20px 130px; }

header.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line); }
header.top .in{ max-width:760px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:10px; min-height:62px; }
header.top .back{ border:1px solid var(--line); background:var(--surface); color:var(--ink); width:40px; height:40px; border-radius:50%; font-size:1.2rem; cursor:pointer; flex:none; }
header.top h1{ font-size:1.25rem; margin:0; font-weight:800; color:var(--mint); letter-spacing:-.02em; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.top h1.plain{ color:var(--ink); font-weight:700; font-size:1.05rem; }
header.top .bell{ color:var(--ink2); width:24px; height:24px; flex:none; }
header.top .dday{ display:flex; align-items:center; gap:6px; font-size:.9rem; font-weight:700; color:var(--teal); background:var(--mintSoft); padding:7px 14px; border-radius:22px; flex:none; }
header.top .dday svg{ width:17px; height:17px; }

nav.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
nav.tabs .in{ max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
nav.tabs button{ border:0; background:none; padding:10px 2px 12px; font-size:.75rem; color:var(--ink2); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
nav.tabs button svg{ width:24px; height:24px; }
nav.tabs button.on{ color:var(--mint); font-weight:700; }

.phead{ margin:28px 0 18px; }
.phead h2{ font-size:1.65rem; font-weight:800; margin:0; letter-spacing:-.03em; line-height:1.3; }
.phead p{ margin:4px 0 0; color:var(--ink3); font-size:.95rem; }
h2.sec, h3.sh{ font-size:1rem; color:var(--ink); font-weight:700; margin:30px 2px 12px; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:22px; margin:14px 0; }

.hero{ display:block; width:100%; text-align:left; border:0; cursor:pointer; margin:0 0 8px; padding:24px 26px; border-radius:28px; background:var(--mint); color:#fff; }
.hero .hl{ font-size:.92rem; opacity:.85; display:block; }
.hero .hn{ font-size:3rem; font-weight:800; line-height:1.15; display:block; letter-spacing:-.03em; margin:4px 0; }
.hero .hs{ font-size:.95rem; opacity:.85; }
.rows .row{ display:flex; justify-content:space-between; padding:8px 2px; color:var(--ink2); }
.rows .row b{ color:var(--ink); }

.todo{ background:var(--soft); border-radius:24px; padding:20px 22px; margin:16px 0; }
.todo b{ display:block; margin-bottom:4px; font-size:1rem; }
.todo p{ color:var(--ink2); }
.todo .act{ margin-top:14px; }

.unitlist, .cards{ display:grid; gap:12px; }
.card, .unit{ display:grid; grid-template-columns:56px 1fr auto; gap:16px; align-items:center; background:var(--soft); border:0; border-radius:24px; padding:18px 20px; cursor:pointer; text-align:left; width:100%; }
.tile, .unit .no{ width:56px; height:56px; border-radius:16px; background:var(--tile); color:var(--teal); display:grid; place-items:center; font-weight:800; font-size:1.05rem; }
.tile svg{ width:26px; height:26px; }
.card b, .unit .t{ font-weight:700; font-size:1.08rem; display:block; }
.card small, .unit .s{ font-size:.88rem; color:var(--ink2); display:block; }
.unit .bar{ height:5px; background:var(--line); border-radius:4px; margin-top:8px; overflow:hidden; display:block; }
.unit .bar i{ display:block; height:100%; background:var(--mint); border-radius:4px; }
.unit .pct, .chev{ font-size:.95rem; color:var(--ink3); font-weight:600; }

.menu h4{ font-size:.85rem; color:var(--ink2); font-weight:600; margin:26px 4px 6px; }
.menu button.mi{ display:flex; align-items:center; gap:16px; width:100%; border:0; background:none; padding:14px 6px; font-size:1.08rem; cursor:pointer; text-align:left; border-radius:12px; }
.menu button.mi svg{ width:26px; height:26px; color:var(--ink2); }
.menu button.mi:hover{ background:var(--soft); }

.seg{ display:flex; gap:4px; background:var(--soft); padding:5px; border-radius:18px; margin:18px 0 8px; }
.seg button{ flex:1; border:0; background:none; padding:11px 4px; border-radius:14px; cursor:pointer; font-size:.95rem; color:var(--ink2); font-weight:500; }
.seg button.on{ background:var(--tile); color:var(--teal); font-weight:700; }

.concept{ background:var(--surface); border:1px solid var(--line); border-radius:24px; margin:12px 0; overflow:hidden; }
.concept > button{ width:100%; text-align:left; border:0; background:none; padding:18px 20px; cursor:pointer; display:flex; align-items:center; gap:12px; font-weight:700; font-size:1.02rem; }
.concept > button .k{ font-size:.78rem; font-weight:700; color:var(--teal); background:var(--mintSoft); border-radius:20px; padding:3px 10px; flex:none; }
.concept > button .chev{ margin-left:auto; color:var(--ink3); transition:transform .2s; }
.concept.open > button .chev{ transform:rotate(90deg); }
.concept .body{ display:none; padding:0 20px 20px; }
.concept.open .body{ display:block; }
.concept.flash{ box-shadow:0 0 0 3px var(--mint); }
.body p{ margin:8px 0; } .body ul{ margin:6px 0; padding-left:20px; } .body li{ margin:4px 0; }
.key, .warn, .tip{ border-radius:16px; padding:12px 16px; margin:12px 0; }
.key{ background:var(--mintSoft); } .warn{ background:var(--badSoft); } .tip{ background:var(--goldSoft); }
.key b, .warn b, .tip b{ display:block; font-size:.82rem; margin-bottom:2px; }
.key b{ color:var(--teal); } .warn b{ color:var(--bad); } .tip b{ color:var(--gold); }
figure{ margin:14px 0; text-align:center; }
figure svg{ max-width:100%; height:auto; }
figcaption{ font-size:.82rem; color:var(--ink3); margin-top:4px; }
.fig .ax{ stroke:var(--ink3); stroke-width:1.2; fill:none; }
.fig .c1{ stroke:var(--mint); stroke-width:2.5; fill:none; }
.fig .c2{ stroke:var(--bad); stroke-width:2.5; fill:none; }
.fig .c3{ stroke:var(--gold); stroke-width:2.2; fill:none; }
.fig .ds{ stroke:var(--ink3); stroke-width:1.2; stroke-dasharray:5 4; fill:none; }
.fig .fill1{ fill:var(--mint); opacity:.16; } .fig .fill2{ fill:var(--bad); opacity:.2; } .fig .fill3{ fill:var(--gold); opacity:.22; }
.fig text{ fill:var(--ink2); font-size:13px; font-family:inherit; }
.fig .tb{ fill:var(--ink); font-weight:700; }
.fig .dot{ fill:var(--ink); }
.fig .hole{ fill:var(--surface); stroke:var(--ink); stroke-width:1.5; }
.fig .box{ fill:var(--soft); stroke:var(--line); stroke-width:1.5; }

.q-meta{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:16px 0 4px; font-size:.8rem; }
.chip{ padding:5px 12px; border-radius:20px; background:var(--mintSoft); color:var(--teal); font-weight:700; }
.chip.g{ background:var(--soft); color:var(--ink2); }
.chip.r{ background:var(--badSoft); color:var(--bad); }
.src{ font-size:.8rem; color:var(--ink3); margin:4px 2px 0; }
.qtext{ font-size:1.05rem; margin:12px 0 16px; }
.choices{ display:grid; gap:10px; }
.choice{ display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1.5px solid transparent; background:var(--soft); border-radius:18px; padding:14px 16px; cursor:pointer; min-height:54px; }
.choice .n{ flex:none; width:28px; height:28px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-size:.82rem; font-weight:700; color:var(--ink2); }
.choice:hover{ border-color:var(--mint); }
.choice.right{ border-color:var(--ok); background:var(--okSoft); } .choice.right .n{ background:var(--ok); color:#fff; }
.choice.wrong{ border-color:var(--bad); background:var(--badSoft); } .choice.wrong .n{ background:var(--bad); color:#fff; }
.choice[disabled]{ cursor:default; }
.inputrow{ display:flex; gap:8px; }
.inputrow input{ flex:1; font:inherit; font-size:1.1rem; padding:14px 18px; border-radius:16px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); min-width:0; }
.btn{ border:0; border-radius:30px; padding:14px 24px; font-weight:700; cursor:pointer; color:#fff; font-size:.98rem; background:linear-gradient(90deg,var(--grad1),var(--grad2)); box-shadow:var(--shadow); }
.btn.ghost{ background:var(--mintSoft); color:var(--teal); box-shadow:none; }
.btn.line{ background:var(--surface); border:1.5px solid var(--line); color:var(--ink); box-shadow:none; }
.btn.warnb{ }
.btn:disabled{ opacity:.45; cursor:default; }
.btnrow{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
.fab{ position:fixed; right:max(20px, calc(50% - 360px)); bottom:calc(88px + env(safe-area-inset-bottom,0px)); z-index:7; border:0; border-radius:30px; padding:15px 24px; font-weight:700; font-size:1rem; color:#fff; background:linear-gradient(90deg,var(--grad1),var(--grad2)); box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; gap:6px; }

.timer{ display:flex; align-items:center; gap:14px; background:var(--soft); border-radius:20px; padding:12px 16px; margin-top:16px; }
.timer svg{ width:46px; height:46px; flex:none; transform:rotate(-90deg); }
.timer .trk{ stroke:var(--line); }
.timer .arc{ stroke:var(--mint); transition:stroke-dashoffset .9s linear, stroke .3s; }
.timer.over .arc{ stroke:var(--bad); }
.timer .tt{ font-size:1.4rem; font-weight:800; font-variant-numeric:tabular-nums; }
.timer .tg{ font-size:.8rem; color:var(--ink3); }
.timer.over .tt{ color:var(--bad); }
.timer .pz{ margin-left:auto; padding:10px 18px; }

.result{ border-radius:20px; padding:16px 18px; margin:18px 0 6px; font-weight:700; }
.result.ok{ background:var(--okSoft); color:var(--ok); } .result.no{ background:var(--badSoft); color:var(--bad); }
.result small{ display:block; font-weight:400; color:var(--ink2); margin-top:2px; }
.sol{ background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:18px 20px; margin:12px 0; }
.sol h4{ margin:0 0 8px; font-size:.9rem; color:var(--teal); }
.sol .step{ margin:10px 0; padding-left:14px; border-left:3px solid var(--tile); }
.why{ margin:16px 0; } .why p{ margin:0 0 8px; font-size:.88rem; color:var(--ink2); }
.why .opts{ display:flex; flex-wrap:wrap; gap:8px; }
.why .opts button{ border:0; background:var(--soft); border-radius:20px; padding:8px 14px; font-size:.88rem; cursor:pointer; color:var(--ink2); }
.why .opts button.on{ background:var(--badSoft); color:var(--bad); font-weight:700; }
.alert{ border-radius:20px; padding:16px 18px; margin:14px 0; background:var(--mintSoft); }
.alert b{ display:block; margin-bottom:4px; color:var(--teal); }
.progress{ height:6px; border-radius:4px; background:var(--soft); overflow:hidden; margin:14px 0 0; }
.progress i{ display:block; height:100%; background:var(--mint); transition:width .3s; }
.plist{ display:grid; gap:10px; }
.pitem{ display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; background:var(--soft); border:0; border-radius:20px; padding:14px 18px; cursor:pointer; width:100%; text-align:left; }
.pitem .id{ font-weight:800; font-variant-numeric:tabular-nums; color:var(--teal); }
.pitem .m{ font-size:.82rem; color:var(--ink3); }
.st{ font-size:.75rem; font-weight:700; padding:3px 10px; border-radius:12px; }
.st.ok{ background:var(--okSoft); color:var(--ok); } .st.no{ background:var(--badSoft); color:var(--bad); } .st.new{ background:var(--surface); color:var(--ink3); }
.stat{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:14px 0; }
.stat div{ background:var(--soft); border-radius:20px; padding:14px 16px; }
.stat b{ display:block; font-size:1.4rem; font-weight:800; font-variant-numeric:tabular-nums; }
.stat span{ font-size:.8rem; color:var(--ink3); }
.rrow{ padding:14px 0; border-bottom:1px solid var(--line); }
.rrow:last-child{ border-bottom:0; }
.rrow .h{ display:flex; justify-content:space-between; gap:8px; font-weight:700; }
.rrow .bars{ height:8px; border-radius:4px; background:var(--soft); overflow:hidden; margin:8px 0; }
.rrow .bars i{ display:block; height:100%; border-radius:4px; }
.rrow .adv{ font-size:.9rem; color:var(--ink2); }
.empty{ text-align:center; color:var(--ink3); padding:60px 10px; }
.empty b{ display:block; color:var(--ink); font-size:1.15rem; margin-bottom:6px; }
.small{ font-size:.82rem; color:var(--ink3); }
.formula{ display:grid; gap:10px; }
.formula .f{ background:var(--soft); border-radius:20px; padding:14px 18px; }
.formula .f b{ font-size:.82rem; color:var(--teal); display:block; }

/* ---- 여백·들여쓰기 다듬기 ---- */
body{ line-height:1.7; }
.wrap{ padding:0 24px 140px; }
header.top .in{ padding:14px 24px; min-height:68px; }
header.top h1{ font-size:1.45rem; letter-spacing:-.04em; }
header.top h1.plain{ font-size:1.08rem; letter-spacing:-.02em; }
.phead{ margin:40px 4px 26px; }
.phead h2{ font-size:1.8rem; }
.phead p{ margin-top:6px; }
h2.sec, h3.sh{ margin:44px 4px 14px; font-size:1.05rem; }
.hero{ padding:28px 30px; }
.hero .hn{ font-size:3.2rem; margin:6px 0 4px; }
.rows{ padding:0 6px; }
.rows .row{ padding:10px 0; border-bottom:1px solid var(--line); }
.rows .row:last-child{ border-bottom:0; }
.todo{ padding:24px 26px; margin:22px 0; }
.todo p{ line-height:1.7; }
.unitlist{ gap:14px; }
.card, .unit{ padding:20px 24px; gap:18px; }
.unit .s{ margin-top:2px; }
.unit .bar{ margin-top:10px; }
.panel{ padding:26px 28px; }
.seg{ margin:20px 0 10px; }
.concept > button{ padding:20px 24px; }
.concept .body{ padding:2px 24px 26px 24px; }
.body > p{ padding-left:4px; }
.body ul{ padding-left:26px; }
.body li{ margin:6px 0; padding-left:2px; }
.key, .warn, .tip{ padding:16px 20px; margin:16px 0; }
.key b, .warn b, .tip b{ margin-bottom:6px; }
.q-meta{ margin:22px 2px 6px; }
.src{ margin:6px 4px 0; }
.qtext{ margin:16px 4px 20px; line-height:1.8; }
.qtext .key{ margin:14px 0 0; padding:14px 20px 14px 22px; }
.choices{ gap:12px; }
.choice{ padding:16px 20px; gap:14px; }
.timer{ padding:14px 20px; }
.result{ padding:18px 22px; margin:22px 0 8px; }
.sol{ padding:24px 26px; margin:16px 0; }
.sol h4{ margin:0 0 14px; font-size:.95rem; }
.sol .step{ margin:14px 0 14px 4px; padding:2px 0 2px 18px; line-height:1.8; }
.sol .key, .sol .tip, .sol .warn{ margin:18px 0 4px; }
.why{ margin:22px 4px; }
.alert{ padding:18px 22px; }
.plist{ gap:12px; }
.pitem{ padding:16px 22px; gap:16px; }
.stat{ gap:12px; margin:18px 0; }
.stat div{ padding:16px 18px; }
.rrow{ padding:18px 4px; }
.formula{ gap:12px; }
.formula .f{ padding:20px 24px; }
.formula .f b{ margin-bottom:10px; }
.formula .f .fx{ padding-left:14px; border-left:3px solid var(--tile); line-height:1.9; }
.menu{ margin-top:-6px; }
.menu h4{ margin:30px 6px 6px; }
.menu button.mi{ padding:15px 10px; }
.brandline{ display:flex; align-items:center; gap:10px; margin:36px 4px 0; color:var(--ink3); font-size:.85rem; }
.brandline b{ color:var(--mint); font-weight:800; font-size:1rem; letter-spacing:-.03em; }


/* ---- 반짝임·전환 ---- */
.logo{ background:linear-gradient(100deg,var(--grad1) 0%,var(--grad2) 35%,#C9B6FF 50%,var(--grad2) 65%,var(--grad1) 100%); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent !important; animation:sheen 4.5s linear infinite; font-weight:900 !important; letter-spacing:-.04em; }
@keyframes sheen{ from{ background-position:100% 0; } to{ background-position:-150% 0; } }
.btn, .fab{ overflow:hidden; transition:transform .15s ease, box-shadow .2s ease; }
.btn{ position:relative; }
.fab{ position:fixed; }
.btn:not(.ghost):not(.line)::after, .fab::after, .hero::after{ content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent); transform:skewX(-20deg); animation:shine 3.6s ease-in-out infinite; pointer-events:none; }
@keyframes shine{ 0%,60%{ left:-60%; } 100%{ left:140%; } }
.hero{ position:relative; overflow:hidden; background:linear-gradient(135deg,#6B4BF5 0%,#7F5BFF 55%,#9A72FF 100%); box-shadow:0 18px 40px -18px rgba(116,82,247,.7); transition:transform .18s ease; }
.hero::before{ content:""; position:absolute; right:-40px; top:-60px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%); pointer-events:none; }
.btn:active, .fab:active, .hero:active, .unit:active, .choice:active, .pitem:active, .mi:active{ transform:scale(.97); }
.unit, .card, .choice, .pitem{ transition:transform .15s ease, background .2s ease, border-color .2s ease; }
.unit:hover, .pitem:hover{ background:var(--tile); }
nav.tabs button{ position:relative; transition:color .2s; }
nav.tabs button svg{ transition:transform .25s cubic-bezier(.3,1.6,.5,1); }
nav.tabs button.on svg{ transform:translateY(-2px) scale(1.08); }
nav.tabs button::before{ content:""; position:absolute; top:0; left:50%; width:0; height:3px; border-radius:0 0 3px 3px; background:linear-gradient(90deg,var(--grad1),var(--grad2)); transform:translateX(-50%); transition:width .3s cubic-bezier(.3,1.4,.5,1); }

function mapDiagram(xs, ys, arrows, cap){
  const h = 30 + Math.max(xs.length, ys.length)*34;
  const xY = i => 30 + i*34 + (Math.max(xs.length,ys.length)-xs.length)*17;
  const yY = i => 30 + i*34 + (Math.max(xs.length,ys.length)-ys.length)*17;
  let s = `<figure><svg class="fig" viewBox="0 0 240 ${h}" width="240"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mint)"/></marker></defs>`;
  s += `<ellipse cx="55" cy="${h/2}" rx="35" ry="${h/2-8}" class="ax"/><ellipse cx="185" cy="${h/2}" rx="35" ry="${h/2-8}" class="ax"/>`;
  xs.forEach((x,i)=>{ s += `<circle cx="55" cy="${xY(i)}" r="3" class="dot"/><text x="40" y="${xY(i)+5}" text-anchor="end">${x}</text>`; });
  ys.forEach((y,i)=>{ s += `<circle cx="185" cy="${yY(i)}" r="3" class="dot"/><text x="200" y="${yY(i)+5}">${y}</text>`; });
  arrows.forEach(([a,b])=>{ s += `<line x1="59" y1="${xY(a)}" x2="180" y2="${yY(b)}" class="c1" stroke-width="1.6" marker-end="url(#ah)"/>`; });
  s += `<text x="55" y="${h-2}" text-anchor="middle" class="tb">X</text><text x="185" y="${h-2}" text-anchor="middle" class="tb">Y</text></svg>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;
  return s;
}

id:'prop', name:'명제',
concepts:[
{ id:'c1', title:'명제, 조건, 진리집합', body: R`
<p><b>명제</b>는 참인지 거짓인지 분명히 판별할 수 있는 문장이나 식이에요. ‘2는 소수이다’(참)도, ‘3&gt;5’(거짓)도 둘 다 명제예요. 반면 ‘\(x+1=3\)’처럼 \(x\) 값에 따라 참·거짓이 바뀌는 건 <b>조건</b>이에요.</p>
<p><b>진리집합</b>: 전체집합 \(U\)의 원소 중 조건 \(p\)를 참으로 만드는 것들의 모임 \(P\).</p>
<div class="key"><b>부정</b>조건 \(\sim p\)의 진리집합은 \(P^C\).<br>‘\(p\) 또는 \(q\)’의 부정은 ‘\(\sim p\) 그리고 \(\sim q\)’, ‘\(p\) 그리고 \(q\)’의 부정은 ‘\(\sim p\) 또는 \(\sim q\)’.</div>
<p>예: \(-1 < x \le 2\) 는 ‘\(x>-1\) 그리고 \(x\le 2\)’ 이므로, 부정은 ‘\(x \le -1\) 또는 \(x > 2\)’.</p>
<div class="warn"><b>자주 틀림</b>\(ab=0\) 은 ‘\(a=0\) 또는 \(b=0\)’. 그래서 부정은 ‘\(a\ne0\) 그리고 \(b\ne0\)’, 즉 \(ab\ne0\).<br>\(a^2+b^2=0\) 은 ‘\(a=0\) 그리고 \(b=0\)’. 부정은 ‘\(a\ne0\) 또는 \(b\ne0\)’.</div>`},
{ id:'c2', title:'명제 p → q 의 참, 거짓', body: R`
<p>‘\(p\)이면 \(q\)이다’에서 \(p\)를 가정, \(q\)를 결론이라고 해요. 참·거짓은 진리집합의 포함 관계로 판단해요.</p>
${FIG.vennSub}
<div class="key"><b>판정법</b>\(P \subset Q\) 이면 참, \(P \not\subset Q\) 이면 거짓.</div>
${FIG.vennCex}
<p>거짓임을 보일 땐 <b>반례 하나</b>면 충분해요. 반례는 가정은 만족하는데 결론은 만족하지 않는 것, 즉 \(P-Q\)의 원소예요.</p>
<div class="tip"><b>요령</b>‘\(x^2=4\)이면 \(x=2\)’처럼 제곱이 나오면 음수를 먼저 넣어 보세요. ‘\(x+y\)가 무리수이면 \(x, y\) 모두 무리수’ 같은 건 \(x=\sqrt2,\ y=1\) 같은 섞인 경우를 넣어 보세요.</div>`},
{ id:'c3', title:'‘모든’과 ‘어떤’', body: R`
<ul><li>‘모든 \(x\)에 대하여 \(p\)’ 는 \(P=U\) 일 때 참. 반례가 하나라도 있으면 거짓.</li>
<li>‘어떤 \(x\)에 대하여 \(p\)’ 는 \(P\ne\varnothing\) 일 때 참. 만족하는 \(x\)가 하나만 있어도 참.</li></ul>
<div class="key"><b>부정</b>‘모든’ ↔ ‘어떤’을 바꾸고, 뒤의 조건을 부정한다.<br>‘모든 실수 \(x\)에 대하여 \(x^2\ge0\)’ 의 부정은 ‘어떤 실수 \(x\)에 대하여 \(x^2<0\)’.</div>`},
{ id:'c4', title:'역과 대우', body: R`
<p>명제 \(p\to q\) 에 대하여 역은 \(q\to p\), 대우는 \(\sim q\to\sim p\).</p>
${FIG.contra}
<div class="key"><b>핵심</b>명제와 그 대우는 참·거짓이 항상 같다. 역은 따로 확인해야 한다.</div>
<div class="tip"><b>대우가 쓸모 있을 때</b>조건에 ‘\(\ne\)’가 있으면 대우로 바꿔 ‘\(=\)’로 만들면 쉬워요.<br>‘\(x^2-ax+3\ne0\)이면 \(x-1\ne0\)’이 참 ⟺ 대우 ‘\(x=1\)이면 \(x^2-ax+3=0\)’이 참 ⟹ \(1-a+3=0\), \(a=4\).</div>`},
{ id:'c5', title:'충분조건과 필요조건', body: R`
<p>\(p\to q\) 가 참이면 기호로 \(p \Rightarrow q\), 이때</p>
<div class="key"><b>정의</b>\(p\)는 \(q\)이기 위한 <b>충분조건</b>, \(q\)는 \(p\)이기 위한 <b>필요조건</b>.<br>\(p\Rightarrow q\) 이고 \(q\Rightarrow p\) 이면 필요충분조건 (\(P=Q\)).</div>
${FIG.vennSub}
<p>외우는 법: <b>작은 집합이 충분, 큰 집합이 필요</b>. 화살표가 나가는 쪽이 충분, 들어오는 쪽이 필요.</p>
<div class="tip"><b>연결하기 (삼단논법)</b>\(p\Rightarrow q\), \(q\Rightarrow r\) 이면 \(p\Rightarrow r\). 이때 대우도 같이 쓴다: \(q\Rightarrow r\) 이면 \(\sim r\Rightarrow\sim q\).</div>
<div class="warn"><b>문장 읽기</b>‘\(q\)는 \(p\)이기 위한 필요조건’ = \(p\Rightarrow q\) = \(P\subset Q\). 문장 끝 ‘~이기 위한’ 앞의 것이 출발점이에요.</div>`},
{ id:'c6', title:'증명: 대우 증명법, 귀류법', body: R`
<p><b>대우를 이용한 증명</b>: 원래 명제 대신 대우가 참임을 보인다.<br>예) ‘\(n^2\)이 짝수이면 \(n\)은 짝수’ ← 대우 ‘\(n\)이 홀수이면 \(n^2\)은 홀수’: \(n=2k+1\) 이면 \(n^2=2(2k^2+2k)+1\) 은 홀수.</p>
<p><b>귀류법</b>: 결론을 부정해서 가정하고, 모순을 이끌어 낸다.<br>예) \(\sqrt2\)가 유리수라 하면 \(\sqrt2=\dfrac{m}{n}\) (서로소) → \(m^2=2n^2\) → \(m\) 짝수 → \(n\)도 짝수 → 서로소에 모순.</p>
<div class="tip"><b>서술형 포인트</b>빈칸 채우기형이 자주 나와요. ‘\(m^2\)이 짝수이므로 \(m\)도 짝수’처럼 대우 증명 결과를 쓰는 줄이 핵심이에요.</div>`},
],

{ id:'0952', tag:'명제의 참, 거짓', c:'c2', t:100, src:'유형 해결의 법칙 공통수학2 p.132, 0952번 (STEP 3 내신 마스터)',
  q:R`\(x, y\)가 실수일 때, 다음 중 참인 명제는?`,
  ch:[R`\(x^2>4\)이면 \(x>2\)이다.`, R`\(x+y>2\)이면 \(x>1\)이고 \(y>1\)이다.`, R`\((x-2)(y-3)=0\)이면 \(x=2\) 또는 \(y=3\)이다.`, R`\(x+y\)가 무리수이면 \(x, y\)는 무리수이다.`, R`\(x\)가 자연수일 때, \(x\)가 소수이면 \(x^2\)은 홀수이다.`], a:2,

<div class="step">② \(x=0,\ y=3\)이면 \(x+y=3>2\)인데 \(x>1\)이 아님. 거짓.</div>
<div class="step">③ \(AB=0\)이면 \(A=0\) 또는 \(B=0\). 참.</div>
<div class="step">④ \(x=\sqrt2,\ y=0\)이면 \(x+y\)는 무리수인데 \(y\)는 유리수. 거짓.</div>

{ id:'0955', tag:'진리집합의 포함 관계', c:'c2', t:100, src:'유형 해결의 법칙 공통수학2 p.132, 0955번 (STEP 3 내신 마스터)',
  q:R`두 조건 \(p: x\le-3\) 또는 \(x\ge3\), \(q: x<a\) 에 대하여 명제 ‘\(\sim p\)이면 \(q\)이다.’가 참이 되도록 하는 실수 \(a\)의 값의 범위는?`,

  hint:R`\(\sim p\)를 먼저 구하고 수직선에 그려 보세요.`,
  sol:R`<div class="step">\(\sim p: -3<x<3\). 명제가 참이려면 \(\{x\mid -3<x<3\}\subset\{x\mid x<a\}\).</div>

<div class="step">\(a\)가 3보다 오른쪽이거나 3과 같으면 돼요. \(a=3\)일 때 \(q: x<3\)이고 \(\sim p\)에 3이 포함되지 않으니 괜찮아요.</div>
<div class="step">따라서 \(a\ge3\).</div>
<div class="warn"><b>경계값</b>열린 끝(○)끼리 만나면 등호 포함, 닫힌 끝(●)이 열린 끝을 넘어가면 등호 제외. 그림으로 확인하는 게 제일 안전해요.</div>`,
  v:{ q:R`두 조건 \(p: x<-2\) 또는 \(x>4\), \(q: x>a\) 에 대하여 명제 ‘\(\sim p\)이면 \(q\)이다.’가 참이 되도록 하는 실수 \(a\)의 값의 범위는?`,
      ch:[R`\(a<-2\)`, R`\(a\le-2\)`, R`\(a<4\)`, R`\(a\ge4\)`, R`\(a>-2\)`], a:0, hint:R`\(\sim p\)는 등호를 포함해요.`,
      sol:R`<div class="step">\(\sim p: -2\le x\le4\). 이것이 \(x>a\) 안에 들어가야 해요.</div><div class="step">\(a=-2\)이면 \(q: x>-2\)라서 \(x=-2\)가 빠져요. 그래서 등호가 안 돼요: \(a<-2\).</div>` } },

{ id:'0870', tag:'대우로 미지수 구하기', c:'c4', t:80, src:'유형 해결의 법칙 공통수학2 p.120, 0870번 (STEP 2 유형 10 대표 문제)',
  q:R`명제 ‘\(4x^2-ax+3\ne0\)이면 \(2x-3\ne0\)이다.’가 참일 때, 상수 \(a\)의 값은?`,
  ch:['2','4','6','8','10'], a:3,
  hint:R`‘\(\ne\)’가 있으면 대우.`,
  sol:R`<div class="step">대우: ‘\(2x-3=0\)이면 \(4x^2-ax+3=0\)이다.’ 원래 명제가 참이면 대우도 참.</div>
<div class="step">\(x=\dfrac{3}{2}\) 을 대입: \(4\cdot\dfrac{9}{4}-\dfrac{3}{2}a+3=0\) → \(12=\dfrac{3}{2}a\) → \(a=8\).</div>
<div class="key"><b>쓴 개념</b>명제와 대우의 참·거짓은 같다.</div>`,
  v:{ q:R`명제 ‘\(x^2+ax-6\ne0\)이면 \(x-2\ne0\)이다.’가 참일 때, 상수 \(a\)의 값은?`, ch:['−1','1','2','3','4'], a:1, hint:R`대우로 바꾸면 \(x=2\)를 대입하게 돼요.`,
      sol:R`<div class="step">대우: \(x=2\)이면 \(x^2+ax-6=0\). \(4+2a-6=0\) → \(a=1\).</div>` } },

{ id:'0958', tag:'역과 대우의 참, 거짓', c:'c4', t:120, src:'유형 해결의 법칙 공통수학2 p.133, 0958번 (STEP 3 내신 마스터)',
  q:R`다음 보기 중 그 역은 참이고, 대우는 거짓인 명제인 것만을 있는 대로 고른 것은? (단, \(x\)는 실수이고 \(A, B\)는 공집합이 아닌 집합이다.)<div class="key">ㄱ. \(x^2\ge9\)이면 \(x\ge3\)이다.<br>ㄴ. \(A\subset B\)이면 \(A\cup B=B\)이다.<br>ㄷ. \(x>2\)이면 \(2x+4>0\)이다.</div>`,
  ch:['ㄱ','ㄷ','ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ'], a:0,
  hint:R`대우가 거짓 = 원래 명제가 거짓. 원래 명제부터 판정하세요.`,
  sol:R`<div class="step">대우가 거짓 ⟺ 원래 명제가 거짓. 그래서 ‘원래 명제 거짓, 역 참’인 것을 찾으면 돼요.</div>
<div class="step">ㄱ. \(x=-4\)이면 \(x^2=16\ge9\)인데 \(x<3\) → 명제 거짓. 역 ‘\(x\ge3\)이면 \(x^2\ge9\)’ 참. 해당 ${ICON.ok}</div>
<div class="step">ㄴ. \(A\subset B\)이면 \(A\cup B=B\) 참 → 대우도 참. 해당 ${ICON.no}</div>
<div class="step">ㄷ. \(x>2\)이면 \(2x+4>8>0\) 참 → 대우 참. 해당 ${ICON.no}</div>
<div class="key"><b>쓴 개념</b>대우 = 원래 명제와 같은 참·거짓</div>`,
  v:{ q:R`다음 보기 중 그 역은 참이고, 대우는 거짓인 명제인 것만을 있는 대로 고른 것은? (단, \(x, y\)는 실수)<div class="key">ㄱ. \(x>0\)이면 \(x>1\)이다.<br>ㄴ. \(xy=0\)이면 \(x=0\)이다.<br>ㄷ. \(x=2\)이면 \(x^2=4\)이다.</div>`,
      ch:['ㄱ','ㄴ','ㄷ','ㄱ, ㄴ','ㄴ, ㄷ'], a:3, hint:R`원래 명제가 거짓인 것부터.`,
      sol:R`<div class="step">ㄱ. 명제 거짓(\(x=\frac12\)), 역 ‘\(x>1\)이면 \(x>0\)’ 참 ${ICON.ok}</div><div class="step">ㄴ. 명제 거짓(\(x=1,\ y=0\)), 역 ‘\(x=0\)이면 \(xy=0\)’ 참 ${ICON.ok}</div><div class="step">ㄷ. 명제 참 → 대우도 참 ${ICON.no}</div>` } },

{ id:'0959', tag:'진리집합과 명제', c:'c5', t:90, src:'유형 해결의 법칙 공통수학2 p.133, 0959번 (STEP 3 내신 마스터)',
  q:R`전체집합 \(U\)에 대하여 세 조건 \(p, q, r\)의 진리집합을 각각 \(P, Q, R\)라 하면 \(P-Q=\varnothing\), \(Q-R=\varnothing\)인 관계가 성립할 때, 다음 중 항상 참이라고 할 수 <b>없는</b> 명제는?`,
  ch:[R`\(p\to q\)`, R`\(q\to r\)`, R`\(p\to r\)`, R`\(\sim r\to\sim p\)`, R`\(\sim p\to\sim r\)`], a:4,
  hint:R`\(P-Q=\varnothing\) 은 무슨 포함 관계일까요?`,
  sol:R`<div class="step">\(P-Q=\varnothing\) ⟺ \(P\subset Q\), \(Q-R=\varnothing\) ⟺ \(Q\subset R\). 그래서 \(P\subset Q\subset R\).</div>
<figure><svg class="fig" viewBox="0 0 300 150" width="280"><ellipse cx="150" cy="75" rx="135" ry="66" class="c1"/><ellipse cx="130" cy="78" rx="85" ry="45" class="c3"/><ellipse cx="110" cy="80" rx="40" ry="24" class="c2"/>
<text x="102" y="85" class="tb">P</text><text x="186" y="84" class="tb">Q</text><text x="258" y="80" class="tb">R</text></svg></figure>
<div class="step">①②③ 포함 관계 그대로 참. ④는 ③의 대우라 참.</div>
<div class="step">⑤ \(\sim p\to\sim r\) 은 \(r\to p\) 의 대우, 즉 \(R\subset P\) 여야 하는데 항상 성립하진 않아요.</div>`,
  v:{ q:R`세 조건 \(p, q, r\)의 진리집합 \(P, Q, R\)에 대하여 \(Q\cup P=P\), \(R\cap Q=R\)일 때, 다음 중 항상 참이라고 할 수 <b>없는</b> 명제는?`,
      ch:[R`\(q\to p\)`, R`\(r\to p\)`, R`\(r\to q\)`, R`\(\sim p\to\sim r\)`, R`\(p\to r\)`], a:4, hint:R`\(Q\cup P=P\) 는 \(Q\subset P\).`,
      sol:R`<div class="step">\(Q\cup P=P\) → \(Q\subset P\), \(R\cap Q=R\) → \(R\subset Q\). 그래서 \(R\subset Q\subset P\).</div><div class="step">⑤ \(p\to r\)은 \(P\subset R\) 이 필요해서 항상 참은 아니에요. ④는 \(r\to p\)의 대우라 참.</div>` } },

{ id:'0961', tag:'필요조건과 미지수', c:'c5', t:120, src:'유형 해결의 법칙 공통수학2 p.133, 0961번 (STEP 3 내신 마스터)',
  q:R`두 조건 \(p: 3x-a=0\), \(q: x^3-7x^2+4x+12=0\) 에 대하여 \(q\)는 \(p\)이기 위한 필요조건이 되도록 하는 모든 실수 \(a\)의 값의 합은?`,
  ch:['18','21','24','27','30'], a:1,
  hint:R`‘\(q\)는 \(p\)이기 위한 필요조건’ → \(p\Rightarrow q\). 삼차식은 인수정리로.`,
  sol:R`<div class="step">\(p\Rightarrow q\) 이므로 \(P\subset Q\).</div>
<div class="step">\(x=2\) 대입: \(8-28+8+12=0\). 조립제법으로 \((x-2)(x^2-5x-6)=(x-2)(x-6)(x+1)\). \(Q=\{-1,2,6\}\).</div>
<div class="step">\(P=\left\{\dfrac{a}{3}\right\}\) 이 \(Q\)에 들어가야 하니 \(\dfrac{a}{3}=-1,\ 2,\ 6\) → \(a=-3,\ 6,\ 18\).</div>
<div class="step">합: \(-3+6+18=21\).</div>`,
  v:{ q:R`두 조건 \(p: 2x-a=0\), \(q: x^2-x-6=0\) 에 대하여 \(q\)는 \(p\)이기 위한 필요조건이 되도록 하는 모든 실수 \(a\)의 값의 합은?`, ch:['−2','0','2','4','6'], a:2, hint:R`\(P\subset Q\).`,
      sol:R`<div class="step">\(Q=\{-2,3\}\), \(\dfrac{a}{2}\in Q\) → \(a=-4,\ 6\). 합 2.</div>` } },

{ id:'0962', tag:'충분·필요조건 연결', c:'c5', t:90, src:'유형 해결의 법칙 공통수학2 p.133, 0962번 (STEP 3 내신 마스터)',
  q:R`세 조건 \(p, q, r\)에 대하여 \(p\)는 \(\sim r\)이기 위한 충분조건, \(r\)는 \(q\)이기 위한 필요조건일 때, 다음 중 항상 참인 명제는?`,
  ch:[R`\(p\to q\)`, R`\(q\to p\)`, R`\(p\to\sim q\)`, R`\(\sim q\to r\)`, R`\(\sim r\to q\)`], a:2,
  hint:R`화살표 두 개로 바꾸고, 하나는 대우로 뒤집어서 이어 붙이세요.`,
  sol:R`<div class="step">\(p\)는 \(\sim r\)이기 위한 충분조건 → \(p\Rightarrow\sim r\).</div>
<div class="step">\(r\)는 \(q\)이기 위한 필요조건 → \(q\Rightarrow r\), 대우 \(\sim r\Rightarrow\sim q\).</div>
<div class="step">이어 붙이면 \(p\Rightarrow\sim r\Rightarrow\sim q\), 즉 \(p\to\sim q\) 참.</div>`,
  v:{ q:R`세 조건 \(p, q, r\)에 대하여 \(p\)는 \(q\)이기 위한 필요조건, \(r\)는 \(\sim q\)이기 위한 충분조건일 때, 다음 중 항상 참인 명제는?`,
      ch:[R`\(q\to\sim r\)`, R`\(p\to r\)`, R`\(r\to q\)`, R`\(\sim p\to q\)`, R`\(r\to p\)`], a:0, hint:R`\(q\Rightarrow p\), \(r\Rightarrow\sim q\).`,
      sol:R`<div class="step">\(r\Rightarrow\sim q\) 의 대우가 \(q\Rightarrow\sim r\). 그래서 ① 참.</div>` } },
],

/* ===== 2. 절대부등식 ===== */
UNITS.push({
id:'ineq', name:'절대부등식',
concepts:[
{ id:'c1', title:'절대부등식과 기본 부등식', body: R`
<p>문자에 어떤 실수를 넣어도 항상 성립하는 부등식이 <b>절대부등식</b>이에요.</p>
<ul><li>\(a^2\ge0\), \(a^2+b^2\ge0\)</li><li>\(a^2\pm ab+b^2\ge0\) (완전제곱식으로 변형)</li><li>\(|a|+|b|\ge|a+b|\) (등호는 \(ab\ge0\))</li></ul>
<div class="key"><b>증명 방법</b>‘(좌변) − (우변)’을 완전제곱식의 합으로 만들거나, 양변이 양수면 제곱해서 비교.</div>`},
{ id:'c2', title:'산술평균과 기하평균의 관계', body: R`
<div class="key"><b>공식</b>\(a>0,\ b>0\) 일 때 \(\dfrac{a+b}{2}\ge\sqrt{ab}\) (등호는 \(a=b\))</div>
${FIG.amgm}
<p>시험에서 쓰는 모양: \(a+b\ge2\sqrt{ab}\).</p>
<ul><li><b>곱이 일정</b>하면 합의 최솟값: \(x+\dfrac{9}{x}\ge2\sqrt{9}=6\) (\(x=3\))</li>
<li><b>합이 일정</b>하면 곱의 최댓값: \(a+b=10\) 이면 \(ab\le25\)</li></ul>
<div class="warn"><b>체크 2개</b>① 두 수가 양수인가? ② 등호가 실제로 성립할 수 있는가? 등호가 안 되면 그 값은 최솟값이 아니에요.</div>`},
{ id:'c3', title:'산술·기하 활용 기술', body: R`
<p><b>상수 만들기</b>: 곱했을 때 문자가 사라지게 식을 쪼개요.</p>
<p>\(x>1\) 일 때 \(x+\dfrac{4}{x-1}=(x-1)+\dfrac{4}{x-1}+1\ge2\sqrt4+1=5\).</p>
<p><b>곱해서 전개</b>: \(x+2y=4\) 일 때 \(\dfrac1x+\dfrac2y\)의 최솟값은 \(\left(\dfrac1x+\dfrac2y\right)(x+2y)\) 를 전개해서 산술·기하.</p>
<div class="warn"><b>함정</b>산술·기하를 두 번 쓰면 등호 조건이 서로 다를 수 있어요. 등호 조건이 동시에 성립하는지 확인하세요.</div>`},
{ id:'c4', title:'코시-슈바르츠 부등식', body: R`
<div class="key"><b>공식</b>\((a^2+b^2)(x^2+y^2)\ge(ax+by)^2\)<br>등호는 \(\dfrac{x}{a}=\dfrac{y}{b}\) 일 때. 세 쌍도 똑같이 성립.</div>
<p><b>언제 쓰나</b>: 일차식의 값이 주어지고 제곱의 합의 최솟값을 묻거나, 제곱의 합이 주어지고 일차식의 최댓값·최솟값을 물을 때.</p>
<p>예) \(x^2+y^2=5\) 일 때 \(x+2y\)의 범위: \((1+4)(x^2+y^2)\ge(x+2y)^2\) → \((x+2y)^2\le25\) → \(-5\le x+2y\le5\).</p>
<div class="tip"><b>요령</b>계수를 맞추는 게 전부예요. \(4x^2\)이 보이면 \((2x)^2\)으로 보고, 짝이 되는 계수를 정하세요.</div>`},
],
checks:[
{ c:'c2', q:R`\(x>0\) 일 때 \(x+\dfrac{9}{x}\) 의 최솟값은?`, ch:['3','6','9','10','18'], a:1,
  deep:R`<p>\(x+\dfrac9x\ge2\sqrt{x\cdot\dfrac9x}=6\), 등호는 \(x=\dfrac9x\) 즉 \(x=3\).</p><p>심화: 범위가 \(x\ge4\) 로 제한되면? 등호 조건 \(x=3\)이 범위 밖이라 산술·기하로는 최솟값을 못 구해요. 이때는 \(x=4\)에서 최소, \(4+\dfrac94=\dfrac{25}{4}\).</p>`,
  review:R`<p>두 양수의 곱 \(x\cdot\dfrac9x=9\)가 일정하니 합의 최솟값은 \(2\sqrt9=6\).</p><p>공식: \(a+b\ge2\sqrt{ab}\). 9를 답으로 골랐다면 루트를 빼먹은 거예요.</p>` },
{ c:'c4', q:R`실수 \(x, y\)에 대하여 \(x^2+y^2=5\) 일 때 \(x+2y\)의 최댓값은?`, ch:['3','4','5','10','25'], a:2,
  deep:R`<p>\((1^2+2^2)(x^2+y^2)\ge(x+2y)^2\) → \(25\ge(x+2y)^2\) → 최댓값 5. 등호: \(\dfrac{x}{1}=\dfrac{y}{2}\), 즉 \(y=2x\)를 대입하면 \(x=1,\ y=2\).</p><p>심화: 이건 원 \(x^2+y^2=5\)와 직선 \(x+2y=k\)가 만날 조건(원의 중심과 직선 사이 거리 \(\le\) 반지름)으로도 풀 수 있어요. 도형의 방정식과 연결돼요.</p>`,
  review:R`<p>코시-슈바르츠: \((a^2+b^2)(x^2+y^2)\ge(ax+by)^2\). 여기서 \(a=1,\ b=2\).</p><p>\(5\times5=25\ge(x+2y)^2\) 이므로 \(x+2y\le5\). 25를 골랐다면 마지막에 제곱근을 안 씌운 거예요.</p>` },
],
problems:[
{ id:'0963', tag:'산술·기하 (곱해서 전개)', c:'c3', t:120, src:'유형 해결의 법칙 공통수학2 p.133, 0963번 (STEP 3 내신 마스터)',
  q:R`양수 \(x, y\)에 대하여 \(x+2y=4\) 일 때, \(\dfrac1x+\dfrac2y\) 의 최솟값은 \(\dfrac{a}{b}\) 이다. 이때 \(a-b\)의 값은? (단, \(a, b\)는 서로소인 자연수이다.)`,
  ch:['1','2','3','4','5'], a:4,
  hint:R`\(\left(\dfrac1x+\dfrac2y\right)(x+2y)\) 를 전개해 보세요.`,
  sol:R`<div class="step">\(\left(\dfrac1x+\dfrac2y\right)(x+2y)=1+\dfrac{2y}{x}+\dfrac{2x}{y}+4=5+\dfrac{2y}{x}+\dfrac{2x}{y}\)</div>
<div class="step">산술·기하: \(\dfrac{2y}{x}+\dfrac{2x}{y}\ge2\sqrt{4}=4\). 그래서 전체 \(\ge9\) (등호 \(x=y\)).</div>
<div class="step">\(x+2y=4\) 이므로 \(4\left(\dfrac1x+\dfrac2y\right)\ge9\) → \(\dfrac1x+\dfrac2y\ge\dfrac94\).</div>
<div class="step">\(a=9,\ b=4\), \(a-b=5\). 등호는 \(x=y=\dfrac43\)에서 성립.</div>`,
  v:{ q:R`양수 \(x, y\)에 대하여 \(x+3y=6\) 일 때, \(\dfrac3x+\dfrac1y\) 의 최솟값은?`, ch:['1','2','3','4','6'], a:1, hint:R`\((x+3y)\)을 곱하세요.`,
      sol:R`<div class="step">\(\left(\dfrac3x+\dfrac1y\right)(x+3y)=3+\dfrac{9y}{x}+\dfrac{x}{y}+3\ge6+2\sqrt9=12\)</div><div class="step">\(6\left(\dfrac3x+\dfrac1y\right)\ge12\) → 최솟값 2.</div>` } },

{ id:'0964', tag:'산술·기하 (치환)', c:'c3', t:120, src:'유형 해결의 법칙 공통수학2 p.133, 0964번 (STEP 3 내신 마스터)',
  q:R`\(a>0\) 일 때, \(a+\dfrac1a+\dfrac{4a}{a^2+1}\) 의 최솟값은?`,
  ch:['2','3','4','5','6'], a:2,
  hint:R`\(\dfrac{4a}{a^2+1}\) 의 분모, 분자를 \(a\)로 나눠 보세요.`,
  sol:R`<div class="step">\(\dfrac{4a}{a^2+1}=\dfrac{4}{a+\frac1a}\). \(t=a+\dfrac1a\) 라 두면 \(t\ge2\).</div>
<div class="step">식 \(=t+\dfrac4t\ge2\sqrt4=4\), 등호는 \(t=2\).</div>
<div class="step">\(t=2\)는 \(a=1\)일 때 가능하므로 최솟값 4.</div>
<div class="warn"><b>체크</b>\(t\)의 범위(\(t\ge2\)) 안에 등호 조건 \(t=2\)가 있는지 꼭 확인. 범위 밖이면 다른 방법이 필요해요.</div>`,
  v:{ q:R`\(x>1\) 일 때, \(x+\dfrac{4}{x-1}\) 의 최솟값은?`, ch:['3','4','5','6','7'], a:2, hint:R`\(x=(x-1)+1\).`,
      sol:R`<div class="step">\((x-1)+\dfrac4{x-1}+1\ge2\sqrt4+1=5\), 등호 \(x-1=2\), \(x=3\).</div>` } },

{ id:'0945', tag:'최댓값·최솟값 (제곱의 합)', c:'c4', t:150, input:'2', src:'유형 해결의 법칙 공통수학2 p.131, 0945번 (STEP 2 유형 26)',
  q:R`실수 \(a, b, c\)에 대하여 \(a+b+c=3\), \(a^2+b^2+c^2=9\) 일 때, \(c\)의 최댓값과 최솟값의 합을 구하시오.`,
  hint:R`\(a+b\), \(a^2+b^2\) 을 \(c\)로 나타내고 코시-슈바르츠 (\(1^2+1^2\))를 쓰세요.`,
  sol:R`<div class="step">\(a+b=3-c\), \(a^2+b^2=9-c^2\).</div>
<div class="step">코시-슈바르츠: \((1^2+1^2)(a^2+b^2)\ge(a+b)^2\) → \(2(9-c^2)\ge(3-c)^2\).</div>
<div class="step">\(18-2c^2\ge9-6c+c^2\) → \(3c^2-6c-9\le0\) → \(c^2-2c-3\le0\) → \((c-3)(c+1)\le0\).</div>
<div class="step">\(-1\le c\le3\). 최댓값 3, 최솟값 −1, 합 <b>2</b>.</div>
<div class="tip"><b>다른 풀이</b>\(a, b\)가 실수이므로 \(t^2-(3-c)t+ab=0\)의 판별식으로 풀어도 같은 결과.</div>`,
  v:{ q:R`실수 \(a, b, c\)에 대하여 \(a+b+c=4\), \(a^2+b^2+c^2=8\) 일 때, \(c\)의 최댓값은?`, ch:[R`\(\dfrac43\)`,'2',R`\(\dfrac83\)`,'3','4'], a:2, hint:R`\(2(a^2+b^2)\ge(a+b)^2\).`,
      sol:R`<div class="step">\(2(8-c^2)\ge(4-c)^2\) → \(16-2c^2\ge16-8c+c^2\) → \(3c^2-8c\le0\) → \(0\le c\le\dfrac83\).</div>` } },

{ id:'0944', tag:'코시-슈바르츠', c:'c4', t:90, src:'유형 해결의 법칙 공통수학2 p.131, 0944번 (STEP 2 유형 26)',
  q:R`실수 \(x, y\)에 대하여 \(\dfrac{x}{3}+\dfrac{y}{2}=\sqrt{26}\) 일 때, \(x^2+y^2\)의 최솟값은?`,
  ch:['18','36','54','72','90'], a:3,
  hint:R`계수 \(\dfrac13, \dfrac12\) 과 짝을 맞추세요.`,
  sol:R`<div class="step">\(\left\{\left(\dfrac13\right)^2+\left(\dfrac12\right)^2\right\}(x^2+y^2)\ge\left(\dfrac{x}{3}+\dfrac{y}{2}\right)^2=26\)</div>
<div class="step">\(\dfrac19+\dfrac14=\dfrac{13}{36}\) 이므로 \(x^2+y^2\ge26\times\dfrac{36}{13}=72\).</div>`,
  v:{ q:R`실수 \(x, y\)에 대하여 \(\dfrac{x}{4}+\dfrac{y}{3}=5\) 일 때, \(x^2+y^2\)의 최솟값은?`, ch:['100','121','144','169','196'], a:2, hint:R`\(\dfrac1{16}+\dfrac19\).`,
      sol:R`<div class="step">\(\left(\dfrac1{16}+\dfrac19\right)(x^2+y^2)\ge25\), \(\dfrac{25}{144}(x^2+y^2)\ge25\) → \(\ge144\).</div>` } },

{ id:'0946', tag:'코시-슈바르츠 (세 문자)', c:'c4', t:100, src:'유형 해결의 법칙 공통수학2 p.131, 0946번 (STEP 2 유형 26 Plus)',
  q:R`실수 \(x, y, z\)에 대하여 \(4x+y+3z=12\) 일 때, \(4x^2+y^2+9z^2\)의 최솟값은?`,
  ch:['20','22','24','26','28'], a:2,
  hint:R`\(4x^2=(2x)^2\), \(9z^2=(3z)^2\). 그러면 \(4x=2\cdot(2x)\).`,
  sol:R`<div class="step">\(X=2x,\ Y=y,\ Z=3z\) 로 보면 \(4x+y+3z=2X+Y+Z=12\).</div>
<div class="step">\((2^2+1^2+1^2)(X^2+Y^2+Z^2)\ge(2X+Y+Z)^2=144\)</div>
<div class="step">\(6(4x^2+y^2+9z^2)\ge144\) → 최솟값 24.</div>`,
  v:{ q:R`실수 \(x, y, z\)에 대하여 \(2x+y+2z=9\) 일 때, \(x^2+y^2+z^2\)의 최솟값은?`, ch:['3','6','9','12','27'], a:2, hint:R`\((4+1+4)\).`,
      sol:R`<div class="step">\(9(x^2+y^2+z^2)\ge81\) → 최솟값 9.</div>` } },

{ id:'0965', tag:'산술·기하 + 코시-슈바르츠', c:'c4', t:150, src:'유형 해결의 법칙 공통수학2 p.133, 0965번 (STEP 3 내신 마스터)',
  q:R`\(a>0,\ b>0,\ c>0,\ d>0\) 이고 \(a^2+b^2=2\), \(c^2+d^2=8\) 일 때, \(ab+cd\)의 최댓값을 \(\alpha\), \(ac+bd\)의 최댓값을 \(\beta\)라 하자. 이때 \(\alpha+\beta\)의 값은?`,
  ch:['5','7','9','11','13'], a:2,
  hint:R`\(ab\)는 \(a^2+b^2\)로, \(ac+bd\)는 코시-슈바르츠로.`,
  sol:R`<div class="step">\(a^2+b^2\ge2ab\) → \(ab\le1\). \(c^2+d^2\ge2cd\) → \(cd\le4\). 등호 \(a=b=1,\ c=d=2\) 가 동시에 가능하므로 \(\alpha=5\).</div>
<div class="step">\((a^2+b^2)(c^2+d^2)\ge(ac+bd)^2\) → \(16\ge(ac+bd)^2\) → \(\beta=4\).</div>
<div class="step">\(\alpha+\beta=9\).</div>`,
  v:{ q:R`양수 \(a, b, c, d\)에 대하여 \(a^2+b^2=2\), \(c^2+d^2=18\) 일 때, \(ab+cd\)의 최댓값을 \(\alpha\), \(ac+bd\)의 최댓값을 \(\beta\)라 하자. \(\alpha+\beta\)의 값은?`, ch:['12','14','16','18','20'], a:2, hint:R`\(ab\le1,\ cd\le9\).`,
      sol:R`<div class="step">\(\alpha=1+9=10\), \(\beta=\sqrt{2\cdot18}=6\), 합 16.</div>` } },
],

/* ===== 3. 함수 ===== */
UNITS.push({
id:'func', name:'함수',
concepts:[
{ id:'c1', title:'함수의 뜻, 정의역·공역·치역', body: R`
<p>\(X\)의 <b>각 원소</b>에 \(Y\)의 원소가 <b>오직 하나씩</b> 대응할 때 \(f: X\to Y\)를 함수라 해요.</p>
${mapDiagram(['1','2','3'],['a','b','c'],[[0,0],[1,0],[2,1]],'함수 O: 1, 2가 같은 곳으로 가도 괜찮다. 남는 원소 c도 괜찮다.')}
${mapDiagram(['1','2','3'],['a','b','c'],[[0,0],[0,1],[1,2]],'함수 X: 1이 두 곳으로 가고, 3은 갈 곳이 없다.')}
<div class="key"><b>용어</b>정의역 \(X\), 공역 \(Y\), 치역 \(\{f(x)\mid x\in X\}\subset Y\).</div>
<p>그래프로 판정: \(y\)축에 평행한 직선이 그래프와 항상 한 점에서 만나야 함수.</p>
<div class="tip"><b>문제 유형</b>‘\(X\)에서 \(Y\)로의 함수인가’는 \(X\)의 원소를 모두 넣어서 결과가 전부 \(Y\) 안에 있는지 보는 것.</div>`},
{ id:'c2', title:'서로 같은 함수', body: R`
<p>두 함수 \(f, g\)가 같으려면 정의역과 공역이 각각 같고, 정의역의 모든 \(x\)에서 \(f(x)=g(x)\).</p>
<p>예) \(X=\{-1,1\}\)에서 \(f(x)=x^2\), \(g(x)=|x|\) 는 서로 같은 함수(둘 다 1).</p>`},
{ id:'c3', title:'일대일함수와 일대일대응', body: R`
<div class="key"><b>정의</b>일대일함수: \(x_1\ne x_2\) 이면 \(f(x_1)\ne f(x_2)\).<br>일대일대응: 일대일함수 + 치역 = 공역.</div>
${FIG.hline}
<p>실수 전체에서 정의된 구간별 일차함수가 일대일대응이 되려면</p>
<ul><li>두 직선의 기울기 부호가 같고 (곱이 양수)</li><li>경계에서 이어져야 해요(경계값이 같아야 치역 = 실수 전체).</li></ul>
<div class="warn"><b>자주 틀림</b>\(f(x)=|2x|+x\) 처럼 절댓값이 섞이면 구간을 나눠 기울기를 확인하세요. \(x\ge0\)에서 \(3x\), \(x<0\)에서 \(-x\) → 기울기 부호가 달라 일대일 아님.</div>`},
{ id:'c4', title:'항등함수, 상수함수, 함수의 개수', body: R`
<ul><li>항등함수: \(f(x)=x\) (\(X\to X\))</li><li>상수함수: 모든 \(x\)에 대하여 \(f(x)=c\)</li></ul>
<div class="key"><b>개수</b>\(n(X)=m,\ n(Y)=n\) 일 때<br>함수 \(n^m\)개, 일대일함수 \(_n\mathrm{P}_m=n(n-1)\cdots(n-m+1)\)개, 일대일대응 \(n!\)개 (\(m=n\)).</div>
<div class="tip"><b>항등함수 문제</b>‘\(f\)가 \(X\)에서 \(X\)로의 항등함수’ → \(f(x)=x\)를 만족하는 \(x\)들이 곧 \(X\)의 원소.</div>`},
],
checks:[
{ c:'c1', q:R`다음 대응 \(f: X\to Y\)에 대한 설명으로 옳은 것은?`, fig: mapDiagram(['1','2','3'],['a','b','c'],[[0,0],[1,0],[2,1]]),
  ch:['일대일대응이다','일대일함수지만 일대일대응은 아니다','함수지만 일대일함수는 아니다','함수가 아니다'], a:2,
  deep:R`<p>\(X\)의 모든 원소가 하나씩 대응하니 함수. 그런데 1, 2가 모두 a로 가서 일대일은 아니에요. 치역은 \(\{a,b\}\), 공역은 \(\{a,b,c\}\).</p><p>심화: \(X=\{1,2,3\}\), \(Y=\{a,b,c\}\)에서 일대일함수의 개수는 \(3\times2\times1=6\), 함수 전체는 \(3^3=27\)개예요.</p>`,
  review:R`<p>함수 조건은 ‘\(X\)의 원소마다 화살표가 정확히 하나’. \(Y\) 쪽은 남아도 되고 겹쳐도 돼요.</p><p>일대일은 ‘\(Y\) 쪽에서 화살표를 두 개 받는 원소가 없음’. a가 두 개를 받으니 일대일이 아니에요.</p>` },
{ c:'c4', q:R`\(n(X)=3\), \(n(Y)=4\) 일 때, \(X\)에서 \(Y\)로의 일대일함수의 개수는?`, ch:['12','24','64','81','7'], a:1,
  deep:R`<p>첫 원소 4가지, 다음 3가지, 다음 2가지: \(4\times3\times2=24\).</p><p>심화: 함수의 개수는 \(4^3=64\), \(Y\)에서 \(X\)로의 일대일함수는 0개(원소가 모자라서 불가능). 조건 붙은 개수 문제(예: \(f(1)<f(2)<f(3)\))는 \(_4\mathrm{C}_3=4\)처럼 고르기만 하면 돼요.</p>`,
  review:R`<p>일대일이니 \(X\)의 원소들이 서로 다른 곳으로 가야 해요. 하나 고를 때마다 선택지가 하나씩 줄어요: \(4\times3\times2\).</p><p>64는 일대일 조건 없이 아무 함수나 센 개수예요.</p>` },
],
problems:[
{ id:'1123', tag:'함수의 뜻', c:'c1', t:80, src:'유형 해결의 법칙 공통수학2 p.156, 1123번 (STEP 3 내신 마스터)',
  q:R`두 집합 \(X=\{1,2,3,4\}\), \(Y=\{1,2,3\}\)에 대하여 다음 중 \(X\)에서 \(Y\)로의 함수인 것은?`,
  ch:[R`\(f(x)=x-1\)`, R`\(f(x)=\sqrt x\)`, R`\(f(x)=4-|-x|\)`, R`\(f(x)=x^2-1\)`, R`\(f(x)=\begin{cases}1 & (x\ge2)\\ 2 & (x<2)\end{cases}\)`], a:4,
  hint:R`\(X\)의 원소 1, 2, 3, 4를 직접 넣어 보세요.`,
  sol:R`<div class="step">① \(f(1)=0\notin Y\) ② \(f(2)=\sqrt2\notin Y\) ③ \(f(4)=0\notin Y\) ④ \(f(1)=0\notin Y\)</div>
<div class="step">⑤ \(f(1)=2\), \(f(2)=f(3)=f(4)=1\). 모두 \(Y\) 안. 함수 ${ICON.ok}</div>`,
  v:{ q:R`두 집합 \(X=\{0,1,2\}\), \(Y=\{0,1,2,3\}\)에 대하여 다음 중 \(X\)에서 \(Y\)로의 함수인 것은?`, ch:[R`\(f(x)=x+2\)`, R`\(f(x)=x^2\)`, R`\(f(x)=|x-1|\)`, R`\(f(x)=2x-1\)`, R`\(f(x)=2x\)`], a:2, hint:R`0, 1, 2 대입.`,
      sol:R`<div class="step">① \(f(2)=4\) ② \(f(2)=4\) ④ \(f(0)=-1\) ⑤ \(f(2)=4\) → 모두 탈락.</div><div class="step">③ \(1, 0, 1\) 모두 \(Y\) 안.</div>` } },

{ id:'1124', tag:'치역 구하기', c:'c1', t:90, src:'유형 해결의 법칙 공통수학2 p.156, 1124번 (STEP 3 내신 마스터)',
  q:R`집합 \(X=\{x\mid-2\le x\le3\}\)을 정의역으로 하는 함수 \(f(x)=|x-1|+x\)의 치역이 \(\{f(x)\mid a\le f(x)\le b\}\)일 때, \(a+b\)의 값은?`,
  ch:['2','4','6','8','10'], a:2,
  hint:R`절댓값 안이 0이 되는 \(x=1\)에서 나눠요.`,
  sol:R`<div class="step">\(x<1\): \(f(x)=-(x-1)+x=1\) (상수).</div>
<div class="step">\(x\ge1\): \(f(x)=2x-1\), \(x=3\)에서 5.</div>
<figure><svg class="fig" viewBox="0 0 240 160" width="240"><line x1="10" y1="140" x2="230" y2="140" class="ax"/><line x1="90" y1="150" x2="90" y2="5" class="ax"/>
<polyline points="50,120 110,120 150,40" class="c1"/><circle cx="50" cy="120" r="3.5" class="dot"/><circle cx="150" cy="40" r="3.5" class="dot"/>
<line x1="90" y1="40" x2="150" y2="40" class="ds"/><text x="80" y="124" text-anchor="end">1</text><text x="80" y="44" text-anchor="end">5</text><text x="50" y="155" text-anchor="middle">−2</text><text x="150" y="155" text-anchor="middle">3</text></svg></figure>
<div class="step">치역 \(1\le f(x)\le5\), \(a+b=6\).</div>`,
  v:{ q:R`\(X=\{x\mid-1\le x\le4\}\)을 정의역으로 하는 \(f(x)=|x-2|+x\)의 치역이 \(\{f(x)\mid a\le f(x)\le b\}\)일 때 \(a+b\)는?`, ch:['4','6','8','10','12'], a:2, hint:R`\(x=2\)에서 나눠요.`,
      sol:R`<div class="step">\(x<2\): \(f=2\). \(x\ge2\): \(f=2x-2\), 최대 \(f(4)=6\). 치역 \([2,6]\), 합 8.</div>` } },

{ id:'1125', tag:'일대일대응 판별', c:'c3', t:90, src:'유형 해결의 법칙 공통수학2 p.156, 1125번 (STEP 3 내신 마스터)',
  q:R`실수 전체의 집합에서 정의된 보기의 함수 중 정의역의 임의의 두 원소 \(x_1, x_2\)에 대하여 \(f(x_1)=f(x_2)\)이면 \(x_1=x_2\)이고, 치역과 공역이 같은 함수인 것만을 있는 대로 고른 것은?<div class="key">ㄱ. \(f(x)=1\) &nbsp; ㄴ. \(f(x)=-2x\)<br>ㄷ. \(f(x)=|2x|+x\) &nbsp; ㄹ. \(f(x)=\begin{cases}x^2&(x\ge0)\\-x^2&(x<0)\end{cases}\)</div>`,
  ch:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ'], a:3,
  hint:R`조건 = 일대일대응. 그래프를 그려서 가로선 판정.`,
  sol:R`<div class="step">조건은 일대일대응을 뜻해요.</div>
<div class="step">ㄱ. 상수함수, 일대일 아님. ㄴ. 감소하는 직선, 일대일대응 ${ICON.ok}</div>
<div class="step">ㄷ. \(x\ge0\): \(3x\), \(x<0\): \(-x\). 기울기 부호가 달라 V자 모양 → 일대일 아님.</div>
<div class="step">ㄹ. \(x\ge0\)은 증가, \(x<0\)도 증가하고 0에서 이어짐 → 일대일대응 ${ICON.ok}</div>`,
  v:{ q:R`실수 전체에서 정의된 보기의 함수 중 일대일대응인 것만을 있는 대로 고른 것은?<div class="key">ㄱ. \(f(x)=x^3\) &nbsp; ㄴ. \(f(x)=|x|\)<br>ㄷ. \(f(x)=x|x|\) &nbsp; ㄹ. \(f(x)=x^2+1\)</div>`, ch:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ'], a:1, hint:R`ㄷ은 구간을 나눠 보세요.`,
      sol:R`<div class="step">ㄱ. 계속 증가 ${ICON.ok} ㄴ. \(f(1)=f(-1)\) ${ICON.no} ㄷ. \(x\ge0\): \(x^2\), \(x<0\): \(-x^2\) → 계속 증가 ${ICON.ok} ㄹ. \(f(1)=f(-1)\) ${ICON.no}</div>` } },

{ id:'1126', tag:'구간별 함수의 일대일대응', c:'c3', t:100, src:'유형 해결의 법칙 공통수학2 p.156, 1126번 (STEP 3 내신 마스터)',
  q:R`실수 전체의 집합에서 정의된 함수 \(f(x)=\begin{cases}(a-1)x+2&(x\ge0)\\(a+1)x+2&(x<0)\end{cases}\)가 일대일대응이 되도록 하는 실수 \(a\)의 값의 범위는?`,
  ch:[R`\(a\le-1\)`, R`\(a\le0\)`, R`\(-1<a<1\)`, R`\(a<-1\) 또는 \(a>1\)`, R`\(a\ge0\)`], a:3,
  hint:R`두 직선 모두 \(x=0\)에서 2를 지나요. 남은 건 기울기 부호.`,
  sol:R`<div class="step">두 식 모두 \(x=0\)에서 값이 2라서 이어져 있어요.</div>
<div class="step">일대일대응이려면 두 기울기의 부호가 같아야 함: \((a-1)(a+1)>0\).</div>
<div class="step">\(a<-1\) 또는 \(a>1\). (기울기가 0이면 상수 구간이 생겨 안 돼요.)</div>`,
  v:{ q:R`\(f(x)=\begin{cases}(a+2)x+1&(x\ge0)\\(3-a)x+1&(x<0)\end{cases}\)가 일대일대응이 되도록 하는 \(a\)의 범위는?`, ch:[R`\(a<-2\)`, R`\(-2<a<3\)`, R`\(a>3\)`, R`\(a<-2\) 또는 \(a>3\)`, R`\(-3<a<2\)`], a:1, hint:R`\((a+2)(3-a)>0\).`,
      sol:R`<div class="step">\((a+2)(3-a)>0\) → \((a+2)(a-3)<0\) → \(-2<a<3\).</div>` } },

{ id:'1127', tag:'항등함수', c:'c4', t:120, src:'유형 해결의 법칙 공통수학2 p.156, 1127번 (STEP 3 내신 마스터)',
  q:R`네 개의 서로 다른 실수를 원소로 갖는 집합 \(X\)에 대하여 \(X\)에서 \(X\)로의 함수 \(f(x)=\begin{cases}-5&(x<-4)\\x^2+2x-6&(-4\le x<3)\\7&(x\ge3)\end{cases}\)이 항등함수일 때, \(f(x)\)의 모든 함숫값들의 합은?`,
  ch:['−2','−1','0','1','2'], a:3,
  hint:R`구간마다 \(f(x)=x\) 를 풀고, 그 구간에 들어가는지 확인.`,
  sol:R`<div class="step">\(x<-4\): \(-5=x\) → \(x=-5\) ${ICON.ok} (범위 안)</div>
<div class="step">\(-4\le x<3\): \(x^2+2x-6=x\) → \(x^2+x-6=0\) → \(x=2,\ -3\) 둘 다 범위 안 ${ICON.ok}</div>
<div class="step">\(x\ge3\): \(7=x\) ${ICON.ok}</div>
<div class="step">\(X=\{-5,-3,2,7\}\). 항등함수라 함숫값 = 원소, 합 \(1\).</div>`,
  v:{ q:R`네 개의 서로 다른 실수를 원소로 갖는 집합 \(X\)에서 \(X\)로의 함수 \(f(x)=\begin{cases}-4&(x<-3)\\x^2+x-3&(-3\le x<2)\\5&(x\ge2)\end{cases}\)이 항등함수일 때, 모든 함숫값의 합은?`, ch:['−1','0','1','2','3'], a:2, hint:R`가운데 구간은 \(x^2=3\).`,
      sol:R`<div class="step">\(x=-4\), \(x=\pm\sqrt3\) (둘 다 \([-3,2)\) 안), \(x=5\). 합 \(-4+0+5=1\).</div>` } },

{ id:'1128', tag:'조건 있는 함수의 개수', c:'c4', t:120, src:'유형 해결의 법칙 공통수학2 p.156, 1128번 (STEP 3 내신 마스터)',
  q:R`집합 \(X=\{1,2,3,4,5\}\)에 대하여 \(X\)에서 \(X\)로의 함수 중 다음 조건을 만족시키는 함수 \(f\)의 개수는?<div class="key">(가) 임의의 \(x\in X\)에 대하여 \(x+f(x)\)는 짝수이다.<br>(나) 함수 \(f\)는 일대일대응이다.</div>`,
  ch:['8','10','12','14','16'], a:2,
  hint:R`\(x+f(x)\)가 짝수 → \(x\)와 \(f(x)\)의 홀짝이 같다.`,
  sol:R`<div class="step">홀수 \(\{1,3,5\}\)는 홀수끼리, 짝수 \(\{2,4\}\)는 짝수끼리 대응.</div>
<div class="step">일대일대응이니 홀수끼리 \(3!=6\), 짝수끼리 \(2!=2\).</div>
<div class="step">\(6\times2=12\).</div>`,
  v:{ q:R`\(X=\{1,2,3,4\}\)에서 \(X\)로의 일대일대응 \(f\) 중 모든 \(x\)에 대하여 \(x+f(x)\)가 홀수인 것의 개수는?`, ch:['2','4','6','8','24'], a:1, hint:R`홀수는 짝수로, 짝수는 홀수로.`,
      sol:R`<div class="step">\(\{1,3\}\to\{2,4\}\): \(2!\), \(\{2,4\}\to\{1,3\}\): \(2!\). 곱 4.</div>` } },
],

/* ===== 4. 합성함수와 역함수 ===== */
UNITS.push({
id:'inv', name:'합성함수와 역함수',
concepts:[
{ id:'c1', title:'합성함수', body: R`
<div class="key"><b>정의</b>\((f\circ g)(x)=f(g(x))\). 안쪽 \(g\)를 먼저 계산한다.</div>
<p>예) \(f(x)=2x+1,\ g(x)=x^2\): \((f\circ g)(2)=f(4)=9\), \((g\circ f)(2)=g(5)=25\).</p>
<ul><li>교환법칙 X: \(f\circ g\ne g\circ f\) (일반적으로)</li><li>결합법칙 O: \((f\circ g)\circ h=f\circ(g\circ h)\)</li><li>\(f\circ I=I\circ f=f\)</li></ul>
<div class="tip"><b>\(f\circ g=h\) 에서 \(f(\square)\) 구하기</b>식 전체를 구하지 말고, \(g(x)=\square\) 가 되는 \(x\)를 찾아 \(h(x)\)에 넣으면 끝.</div>
<div class="tip"><b>규칙 찾기</b>\(f(n)=\) ‘\(n\) 이하 소수의 개수’ 같은 함수의 반복 합성은 안쪽부터 하나씩 계산.</div>`},
{ id:'c2', title:'역함수의 뜻과 구하는 법', body: R`
<p>\(f\)가 <b>일대일대응</b>일 때만 역함수 \(f^{-1}\)이 존재해요.</p>
<div class="key"><b>핵심</b>\(f(a)=b\) ⟺ \(f^{-1}(b)=a\)</div>
<p>구하는 순서: \(y=f(x)\)를 \(x\)에 대해 풀고 → \(x\)와 \(y\)를 바꾼다. 정의역과 치역도 서로 바뀐다.</p>
<p>예) \(y=3x-6\) → \(x=\dfrac{y}{3}+2\) → \(f^{-1}(x)=\dfrac{x}{3}+2\).</p>
<div class="tip"><b>값만 물으면</b>\(f^{-1}(5)\)를 구하라고 하면 역함수 식을 만들지 말고 \(f(x)=5\)를 풀어요. 훨씬 빨라요.</div>`},
{ id:'c3', title:'역함수의 성질', body: R`
<ul><li>\((f^{-1})^{-1}=f\)</li><li>\(f^{-1}\circ f=I\), \(f\circ f^{-1}=I\)</li><li>\((f\circ g)^{-1}=g^{-1}\circ f^{-1}\) (양말 신고 신발 신고, 벗을 땐 신발 먼저)</li></ul>
<div class="warn"><b>자주 틀림</b>\((g\circ f)^{-1}(2)=f^{-1}(g^{-1}(2))\). 순서가 뒤집혀요.</div>
<p>예) \((f\circ g)^{-1}(3x-1)=x\) 이면 양변에 \(f\circ g\)를 씌워 \((f\circ g)(x)=3x-1\).</p>`},
{ id:'c4', title:'역함수의 그래프', body: R`
${FIG.inverse}
<div class="key"><b>대칭</b>\(y=f(x)\)와 \(y=f^{-1}(x)\)의 그래프는 직선 \(y=x\)에 대칭.</div>
<p>\(f\)가 <b>증가함수</b>이면 두 그래프의 교점은 \(y=f(x)\)와 \(y=x\)의 교점과 같아요. 그래서 \(f(x)=x\)를 풀면 돼요.</p>
<div class="warn"><b>감소함수</b>는 \(y=x\) 밖에서도 만날 수 있으니 이 방법을 그대로 쓰면 안 돼요.</div>
<p>자기 자신이 역함수인 일차함수: \(y=x\) 또는 기울기가 \(-1\)인 직선 (\(y=-x+k\)).</p>`},
],
checks:[
{ c:'c1', q:R`\(f(x)=2x+1,\ g(x)=x^2\) 일 때, \((f\circ g)(2)\)의 값은?`, ch:['5','9','10','25','17'], a:1,
  deep:R`<p>\(g(2)=4\) → \(f(4)=9\).</p><p>심화: \((f\circ g)(x)=2x^2+1\), \((g\circ f)(x)=(2x+1)^2\). 두 식이 같아지는 \(x\)를 구하면 \(2x^2+1=4x^2+4x+1\) → \(x=0\) 또는 \(x=-2\). 이렇게 교환법칙이 성립하는 점만 따로 묻는 문제도 나와요.</p>`,
  review:R`<p>\((f\circ g)(2)=f(g(2))\). 오른쪽 \(g\)부터예요. 25를 골랐다면 \(f\)를 먼저 해서 \(g(f(2))\)를 계산한 거예요.</p>` },
{ c:'c2', q:R`\(f(x)=3x-6\) 일 때, \(f^{-1}(x)\)는?`, ch:[R`\(3x+6\)`, R`\(\dfrac{x}{3}+2\)`, R`\(\dfrac{x}{3}-2\)`, R`\(\dfrac{1}{3x-6}\)`], a:1,
  deep:R`<p>\(y=3x-6\) → \(x=\dfrac{y+6}{3}\) → \(f^{-1}(x)=\dfrac{x}{3}+2\).</p><p>심화: 일차함수 \(y=ax+b\)와 그 역함수의 그래프가 만나는 점은 \(y=x\) 위 (\(a>0\)일 때). \(3x-6=x\) → \((3,3)\). 계산 없이도 교점을 바로 찾을 수 있어요.</p>`,
  review:R`<p>\(f^{-1}(x)\)는 \(\dfrac1{f(x)}\)가 아니에요. 순서: \(x\)에 대해 풀고 → \(x, y\) 바꾸기.</p><p>\(y=3x-6\) → \(3x=y+6\) → \(x=\dfrac{y}{3}+2\) → \(y=\dfrac{x}{3}+2\).</p>` },
],
problems:[
{ id:'1129', tag:'합성함수의 값', c:'c1', t:80, src:'유형 해결의 법칙 공통수학2 p.156, 1129번 (STEP 3 내신 마스터)',
  q:R`자연수 \(n\)에 대하여 \(f(n)\)을 \(n\)보다 작거나 같은 소수의 개수라 하자. 예를 들어 \(f(1)=0,\ f(2)=1\)이다. 이때 \(f(13)+(f\circ f)(13)+(f\circ f\circ f)(13)\)의 값은?`,
  ch:['5','7','9','11','13'], a:3,
  hint:R`\(f(13)\)부터 차례대로.`,
  sol:R`<div class="step">13 이하 소수: 2, 3, 5, 7, 11, 13 → \(f(13)=6\).</div>
<div class="step">\((f\circ f)(13)=f(6)=3\) (2, 3, 5).</div>
<div class="step">\((f\circ f\circ f)(13)=f(3)=2\).</div>
<div class="step">합 \(6+3+2=11\).</div>`,
  v:{ q:R`자연수 \(n\)에 대하여 \(f(n)\)을 \(n\)의 양의 약수의 개수라 하자. \(f(12)+(f\circ f)(12)+(f\circ f\circ f)(12)\)의 값은?`, ch:['9','11','12','13','15'], a:3, hint:R`12의 약수는 6개.`,
      sol:R`<div class="step">\(f(12)=6\), \(f(6)=4\), \(f(4)=3\). 합 13.</div>` } },

{ id:'1131', tag:'합성함수에서 함숫값 찾기', c:'c1', t:80, src:'유형 해결의 법칙 공통수학2 p.157, 1131번 (STEP 3 내신 마스터)',
  q:R`두 함수 \(g, h\)가 \(g(x)=\dfrac{x+2}{5}\), \(h(x)=3x+6\)일 때, \((f\circ g)(x)=h(x)\)를 만족시키는 함수 \(f(x)\)에 대하여 \(f(-1)\)의 값은?`,
  ch:['−15','−12','−9','−6','−3'], a:0,
  hint:R`\(g(x)=-1\) 이 되는 \(x\)를 찾으세요.`,
  sol:R`<div class="step">\(f(g(x))=3x+6\). \(g(x)=-1\) 이 되는 \(x\): \(\dfrac{x+2}{5}=-1\) → \(x=-7\).</div>
<div class="step">\(f(-1)=f(g(-7))=h(-7)=-21+6=-15\).</div>
<div class="tip"><b>다른 풀이</b>\(t=\dfrac{x+2}{5}\)로 치환하면 \(x=5t-2\), \(f(t)=15t\). \(f(-1)=-15\).</div>`,
  v:{ q:R`\(g(x)=\dfrac{x-1}{3}\), \(h(x)=2x+5\)일 때, \((f\circ g)(x)=h(x)\)를 만족시키는 \(f\)에 대하여 \(f(2)\)의 값은?`, ch:['9','13','17','19','21'], a:3, hint:R`\(g(x)=2\).`,
      sol:R`<div class="step">\(\dfrac{x-1}{3}=2\) → \(x=7\). \(f(2)=h(7)=19\).</div>` } },

{ id:'1133', tag:'합성함수의 역함수', c:'c3', t:120, src:'유형 해결의 법칙 공통수학2 p.157, 1133번 (STEP 3 내신 마스터)',
  q:R`두 함수 \(f(x)=ax+b,\ g(x)=x+c\)에 대하여 \((f\circ g)^{-1}(3x-1)=x\), \(f^{-1}(2)=-1\)일 때, \(a+2b+3c\)의 값은? (단, \(a, b, c\)는 상수)`,
  ch:['3','5','7','9','11'], a:2,
  hint:R`\((f\circ g)^{-1}(A)=x\) ⟺ \((f\circ g)(x)=A\).`,
  sol:R`<div class="step">\((f\circ g)(x)=3x-1\). 그런데 \(f(g(x))=a(x+c)+b=ax+ac+b\).</div>
<div class="step">계수 비교: \(a=3\), \(3c+b=-1\).</div>
<div class="step">\(f^{-1}(2)=-1\) ⟺ \(f(-1)=2\): \(-3+b=2\) → \(b=5\), 그래서 \(c=-2\).</div>
<div class="step">\(a+2b+3c=3+10-6=7\).</div>`,
  v:{ q:R`\(f(x)=ax+b,\ g(x)=x+c\)에 대하여 \((f\circ g)^{-1}(2x+3)=x\), \(f^{-1}(1)=2\)일 때, \(a+b+c\)의 값은?`, ch:['0','1','2','3','4'], a:2, hint:R`\(f(2)=1\).`,
      sol:R`<div class="step">\(ax+ac+b=2x+3\) → \(a=2\), \(2c+b=3\).</div><div class="step">\(f(2)=4+b=1\) → \(b=-3\), \(c=3\). 합 2.</div>` } },

{ id:'1134', tag:'역함수의 값', c:'c3', t:90, src:'유형 해결의 법칙 공통수학2 p.157, 1134번 (STEP 3 내신 마스터)',
  q:R`두 함수 \(f(x)=3x^2+2\ (x\ge0)\), \(g(x)=x-3\)에 대하여 \((g\circ f)^{-1}(2)+(f^{-1}\circ g^{-1})(2)\)의 값은?`,
  ch:['2','3','4','5','6'], a:0,
  hint:R`\((g\circ f)^{-1}=f^{-1}\circ g^{-1}\). 두 항은 사실 같아요.`,
  sol:R`<div class="step">\((g\circ f)^{-1}=f^{-1}\circ g^{-1}\) 이므로 두 항이 같아요.</div>
<div class="step">\(g^{-1}(2)=k\) ⟺ \(g(k)=2\) → \(k=5\).</div>
<div class="step">\(f^{-1}(5)=m\) ⟺ \(3m^2+2=5\), \(m\ge0\) → \(m=1\).</div>
<div class="step">\(1+1=2\).</div>`,
  v:{ q:R`\(f(x)=2x^2-1\ (x\ge0)\), \(g(x)=x+4\)에 대하여 \((g\circ f)^{-1}(11)+(f^{-1}\circ g^{-1})(11)\)의 값은?`, ch:['2','3','4','5','6'], a:2, hint:R`\(g^{-1}(11)=7\).`,
      sol:R`<div class="step">\(g^{-1}(11)=7\), \(2m^2-1=7\) → \(m=2\). 두 항 모두 2, 합 4.</div>` } },

{ id:'1135', tag:'역함수와 그래프가 일치', c:'c4', t:80, src:'유형 해결의 법칙 공통수학2 p.157, 1135번 (STEP 3 내신 마스터)',
  q:R`점 \((-1,3)\)을 지나는 일차함수 \(y=f(x)\)의 그래프와 \(y=f^{-1}(x)\)의 그래프가 일치할 때, \(f(2)\)의 값은?`,
  ch:['−2','−1','0','1','2'], a:2,
  hint:R`자기 자신이 역함수인 일차함수는 \(y=x\) 또는 기울기 \(-1\).`,
  sol:R`<div class="step">\(f=f^{-1}\)인 일차함수는 \(y=x\) 또는 \(y=-x+k\).</div>
<div class="step">\(y=x\)는 \((-1,3)\)을 안 지나요. \(y=-x+k\)에 대입: \(3=1+k\) → \(k=2\).</div>
<div class="step">\(f(x)=-x+2\), \(f(2)=0\).</div>
<div class="tip"><b>확인</b>\(f(x)=ax+b\)의 역함수 \(\dfrac{x-b}{a}\)와 비교: \(a=\dfrac1a\), \(b=-\dfrac ba\) → \(a=-1\) (또는 \(a=1,\ b=0\)).</div>`,
  v:{ q:R`점 \((2,-1)\)을 지나는 일차함수 \(y=f(x)\)의 그래프와 \(y=f^{-1}(x)\)의 그래프가 일치할 때, \(f(5)\)의 값은?`, ch:['−4','−3','−2','3','4'], a:0, hint:R`\(y=-x+k\).`,
      sol:R`<div class="step">\(-1=-2+k\) → \(k=1\), \(f(5)=-4\).</div>` } },

{ id:'1137', tag:'함수와 역함수의 교점', c:'c4', t:150, src:'유형 해결의 법칙 공통수학2 p.157, 1137번 (STEP 3 내신 마스터)',
  q:R`함수 \(f(x)=x^2-2x+k\ (x\ge1)\)의 그래프와 그 역함수 \(y=f^{-1}(x)\)의 그래프가 서로 다른 두 점에서 만나도록 하는 정수 \(k\)의 개수는?`,
  ch:['1','2','3','4','5'], a:0,

  sol:R`<div class="step">\(x\ge1\)에서 \(f\)는 증가하므로 교점은 \(f(x)=x\)의 해: \(x^2-3x+k=0\)이 \(x\ge1\)인 서로 다른 두 실근을 가져야 해요.</div>

concepts:[
{ id:'c1', title:'유리식 계산과 부분분수', body: R`
<p>유리식의 덧셈·뺄셈은 통분, 곱셈·나눗셈은 인수분해 후 약분.</p>
<div class="key"><b>부분분수</b>\[\frac{1}{AB}=\frac{1}{B-A}\left(\frac1A-\frac1B\right)\]단, \(A\ne B\)</div>
<p>예) \(\dfrac1{x(x+2)}=\dfrac12\left(\dfrac1x-\dfrac1{x+2}\right)\). 여러 개를 더하면 가운데가 다 지워지고 처음과 끝만 남아요(망원).</p>
<div class="tip"><b>항등식의 미정계수</b>\(\dfrac ax+\dfrac b{x-1}+\dfrac c{x-2}=\dfrac{4}{x(x-1)(x-2)}\) 꼴은 양변에 분모를 곱한 뒤 \(x=0,1,2\)를 대입하면 바로 나와요.</div>`},
{ id:'c2', title:'y = k/(x−p) + q 의 그래프', body: R`
${FIG.rational}
<ul><li>점근선: \(x=p\), \(y=q\)</li><li>정의역 \(\{x\mid x\ne p\}\), 치역 \(\{y\mid y\ne q\}\)</li><li>\(k>0\): 1, 3사분면 방향 / \(k<0\): 2, 4사분면 방향</li><li>\(|k|\)가 클수록 점근선 교점에서 멀어짐</li></ul>
<div class="key"><b>대칭</b>점 \((p,q)\)에 대해 점대칭. 직선 \(y=(x-p)+q\), \(y=-(x-p)+q\)에 대해 선대칭.</div>
<div class="tip"><b>대칭축 문제</b>‘직선 \(y=x-1\)에 대하여 대칭’ → 점근선의 교점 \((p,q)\)가 그 직선 위에 있다.</div>`},
{ id:'c3', title:'y = (ax+b)/(cx+d) 의 변형과 치역', body: R`
<p>분자를 분모로 나눠 \(y=\dfrac{k}{x-p}+q\) 꼴로 바꿔요.</p>
<p>예) \(\dfrac{5x-6}{x-2}=\dfrac{5(x-2)+4}{x-2}=5+\dfrac4{x-2}\).</p>
<div class="key"><b>바로 보기</b>점근선 \(x=-\dfrac dc\), \(y=\dfrac ac\).</div>
<p><b>정의역이 구간으로 제한</b>되면, 그 구간이 점근선 한쪽에 있을 때 그래프가 계속 증가하거나 감소해요. 그래서 양 끝값만 넣으면 치역이 나와요.</p>`},
{ id:'c4', title:'평행이동, 역함수', body: R`
<p>\(y=\dfrac kx\)를 \(x\)축 방향 \(p\), \(y\)축 방향 \(q\)만큼 평행이동 → \(y=\dfrac{k}{x-p}+q\). 점근선 교점이 \((0,0)\)에서 \((p,q)\)로 이동.</p>
<div class="key"><b>역함수 공식</b>\(y=\dfrac{ax+b}{cx+d}\) 의 역함수는 \(y=\dfrac{-dx+b}{cx-a}\) (\(a\)와 \(-d\) 자리 바꾸기)</div>
<div class="tip"><b>평행이동 연결 문제</b>원·점 등 다른 도형의 이동으로 평행이동 양을 정해 주는 문제가 많아요. 먼저 ‘얼마만큼 이동했는지’를 구하세요.</div>`},
],

problems:[
{ id:'1269', tag:'부분분수 (항등식)', c:'c1', t:120, src:'유형 해결의 법칙 공통수학2 p.176, 1269번 (STEP 3 내신 마스터)',

{ id:'1270', tag:'부분분수 (망원 합)', c:'c1', t:100, src:'유형 해결의 법칙 공통수학2 p.176, 1270번 (STEP 3 내신 마스터)',

{ id:'1272', tag:'유리함수의 평행이동', c:'c4', t:120, src:'유형 해결의 법칙 공통수학2 p.176, 1272번 (STEP 3 내신 마스터)',

id:'irr', name:'무리함수',
concepts:[
{ id:'c1', title:'무리식의 조건과 계산', body: R`
<div class="key"><b>값이 실수일 조건</b>근호 안 \(\ge0\), 분모 \(\ne0\).</div>
<p>분모의 유리화:</p>\[\frac{1}{\sqrt a+\sqrt b}=\frac{\sqrt a-\sqrt b}{a-b}\]
<div class="warn"><b>음수의 제곱근</b>\(\sqrt a\sqrt b=-\sqrt{ab}\) 이면 \(a<0,\ b<0\) (또는 둘 중 하나가 0).<br>\(\dfrac{\sqrt a}{\sqrt b}=-\sqrt{\dfrac ab}\) 이면 \(a>0,\ b<0\) (또는 \(a=0,\ b\ne0\)).</div>
<p>\(\sqrt{x^2}=|x|\). 절댓값은 범위를 알아야 풀 수 있어요.</p>
<div class="tip"><b>망원 합</b>\[\frac{1}{\sqrt{n+1}+\sqrt n}=\sqrt{n+1}-\sqrt n\]여러 개 더하면 처음과 끝만 남아요.</div>`},
{ id:'c2', title:'y = √(a(x−p)) + q 의 그래프', body: R`
${FIG.sqrt4}
<div class="key"><b>읽는 법</b>시작점 \((p,q)\). \(a>0\)이면 오른쪽으로, \(a<0\)이면 왼쪽으로. 근호 앞이 \(-\)면 아래로.</div>
<ul><li>\(y=\sqrt{a(x-p)}+q\ (a>0)\): 정의역 \(x\ge p\), 치역 \(y\ge q\)</li><li>\(y=\sqrt{a(x-p)}+q\ (a<0)\): 정의역 \(x\le p\), 치역 \(y\ge q\)</li></ul>
<div class="warn"><b>변형 먼저</b>\(\sqrt{2x+2}\)는 \(\sqrt{2(x+1)}\). 괄호로 묶어야 시작점 \(x=-1\)이 보여요.</div>`},
{ id:'c3', title:'평행이동과 대칭이동', body: R`
<ul><li>평행이동 \((m,n)\): \(x\to x-m\), \(y\to y-n\)</li><li>\(x\)축 대칭: \(y\to-y\) (근호 앞 부호가 바뀜)</li><li>\(y\)축 대칭: \(x\to-x\) (근호 안 부호가 바뀜)</li><li>원점 대칭: 둘 다</li></ul>
<div class="tip"><b>순서 주의</b>‘대칭이동 후 평행이동’과 ‘평행이동 후 대칭이동’은 결과가 달라요. 문제에 적힌 순서대로 식에 하나씩 적용하세요.</div>
<div class="tip"><b>넓이 문제</b>모양이 같은 무리함수 그래프 두 개 사이 넓이는, 잘라서 옮겨 붙이면 직사각형이 되는 경우가 많아요.</div>`},
{ id:'c4', title:'역함수와 교점', body: R`
<p>\(y=\sqrt{x-p}+q\)의 역함수: \(x-p=(y-q)^2\) → \(y=(x-q)^2+p\ (x\ge q)\). 이차함수의 일부가 돼요.</p>
<div class="key"><b>직선과 만나는 점의 개수</b>직선을 평행이동하며 ① 시작점을 지날 때 ② 접할 때(판별식 \(D=0\))가 경계.</div>
<p>사분면 문제: 시작점의 위치와 뻗는 방향만 보면 지나는 사분면이 정해져요.</p>`},
],
checks:[
{ c:'c2', q:R`함수 \(y=\sqrt{-2(x-1)}+3\)의 정의역과 치역은?`, ch:[R`\(x\ge1,\ y\ge3\)`, R`\(x\le1,\ y\ge3\)`, R`\(x\le1,\ y\le3\)`, R`\(x\ge-1,\ y\ge3\)`], a:1,
  deep:R`<p>근호 안 \(-2(x-1)\ge0\) → \(x\le1\). 근호 앞이 \(+\)라 \(y\ge3\). 시작점 \((1,3)\)에서 왼쪽 위로 뻗어요.</p><p>심화: 이 그래프가 지나는 사분면은 1, 2사분면. 시작점 \((1,3)\)이 1사분면이고 왼쪽 위로 가며 \(y\)축을 넘어 2사분면으로 들어가요.</p>`,
  review:R`<p>정의역은 근호 안이 0 이상인 범위. \(-2(x-1)\ge0\) 양변을 \(-2\)로 나누면 부등호 방향이 바뀌어 \(x-1\le0\).</p><p>치역은 \(\sqrt{\ }\ge0\) 이므로 \(+3\)을 해서 \(y\ge3\).</p>` },
{ c:'c1', q:R`\(\sqrt{-8}\times\sqrt{-2}\)의 값은?`, ch:['4','−4',R`\(4i\)`,'16'], a:1,
  deep:R`<p>\(\sqrt{-8}=2\sqrt2 i\), \(\sqrt{-2}=\sqrt2 i\). 곱은 \(4i^2=-4\).</p><p>심화: 그래서 ‘\(\sqrt a\sqrt b=-\sqrt{ab}\)를 만족’이라는 조건은 \(a<0,\ b<0\)을 뜻해요. 1405번처럼 이 조건에서 \(x\)의 범위를 구한 뒤 절댓값을 푸는 문제로 자주 나와요.</p>`,
  review:R`<p>음수끼리는 \(\sqrt a\sqrt b=\sqrt{ab}\)가 성립하지 않아요. \(i\)로 바꿔서 계산하세요: \(\sqrt{-8}\sqrt{-2}=(2\sqrt2i)(\sqrt2 i)=4i^2=-4\).</p>` },

problems:[
{ id:'1404', tag:'무리식이 실수일 조건', c:'c1', t:70, src:'유형 해결의 법칙 공통수학2 p.194, 1404번 (STEP 3 내신 마스터)',
  q:R`\(\sqrt{-2x^2+3x+5}\)의 값이 실수가 되도록 하는 모든 정수 \(x\)의 값의 합은?`,
  ch:['−3','0','2','3','6'], a:2,
  hint:R`근호 안 \(\ge0\).`,
  sol:R`<div class="step">\(-2x^2+3x+5\ge0\) → \(2x^2-3x-5\le0\) → \((2x-5)(x+1)\le0\).</div>
<div class="step">\(-1\le x\le\dfrac52\). 정수 \(-1,0,1,2\), 합 2.</div>`,
  v:{ q:R`\(\sqrt{-x^2+2x+8}\)의 값이 실수가 되도록 하는 모든 정수 \(x\)의 값의 합은?`, ch:['3','5','7','9','10'], a:2, hint:R`\((x-4)(x+2)\le0\).`,
      sol:R`<div class="step">\(-2\le x\le4\), 정수 합 \(-2-1+0+1+2+3+4=7\).</div>` } },

{ id:'1405', tag:'음수의 제곱근 성질', c:'c1', t:100, src:'유형 해결의 법칙 공통수학2 p.194, 1405번 (STEP 3 내신 마스터)',
  q:R`\(\dfrac{\sqrt{x+2}}{\sqrt{x^2-9}}=-\sqrt{\dfrac{x+2}{x^2-9}}\)를 만족시키는 실수 \(x\)에 대하여 \(\sqrt{(x+4)^2}+\sqrt{(x-5)^2}\)을 간단히 하면?`,
  ch:['−9','−1','9',R`\(-2x+1\)`,R`\(2x-1\)`], a:2,
  hint:R`\(\dfrac{\sqrt a}{\sqrt b}=-\sqrt{\dfrac ab}\) 이면 \(a\ge0,\ b<0\).`,
  sol:R`<div class="step">조건에서 \(x+2\ge0\), \(x^2-9<0\) → \(-2\le x<3\).</div>
<div class="step">이 범위에서 \(x+4>0\), \(x-5<0\).</div>
<div class="step">\(|x+4|+|x-5|=(x+4)+(5-x)=9\).</div>`,
  v:{ q:R`\(\dfrac{\sqrt{x-1}}{\sqrt{x-4}}=-\sqrt{\dfrac{x-1}{x-4}}\)를 만족시키는 실수 \(x\)에 대하여 \(\sqrt{(x+1)^2}+\sqrt{(x-5)^2}\)을 간단히 하면?`, ch:['−6',R`\(2x-4\)`,'4','6',R`\(2x+6\)`], a:3, hint:R`\(x-1\ge0,\ x-4<0\).`,
      sol:R`<div class="step">\(1\le x<4\). \((x+1)+(5-x)=6\).</div>` } },

{ id:'1406', tag:'분모의 유리화 (망원 합)', c:'c1', t:90, src:'유형 해결의 법칙 공통수학2 p.194, 1406번 (STEP 3 내신 마스터)',
  q:R`자연수 \(n\)에 대하여 \(f(n)=\sqrt{2n+1}+\sqrt{2n-1}\)일 때, \(\dfrac1{f(1)}+\dfrac1{f(2)}+\dfrac1{f(3)}+\cdots+\dfrac1{f(24)}\)의 값은?`,
  ch:['1','2','3','4','5'], a:2,
  hint:R`\(\dfrac{1}{f(n)}\)을 유리화하면 \(\dfrac{\sqrt{2n+1}-\sqrt{2n-1}}{2}\).`,
  sol:R`<div class="step">\(\dfrac{1}{\sqrt{2n+1}+\sqrt{2n-1}}=\dfrac{\sqrt{2n+1}-\sqrt{2n-1}}{(2n+1)-(2n-1)}=\dfrac{\sqrt{2n+1}-\sqrt{2n-1}}{2}\)</div>
<div class="step">합: \(\dfrac12\left\{(\sqrt3-1)+(\sqrt5-\sqrt3)+\cdots+(\sqrt{49}-\sqrt{47})\right\}=\dfrac12(7-1)=3\).</div>`,
  v:{ q:R`\(f(n)=\sqrt{n+1}+\sqrt n\)일 때, \(\dfrac1{f(1)}+\dfrac1{f(2)}+\cdots+\dfrac1{f(99)}\)의 값은?`, ch:['8','9','10','11','99'], a:1, hint:R`분모 차가 1.`,
      sol:R`<div class="step">\(\sqrt{100}-\sqrt1=9\).</div>` } },

{ id:'1409', tag:'대칭이동 + 평행이동', c:'c3', t:100, src:'유형 해결의 법칙 공통수학2 p.194, 1409번 (STEP 3 내신 마스터)',
  q:R`함수 \(y=\sqrt{a(x-1)}+1\)의 그래프를 \(x\)축에 대하여 대칭이동한 후 \(x\)축의 방향으로 \(b\)만큼, \(y\)축의 방향으로 \(c\)만큼 평행이동한 그래프가 함수 \(y=-\sqrt{2x+2}+5\)의 그래프와 일치할 때, \(a-b+c\)의 값은? (단, \(a\)는 상수)`,
  ch:['2','4','6','8','10'], a:4,
  hint:R`목표 식을 \(-\sqrt{2(x+1)}+5\)로 바꿔 두세요.`,
  sol:R`<div class="step">\(x\)축 대칭: \(y=-\sqrt{a(x-1)}-1\).</div>
<div class="step">평행이동: \(y=-\sqrt{a(x-b-1)}-1+c\).</div>
<div class="step">\(-\sqrt{2(x+1)}+5\)와 비교: \(a=2\), \(-b-1=1\) → \(b=-2\), \(c-1=5\) → \(c=6\).</div>
<div class="step">\(a-b+c=2+2+6=10\).</div>`,
  v:{ q:R`\(y=\sqrt{a(x+1)}-2\)의 그래프를 \(y\)축에 대하여 대칭이동한 후 \(x\)축 방향으로 \(b\)만큼, \(y\)축 방향으로 \(c\)만큼 평행이동한 그래프가 \(y=\sqrt{-3x+6}+1\)과 일치할 때, \(a+b+c\)의 값은?`, ch:['3','5','7','9','11'], a:2, hint:R`\(y\)축 대칭은 \(x\to-x\).`,
      sol:R`<div class="step">\(y\)축 대칭: \(\sqrt{a(-x+1)}-2=\sqrt{-a(x-1)}-2\).</div><div class="step">이동: \(\sqrt{-a(x-b-1)}-2+c\). 목표 \(\sqrt{-3(x-2)}+1\): \(a=3\), \(b=1\), \(c=3\). 합 7.</div>` } },

{ id:'1410', tag:'무리함수 그래프와 넓이', c:'c3', t:150, src:'유형 해결의 법칙 공통수학2 p.194, 1410번 (STEP 3 내신 마스터)',
  q:R`두 함수 \(f(x)=-\sqrt{x+4}-3\), \(g(x)=-\sqrt{-x+4}+3\)의 그래프와 두 직선 \(x=-4,\ x=4\)로 둘러싸인 도형의 넓이는?`,

  hint:R`직선 \(y=3\), \(y=-3\)을 그어 보세요. 잘린 두 조각의 모양이 같아요.`,
  sol:R`<div class="step">\(f\)의 시작점 \((-4,-3)\), \(g\)의 시작점 \((4,3)\).</div>
<figure><svg class="fig" viewBox="0 0 300 215" width="300">

<text x="214" y="70">y=3</text><text x="44" y="159">y=−3</text><text x="216" y="200" class="tb">f</text><text x="216" y="56" class="tb">g</text>
<text x="90" y="125" text-anchor="middle">−4</text><text x="210" y="125" text-anchor="middle">4</text></svg>
<figcaption>점선 직사각형: 가로 8, 세로 6</figcaption></figure>
<div class="step">\(y=-3\)과 \(f\) 사이 조각 A는 \(y=\sqrt{x+4}\) 아래 넓이와 같고, \(y=3\)과 \(g\) 사이 조각 B는 \(y=\sqrt{4-x}\) 아래 넓이와 같아요. 이 둘은 \(y\)축 대칭이라 넓이가 같아요.</div>
<div class="step">구하는 넓이 = 직사각형 − B + A = 직사각형 = \(8\times6=48\).</div>`,
  v:{ q:R`두 함수 \(f(x)=\sqrt{x+2}+1\), \(g(x)=\sqrt{2-x}-3\)의 그래프와 두 직선 \(x=-2,\ x=2\)로 둘러싸인 도형의 넓이는?`, ch:['8','12','16','20','24'], a:2, hint:R`\(y=1\)과 \(y=-3\) 사이 직사각형.`,
      sol:R`<div class="step">\(f\)는 \(y=1\) 위로 \(\sqrt{x+2}\)만큼, \(g\)는 \(y=-3\) 위로 \(\sqrt{2-x}\)만큼. 두 조각의 넓이가 같아 서로 상쇄돼요.</div><div class="step">넓이 = 가로 4 × 세로 4 = 16.</div>` } },

{ id:'1411', tag:'그래프가 지나는 사분면', c:'c4', t:100, src:'유형 해결의 법칙 공통수학2 p.194, 1411번 (STEP 3 내신 마스터)',
  q:R`정의역이 \(\{x\mid x>a\}\)인 함수 \(y=\sqrt{2x-2a}-a^2+1\)의 그래프가 오직 하나의 사분면을 지나도록 하는 실수 \(a\)의 최댓값은?`,
  ch:['−2','−1','0','1','2'], a:3,
  hint:R`시작점 \((a,\ 1-a^2)\)이 어디 있어야 1사분면만 지날까요?`,
  sol:R`<div class="step">\(y=\sqrt{2(x-a)}+(1-a^2)\): 시작점 \((a,\ 1-a^2)\)에서 오른쪽 위로 뻗어요 (시작점 자체는 정의역에서 빠짐).</div>
<div class="step">오른쪽 위로 끝없이 가니 결국 1사분면에 들어가요. 그래서 1사분면만 지나야 해요.</div>
<div class="step">시작점이 \(x\ge0\), \(y\ge0\)에 있어야 함: \(a\ge0\), \(1-a^2\ge0\) → \(0\le a\le1\).</div>
<div class="step">최댓값 1.</div>
<div class="warn"><b>경계</b>\(a=1\)이면 시작점 \((1,0)\)이 \(x\)축 위지만 정의역이 \(x>1\)이라 그래프는 1사분면 안에만 있어요.</div>`,
  v:{ q:R`정의역이 \(\{x\mid x>a\}\)인 함수 \(y=\sqrt{3x-3a}-a+2\)의 그래프가 오직 하나의 사분면을 지나도록 하는 실수 \(a\)의 최댓값은?`, ch:['−2','0','1','2','3'], a:3, hint:R`시작점 \((a,\ 2-a)\).`,
      sol:R`<div class="step">\(a\ge0\), \(2-a\ge0\) → \(0\le a\le2\). 최댓값 2.</div>` } },
],
