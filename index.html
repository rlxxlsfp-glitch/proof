{ u:'prop', id:'P2-01', tag:'명제의 뜻', c:'c1', t:30, src:PS('2. 명제','01',113), q:R`다음 중 명제가 아닌 것은?`, ch:[R`\(3>0\)`,R`\(x<3\)`,R`5는 8의 약수이다.`,R`울릉도는 대한민국의 섬이다.`,R`대한민국의 수도는 서울이다.`], a:1, hint:R`\(x\) 값에 따라 참·거짓이 바뀌면 명제가 아니라 조건이에요.`,
  sol:R`<div class="step">③은 거짓이지만 거짓이라고 딱 말할 수 있으니 명제예요.</div><div class="step">②는 \(x=1\)이면 참, \(x=5\)면 거짓. 정해지지 않으니 조건이에요.</div>`,
  v:{ q:R`다음 중 명제가 아닌 것은?`, ch:[R`\(2+3=6\)`,R`\(x+1>2\)`,R`모든 정사각형은 직사각형이다.`,R`7은 소수이다.`,R`\(\sqrt4=2\)`], a:1, hint:R`문자가 들어 있는 것.`, sol:R`<div class="step">②는 \(x\)에 따라 달라지는 조건.</div>` } },
{ u:'prop', id:'P2-02', tag:'반례 찾기', c:'c2', t:50, src:PS('2. 명제','02',113), q:R`다음 명제 중 거짓인 것은?`, ch:[R`\(x<1\)이면 \(x^2<1\)이다.`,R`\(|x|=2\)이면 \(x^2=4\)이다.`,R`\(xy=0\)이면 \(x=0\) 또는 \(y=0\)이다.`,R`\(x, y\)가 유리수이면 \(xy\)도 유리수이다.`,R`\(x\)가 4의 약수이면 \(x\)는 8의 약수이다.`], a:0, hint:R`음수를 넣어 보세요.`,
  sol:R`<div class="step">① \(x=-2\)는 \(x<1\)인데 \(x^2=4\). 반례가 있으니 거짓.</div><div class="step">⑤ 4의 약수 \(\{1,2,4\}\)는 8의 약수 \(\{1,2,4,8\}\) 안에 쏙. 참.</div>`,
  v:{ q:R`다음 중 거짓인 명제는?`, ch:[R`\(x=2\)이면 \(x^2=4\)`,R`\(x>2\)이면 \(x^2>4\)`,R`\(x^2>4\)이면 \(x>2\)`,R`\(x\)가 6의 약수이면 12의 약수`,R`\(x\)가 짝수이면 \(x^2\)도 짝수`], a:2, hint:R`음수.`, sol:R`<div class="step">③ \(x=-3\).</div>` } },
{ u:'prop', id:'P2-03', tag:'조건의 부정', c:'c1', t:40, src:PS('2. 명제','03',113), q:R`조건 ‘\(a^2+b^2=0\)’의 부정과 서로 같은 것은? (단, \(a, b\)는 실수이다.)`, ch:[R`\(a=b=0\)`,R`\(ab>0\)`,R`\(ab<0\)`,R`\(a\ne0\) 또는 \(b\ne0\)`,R`\(a\ne0\)이고 \(b\ne0\)`], a:3, hint:R`\(a^2+b^2=0\)은 ‘\(a=0\) 그리고 \(b=0\)’.`,
  sol:R`<div class="step">제곱의 합이 0이려면 둘 다 0: ‘\(a=0\) 그리고 \(b=0\)’.</div><div class="step">‘그리고’의 부정은 ‘또는’: ‘\(a\ne0\) 또는 \(b\ne0\)’. 둘 중 하나만 0이 아니어도 되니까요.</div>`,
  v:{ q:R`조건 ‘\(ab=0\)’의 부정은?`, ch:[R`\(a=0\) 또는 \(b=0\)`,R`\(a\ne0\) 또는 \(b\ne0\)`,R`\(a\ne0\)이고 \(b\ne0\)`,R`\(a=b=0\)`,R`\(ab>0\)`], a:2, hint:R`\(ab=0\)은 ‘또는’.`, sol:R`<div class="step">‘또는’의 부정은 ‘그리고’.</div>` } },
{ u:'prop', id:'P2-04', tag:'부정의 진리집합', c:'c1', t:50, input:'12', src:PS('2. 명제','04',113), q:R`전체집합 \(U=\{1,2,3,4,5,6,7,8\}\)에 대하여 조건 \(p\)가 ‘\(p\): \(x\)는 짝수 또는 6의 약수이다.’일 때, 조건 \(\sim p\)의 진리집합의 모든 원소의 합을 구하시오.`, hint:R`\(P\)를 먼저 구하고 나머지를 더해요.`,
  sol:R`<div class="step">짝수 \(\{2,4,6,8\}\) 또는 6의 약수 \(\{1,2,3,6\}\) → \(P=\{1,2,3,4,6,8\}\).</div><div class="step">\(P^C=\{5,7\}\), 합 12.</div>`,
  v:{ q:R`\(U=\{1,2,\dots,10\}\)에서 \(p\): \(x\)는 홀수 또는 4의 배수일 때, \(\sim p\)의 진리집합의 원소의 합을 구하시오.`, input:'18', hint:R`남는 건 4의 배수가 아닌 짝수.`, sol:R`<div class="step">\(P^C=\{2,6,10\}\), 합 18.</div>` } },
{ u:'prop', id:'P2-05', tag:'벤 다이어그램과 명제', c:'c2', t:60, src:PS('2. 명제','05',113), q:R`세 조건 \(p, q, r\)의 진리집합을 각각 \(P, Q, R\)라 할 때, 벤 다이어그램으로 나타내면 아래 그림과 같다. 다음 명제 중 거짓인 것은? (단, \(U\)는 전체집합이다.)`+VENN05, ch:[R`\(p\to\sim q\)`,R`\(p\to\sim r\)`,R`\(\sim q\to\sim p\)`,R`\(r\to\sim p\)`,R`\(r\to\sim q\)`], a:0, hint:R`그림: \(P\subset Q\), \(R\)은 \(Q\)와 떨어져 있어요.`,
  sol:R`<div class="step">① \(P\subset Q^C\)? \(P\)는 \(Q\) 안에 있으니 거짓.</div><div class="step">②④⑤: \(R\)은 \(P, Q\)와 안 겹치니 참. ③은 \(p\to q\)의 대우라 참.</div>`,
  v:{ q:R`그림(위와 같은 배치)에서 참인 명제는?`+VENN05, ch:[R`\(q\to p\)`,R`\(p\to r\)`,R`\(\sim p\to\sim q\)`,R`\(q\to\sim r\)`,R`\(r\to q\)`], a:3, hint:R`\(Q\)와 \(R\)은 안 겹쳐요.`, sol:R`<div class="step">\(Q\subset R^C\) → ④.</div>` } },
{ u:'prop', id:'P2-06', tag:'대우 만들기', c:'c4', t:40, src:PS('2. 명제','06',113), q:R`실수 \(a\)에 대하여 명제 ‘\(a\ge\sqrt3\)이면 \(a^2\ge3\)이다.’의 대우는?`, ch:[R`\(a^2<3\)이면 \(a>\sqrt3\)이다.`,R`\(a^2<3\)이면 \(a<\sqrt3\)이다.`,R`\(a^2\le3\)이면 \(a\le\sqrt3\)이다.`,R`\(a>\sqrt3\)이면 \(a^2\le3\)이다.`,R`\(a\ge\sqrt3\)이면 \(a^2<3\)이다.`], a:1, hint:R`앞뒤 바꾸고, 둘 다 부정. \(\ge\)의 부정은 \(<\).`,
  sol:R`<div class="step">결론의 부정 \(a^2<3\)을 앞에, 가정의 부정 \(a<\sqrt3\)을 뒤에.</div>`,
  v:{ q:R`‘\(x>2\)이면 \(x^2>4\)’의 대우는?`, ch:[R`\(x^2>4\)이면 \(x>2\)`,R`\(x^2\le4\)이면 \(x\le2\)`,R`\(x^2<4\)이면 \(x<2\)`,R`\(x\le2\)이면 \(x^2\le4\)`,R`\(x^2\ge4\)이면 \(x\ge2\)`], a:1, hint:R`\(>\)의 부정은 \(\le\).`, sol:R`<div class="step">②.</div>` } },
{ u:'prop', id:'P2-07', tag:'역이 참인 명제', c:'c4', t:70, src:PS('2. 명제','07',113), q:R`다음 명제의 역이 참인 것은? (단, \(x, y, a, b\)는 실수이다.)`, ch:[R`\(x>y\)이면 \(x^2>y^2\)이다.`,R`\(x=-3\)이면 \(2x^2-18=0\)이다.`,R`\(a=0\)이고 \(b=0\)이면 \(ab=0\)이다.`,R`\(a>0\)이고 \(b>0\)이면 \(a+b>0\)이고 \(ab>0\)이다.`,R`세 집합 \(A, B, C\)에 대하여 \(A\subset B\)이면 \((A\cap C)\subset(B\cap C)\)이다.`], a:3, hint:R`역은 앞뒤만 바꾼 거예요. 하나씩 바꿔서 반례를 찾아요.`,
  sol:R`<div class="step">④의 역: ‘\(a+b>0\)이고 \(ab>0\)이면 \(a>0, b>0\)’. \(ab>0\)이면 부호가 같고, 합이 양수면 둘 다 양수. 참!</div><div class="step">① 역 반례 \(x=-3, y=1\). ② 역 반례 \(x=3\). ③ 역 반례 \(a=0, b=1\). ⑤ 역 반례 \(C=\varnothing\).</div>`,
  v:{ q:R`역이 참인 명제는?`, ch:[R`\(x=1\)이면 \(x^2=1\)`,R`\(x>0\)이면 \(x^3>0\)`,R`\(a>0, b>0\)이면 \(ab>0\)`,R`\(x=2\)이면 \(x^2=2x\)`,R`정사각형이면 마름모`], a:1, hint:R`세제곱은 부호 유지.`, sol:R`<div class="step">\(x^3>0\)이면 \(x>0\). ②.</div>` } },
{ u:'prop', id:'P2-08', tag:'‘어떤’ 명제의 부정', c:'c3', t:60, input:'81', src:PS('2. 명제','08',113), q:R`실수 전체의 집합에 대하여 명제 ‘어떤 실수 \(x\)에 대하여 \(x^2-18x+k<0\)이다.’의 부정이 참이 되도록 하는 상수 \(k\)의 최솟값을 구하시오.`, hint:R`부정: ‘모든 \(x\)에 대하여 \(x^2-18x+k\ge0\)’.`,
  sol:R`<div class="step">부정은 ‘모든 실수 \(x\)에 대하여 \(x^2-18x+k\ge0\)’.</div><div class="step">포물선이 \(x\)축 아래로 안 내려가야 하니 \(\dfrac D4=81-k\le0\) → \(k\ge81\).</div>`,
  v:{ q:R`‘어떤 실수 \(x\)에 대하여 \(x^2-8x+k<0\)’의 부정이 참이 되는 \(k\)의 최솟값을 구하시오.`, input:'16', hint:R`\(16-k\le0\).`, sol:R`<div class="step">16.</div>` } },
{ u:'prop', id:'P2-09', tag:'귀류법 빈칸', c:'c6', t:90, src:PS('2. 명제','09',114), q:R`명제 ‘\(n\ge2\)인 자연수 \(n\)에 대하여 \(\sqrt{n^2-1}\)이 무리수이다.’를 귀류법으로 증명할 때, \(\sqrt{n^2-1}=\dfrac qp\) (서로소)로 두면 \(p=1\)이 되어 \(n^2=\)(가)이다. 이때 \(q=2k\)이면 \((2k)^2<n^2<\)(나)이고, \(q=2k+1\)이면 (나)\(<n^2<(2k+2)^2\)이라 만족하는 \(n\)이 없다. (가), (나)에 알맞은 것은?`, ch:[R`\(q^2-1,\ 2k^2+1\)`,R`\(q^2,\ 2k^2+1\)`,R`\(q^2,\ (2k+1)^2\)`,R`\(q^2+1,\ 2k^2+1\)`,R`\(q^2+1,\ (2k+1)^2\)`], a:4, hint:R`\(\sqrt{n^2-1}=q\)이면 \(n^2=q^2+1\).`,
  sol:R`<div class="step">\(p=1\)이면 \(\sqrt{n^2-1}=q\), 제곱하면 \(n^2=q^2+1\) → (가).</div><div class="step">\(q=2k\)이면 \(n^2=4k^2+1\)이라 \((2k)^2\)과 \((2k+1)^2\) 사이에 끼어요. 제곱수 사이엔 제곱수가 없으니 모순 → (나) \((2k+1)^2\).</div>`,
  v:{ q:R`귀류법의 첫 단계로 옳은 것은? (명제: \(\sqrt3\)은 무리수)`, ch:[R`\(\sqrt3\)이 무리수라고 가정`,R`\(\sqrt3\)이 유리수라고 가정`,R`\(\sqrt3=3\)이라 가정`,R`대우를 쓴다`,R`\(\sqrt3>1\)을 보인다`], a:1, hint:R`결론을 부정.`, sol:R`<div class="step">②.</div>` } },
{ u:'prop', id:'P2-10', tag:'충분·필요조건 연결', c:'c5', t:70, input:'2', src:PS('2. 명제','10',114), q:R`세 조건 \(p, q, r\)에 대하여 \(p\)는 \(q\)이기 위한 충분조건이고, \(p\)는 \(\sim r\)이기 위한 필요조건일 때, 다음 중 옳은 것의 개수를 구하시오.<div class="key">ㄱ. \(p\Rightarrow q\) &nbsp; ㄴ. \(q\Rightarrow p\) &nbsp; ㄷ. \(r\Rightarrow\sim p\) &nbsp; ㄹ. \(\sim q\Rightarrow r\)</div>`, hint:R`\(p\Rightarrow q\), \(\sim r\Rightarrow p\).`,
  sol:R`<div class="step">조건: \(p\Rightarrow q\), \(\sim r\Rightarrow p\) (대우 \(\sim p\Rightarrow r\)).</div><div class="step">ㄱ ✔. ㄴ 모름. ㄷ: 우리가 아는 건 \(\sim p\Rightarrow r\)이지 \(r\Rightarrow\sim p\)가 아님.</div><div class="step">ㄹ: \(\sim q\Rightarrow\sim p\) (ㄱ의 대우) \(\Rightarrow r\) ✔. 2개.</div>`,
  v:{ q:R`\(q\)는 \(p\)이기 위한 필요조건, \(r\)은 \(q\)이기 위한 충분조건일 때 항상 옳은 것의 개수를 구하시오.<div class="key">ㄱ. \(p\Rightarrow q\) ㄴ. \(r\Rightarrow p\) ㄷ. \(\sim q\Rightarrow\sim r\) ㄹ. \(\sim q\Rightarrow\sim p\)</div>`, input:'3', hint:R`\(p\Rightarrow q\), \(r\Rightarrow q\).`, sol:R`<div class="step">ㄱ, ㄷ, ㄹ ✔. ㄴ 모름. 3개.</div>` } },
{ u:'prop', id:'P2-11', tag:'충분조건과 대우', c:'c4', t:50, input:'2', src:PS('2. 명제','11',114), q:R`\(x^2-2ax+3\ne0\)은 \(x-3\ne0\)이기 위한 충분조건일 때, 상수 \(a\)의 값을 구하시오.`, hint:R`충분조건 = 화살표. ‘\(\ne\)’가 있으니 대우.`,
  sol:R`<div class="step">‘\(x^2-2ax+3\ne0\Rightarrow x-3\ne0\)’의 대우: ‘\(x=3\Rightarrow x^2-2ax+3=0\)’.</div><div class="step">\(9-6a+3=0\) → \(a=2\).</div>`,
  v:{ q:R`\(x^2+ax-8\ne0\)이 \(x-2\ne0\)이기 위한 충분조건일 때 \(a\)를 구하시오.`, input:'2', hint:R`\(x=2\) 대입.`, sol:R`<div class="step">\(4+2a-8=0\) → \(a=2\).</div>` } },
{ u:'prop', id:'P2-12', tag:'명제가 참이 될 범위', c:'c2', t:60, input:'3', src:PS('2. 명제','12',114), q:R`두 조건 \(p: -3<x<6\), \(q: -7+a<x<7+a\)에 대하여 명제 \(p\to q\)가 참이 되도록 하는 상수 \(a\)의 최솟값을 \(m\), 최댓값을 \(M\)이라고 할 때, \(m+M\)의 값을 구하시오.`, hint:R`양 끝 비교, 둘 다 열린 끝이라 등호 OK.`,
  sol:R`<div class="step">\(-7+a\le-3\) → \(a\le4\). \(7+a\ge6\) → \(a\ge-1\).</div><div class="step">\(m=-1,\ M=4\) → 3.</div>`,
  v:{ q:R`\(p: -2<x<4\), \(q: a-5<x<a+5\)에서 \(p\to q\)가 참일 때 \(a\)의 최솟값과 최댓값의 합을 구하시오.`, input:'2', hint:R`\(a\le3\), \(a\ge-1\).`, sol:R`<div class="step">\(-1+3=2\).</div>` } },
{ u:'ineq', id:'P2-13', tag:'곱을 전개해서 산술·기하', c:'c3', t:60, input:'18', src:PS('2. 명제','13',114), q:R`\(a>0,\ b>0\)일 때, \(\left(a+\dfrac8b\right)\left(b+\dfrac2a\right)\)의 최솟값을 구하시오.`, hint:R`일단 전개. 그러면 \(ab\)와 \(\dfrac{16}{ab}\)이 나와요.`,
  sol:R`<div class="step">전개: \(ab+2+8+\dfrac{16}{ab}=ab+\dfrac{16}{ab}+10\).</div><div class="step">\(ab+\dfrac{16}{ab}\ge2\sqrt{16}=8\) → 최솟값 18 (\(ab=4\)).</div><div class="warn"><b>자주 틀림</b>괄호마다 따로 산술·기하를 쓰면 등호 조건이 안 맞아서 틀린 값(16)이 나와요. 꼭 먼저 전개!</div>`,
  v:{ q:R`\(a, b>0\)일 때 \(\left(a+\dfrac1b\right)\left(4b+\dfrac1a\right)\)의 최솟값을 구하시오.`, input:'9', hint:R`\(4ab+\dfrac1{ab}+5\).`, sol:R`<div class="step">\(4+5=9\).</div>` } },
{ u:'ineq', id:'P2-14', tag:'코시-슈바르츠 최대·최소', c:'c4', t:60, input:'-13', src:PS('2. 명제','14',114), q:R`두 실수 \(x, y\)에 대하여 \(x^2+y^2=1\)일 때, \(2x+3y\)의 최댓값과 최솟값의 곱을 구하시오.`, hint:R`\((2^2+3^2)(x^2+y^2)\ge(2x+3y)^2\).`,
  sol:R`<div class="step">\(13\times1\ge(2x+3y)^2\) → \(-\sqrt{13}\le2x+3y\le\sqrt{13}\).</div><div class="step">곱 \(-13\).</div>`,
  v:{ q:R`\(x^2+y^2=4\)일 때 \(3x+4y\)의 최댓값과 최솟값의 곱을 구하시오.`, input:'-100', hint:R`\(25\times4\).`, sol:R`<div class="step">\(\pm10\), 곱 \(-100\).</div>` } },
/* 함수 */
{ u:'func', id:'P31-01', tag:'함수가 아닌 대응', c:'c1', t:40, src:PS('1. 함수','01',140), q:R`두 집합 \(X=\{1,2,3\},\ Y=\{-1,0,1,2,3\}\)에 대하여 다음 대응 중 \(X\)에서 \(Y\)로의 함수가 아닌 것은?`, ch:[R`\(x\to|x|\)`,R`\(x\to-x+2\)`,R`\(x\to2x-3\)`,R`\(x\to x-1\)`,R`\(x\to x^2-x-1\)`], a:4, hint:R`1, 2, 3을 넣고 결과가 \(Y\)에 있는지.`,
  sol:R`<div class="step">⑤ \(x=3\): \(9-3-1=5\notin Y\). 버튼을 눌렀는데 진열장에 없는 음료가 나온 셈이라 함수 X.</div>`,
  v:{ q:R`\(X=\{0,1,2\}\), \(Y=\{0,1,2,3,4\}\)에서 함수가 아닌 것은?`, ch:[R`\(x\to x+2\)`,R`\(x\to x^2\)`,R`\(x\to 2x\)`,R`\(x\to 3x-1\)`,R`\(x\to 4-x\)`], a:3, hint:R`\(x=0\).`, sol:R`<div class="step">④ \(-1\notin Y\).</div>` } },
{ u:'func', id:'P31-02', tag:'구간별 함숫값', c:'c1', t:30, input:'1', src:PS('1. 함수','02',140), q:R`함수 \(f(x)=\begin{cases}x+2&(x>0)\\-x^2+1&(x\le0)\end{cases}\)에 대하여 \(f(-2)+f(2)\)의 값을 구하시오.`, hint:R`\(-2\)는 아래 식, 2는 위 식.`,
  sol:R`<div class="step">\(f(-2)=-4+1=-3\), \(f(2)=4\). 합 1.</div>`,
  v:{ q:R`\(f(x)=\begin{cases}2x-1&(x\ge1)\\x^2&(x<1)\end{cases}\)일 때 \(f(-3)+f(3)\)을 구하시오.`, input:'14', hint:R`\(9+5\).`, sol:R`<div class="step">14.</div>` } },
{ u:'func', id:'P31-03', tag:'치역 구하기 (규칙)', c:'c1', t:50, input:'20', src:PS('1. 함수','03',140), q:R`자연수 전체의 집합 \(N\)에서 \(N\)으로의 함수 \(f\)를 \(f(n)=(3^n\)의 일의 자리의 숫자)로 정의할 때, 함수 \(f\)의 치역의 모든 원소의 합을 구하시오.`, hint:R`\(3, 9, 27, 81, 243, \dots\) 일의 자리만.`,
  sol:R`<div class="step">일의 자리: 3, 9, 7, 1, 3, 9, … 반복.</div><div class="step">치역 \(\{1,3,7,9\}\), 합 20.</div>`,
  v:{ q:R`\(f(n)=(2^n\)의 일의 자리 숫자)일 때 치역의 원소의 합을 구하시오.`, input:'20', hint:R`2, 4, 8, 6.`, sol:R`<div class="step">20.</div>` } },
{ u:'func', id:'P31-06', tag:'일대일대응·상수함수 개수', c:'c4', t:40, input:'28', src:PS('1. 함수','06',140), q:R`집합 \(X=\{1,2,3,4\}\)에 대하여 \(X\)에서 \(X\)로의 함수 중 일대일대응의 개수를 \(a\), 상수함수의 개수를 \(b\)라고 할 때, \(a+b\)의 값을 구하시오.`, hint:R`일대일대응 \(4!\), 상수함수는 값 하나 고르기.`,
  sol:R`<div class="step">\(a=4!=24\), \(b=4\) (모두 1, 모두 2, …). 합 28.</div>`,
  v:{ q:R`\(X=\{1,2,3\}\)에서 \(X\)로의 일대일대응 개수 \(a\), 함수 개수 \(b\)일 때 \(a+b\)를 구하시오.`, input:'33', hint:R`\(3!+3^3\).`, sol:R`<div class="step">\(6+27=33\).</div>` } },
{ u:'inv', id:'P31-07', tag:'합성함수의 값', c:'c1', t:40, input:'1', src:PS('1. 함수','07',140), q:R`두 함수 \(f(x)=x-a,\ g(x)=x^2+1\)에 대하여 \((f\circ g)(1)=a\)일 때, 상수 \(a\)의 값을 구하시오.`, hint:R`\(g(1)\)부터.`,
  sol:R`<div class="step">\(g(1)=2\), \(f(2)=2-a=a\) → \(a=1\).</div>`,
  v:{ q:R`\(f(x)=2x+a\), \(g(x)=x^2-1\)에 대하여 \((g\circ f)(0)=8\)일 때 양수 \(a\)를 구하시오.`, input:'3', hint:R`\(f(0)=a\).`, sol:R`<div class="step">\(g(a)=a^2-1=8\) → \(a=3\).</div>` } },
{ u:'func', id:'P31-08', tag:'치환으로 함숫값', c:'c1', t:40, input:'3', src:PS('1. 함수','08',141), q:R`함수 \(f\)에 대하여 \(f\left(\dfrac{3x+1}{2}\right)=x^2-6\)일 때, \(f(5)\)의 값을 구하시오.`, hint:R`\(\dfrac{3x+1}2=5\)가 되는 \(x\)를 찾아요.`,
  sol:R`<div class="step">\(\dfrac{3x+1}{2}=5\) → \(x=3\). \(f(5)=9-6=3\).</div>`,
  v:{ q:R`\(f(2x-1)=x^2+x\)일 때 \(f(5)\)를 구하시오.`, input:'12', hint:R`\(x=3\).`, sol:R`<div class="step">\(9+3=12\).</div>` } },
{ u:'inv', id:'P31-09', tag:'f∘g = g∘f', c:'c1', t:60, input:'2', src:PS('1. 함수','09',141), q:R`두 함수 \(f(x)=ax+3,\ g(x)=-x+4\)에 대하여 \(f\circ g=g\circ f\)가 성립할 때, \(f(2)\)의 값을 구하시오. (단, \(a\)는 상수이다.)`, hint:R`두 합성함수를 각각 전개해서 상수항 비교.`,
  sol:R`<div class="step">\(f(g(x))=a(-x+4)+3=-ax+4a+3\). \(g(f(x))=-(ax+3)+4=-ax+1\).</div><div class="step">\(4a+3=1\) → \(a=-\dfrac12\). \(f(2)=-1+3=2\).</div>`,
  v:{ q:R`\(f(x)=ax+3\), \(g(x)=x+3\)에 대하여 \(f\circ g=g\circ f\)일 때 \(f(2)\)를 구하시오.`, input:'5', hint:R`상수항 비교.`, sol:R`<div class="step">\(a(x+3)+3=ax+6\) → \(3a+3=6\) → \(a=1\). \(f(2)=5\).</div>` } },
{ u:'inv', id:'P31-10', tag:'합성의 반복 규칙', c:'c1', t:80, input:'2', src:PS('1. 함수','10',141), q:R`함수 \(f(x)=\dfrac{1}{1-x}\)에 대하여 \(f^1(x)=f(x),\ f^{n+1}(x)=(f\circ f^n)(x)\)로 정의할 때, \(f^{200}(-1)\)의 값을 구하시오.`, hint:R`\(f(-1), f(f(-1)), \dots\) 몇 개만 계산.`,
  sol:R`<div class="step">\(f(-1)=\dfrac12\), \(f\left(\dfrac12\right)=2\), \(f(2)=-1\). 3번마다 제자리.</div><div class="step">\(200=3\times66+2\) → \(f^{200}(-1)=f^2(-1)=2\).</div>`,
  v:{ q:R`같은 \(f(x)=\dfrac1{1-x}\)에서 \(f^{100}(2)\)를 구하시오.`, input:'-1', hint:R`\(2\to-1\to\frac12\to2\).`, sol:R`<div class="step">\(100=3\times33+1\) → \(f(2)=-1\).</div>` } },
{ u:'inv', id:'P31-11', tag:'역함수가 존재할 조건', c:'c2', t:50, input:'2', src:PS('1. 함수','11',141), q:R`정의역이 \(X=\{x\mid-1\le x\le1\}\), 공역이 \(Y=\{y\mid a\le y\le b\}\)인 함수 \(f(x)=-2x+1\)의 역함수가 존재하도록 하는 실수 \(a, b\)에 대하여 \(a+b\)의 값을 구하시오.`, hint:R`역함수가 있으려면 일대일대응 → 공역 = 치역.`,
  sol:R`<div class="step">감소하니 치역은 \(f(1)=-1\)부터 \(f(-1)=3\)까지.</div><div class="step">공역 = 치역 → \(a=-1,\ b=3\). 합 2.</div>`,
  v:{ q:R`정의역 \(\{x\mid0\le x\le2\}\), 공역 \(\{y\mid a\le y\le b\}\)인 \(f(x)=3x-1\)의 역함수가 존재할 때 \(a+b\)를 구하시오.`, input:'4', hint:R`\(-1\)부터 5까지.`, sol:R`<div class="step">4.</div>` } },
{ u:'inv', id:'P31-13', tag:'역함수 성질 정리', c:'c3', t:50, input:'-2', src:PS('1. 함수','13',141), q:R`두 함수 \(f(x)=x+1,\ g(x)=2x+6\)에 대하여 \((f\circ(g\circ f)^{-1}\circ f)(1)\)의 값을 구하시오.`, hint:R`\((g\circ f)^{-1}=f^{-1}\circ g^{-1}\).`,
  sol:R`<div class="step">\(f\circ f^{-1}\circ g^{-1}\circ f=g^{-1}\circ f\).</div><div class="step">\(f(1)=2\), \(g^{-1}(2)\): \(2x+6=2\) → \(-2\).</div>`,
  v:{ q:R`\(f(x)=x-1\), \(g(x)=3x\)일 때 \((f\circ(g\circ f)^{-1}\circ f)(4)\)를 구하시오.`, input:'1', hint:R`\(g^{-1}(f(4))\).`, sol:R`<div class="step">\(f(4)=3\), \(g^{-1}(3)=1\).</div>` } },
/* 유리함수 */
{ u:'rat', id:'P32-01', tag:'유리식 항등식', c:'c1', t:70, input:'4', src:PS('2. 유리함수','01',158), q:R`상수 \(a, b, c\)에 대하여 \(\dfrac1x+\dfrac{2}{x-1}-\dfrac{3}{x+1}=\dfrac{ax^2+bx+c}{x(x-1)(x+1)}\)일 때, \(a+b+c\)의 값을 구하시오.`, hint:R`좌변을 통분해서 분자만 정리.`,
  sol:R`<div class="step">분자: \((x^2-1)+2x(x+1)-3x(x-1)=5x-1\).</div><div class="step">\(a=0,\ b=5,\ c=-1\) → 4.</div><div class="tip"><b>더 빠른 길</b>\(a+b+c\)는 분자에 \(x=1\)을 넣은 값! 우변 분자 \(=5\cdot1-1=4\).</div>`,
  v:{ q:R`\(\dfrac2x-\dfrac1{x+2}=\dfrac{ax+b}{x(x+2)}\)일 때 \(a+b\)를 구하시오.`, input:'5', hint:R`분자 \(2(x+2)-x\).`, sol:R`<div class="step">\(x+4\) → 5.</div>` } },
{ u:'rat', id:'P32-02', tag:'유리식 곱셈·나눗셈', c:'c1', t:80, input:'1', src:PS('2. 유리함수','02',158), q:R`다음 식을 간단히 하시오. \[\frac{x^2-y^2}{x^2-2xy+y^2}\times\frac{x^2+xy-2y^2}{x^2+xy}\div\frac{x^2-4y^2}{x^2-2xy}\]`, hint:R`전부 인수분해하고, 나눗셈은 뒤집어서 곱하기.`,
  sol:R`<div class="step">\(\dfrac{(x-y)(x+y)}{(x-y)^2}\times\dfrac{(x+2y)(x-y)}{x(x+y)}\times\dfrac{x(x-2y)}{(x-2y)(x+2y)}\)</div><div class="step">약분하면 전부 지워져서 1.</div>`,
  v:{ q:R`\(\dfrac{x^2-1}{x^2+x}\div\dfrac{x-1}{x}\)을 간단히 한 값을 구하시오.`, input:'1', hint:R`인수분해.`, sol:R`<div class="step">\(\dfrac{(x-1)(x+1)}{x(x+1)}\times\dfrac{x}{x-1}=1\).</div>` } },
{ u:'rat', id:'P32-04', tag:'유리함수의 뜻', c:'c2', t:40, src:PS('2. 유리함수','04',158), q:R`다음 보기의 함수 중 다항함수가 아닌 유리함수인 것만을 있는 대로 고른 것은?<div class="key">ㄱ. \(y=\dfrac{x+1}2\) &nbsp; ㄴ. \(y=\dfrac2{x+1}\) &nbsp; ㄷ. \(y=\dfrac34x\) &nbsp; ㄹ. \(y=\dfrac1{1-x}\)</div>`, ch:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ'], a:3, hint:R`분모에 \(x\)가 있으면 다항함수가 아니에요.`,
  sol:R`<div class="step">ㄱ, ㄷ은 분모가 숫자라 그냥 일차함수(다항함수). ㄴ, ㄹ은 분모에 \(x\).</div>`,
  v:{ q:R`다항함수가 아닌 유리함수는?<div class="key">ㄱ. \(y=\dfrac{x^2}3\) ㄴ. \(y=\dfrac3{x^2}\) ㄷ. \(y=\dfrac{x}{x+1}\) ㄹ. \(y=2x-1\)</div>`, ch:['ㄱ, ㄴ','ㄴ, ㄷ','ㄷ, ㄹ','ㄱ, ㄹ','ㄴ, ㄹ'], a:1, hint:R`분모의 \(x\).`, sol:R`<div class="step">ㄴ, ㄷ.</div>` } },
{ u:'rat', id:'P32-05', tag:'그래프로 유리함수 결정', c:'c2', t:60, input:'7', src:PS('2. 유리함수','05',158)+' (그래프를 글로 옮김)', q:R`유리함수 \(y=\dfrac{b}{x-a}+c\)의 그래프의 점근선이 \(x=2,\ y=3\)이고 그래프가 점 \((0,2)\)를 지날 때, 상수 \(a, b, c\)에 대하여 \(a+b+c\)의 값을 구하시오.`, hint:R`점근선이 바로 \(a\)와 \(c\).`,
  sol:R`<div class="step">\(a=2,\ c=3\). \((0,2)\) 대입: \(\dfrac{b}{-2}+3=2\) → \(b=2\).</div><div class="step">합 7.</div>`,
  v:{ q:R`\(y=\dfrac{b}{x-a}+c\)의 점근선이 \(x=-1,\ y=2\)이고 원점을 지날 때 \(a+b+c\)를 구하시오.`, input:'-1', hint:R`\(b+2=0\).`, sol:R`<div class="step">\(a=-1, c=2, b=-2\) → \(-1\).</div>` } },
{ u:'rat', id:'P32-06', tag:'평행이동 후 원점 지남', c:'c4', t:40, input:'2', src:PS('2. 유리함수','06',158), q:R`유리함수 \(y=\dfrac1{x+1}-3\)의 그래프를 \(y\)축의 방향으로 \(a\)만큼 평행이동한 그래프가 원점을 지날 때, 실수 \(a\)의 값을 구하시오.`, hint:R`식 끝에 \(+a\).`,
  sol:R`<div class="step">\(y=\dfrac1{x+1}-3+a\)에 \((0,0)\): \(1-3+a=0\) → \(a=2\).</div>`,
  v:{ q:R`\(y=\dfrac2{x-1}+1\)을 \(y\)축 방향으로 \(a\)만큼 옮긴 그래프가 원점을 지날 때 \(a\)를 구하시오.`, input:'1', hint:R`\(-2+1+a=0\).`, sol:R`<div class="step">1.</div>` } },
{ u:'rat', id:'P32-07', tag:'점근선으로 미지수', c:'c3', t:40, input:'-3', src:PS('2. 유리함수','07',158), q:R`유리함수 \(y=\dfrac{ax-2}{x+b}\)의 그래프의 점근선의 방정식이 \(x=1,\ y=-2\)일 때, 상수 \(a, b\)에 대하여 \(a+b\)의 값을 구하시오.`, hint:R`\(x=-b\), \(y=a\).`,
  sol:R`<div class="step">\(-b=1\) → \(b=-1\). \(a=-2\). 합 \(-3\).</div>`,
  v:{ q:R`\(y=\dfrac{ax+1}{x-b}\)의 점근선이 \(x=3,\ y=2\)일 때 \(a+b\)를 구하시오.`, input:'5', hint:R`\(b=3\), \(a=2\).`, sol:R`<div class="step">5.</div>` } },
{ u:'rat', id:'P32-08', tag:'지나지 않는 사분면', c:'c2', t:60, src:PS('2. 유리함수','08',159), q:R`유리함수 \(y=\dfrac{-3x-4}{x+1}\)의 그래프가 지나지 않는 사분면은?`, ch:['제1사분면','제2사분면','제3사분면','제4사분면','모두 지난다'], a:0, hint:R`\(-3-\dfrac{1}{x+1}\)로 바꾸고 점근선 교점 \((-1,-3)\)에서 그려 보세요.`,
  sol:R`<div class="step">\(y=-3-\dfrac1{x+1}\). 중심 \((-1,-3)\), \(k=-1<0\)이라 왼쪽 위, 오른쪽 아래 가지.</div><div class="step">오른쪽 가지(\(x>-1\))는 항상 \(y<-3\)이라 1사분면에 못 올라가요. 왼쪽 가지는 \(x<-1\)이라 1사분면 X.</div><div class="step">그래서 제1사분면을 안 지나요.</div>`,
  v:{ q:R`\(y=\dfrac{2x+5}{x+2}\)의 그래프가 지나지 않는 사분면은?`, ch:['제1사분면','제2사분면','제3사분면','제4사분면','모두 지난다'], a:3, hint:R`\(2+\dfrac{1}{x+2}\), 중심 \((-2,2)\).`, sol:R`<div class="step">오른쪽 가지는 \(y>2\), 왼쪽 가지는 \(x<-2\). 4사분면(\(x>0, y<0\)) X.</div>` } },
{ u:'rat', id:'P32-09', tag:'평행이동 관계 찾기', c:'c4', t:50, input:'4', src:PS('2. 유리함수','09',159), q:R`유리함수 \(y=\dfrac{-x+5}{x-2}\)의 그래프는 \(y=\dfrac ax\)의 그래프를 \(x\)축의 방향으로 \(b\)만큼, \(y\)축의 방향으로 \(c\)만큼 평행이동한 것이다. 실수 \(a, b, c\)에 대하여 \(a+b+c\)의 값을 구하시오.`, hint:R`\(-x+5=-(x-2)+3\).`,
  sol:R`<div class="step">\(y=-1+\dfrac{3}{x-2}\) → \(a=3,\ b=2,\ c=-1\). 합 4.</div>`,
  v:{ q:R`\(y=\dfrac{2x+1}{x+1}\)이 \(y=\dfrac ax\)를 \((b, c)\)만큼 옮긴 것일 때 \(a+b+c\)를 구하시오.`, input:'0', hint:R`\(2-\dfrac1{x+1}\).`, sol:R`<div class="step">\(a=-1, b=-1, c=2\) → 0.</div>` } },
{ u:'rat', id:'P32-10', tag:'평행이동으로 겹치는 그래프', c:'c4', t:40, input:'4', src:PS('2. 유리함수','10',159), q:R`유리함수 \(y=\dfrac{x+k}{x+1}\)의 그래프를 평행이동한 그래프가 \(y=\dfrac3x\)의 그래프와 겹쳐질 때, 상수 \(k\)의 값을 구하시오.`, hint:R`평행이동해도 \(\dfrac{k}{x-p}\)의 \(k\)는 그대로.`,
  sol:R`<div class="step">\(y=1+\dfrac{k-1}{x+1}\). 분자 \(k-1=3\) → \(k=4\).</div>`,
  v:{ q:R`\(y=\dfrac{2x+k}{x-1}\)을 평행이동하면 \(y=-\dfrac1x\)와 겹칠 때 \(k\)를 구하시오.`, input:'-3', hint:R`\(2+\dfrac{k+2}{x-1}\).`, sol:R`<div class="step">\(k+2=-1\) → \(-3\).</div>` } },
{ u:'rat', id:'P32-11', tag:'대칭점', c:'c2', t:30, input:'5', src:PS('2. 유리함수','11',159), q:R`유리함수 \(y=\dfrac{4x-5}{x-1}\)의 그래프가 점 \((p, q)\)에 대하여 대칭일 때, \(p+q\)의 값을 구하시오.`, hint:R`대칭점 = 점근선의 교점.`,
  sol:R`<div class="step">점근선 \(x=1,\ y=4\) → \((1,4)\). 합 5.</div>`,
  v:{ q:R`\(y=\dfrac{-2x+1}{x+3}\)의 대칭점 \((p,q)\)에 대하여 \(p+q\)를 구하시오.`, input:'-5', hint:R`\(x=-3,\ y=-2\).`, sol:R`<div class="step">\(-5\).</div>` } },
{ u:'rat', id:'P32-13', tag:'제한된 정의역의 최대·최소', c:'c3', t:60, input:'1', src:PS('2. 유리함수','13',159), q:R`정의역이 \(\{x\mid-2\le x\le a\}\)인 유리함수 \(y=\dfrac4x\)의 최솟값이 \(-8\), 최댓값이 \(b\)일 때, 음수 \(a, b\)에 대하여 \(ab\)의 값을 구하시오.`, hint:R`\(x<0\)에서 \(y=\dfrac4x\)는 감소.`,
  sol:R`<div class="step">감소함수: 최댓값 \(f(-2)=-2=b\), 최솟값 \(f(a)=\dfrac4a=-8\) → \(a=-\dfrac12\).</div><div class="step">\(ab=1\).</div>`,
  v:{ q:R`정의역 \(\{x\mid1\le x\le a\}\)인 \(y=\dfrac6x\)의 최솟값이 2, 최댓값이 \(b\)일 때 \(a+b\)를 구하시오.`, input:'9', hint:R`감소.`, sol:R`<div class="step">\(b=6\), \(a=3\) → 9.</div>` } },
{ u:'rat', id:'P32-14', tag:'유리함수의 역함수', c:'c4', t:50, input:'5', src:PS('2. 유리함수','14',159), q:R`유리함수 \(f(x)=\dfrac{2x+a}{x+2}\)의 역함수가 \(f^{-1}(x)=\dfrac{3-2x}{x-b}\)일 때, 상수 \(a, b\)에 대하여 \(a+b\)의 값을 구하시오.`, hint:R`공식: \(a\)와 \(d\) 자리 바꾸고 부호 반대.`,
  sol:R`<div class="step">역함수 \(=\dfrac{-2x+a}{x-2}\). 비교하면 \(a=3,\ b=2\). 합 5.</div>`,
  v:{ q:R`\(f(x)=\dfrac{x+a}{x-3}\)의 역함수가 \(\dfrac{3x+2}{x-b}\)일 때 \(a+b\)를 구하시오.`, input:'3', hint:R`역함수 \(\dfrac{3x+a}{x-1}\).`, sol:R`<div class="step">\(a=2, b=1\) → 3.</div>` } },
/* 무리함수 */
{ u:'irr', id:'P33-01', tag:'무리식이 실수일 조건', c:'c1', t:50, input:'5', src:PS('3. 무리함수','01',175), q:R`무리식 \(\sqrt{6-2x}+\dfrac{1}{\sqrt{3x-4}}\)의 값이 실수가 되도록 하는 모든 정수 \(x\)의 값의 합을 구하시오.`, hint:R`분모의 근호 안은 0이 되면 안 돼요(> 0).`,
  sol:R`<div class="step">\(6-2x\ge0\) → \(x\le3\). 분모라서 \(3x-4>0\) → \(x>\dfrac43\).</div><div class="step">정수 2, 3 → 5.</div>`,
  v:{ q:R`\(\sqrt{x+2}+\dfrac1{\sqrt{4-x}}\)이 실수인 정수 \(x\)의 합을 구하시오.`, input:'3', hint:R`\(-2\le x<4\).`, sol:R`<div class="step">\(-2+\dots+3=3\).</div>` } },
{ u:'irr', id:'P33-02', tag:'근호 안 완전제곱', c:'c1', t:80, input:'2', src:PS('3. 무리함수','02',175), q:R`\(0<x\le1\)일 때, \(\sqrt{1+\dfrac{2x+1}{x^2}}-\sqrt{1-\dfrac{2x-1}{x^2}}\)을 간단히 하시오.`, hint:R`근호 안을 통분하면 완전제곱이 보여요.`,
  sol:R`<div class="step">\(1+\dfrac{2x+1}{x^2}=\dfrac{(x+1)^2}{x^2}\), \(1-\dfrac{2x-1}{x^2}=\dfrac{(x-1)^2}{x^2}\).</div><div class="step">\(\dfrac{|x+1|}{x}-\dfrac{|x-1|}{x}=\dfrac{(x+1)-(1-x)}{x}=2\) (\(x\le1\)이라 \(|x-1|=1-x\)).</div>`,
  v:{ q:R`\(0<x<2\)일 때 \(\sqrt{x^2+4x+4}+\sqrt{x^2-4x+4}\)를 간단히 하시오.`, input:'4', hint:R`\(|x+2|+|x-2|\).`, sol:R`<div class="step">\((x+2)+(2-x)=4\).</div>` } },
{ u:'irr', id:'P33-03', tag:'분모의 유리화', c:'c1', t:60, input:'1', src:PS('3. 무리함수','03',175), q:R`\(x\ne0\)일 때, \(\dfrac{x}{\sqrt{2x+1}-1}-\dfrac{x}{\sqrt{2x+1}+1}\)을 간단히 하시오.`, hint:R`통분하면 분모가 \((2x+1)-1\).`,
  sol:R`<div class="step">통분: \(\dfrac{x\{(\sqrt{2x+1}+1)-(\sqrt{2x+1}-1)\}}{(2x+1)-1}=\dfrac{2x}{2x}=1\).</div>`,
  v:{ q:R`\(\dfrac{1}{\sqrt{x+1}-\sqrt x}-\dfrac1{\sqrt{x+1}+\sqrt x}\)을 \(\sqrt x\)의 몇 배인지 구하시오.`, input:'2', hint:R`유리화.`, sol:R`<div class="step">\((\sqrt{x+1}+\sqrt x)-(\sqrt{x+1}-\sqrt x)=2\sqrt x\).</div>` } },
{ u:'irr', id:'P33-04', tag:'무리함수의 뜻', c:'c2', t:40, src:PS('3. 무리함수','04',175), q:R`다음 보기의 함수 중 무리함수인 것만을 있는 대로 고른 것은?<div class="key">ㄱ. \(y=\sqrt3x\) &nbsp; ㄴ. \(y=\sqrt{5x}\) &nbsp; ㄷ. \(y=\sqrt{(x-2)^2}\) &nbsp; ㄹ. \(y=\dfrac{1}{1-\sqrt{2x}}\)</div>`, ch:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ'], a:3, hint:R`근호 안에 문자가 있어야 해요. 근호가 벗겨지면 무리함수 아님.`,
  sol:R`<div class="step">ㄱ: \(\sqrt3\)은 그냥 숫자 → 일차함수. ㄷ: \(|x-2|\)로 근호가 벗겨져요.</div><div class="step">ㄴ, ㄹ만 근호 안에 \(x\)가 남아요.</div>`,
  v:{ q:R`무리함수인 것은?<div class="key">ㄱ. \(y=\sqrt{x^2}\) ㄴ. \(y=\sqrt{x+1}\) ㄷ. \(y=\sqrt2+x\) ㄹ. \(y=2\sqrt{-x}\)</div>`, ch:['ㄱ, ㄴ','ㄴ, ㄷ','ㄴ, ㄹ','ㄱ, ㄹ','ㄷ, ㄹ'], a:2, hint:R`근호 안 문자.`, sol:R`<div class="step">ㄴ, ㄹ.</div>` } },
{ u:'irr', id:'P33-05', tag:'평행이동으로 겹치는 그래프', c:'c3', t:60, src:PS('3. 무리함수','05',175), q:R`다음 보기의 함수의 그래프 중 평행이동하여 무리함수 \(y=\sqrt{-3x}\)의 그래프와 겹쳐지는 것만을 있는 대로 고른 것은?<div class="key">ㄱ. \(y=-\sqrt{-3x}\) &nbsp; ㄴ. \(y=-\sqrt{3x}+1\) &nbsp; ㄷ. \(y=\sqrt{3x+1}-1\) &nbsp; ㄹ. \(y=\sqrt{-3x-1}+1\)</div>`, ch:['ㄱ','ㄴ','ㄷ','ㄹ','ㄷ, ㄹ'], a:3, hint:R`평행이동은 근호 안 \(x\)의 계수(\(-3\))와 근호 앞 부호(\(+\))를 바꾸지 않아요.`,
  sol:R`<div class="step">\(y=\sqrt{-3x}\): 안쪽 계수 \(-3\), 앞 부호 \(+\).</div><div class="step">ㄱ 앞 부호 ✘, ㄴ 둘 다 ✘, ㄷ 안쪽 \(+3\) ✘. ㄹ \(\sqrt{-3\left(x+\frac13\right)}+1\) ✔.</div>`,
  v:{ q:R`\(y=-\sqrt{2x}\)를 평행이동해서 겹치는 것은?<div class="key">ㄱ. \(y=\sqrt{2x}\) ㄴ. \(y=-\sqrt{2x-4}+3\) ㄷ. \(y=-\sqrt{-2x}\) ㄹ. \(y=-\sqrt{x+1}\)</div>`, ch:['ㄱ','ㄴ','ㄷ','ㄹ','ㄴ, ㄹ'], a:1, hint:R`계수 2, 앞 부호 \(-\).`, sol:R`<div class="step">ㄴ.</div>` } },
{ u:'irr', id:'P33-06', tag:'평행이동 후 점을 지남', c:'c3', t:50, input:'3', src:PS('3. 무리함수','06',175), q:R`무리함수 \(y=\sqrt{ax}\)의 그래프를 \(x\)축의 방향으로 1만큼, \(y\)축의 방향으로 2만큼 평행이동한 그래프가 점 \((4,5)\)를 지날 때, 상수 \(a\)의 값을 구하시오.`, hint:R`\(y=\sqrt{a(x-1)}+2\).`,
  sol:R`<div class="step">\(5=\sqrt{3a}+2\) → \(3a=9\) → \(a=3\).</div>`,
  v:{ q:R`\(y=\sqrt{ax}\)를 \(x\)축 방향 \(-2\), \(y\)축 방향 1만큼 옮긴 그래프가 \((6,5)\)를 지날 때 \(a\)를 구하시오.`, input:'2', hint:R`\(\sqrt{8a}+1=5\).`, sol:R`<div class="step">\(8a=16\) → 2.</div>` } },
{ u:'irr', id:'P33-07', tag:'표준형으로 바꾸기', c:'c2', t:50, input:'-3', src:PS('3. 무리함수','07',175), q:R`무리함수 \(y=\sqrt{-2x+4}-3\)의 그래프는 \(y=\sqrt{ax}\)의 그래프를 \(x\)축의 방향으로 \(b\)만큼, \(y\)축의 방향으로 \(c\)만큼 평행이동한 것이다. 실수 \(a, b, c\)에 대하여 \(a+b+c\)의 값을 구하시오.`, hint:R`\(-2x+4=-2(x-2)\).`,
  sol:R`<div class="step">\(y=\sqrt{-2(x-2)}-3\) → \(a=-2,\ b=2,\ c=-3\). 합 \(-3\).</div>`,
  v:{ q:R`\(y=\sqrt{3x+6}+1\)이 \(y=\sqrt{ax}\)를 \((b,c)\)만큼 옮긴 것일 때 \(a+b+c\)를 구하시오.`, input:'2', hint:R`\(3(x+2)\).`, sol:R`<div class="step">\(3-2+1=2\).</div>` } },
{ u:'irr', id:'P33-08', tag:'지나는 사분면', c:'c2', t:40, src:PS('3. 무리함수','08',175), q:R`무리함수 \(y=-\sqrt{x-2}-1\)의 그래프가 지나는 사분면은?`, ch:['제1사분면','제2사분면','제3사분면','제4사분면','제1, 4사분면'], a:3, hint:R`시작점 \((2,-1)\), 오른쪽 아래로.`,
  sol:R`<div class="step">시작점 \((2,-1)\)은 4사분면이고, 오른쪽 아래로만 가니까 계속 4사분면.</div>`,
  v:{ q:R`\(y=\sqrt{-x}+2\)의 그래프가 지나는 사분면은?`, ch:['제1사분면','제2사분면','제3사분면','제4사분면','제1, 2사분면'], a:1, hint:R`시작점 \((0,2)\), 왼쪽 위로.`, sol:R`<div class="step">제2사분면.</div>` } },
{ u:'irr', id:'P33-09', tag:'그래프로 무리함수 결정', c:'c2', t:80, input:'-4', src:PS('3. 무리함수','09',176)+' (그래프를 글로 옮김)', q:R`무리함수 \(f(x)=-\sqrt{ax+b}+c\)의 그래프가 점 \((4,2)\)에서 시작하여 왼쪽 아래로 뻗고, 점 \((0,-2)\)를 지날 때, \(f(-5)\)의 값을 구하시오. (단, \(a, b, c\)는 상수이다.)`, hint:R`\(f(x)=-\sqrt{a(x-4)}+2\) (\(a<0\)).`,
  sol:R`<div class="step">시작점 \((4,2)\), 왼쪽으로 뻗으니 \(f(x)=-\sqrt{a(x-4)}+2\), \(a<0\).</div><div class="step">\((0,-2)\): \(-\sqrt{-4a}+2=-2\) → \(-4a=16\) → \(a=-4\).</div><div class="step">\(f(-5)=-\sqrt{36}+2=-4\).</div>`,
  v:{ q:R`\(f(x)=\sqrt{a(x+1)}-3\)의 그래프가 \((3,1)\)을 지날 때 \(f(8)\)을 구하시오.`, input:'3', hint:R`\(\sqrt{4a}=4\).`, sol:R`<div class="step">\(a=4\), \(f(8)=6-3=3\).</div>` } },
{ u:'irr', id:'P33-10', tag:'제한된 정의역의 치역', c:'c2', t:50, input:'2', src:PS('3. 무리함수','10',176), q:R`정의역이 \(\{x\mid1\le x\le5\}\)인 무리함수 \(y=-\sqrt{x-1}+1\)의 치역이 \(\{y\mid a\le y\le b\}\)일 때, \(b-a\)의 값을 구하시오.`, hint:R`감소하는 함수라 양 끝만.`,
  sol:R`<div class="step">\(x=1\): 1 \(=b\). \(x=5\): \(-2+1=-1=a\). \(b-a=2\).</div>`,
  v:{ q:R`정의역 \(\{x\mid-1\le x\le7\}\)인 \(y=\sqrt{x+2}-1\)의 치역이 \(\{y\mid a\le y\le b\}\)일 때 \(a+b\)를 구하시오.`, input:'2', hint:R`증가.`, sol:R`<div class="step">\(a=0, b=2\).</div>` } },
{ u:'irr', id:'P33-11', tag:'최대·최소로 미지수', c:'c2', t:50, input:'5', src:PS('3. 무리함수','11',176), q:R`정의역이 \(\{x\mid0\le x\le2\}\)인 무리함수 \(y=\sqrt{4x+a}+1\)의 최솟값이 2이고 최댓값이 \(b\)일 때, 실수 \(a, b\)에 대하여 \(a+b\)의 값을 구하시오.`, hint:R`증가함수: 최솟값은 \(x=0\).`,
  sol:R`<div class="step">\(\sqrt a+1=2\) → \(a=1\). \(b=\sqrt9+1=4\). 합 5.</div>`,
  v:{ q:R`정의역 \(\{x\mid0\le x\le3\}\)인 \(y=\sqrt{4x+a}-1\)의 최솟값이 1, 최댓값이 \(b\)일 때 \(a+b\)를 구하시오.`, input:'7', hint:R`\(\sqrt a-1=1\).`, sol:R`<div class="step">\(a=4\), \(b=\sqrt{16}-1=3\) → 7.</div>` } },
{ u:'irr', id:'P33-12', tag:'이차함수의 역함수', c:'c4', t:60, input:'6', src:PS('3. 무리함수','12',176), q:R`함수 \(f(x)=x^2-4x+1\ (x\ge2)\)의 역함수가 \(g(x)=\sqrt{x+a}+b\)일 때, 상수 \(a, b\)에 대하여 \(ab\)의 값을 구하시오.`, hint:R`완전제곱식으로 바꾸고 \(x, y\) 바꾸기.`,
  sol:R`<div class="step">\(y=(x-2)^2-3\) → \(x\)에 대해 풀면 \(x=\sqrt{y+3}+2\) (\(x\ge2\)).</div><div class="step">\(g(x)=\sqrt{x+3}+2\) → \(ab=6\).</div>`,
  v:{ q:R`\(f(x)=x^2+2x\ (x\ge-1)\)의 역함수가 \(\sqrt{x+a}+b\)일 때 \(a+b\)를 구하시오.`, input:'0', hint:R`\((x+1)^2-1\).`, sol:R`<div class="step">\(\sqrt{x+1}-1\) → 0.</div>` } },
{ u:'irr', id:'P33-13', tag:'함수와 역함수의 교점', c:'c4', t:60, input:'8', src:PS('3. 무리함수','13',176), q:R`두 함수 \(y=\sqrt x+2\), \(x=\sqrt y+2\)의 그래프의 교점의 좌표가 \((a, b)\)일 때, \(a+b\)의 값을 구하시오.`, hint:R`두 식은 \(x, y\)를 바꾼 관계 = 역함수. 증가함수라 교점은 \(y=x\) 위.`,
  sol:R`<div class="step">\(x=\sqrt x+2\) → \(\sqrt x=t\): \(t^2-t-2=0\) → \(t=2\) (\(t\ge0\)) → \(x=4\).</div><div class="step">\((4,4)\) → 8.</div>`,
  v:{ q:R`\(y=\sqrt{x}+6\)과 그 역함수의 교점을 \((a,b)\)라 할 때 \(a+b\)를 구하시오.`, input:'18', hint:R`\(t^2-t-6=0\).`, sol:R`<div class="step">\(t=3\), \(x=9\) → 18.</div>` } },
{ u:'irr', id:'P33-14', tag:'합성함수의 역함수 값', c:'c4', t:70, input:'5', src:PS('3. 무리함수','14',176), q:R`두 함수 \(f(x)=\dfrac{2x+1}{x-1},\ g(x)=\sqrt{2x-1}\)에 대하여 \((f^{-1}\circ g)^{-1}(4)\)의 값을 구하시오.`, hint:R`\((f^{-1}\circ g)^{-1}=g^{-1}\circ f\).`,
  sol:R`<div class="step">\((f^{-1}\circ g)^{-1}=g^{-1}\circ(f^{-1})^{-1}=g^{-1}\circ f\).</div><div class="step">\(f(4)=\dfrac93=3\). \(g^{-1}(3)\): \(\sqrt{2x-1}=3\) → \(x=5\).</div>`,
  v:{ q:R`\(f(x)=\dfrac{x+3}{x-1}\), \(g(x)=\sqrt{x+5}\)일 때 \((f^{-1}\circ g)^{-1}(3)\)을 구하시오.`, input:'4', hint:R`\(g^{-1}(f(3))\).`, sol:R`<div class="step">\(f(3)=3\), \(\sqrt{x+5}=3\) → 4.</div>` } },
{ u:'irr', id:'P33-15', tag:'무리함수와 직선의 위치', c:'c4', t:120, src:PS('3. 무리함수','15',176), q:R`무리함수 \(y=\sqrt{2x}\)의 그래프와 직선 \(y=x+k\)가 서로 다른 두 점에서 만날 때, 실수 \(k\)의 값의 범위는?`, ch:[R`\(k<\dfrac12\)`,R`\(0<k<\dfrac12\)`,R`\(0\le k<\dfrac12\)`,R`\(0\le k\le\dfrac12\)`,R`\(k\ge0\)`], a:2, hint:R`경계 두 개: 시작점(원점)을 지날 때, 접할 때.`,
  sol:R`<div class="step">직선을 위아래로 움직이며 보면, 원점을 지날 때(\(k=0\)) 두 점에서 만나기 시작해요.</div><div class="step">접할 때: \(2x=(x+k)^2\) → \(x^2+(2k-2)x+k^2=0\), \(\dfrac D4=(k-1)^2-k^2=0\) → \(k=\dfrac12\).</div><div class="step">그 사이: \(0\le k<\dfrac12\).</div>`,
  v:{ q:R`\(y=\sqrt{x}\)와 직선 \(y=x+k\)가 서로 다른 두 점에서 만날 때 \(k\)의 범위는?`, ch:[R`\(0\le k<\dfrac14\)`,R`\(0<k<\dfrac14\)`,R`\(k<\dfrac14\)`,R`\(0\le k\le\dfrac14\)`,R`\(k\ge0\)`], a:0, hint:R`접할 때 \(1-4k=0\).`, sol:R`<div class="step">\(x=(x+k)^2\) 판별식 → \(k=\dfrac14\). \(0\le k<\dfrac14\).</div>` } },
];

{ u:'prop', id:'1028', tag:'명제가 참이 되는 미지수 (부등식)', c:'c2', t:80, input:'8', src:MB('1028',179),
  q:R`실수 \(x\)에 대하여 두 조건 \(p, q\)가 \(p: k+2<x<k+5\), \(q: -4<x<6\)일 때, 명제 \(p\to q\)가 참이 되도록 하는 정수 \(k\)의 개수를 구하시오.`,
  hint:R`\(P\)가 \(Q\) 안에 들어가도록 양 끝을 비교. 둘 다 열린 끝(<)이라 등호가 들어가요.`,
  sol:R`<div class="step">\(P\subset Q\): \(-4\le k+2\)이고 \(k+5\le6\).</div><div class="step">둘 다 ‘<’라서 끝점이 같아도 괜찮아요. \(k\ge-6\), \(k\le1\).</div><div class="step">정수 \(-6,-5,\dots,1\) → 8개.</div>`,
  v:{ q:R`\(p: k-1<x<k+3\), \(q: -3<x<5\)일 때 \(p\to q\)가 참이 되는 정수 \(k\)의 개수를 구하시오.`, input:'5', hint:R`\(-3\le k-1\), \(k+3\le5\).`, sol:R`<div class="step">\(-2\le k\le2\) → 5개.</div>` } },
{ u:'prop', id:'1029', tag:'명제가 참이 되는 미지수 (등식)', c:'c2', t:50, src:MB('1029',179),
  q:R`명제 ‘\(x=a\)이면 \(x^2+6x-7=0\)이다.’가 참이 되도록 하는 양수 \(a\)의 값은?`, ch:['1','2','3','4','5'], a:0,
  hint:R`\(\{a\}\subset\{x\mid x^2+6x-7=0\}\).`,
  sol:R`<div class="step">\(P=\{a\}\)가 \(Q\) 안에 있어야 하니 \(a\)가 방정식의 해.</div><div class="step">\((x+7)(x-1)=0\) → \(x=1, -7\). 양수 \(a=1\).</div>`,
  v:{ q:R`‘\(x=a\)이면 \(x^2-4x+3=0\)’이 참이 되는 \(a\) 중 큰 값은?`, ch:['1','2','3','4','5'], a:2, hint:R`인수분해.`, sol:R`<div class="step">\((x-1)(x-3)=0\) → 큰 값 3.</div>` } },
{ u:'prop', id:'1030', tag:'~p → q 가 참이 될 조건', c:'c2', t:100, src:MB('1030',179),
  q:R`두 조건 \(p: x^2-5x-24>0\), \(q: x^2-(a+b)x+ab\le0\) (단, \(a<b\))일 때, 명제 \(\sim p\to q\)가 참이 되도록 하는 실수 \(a\)의 최댓값과 실수 \(b\)의 최솟값의 합은?`, ch:['5','6','7','8','9'], a:0,
  hint:R`\(\sim p\)는 \(x^2-5x-24\le0\). \(q\)는 \(a\le x\le b\).`,
  sol:R`<div class="step">\(\sim p\): \((x-8)(x+3)\le0\) → \(-3\le x\le8\). \(q\): \((x-a)(x-b)\le0\) → \(a\le x\le b\).</div><div class="step">\([-3,8]\subset[a,b]\) → \(a\le-3\), \(b\ge8\).</div><div class="step">\(a\)의 최댓값 \(-3\), \(b\)의 최솟값 8, 합 5.</div>`,
  v:{ q:R`\(p: x^2-2x-8>0\), \(q: (x-a)(x-b)\le0\ (a<b)\)일 때 \(\sim p\to q\)가 참이 되는 \(a\)의 최댓값과 \(b\)의 최솟값의 합은?`, ch:['0','1','2','3','4'], a:2, hint:R`\(\sim p: -2\le x\le4\).`, sol:R`<div class="step">\(a\le-2,\ b\ge4\) → \(-2+4=2\).</div>` } },
{ u:'prop', id:'1031', tag:'~q → p (대우로 바꿔 보기)', c:'c4', t:100, src:MB('1031',179),
  q:R`두 조건 \(p: x<0\) 또는 \(x\ge6\), \(q: a-7<x\le3a\)일 때, 명제 \(\sim q\to p\)가 참이 되도록 하는 자연수 \(a\)의 값의 합은?`, ch:['16','18','20','22','24'], a:2,
  hint:R`\(\sim q\to p\)의 대우는 \(\sim p\to q\). \(\sim p\)가 깔끔한 구간이에요.`,
  sol:R`<div class="step">대우 \(\sim p\to q\)가 참이면 돼요. \(\sim p: 0\le x<6\).</div><div class="step">\([0,6)\subset(a-7, 3a]\): \(a-7<0\) → \(a<7\), \(3a\ge6\) → \(a\ge2\).</div><div class="step">자연수 2~6, 합 20.</div>`,
  v:{ q:R`\(p: x<1\) 또는 \(x\ge5\), \(q: a-4<x\le2a\)일 때 \(\sim q\to p\)가 참이 되는 자연수 \(a\)의 합은?`, ch:['5','7','9','12','3'], a:1, hint:R`대우 \(\sim p\to q\).`, sol:R`<div class="step">\([1,5)\subset(a-4,2a]\) → \(a<5\), \(a\ge\dfrac52\). 자연수 3, 4 → 7.</div>` } },
{ u:'prop', id:'1032', tag:'두 명제가 모두 참일 조건', c:'c5', t:110, src:MB('1032',179),
  q:R`세 조건 \(p: 0<x\le5\), \(q: -3\le x\le a\), \(r: x\le b\)에 대하여 명제 \(p\to q\)와 명제 \(q\to\sim r\)이 모두 참이 되도록 하는 정수 \(a\)의 최솟값과 정수 \(b\)의 최댓값의 합은?`, ch:['0','1','2','3','4'], a:1,
  hint:R`\(\sim r: x>b\). \(Q\subset R^C\).`,
  sol:R`<div class="step">\(p\to q\): \((0,5]\subset[-3,a]\) → \(a\ge5\).</div><div class="step">\(q\to\sim r\): \([-3,a]\subset(b,\infty)\) → \(b<-3\).</div><div class="step">정수 \(a\) 최솟값 5, 정수 \(b\) 최댓값 \(-4\). 합 1.</div>`,
  v:{ q:R`\(p: 1<x\le4\), \(q: -2\le x\le a\), \(r: x\le b\)에서 \(p\to q\), \(q\to\sim r\)이 모두 참일 때 정수 \(a\)의 최솟값과 정수 \(b\)의 최댓값의 합은?`, ch:['−1','0','1','2','3'], a:2, hint:R`\(b<-2\).`, sol:R`<div class="step">\(a\ge4\), \(b<-2\) → \(4+(-3)=1\).</div>` } },
{ u:'prop', id:'1034', tag:'두 명제가 모두 참일 조건 (학력평가)', c:'c5', t:150, src:MB('1034',179)+' · 2014년 3월 고2 학력평가',
  q:R`세 조건 \(p: x>4\), \(q: x>5-a\), \(r: (x-a)(x+a)>0\)에 대하여 명제 \(p\to q\)와 명제 \(q\to r\)이 모두 참이 되도록 하는 실수 \(a\)의 최댓값과 최솟값의 합은?`, ch:['3',R`\(\dfrac72\)`,'4',R`\(\dfrac92\)`,'5'], a:1,
  hint:R`먼저 \(p\to q\)에서 \(a\)의 범위가 나오고, 그 범위에서 \(r\)을 풀어요.`,
  sol:R`<div class="step">\(p\to q\): \(x>4\)가 \(x>5-a\) 안에 → \(5-a\le4\) → \(a\ge1\).</div><div class="step">\(a>0\)이니 \(r: x<-a\) 또는 \(x>a\).</div><div class="step">\(q\to r\): \(x>5-a\)가 \(x>a\) 안에 → \(5-a\ge a\) → \(a\le\dfrac52\).</div><div class="step">\(1\le a\le\dfrac52\), 합 \(\dfrac72\).</div>`,
  v:{ q:R`\(p: x>3\), \(q: x>4-a\), \(r: (x-a)(x+a)>0\)에서 \(p\to q\), \(q\to r\)이 모두 참일 때 \(a\)의 최댓값과 최솟값의 합은?`, ch:['2',R`\(\dfrac52\)`,'3',R`\(\dfrac72\)`,'4'], a:2, hint:R`\(a\ge1\), \(4-a\ge a\).`, sol:R`<div class="step">\(1\le a\le2\) → 3.</div>` } },
{ u:'prop', id:'1078', tag:'명제와 진리집합의 포함 관계', c:'c5', t:90, src:MB('1078',187),
  q:R`두 명제 \(q\to\sim p\), \(r\to q\)가 모두 참일 때, 항상 옳은 것만을 보기에서 있는 대로 고른 것은? (\(P, Q, R\)은 \(p, q, r\)의 진리집합)<div class="key">ㄱ. \(p\to\sim r\) &nbsp; ㄴ. \(R\subset P^C\) &nbsp; ㄷ. \(P\subset Q^C\)</div>`, ch:['ㄱ','ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'], a:4,
  hint:R`\(R\subset Q\subset P^C\)로 이어 보세요.`,
  sol:R`<div class="step">\(r\to q\): \(R\subset Q\), \(q\to\sim p\): \(Q\subset P^C\). 그래서 \(R\subset Q\subset P^C\).</div><div class="step">ㄴ ✔. ㄱ은 \(r\to\sim p\)의 대우 ✔. ㄷ은 \(q\to\sim p\)의 대우(\(p\to\sim q\)) ✔.</div>`,
  v:{ q:R`두 명제 \(p\to\sim q\), \(q\to r\)이 모두 참일 때 항상 옳은 것은?<div class="key">ㄱ. \(\sim r\to\sim q\) &nbsp; ㄴ. \(Q\subset P^C\) &nbsp; ㄷ. \(R\subset Q\)</div>`, ch:['ㄱ','ㄴ','ㄱ, ㄴ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'], a:2, hint:R`ㄷ은 방향이 반대.`, sol:R`<div class="step">ㄱ: \(q\to r\)의 대우 ✔. ㄴ: \(P\subset Q^C\) ⟺ \(Q\subset P^C\) ✔. ㄷ: \(Q\subset R\)이지 반대는 모름 ✘.</div>` } },
{ u:'prop', id:'1079', tag:'참인 명제로 포함 관계 추론', c:'c5', t:100, src:MB('1079',187),
  q:R`세 조건 \(p, q, r\)의 진리집합을 \(P, Q, R\)이라 하자. 두 명제 \(q\to\sim p\), \(\sim r\to p\)가 모두 참일 때, 다음 중 옳지 않은 것은? (단, \(R\ne U\))`,
  ch:[R`\(Q\subset R\)`,R`\(P\cap Q=\varnothing\)`,R`어떤 \(x\in P\)에 대하여 \(x\notin R\)이다.`,R`모든 \(x\in Q\)에 대하여 \(x\in R\)이다.`,R`모든 \(x\in P\)에 대하여 \(x\in R\)이다.`], a:4,
  hint:R`\(Q\subset P^C\), \(R^C\subset P\). 대우로 \(P^C\subset R\).`,
  sol:R`<div class="step">\(Q\subset P^C\)이고, \(\sim r\to p\)의 대우로 \(P^C\subset R\). 그래서 \(Q\subset R\) (①, ④ ✔), \(P\cap Q=\varnothing\) (② ✔).</div><div class="step">\(R\ne U\)라 \(R^C\)가 비어 있지 않고 \(R^C\subset P\)이니, \(P\) 안에 \(R\) 밖의 원소가 있어요 (③ ✔). 그래서 ⑤는 거짓.</div>`,
  v:{ q:R`\(P\cap Q=\varnothing\), \(P^C\subset R\)일 때 옳지 않은 것은?`, ch:[R`\(Q\subset R\)`,R`\(Q\subset P^C\)`,R`\(R^C\subset P\)`,R`모든 \(x\in Q\)에 대하여 \(x\in R\)`,R`모든 \(x\in R\)에 대하여 \(x\in Q\)`], a:4, hint:R`\(Q\subset P^C\subset R\).`, sol:R`<div class="step">\(Q\subset R\)은 맞지만 \(R\subset Q\)는 알 수 없어요. ⑤.</div>` } },
{ u:'prop', id:'1080', tag:'세 명제로 집합 관계 (학력평가)', c:'c5', t:120, src:MB('1080',187)+' · 2015년 11월 고1 학력평가',
  q:R`공집합이 아닌 세 부분집합 \(P, Q, R\)이 각각 세 조건 \(p, q, r\)의 진리집합이고, 세 명제 \(\sim p\to r\), \(r\to\sim q\), \(\sim r\to q\)가 모두 참일 때, 보기에서 옳은 것만을 있는 대로 고른 것은?<div class="key">ㄱ. \(P^C\subset R\) &nbsp; ㄴ. \(P\subset Q\) &nbsp; ㄷ. \(P\cap Q=R^C\)</div>`, ch:['ㄱ','ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'], a:2,
  hint:R`뒤의 두 명제로 \(Q=R^C\)가 나와요.`,
  sol:R`<div class="step">ㄱ: \(\sim p\to r\)이 그대로 \(P^C\subset R\) ✔.</div><div class="step">\(r\to\sim q\): \(R\subset Q^C\) ⟺ \(Q\subset R^C\). \(\sim r\to q\): \(R^C\subset Q\). 그래서 \(Q=R^C\).</div><div class="step">ㄱ의 대우로 \(R^C\subset P\), 즉 \(Q\subset P\). 그래서 ㄴ ✘, \(P\cap Q=Q=R^C\) → ㄷ ✔.</div>`,
  v:{ q:R`\(\sim p\to q\), \(q\to\sim r\), \(\sim q\to r\)이 모두 참일 때 옳은 것은?<div class="key">ㄱ. \(P^C\subset Q\) &nbsp; ㄴ. \(R\subset P\) &nbsp; ㄷ. \(P\cup Q=R\)</div>`, ch:['ㄱ','ㄴ','ㄱ, ㄴ','ㄱ, ㄷ','ㄱ, ㄴ, ㄷ'], a:2, hint:R`\(Q=R^C\).`, sol:R`<div class="step">\(Q=R^C\), \(R=Q^C\). ㄱ의 대우 \(Q^C\subset P\) → \(R\subset P\) ✔. \(P\cup Q=U\)라 ㄷ ✘.</div>` } },
{ u:'prop', id:'1082', tag:'대우를 이용한 증명', c:'c6', t:90, src:MB('1082',187),
  q:R`다음은 명제 ‘자연수 \(n\)에 대하여 \(n^2\)이 짝수이면 \(n\)도 짝수이다.’를 증명한 것이다.<div class="key">대우는 ‘\(n\)이 홀수이면 \(n^2\)도 홀수이다.’<br>\(n\)이 홀수이면 \(n=\)(가) (\(k\)는 자연수)로 나타낼 수 있으므로<br>\(n^2=(\)(가)\()^2=4k^2-4k+1=2(\)(나)\()+1\)<br>(나)는 0 또는 짝수이므로 \(n^2\)은 홀수이다.</div>(가), (나)에 알맞은 식을 각각 \(f(k), g(k)\)라 할 때, \(f(2)g(2)\)의 값은?`, ch:['6','8','12','16','20'], a:2,
  hint:R`\(4k^2-4k+1\)이 나오려면 (가)는?`,
  sol:R`<div class="step">\((2k-1)^2=4k^2-4k+1\)이니 (가) \(=2k-1\).</div><div class="step">\(4k^2-4k=2(2k^2-2k)\) → (나) \(=2k^2-2k\).</div><div class="step">\(f(2)=3\), \(g(2)=4\) → 12.</div>`,
  v:{ q:R`‘\(n\)이 짝수이면 \(n^2\)은 짝수’의 증명에서 \(n=\)(가)\(=2k\), \(n^2=2\times\)(나)일 때, (가), (나)를 \(f(k), g(k)\)라 하면 \(f(3)g(1)\)의 값은?`, ch:['6','8','10','12','18'], a:3, hint:R`\(n^2=4k^2\).`, sol:R`<div class="step">\(f(k)=2k\), \(g(k)=2k^2\). \(6\times2=12\).</div>` } },

/* ---------- 절대부등식 ---------- */
{ u:'ineq', id:'1182', tag:'산술·기하 (식 변형)', c:'c3', t:70, input:'13', src:MB('1182',207),
  q:R`\(x>5\)인 실수 \(x\)에 대하여 \(x+\dfrac{1}{x-5}\)의 최솟값을 \(m\), 그때의 \(x\)의 값을 \(n\)이라고 할 때, \(m+n\)의 값을 구하시오.`,
  hint:R`\(x=(x-5)+5\).`,
  sol:R`<div class="step">\((x-5)+\dfrac{1}{x-5}+5\ge2+5=7\).</div><div class="step">등호: \(x-5=1\) → \(x=6\). \(m+n=13\).</div>`,
  v:{ q:R`\(x>2\)일 때 \(x+\dfrac{4}{x-2}\)의 최솟값을 \(m\), 그때의 \(x\)를 \(n\)이라 하면 \(m+n\)은?`, input:'10', hint:R`\((x-2)+\dfrac4{x-2}+2\).`, sol:R`<div class="step">최솟값 \(4+2=6\), \(x=4\). 합 10.</div>` } },
{ u:'ineq', id:'1183', tag:'치환 후 산술·기하', c:'c3', t:120, src:MB('1183',207),
  q:R`\(x>1\)인 실수 \(x\)에 대하여 \(A=x^2+\dfrac1{x^2},\ B=x-\dfrac1x\)라 할 때, \(\dfrac AB\)의 최솟값은?`, ch:[R`\(\sqrt2\)`,'2',R`\(2\sqrt2\)`,'4',R`\(3\sqrt2\)`], a:2,
  hint:R`\(x^2+\dfrac1{x^2}=\left(x-\dfrac1x\right)^2+2\).`,
  sol:R`<div class="step">\(t=x-\dfrac1x\)라 하면 \(x>1\)에서 \(t>0\), \(A=t^2+2\).</div><div class="step">\(\dfrac AB=t+\dfrac2t\ge2\sqrt2\) (등호 \(t=\sqrt2\)).</div>`,
  v:{ q:R`\(x>\sqrt2\)일 때 \(A=x^2+\dfrac4{x^2}\), \(B=x-\dfrac2x\)에 대하여 \(\dfrac AB\)의 최솟값은?`, ch:['2',R`\(2\sqrt2\)`,'4',R`\(4\sqrt2\)`,'8'], a:2, hint:R`\(A=B^2+4\).`, sol:R`<div class="step">\(t+\dfrac4t\ge4\).</div>` } },
{ u:'ineq', id:'1184', tag:'치환 + 등호 조건', c:'c3', t:150, src:MB('1184',207),
  q:R`실수 \(x\)에 대하여 \(x^2-x+\dfrac{9}{x^2-x+1}\)은 \(x=\alpha\) 또는 \(x=\beta\)일 때 최솟값 \(m\)을 갖는다. 이때 \(\alpha^2+\beta^2+m\)의 값은?`, ch:['5','6','9','10','12'], a:3,
  hint:R`\(t=x^2-x+1\)로 놓으면 \(t-1+\dfrac9t\).`,
  sol:R`<div class="step">\(t=x^2-x+1=\left(x-\dfrac12\right)^2+\dfrac34>0\). 식 \(=t+\dfrac9t-1\ge6-1=5\), \(m=5\).</div><div class="step">등호 \(t=3\): \(x^2-x-2=0\) → \(x=2, -1\).</div><div class="step">\(4+1+5=10\).</div>`,
  v:{ q:R`\(x^2+2x+\dfrac{16}{x^2+2x+4}\)이 \(x=\alpha, \beta\)에서 최솟값 \(m\)을 가질 때 \(\alpha^2+\beta^2+m\)은?`, ch:['4','6','8','10','12'], a:2, hint:R`\(t=x^2+2x+4\ge3\).`, sol:R`<div class="step">\(t+\dfrac{16}t-4\ge4\), 등호 \(t=4\): \(x^2+2x=0\) → \(0, -2\). \(0+4+4=8\).</div>` } },
{ u:'ineq', id:'1185', tag:'허근 조건 + 산술·기하', c:'c2', t:80, src:MB('1185',207),
  q:R`\(x\)에 대한 이차방정식 \(x^2-2x+a=0\)이 허근을 가질 때, \(a-1+\dfrac{4}{a-1}\)의 최솟값은? (단, \(a\)는 실수)`, ch:['3','4','6','8','10'], a:1,
  hint:R`허근 조건에서 \(a-1>0\)이 나와요.`,
  sol:R`<div class="step">\(\dfrac D4=1-a<0\) → \(a-1>0\).</div><div class="step">\((a-1)+\dfrac4{a-1}\ge2\sqrt4=4\) (등호 \(a=3\)).</div>`,
  v:{ q:R`\(x^2-4x+a=0\)이 허근을 가질 때 \(a-4+\dfrac{9}{a-4}\)의 최솟값은?`, ch:['3','4','6','9','12'], a:2, hint:R`\(a>4\).`, sol:R`<div class="step">\(2\sqrt9=6\).</div>` } },
{ u:'ineq', id:'1186', tag:'분수식을 쪼개서 산술·기하', c:'c3', t:90, src:MB('1186',207),
  q:R`\(x>1\)인 실수 \(x\)에 대하여 \(\dfrac{x^2-2x+5}{x-1}\)가 \(x=a\)에서 최솟값 \(m\)을 가질 때, \(a+m\)의 값은?`, ch:['6','7','8','9','10'], a:1,
  hint:R`분자 \(=(x-1)^2+4\).`,
  sol:R`<div class="step">\(\dfrac{(x-1)^2+4}{x-1}=(x-1)+\dfrac4{x-1}\ge4\).</div><div class="step">등호 \(x-1=2\) → \(a=3\), \(m=4\). 합 7.</div>`,
  v:{ q:R`\(x>2\)일 때 \(\dfrac{x^2-4x+13}{x-2}\)가 \(x=a\)에서 최솟값 \(m\)을 가지면 \(a+m\)은?`, ch:['8','9','10','11','12'], a:3, hint:R`\((x-2)^2+9\).`, sol:R`<div class="step">\(m=6\), \(a=5\) → 11.</div>` } },
{ u:'ineq', id:'1187', tag:'분수식의 최댓값', c:'c3', t:130, src:MB('1187',207),
  q:R`\(x>-1\)인 실수 \(x\)에 대하여 \(\dfrac{x+1}{x^2+2x+10}\)이 \(x=a\)에서 최댓값 \(b\)를 가질 때, \(a+b\)의 값은?`, ch:[R`\(\dfrac56\)`,'1',R`\(\dfrac76\)`,'2',R`\(\dfrac{13}6\)`], a:4,
  hint:R`분자, 분모를 \(x+1\)로 나눠 보세요.`,
  sol:R`<div class="step">\(t=x+1>0\), 분모 \(=t^2+9\). 식 \(=\dfrac{1}{t+\dfrac9t}\).</div><div class="step">\(t+\dfrac9t\ge6\)이니 식 \(\le\dfrac16\). 등호 \(t=3\) → \(x=2\).</div><div class="step">\(a+b=2+\dfrac16=\dfrac{13}6\).</div>`,
  v:{ q:R`\(x>-2\)일 때 \(\dfrac{x+2}{x^2+4x+8}\)이 \(x=a\)에서 최댓값 \(b\)를 가지면 \(a+b\)는?`, ch:[R`\(\dfrac14\)`,R`\(\dfrac12\)`,R`\(\dfrac34\)`,'1',R`\(\dfrac54\)`], a:0, hint:R`\(t=x+2\).`, sol:R`<div class="step">\(\dfrac1{t+\frac4t}\le\dfrac14\), \(t=2\) → \(x=0\). \(0+\dfrac14\).</div>` } },
{ u:'ineq', id:'1188', tag:'두 문자의 최솟값', c:'c2', t:150, input:'13', src:MB('1188',207),
  q:R`두 양수 \(x, y\)에 대하여 \(x^2-4x+\dfrac{4y}{x}+\dfrac{9x}{y}\)는 \(x=\alpha,\ y=\beta\)일 때 최솟값 \(m\)을 갖는다. 이때 \(\alpha+\beta+m\)의 값을 구하시오.`,
  hint:R`\(\dfrac{4y}x+\dfrac{9x}y\)와 \(x^2-4x\)를 따로 최소로.`,
  sol:R`<div class="step">\(\dfrac{4y}x+\dfrac{9x}y\ge2\sqrt{36}=12\), 등호 \(2y=3x\).</div><div class="step">\(x^2-4x=(x-2)^2-4\ge-4\), 등호 \(x=2\).</div><div class="step">두 등호가 동시에: \(x=2,\ y=3\). \(m=8\). \(2+3+8=13\).</div>`,
  v:{ q:R`두 양수 \(x, y\)에 대하여 \(x^2-2x+\dfrac yx+\dfrac{16x}y\)가 \(x=\alpha, y=\beta\)에서 최솟값 \(m\)을 가질 때 \(\alpha+\beta+m\)을 구하시오.`, input:'12', hint:R`\(y=4x\), \(x=1\).`, sol:R`<div class="step">\(8+(-1)=7\), \(\alpha=1,\ \beta=4\). 합 12.</div>` } },

/* ---------- 함수 ---------- */
{ u:'func', id:'1240', tag:'공역과 치역이 같은 일차함수', c:'c3', t:90, src:MB('1240',219),
  q:R`집합 \(X=\{x\mid-2\le x\le3\}\)에 대하여 \(X\)에서 \(X\)로의 함수 \(f(x)=ax+b\)의 공역과 치역이 서로 같을 때, 상수 \(a, b\)에 대하여 \(b-a\)의 값은? (단, \(ab<0\))`, ch:['−3','−2','−1','1','2'], a:4,
  hint:R`\(a>0\)이면 양 끝이 그대로, \(a<0\)이면 양 끝이 뒤바뀌어 대응해요.`,
  sol:R`<div class="step">\(a>0\): \(f(-2)=-2,\ f(3)=3\) → \(a=1, b=0\) → \(ab=0\) ✘.</div><div class="step">\(a<0\): \(f(-2)=3,\ f(3)=-2\) → \(-2a+b=3,\ 3a+b=-2\) → \(a=-1,\ b=1\) ✔.</div><div class="step">\(b-a=2\).</div>`,
  v:{ q:R`\(X=\{x\mid1\le x\le4\}\)에서 \(X\)로의 \(f(x)=ax+b\)의 공역과 치역이 같고 \(ab<0\)일 때 \(a+b\)는?`, ch:['2','3','4','5','6'], a:2, hint:R`\(a<0\).`, sol:R`<div class="step">\(f(1)=4,\ f(4)=1\) → \(a=-1,\ b=5\). 합 4.</div>` } },
{ u:'func', id:'1241', tag:'이차함수의 치역', c:'c1', t:80, src:MB('1241',219),
  q:R`함수 \(f(x)=x^2-5x+a\)의 정의역이 \(\{x\mid0\le x\le6\}\)이고 치역이 \(\left\{y\,\middle|\,-\dfrac14\le y\le b\right\}\)일 때, 상수 \(a, b\)에 대하여 \(a+b\)의 값은?`, ch:['6','10','14','18','22'], a:3,
  hint:R`꼭짓점 \(x=\dfrac52\)에서 최솟값, 꼭짓점에서 더 먼 끝점에서 최댓값.`,
  sol:R`<div class="step">\(f(x)=\left(x-\dfrac52\right)^2+a-\dfrac{25}4\). 최솟값 \(a-\dfrac{25}4=-\dfrac14\) → \(a=6\).</div><div class="step">최댓값은 꼭짓점에서 먼 \(x=6\): \(36-30+6=12=b\).</div><div class="step">\(a+b=18\).</div>`,
  v:{ q:R`\(f(x)=x^2-4x+a\)의 정의역이 \(\{x\mid0\le x\le5\}\), 치역이 \(\{y\mid-1\le y\le b\}\)일 때 \(a+b\)는?`, ch:['9','10','11','12','13'], a:2, hint:R`꼭짓점 \(x=2\).`, sol:R`<div class="step">\(a-4=-1\) → \(a=3\). \(f(5)=8=b\). 합 11.</div>` } },
{ u:'func', id:'1242', tag:'치역으로 미지수 찾기', c:'c1', t:150, input:'3', src:MB('1242',219),
  q:R`집합 \(X=\{-2,1,a\}\)에서 실수 전체의 집합으로의 함수 \(f(x)=bx^2-2bx+3\)의 치역이 \(\{-5,4\}\)일 때, 두 실수 \(a, b\)에 대하여 \(a+b\)의 값을 구하시오. (단, \(a\ne-2,\ a\ne1\))`,
  hint:R`\(f(1)\)과 \(f(-2)\)를 \(b\)로 나타내고, 둘 다 \(\{-5,4\}\) 안에 있어야 해요.`,
  sol:R`<div class="step">\(f(1)=3-b\), \(f(-2)=8b+3\). \(b\ne0\)이면 두 값이 달라서 하나는 \(-5\), 하나는 4.</div><div class="step">\(f(1)=4\) → \(b=-1\) → \(f(-2)=-5\) ✔. (\(f(1)=-5\)이면 \(b=8\), \(f(-2)=67\) ✘)</div><div class="step">\(f(a)=-a^2+2a+3\in\{-5,4\}\). \(=4\)면 \(a=1\) ✘, \(=-5\)면 \(a^2-2a-8=0\) → \(a=4\) (\(-2\) 제외).</div><div class="step">\(a+b=3\).</div>`,
  v:{ q:R`\(X=\{-1,1,a\}\)에서 정의된 \(f(x)=bx^2-2bx+1\)의 치역이 \(\{-1,7\}\)일 때 \(a+b\)를 구하시오. (단, \(a\ne\pm1\))`, input:'5', hint:R`\(f(1)=1-b\), \(f(-1)=1+3b\).`, sol:R`<div class="step">\(f(1)=-1\) → \(b=2\), \(f(-1)=7\) ✔. \(2a^2-4a+1=7\) → \(a=3\). 합 5.</div>` } },
{ u:'func', id:'1244', tag:'서로 같은 함수', c:'c2', t:80, src:MB('1244',219),
  q:R`집합 \(X=\{-1,0,1\}\)을 정의역으로 하는 두 함수 \(f, g\)에 대하여 다음 중 \(f=g\)인 것이 성립하지 않는 것은? (단, 공역은 실수 전체의 집합이다.)`,
  ch:[R`\(f(x)=3x^2+3,\ g(x)=3\left|2x^2-\dfrac12\right|+\dfrac32\)`,R`\(f(x)=|x|+1,\ g(x)=x^2+1\)`,R`\(f(x)=\dfrac{x+|x|}2,\ g(x)=\begin{cases}1&(x>0)\\0&(x\le0)\end{cases}\)`,R`\(f(x)=-|x|-1,\ g(x)=x^3-1\)`,R`\(f(x)=x-2,\ g(x)=\dfrac{x^2-4}{x+2}\)`], a:3,
  hint:R`\(-1, 0, 1\)을 하나씩 넣어 보세요.`,
  sol:R`<div class="step">④ \(x=1\): \(f(1)=-2\), \(g(1)=0\). 달라요.</div><div class="step">나머지는 세 값을 넣으면 모두 같아요. 예) ⑤는 \(x\ne-2\)에서 \(\dfrac{(x-2)(x+2)}{x+2}=x-2\).</div>`,
  v:{ q:R`\(X=\{-1,0,1\}\)에서 \(f=g\)가 아닌 것은?`, ch:[R`\(f=x^2,\ g=|x|\)`,R`\(f=x^3,\ g=x\)`,R`\(f=|x|-1,\ g=x^2-1\)`,R`\(f=x+1,\ g=x^2+1\)`,R`\(f=2x^2,\ g=x^2+|x|\)`], a:3, hint:R`\(-1\) 대입.`, sol:R`<div class="step">④ \(x=-1\): 0과 2.</div>` } },
{ u:'func', id:'1245', tag:'서로 같은 함수의 미정계수', c:'c2', t:60, src:MB('1245',219),
  q:R`정의역이 \(\{-1,2\}\)에서 실수 전체의 집합으로의 두 함수 \(f(x)=x^2+ax,\ g(x)=x+b\)에 대하여 \(f=g\)일 때, 상수 \(a, b\)에 대하여 \(a+b\)의 값은?`, ch:['−3','−2','2','3','5'], a:2,
  hint:R`\(f(-1)=g(-1)\), \(f(2)=g(2)\).`,
  sol:R`<div class="step">\(1-a=-1+b\), \(4+2a=2+b\).</div><div class="step">빼면 \(-3-3a=-3\) → \(a=0\), \(b=2\). 합 2.</div>`,
  v:{ q:R`정의역 \(\{-2,1\}\)에서 \(f(x)=x^2+ax\), \(g(x)=2x+b\)가 같을 때 \(a+b\)는?`, ch:['3','4','5','6','7'], a:2, hint:R`두 점 대입.`, sol:R`<div class="step">\(1+a=2+b\), \(4-2a=-4+b\) → \(a=3,\ b=2\). 5.</div>` } },
{ u:'func', id:'1246', tag:'서로 같은 함수의 미정계수', c:'c2', t:60, src:MB('1246',219),
  q:R`집합 \(X=\{-1,0,1\}\)에서 실수 전체의 집합 \(R\)로의 함수 \(f(x)=x^3+2a\), \(g(x)=ax+b\)에 대하여 두 함수 \(f, g\)가 서로 같도록 하는 상수 \(a, b\)에 대하여 \(ab\)의 값은?`, ch:['−2','−1','2','4','6'], a:2,
  hint:R`\(x=0\)부터 넣으면 쉬워요.`,
  sol:R`<div class="step">\(x=0\): \(2a=b\). \(x=1\): \(1+2a=a+b\) → \(1+2a=3a\) → \(a=1,\ b=2\).</div><div class="step">\(x=-1\): \(-1+2=1\), \(-1+2=1\) ✔. \(ab=2\).</div>`,
  v:{ q:R`\(X=\{-1,0,1\}\)에서 \(f(x)=x^3+a\), \(g(x)=bx+1\)이 같을 때 \(a+b\)는?`, ch:['0','1','2','3','4'], a:2, hint:R`\(x=0\).`, sol:R`<div class="step">\(a=1\), \(x=1\): \(2=b+1\) → \(b=1\). 합 2.</div>` } },

/* ---------- 합성·역함수 ---------- */
{ u:'inv', id:'1465', tag:'역함수 성질로 간단히', c:'c3', t:80, src:MB('1465',255),
  q:R`두 함수 \(f(x)=2x-3,\ g(x)=-x+1\)에 대하여 \((f\circ(g\circ f)^{-1}\circ f)(1)\)의 값은?`, ch:['−2','−1','0','1','2'], a:4,
  hint:R`\((g\circ f)^{-1}=f^{-1}\circ g^{-1}\). \(f\circ f^{-1}\)은 지워져요.`,
  sol:R`<div class="step">\(f\circ f^{-1}\circ g^{-1}\circ f=g^{-1}\circ f\).</div><div class="step">\(f(1)=-1\), \(g^{-1}(-1)=k\) ⟺ \(-k+1=-1\) → \(k=2\).</div>`,
  v:{ q:R`\(f(x)=3x+1,\ g(x)=x-2\)일 때 \((f\circ(g\circ f)^{-1}\circ f)(2)\)는?`, ch:['5','7','9','11','13'], a:2, hint:R`\(g^{-1}(f(2))\).`, sol:R`<div class="step">\(f(2)=7\), \(g^{-1}(7)=9\).</div>` } },
{ u:'inv', id:'1466', tag:'역함수 성질로 방정식', c:'c3', t:90, input:'5', src:MB('1466',255),
  q:R`함수 \(f(x)=4x\)와 함수 \(g(x)=2x-1\)에 대하여 \((f\circ(f\circ g)^{-1}\circ f)(k)=12\)를 만족시키는 상수 \(k\)의 값을 구하시오.`,
  hint:R`\((f\circ g)^{-1}=g^{-1}\circ f^{-1}\).`,
  sol:R`<div class="step">\(f\circ g^{-1}\circ f^{-1}\circ f=f\circ g^{-1}\).</div><div class="step">\(f(g^{-1}(k))=4g^{-1}(k)=12\) → \(g^{-1}(k)=3\) → \(k=g(3)=5\).</div>`,
  v:{ q:R`\(f(x)=2x\), \(g(x)=x+3\)에 대하여 \((f\circ(f\circ g)^{-1}\circ f)(k)=8\)인 \(k\)를 구하시오.`, input:'7', hint:R`\(f(g^{-1}(k))=8\).`, sol:R`<div class="step">\(g^{-1}(k)=4\) → \(k=7\).</div>` } },
{ u:'inv', id:'1467', tag:'자기 자신이 역함수 (학력평가)', c:'c4', t:150, src:MB('1467',255)+' · 2023년 11월 고1 학력평가',
  q:R`실수 전체의 집합에서 정의된 함수 \(f(x)\)가 역함수를 갖는다. 모든 실수 \(x\)에 대하여 \(f(x)=f^{-1}(x)\), \(f(x^2+1)=-2x^2+1\)일 때, \(f(-2)\)의 값은?`, ch:[R`\(\dfrac32\)`,'2',R`\(\dfrac52\)`,'3',R`\(\dfrac72\)`], a:2,
  hint:R`\(f(-2)=a\) ⟺ \(f^{-1}(-2)=a\) ⟺ \(f(a)=-2\).`,
  sol:R`<div class="step">\(t=x^2+1\ge1\)이면 \(f(t)=-2(t-1)+1=-2t+3\).</div><div class="step">\(f=f^{-1}\)이니 \(f(-2)=a\) ⟺ \(f(a)=-2\). \(-2a+3=-2\) → \(a=\dfrac52\ (\ge1\ ✔)\).</div>`,
  v:{ q:R`역함수를 갖는 \(f\)가 \(f=f^{-1}\), \(f(x^2+2)=-x^2+1\)을 만족시킬 때 \(f(-1)\)은?`, ch:['1','2','3','4','5'], a:3, hint:R`\(t\ge2\)에서 \(f(t)=-t+3\).`, sol:R`<div class="step">\(f(a)=-1\) → \(a=4\). \(f(-1)=4\).</div>` } },
{ u:'inv', id:'1468', tag:'일대일대응과 역함수 (학력평가)', c:'c2', t:150, input:'12', src:MB('1468',255)+' · 2018년 10월 고3 학력평가',
  q:R`두 집합 \(X=\{1,2,3,4\},\ Y=\{2,4,6,8\}\)에 대하여 함수 \(f: X\to Y\)가 다음 조건을 만족시킨다.<div class="key">(가) 함수 \(f\)는 일대일대응이다.<br>(나) \(f(1)\ne2\)<br>(다) 등식 \(\dfrac12f(a)=(f\circ f^{-1})(a)\)를 만족시키는 \(a\)의 개수는 2이다.</div>\(f(2)\times f^{-1}(2)\)의 값을 구하시오.`,
  hint:R`\((f\circ f^{-1})(a)=a\)이고, \(a\)는 \(X\)와 \(Y\)에 동시에 있어야 해요.`,
  sol:R`<div class="step">\(f^{-1}(a)\)가 있으려면 \(a\in Y\), \(f(a)\)가 있으려면 \(a\in X\) → \(a\in\{2,4\}\).</div><div class="step">\(\dfrac12f(a)=a\) → \(f(a)=2a\). 개수가 2이니 \(f(2)=4,\ f(4)=8\).</div><div class="step">남은 \(f(1), f(3)\in\{2,6\}\), \(f(1)\ne2\) → \(f(1)=6,\ f(3)=2\).</div><div class="step">\(f(2)\times f^{-1}(2)=4\times3=12\).</div>`,
  v:{ q:R`\(X=\{1,2,3\}\), \(Y=\{2,4,6\}\)에서 일대일대응 \(f\)가 \(f(1)\ne2\), \(\dfrac12f(a)=(f\circ f^{-1})(a)\)를 만족시키는 \(a\)가 1개일 때 \(f(1)+f^{-1}(2)\)를 구하시오.`, input:'9', hint:R`\(a=2\)만 가능.`, sol:R`<div class="step">\(f(2)=4\), \(f(1)=6\), \(f(3)=2\). \(6+3=9\).</div>` } },

/* ---------- 유리식·유리함수 ---------- */
{ u:'rat', id:'1562', tag:'a+b+c=0 이용', c:'c1', t:80, input:'-3', src:MB('1562',271),
  q:R`0이 아닌 세 실수 \(a, b, c\)에 대하여 \(a+b+c=0\)일 때, \(a\left(\dfrac1b+\dfrac1c\right)+b\left(\dfrac1c+\dfrac1a\right)+c\left(\dfrac1a+\dfrac1b\right)\)의 값을 구하시오.`,
  hint:R`분모가 같은 것끼리 묶어 보세요.`,
  sol:R`<div class="step">분모별로 묶으면 \(\dfrac{b+c}a+\dfrac{c+a}b+\dfrac{a+b}c\).</div><div class="step">\(b+c=-a\) 등을 넣으면 \(-1-1-1=-3\).</div>`,
  v:{ q:R`0이 아닌 \(a, b, c\)에 대하여 \(a+b+c=0\)일 때 \(\dfrac{(a+b)(b+c)(c+a)}{abc}\)의 값을 구하시오.`, input:'-1', hint:R`\(a+b=-c\).`, sol:R`<div class="step">\(\dfrac{(-c)(-a)(-b)}{abc}=-1\).</div>` } },
{ u:'rat', id:'1563', tag:'1/a+1/b+1/c=0 이용', c:'c1', t:100, src:MB('1563',271),
  q:R`세 실수 \(a, b, c\)가 \(\dfrac1a+\dfrac1b+\dfrac1c=0\)을 만족시킬 때, \(\dfrac{a}{(a+b)(c+a)}+\dfrac{b}{(b+c)(a+b)}+\dfrac{c}{(c+a)(b+c)}\)의 값은? (단, \(abc\ne0\))`, ch:['−3','−2','0','1','2'], a:2,
  hint:R`조건을 통분하면 \(ab+bc+ca=0\).`,
  sol:R`<div class="step">통분: 분자 \(=a(b+c)+b(c+a)+c(a+b)=2(ab+bc+ca)\).</div><div class="step">조건에서 \(ab+bc+ca=0\) → 값 0.</div>`,
  v:{ q:R`\(\dfrac1a+\dfrac1b+\dfrac1c=0\)일 때 \(\dfrac{(a+b+c)^2}{a^2+b^2+c^2}\)의 값은?`, ch:['−1','0','1','2','3'], a:2, hint:R`\(ab+bc+ca=0\).`, sol:R`<div class="step">\((a+b+c)^2=a^2+b^2+c^2\) → 1.</div>` } },
{ u:'rat', id:'1564', tag:'a+b+c=0 이용 (학력평가)', c:'c1', t:60, src:MB('1564',271)+' · 2012년 3월 고2 학력평가',
  q:R`\(abc\ne0\)인 세 실수 \(a, b, c\)에 대하여 \(a+b+c=0\)일 때, \(\dfrac{b+c}a+\dfrac{c+a}b+\dfrac{a+b}c\)의 값은?`, ch:['−5','−4','−3','−2','−1'], a:2,
  hint:R`분자를 바꿔요.`, sol:R`<div class="step">\(\dfrac{-a}a+\dfrac{-b}b+\dfrac{-c}c=-3\).</div>`,
  v:{ q:R`\(a+b+c=0\), \(abc\ne0\)일 때 \(\dfrac{a^2}{bc}+\dfrac{b^2}{ca}+\dfrac{c^2}{ab}\)의 값은?`, ch:['−3','−1','0','1','3'], a:4, hint:R`\(\dfrac{a^3+b^3+c^3}{abc}\), \(a^3+b^3+c^3=3abc\).`, sol:R`<div class="step">3.</div>` } },
{ u:'rat', id:'1565', tag:'비례식이 주어진 유리식', c:'c1', t:70, src:MB('1565',271),
  q:R`0이 아닌 세 실수 \(x, y, z\)에 대하여 \(2x=3y,\ 2y=3z\)가 성립할 때, \(\dfrac{x+2y-3z}{2x+y-3z}\)의 값은?`, ch:[R`\(\dfrac34\)`,R`\(\dfrac45\)`,'1',R`\(\dfrac32\)`,R`\(\dfrac53\)`], a:0,
  hint:R`분수가 안 나오게 \(x\)를 정해서 대입해 보세요.`,
  sol:R`<div class="step">\(y=\dfrac23x,\ z=\dfrac23y=\dfrac49x\). \(x=9\)로 두면 \(y=6,\ z=4\).</div><div class="step">\(\dfrac{9+12-12}{18+6-12}=\dfrac9{12}=\dfrac34\).</div>`,
  v:{ q:R`\(3x=2y,\ 3y=2z\)일 때 \(\dfrac{x+y-z}{x-y+z}\)는?`, ch:[R`\(\dfrac17\)`,R`\(\dfrac27\)`,R`\(\dfrac37\)`,R`\(\dfrac12\)`,'1'], a:0, hint:R`\(x=4\).`, sol:R`<div class="step">\(x=4, y=6, z=9\): \(\dfrac{1}{7}\).</div>` } },
{ u:'rat', id:'1566', tag:'비례식 (k로 놓기)', c:'c1', t:100, src:MB('1566',271),
  q:R`0이 아닌 세 실수 \(x, y, z\)에 대하여 \((x+y):(y+z):(z+x)=3:4:5\)일 때, \(\dfrac{x^2+y^2+z^2}{xy+yz+zx}\)의 값은?`, ch:[R`\(\dfrac{13}{10}\)`,R`\(\dfrac{14}{11}\)`,R`\(\dfrac{15}{11}\)`,R`\(\dfrac{16}{11}\)`,R`\(\dfrac{17}{13}\)`], a:1,
  hint:R`\(x+y=3k\) 등으로 놓고 세 식을 다 더해요.`,
  sol:R`<div class="step">\(x+y=3k,\ y+z=4k,\ z+x=5k\). 더하면 \(x+y+z=6k\).</div><div class="step">\(z=3k,\ x=2k,\ y=k\).</div><div class="step">\(\dfrac{4+1+9}{2+3+6}=\dfrac{14}{11}\).</div>`,
  v:{ q:R`\((x+y):(y+z):(z+x)=4:5:3\)일 때 \(\dfrac{xy+yz+zx}{x^2}\)는?`, ch:['9','10','11','12','14'], a:2, hint:R`\(x+y+z=6k\).`, sol:R`<div class="step">\(z=2k, x=k, y=3k\): \(\dfrac{3+6+2}{1}=11\).</div>` } },
{ u:'rat', id:'1567', tag:'연립방정식으로 비 구하기', c:'c1', t:100, src:MB('1567',271),
  q:R`0이 아닌 세 실수 \(x, y, z\)에 대하여 \(x+2y-z=0,\ 2x-y-z=0\)을 만족시킬 때, \(\dfrac{xy+yz+zx}{x^2+y^2+z^2}\)의 값은?`, ch:[R`\(\dfrac{23}{35}\)`,R`\(\dfrac57\)`,R`\(\dfrac{27}{35}\)`,R`\(\dfrac{29}{35}\)`,R`\(\dfrac{31}{35}\)`], a:0,
  hint:R`두 식을 빼서 \(z\)를 없애요.`,
  sol:R`<div class="step">빼면 \(-x+3y=0\) → \(x=3y\), \(z=x+2y=5y\). \(y=1\): \((3,1,5)\).</div><div class="step">\(\dfrac{3+5+15}{9+1+25}=\dfrac{23}{35}\).</div>`,
  v:{ q:R`\(x+y-z=0,\ 2x-y-2z=0\)일 때 \(\dfrac{xy+yz+zx}{x^2+y^2+z^2}\)는? (\(x, z\ne0\))`, ch:[R`\(\dfrac13\)`,R`\(\dfrac12\)`,R`\(\dfrac23\)`,'1',R`\(\dfrac32\)`], a:1, hint:R`더하면 \(x=z\).`, sol:R`<div class="step">\(x=z\), \(y=0\): \(\dfrac{z^2}{2z^2}=\dfrac12\).</div>` } },
{ u:'rat', id:'1636', tag:'치역으로 정의역 찾기', c:'c3', t:130, input:'5', src:MB('1636',283),
  q:R`함수 \(y=\dfrac{2x+2}{x+2}\)의 치역이 \(\left\{y\,\middle|\,y\le\dfrac32\ 또는\ y\ge4\right\}\)일 때, 정의역에 속하는 모든 정수의 개수를 구하시오.`,
  hint:R`\(y=2-\dfrac2{x+2}\). 그래프에서 \(y=\dfrac32\), \(y=4\)가 되는 \(x\)를 찾아요.`,
  sol:R`<div class="step">\(y=2-\dfrac{2}{x+2}\). \(y=\dfrac32\)이면 \(x=2\), \(y=4\)이면 \(x=-3\).</div><div class="step">점근선 \(x=-2\) 기준 오른쪽 가지는 증가해서 \(y<2\): \(y\le\dfrac32\) ⟺ \(-2<x\le2\). 왼쪽 가지는 \(y>2\): \(y\ge4\) ⟺ \(-3\le x<-2\).</div><div class="step">정수: \(-3, -1, 0, 1, 2\) → 5개.</div>`,
  v:{ q:R`\(y=\dfrac{x+3}{x+1}\)의 치역이 \(\{y\mid y\le0\ 또는\ y\ge3\}\)일 때 정의역에 속하는 정수의 개수를 구하시오.`, input:'3', hint:R`\(y=1+\dfrac2{x+1}\).`, sol:R`<div class="step">\(y\ge3\): \(-1<x\le0\). \(y\le0\): \(-3\le x<-1\). 정수 \(-3,-2,0\) → 3.</div>` } },
{ u:'rat', id:'1637', tag:'제한된 정의역의 최대·최소', c:'c3', t:70, src:MB('1637',283),
  q:R`함수 \(y=\dfrac{3x+2}{x+2}\)의 정의역이 \(\{x\mid-1\le x\le1\}\)일 때, 최댓값을 \(M\), 최솟값을 \(m\)이라 할 때, \(M+m\)의 값은?`, ch:[R`\(\dfrac13\)`,R`\(\dfrac23\)`,'1',R`\(\dfrac53\)`,'2'], a:1,
  hint:R`\(3-\dfrac{4}{x+2}\): 증가함수.`,
  sol:R`<div class="step">\(y=3-\dfrac4{x+2}\), \(x>-2\)에서 증가.</div><div class="step">\(m=f(-1)=-1\), \(M=f(1)=\dfrac53\). 합 \(\dfrac23\).</div>`,
  v:{ q:R`\(y=\dfrac{2x+1}{x+1}\)의 정의역이 \(\{x\mid0\le x\le2\}\)일 때 \(M+m\)은?`, ch:['2',R`\(\dfrac73\)`,R`\(\dfrac83\)`,'3',R`\(\dfrac{10}3\)`], a:2, hint:R`\(2-\dfrac1{x+1}\).`, sol:R`<div class="step">\(1+\dfrac53=\dfrac83\).</div>` } },
{ u:'rat', id:'1638', tag:'치역으로 미지수 구하기', c:'c3', t:70, src:MB('1638',283),
  q:R`정의역이 \(\{x\mid2\le x\le a\}\)인 함수 \(y=\dfrac{3x+1}{x-1}\)의 치역이 \(\{y\mid4\le y\le b\}\)일 때, 상수 \(a, b\)에 대하여 \(a+b\)의 값은?`, ch:['10','12','14','16','18'], a:1,
  hint:R`\(3+\dfrac4{x-1}\): 감소함수.`,
  sol:R`<div class="step">\(y=3+\dfrac4{x-1}\), \(x>1\)에서 감소. \(b=f(2)=7\).</div><div class="step">\(f(a)=4\) → \(\dfrac4{a-1}=1\) → \(a=5\). 합 12.</div>`,
  v:{ q:R`정의역 \(\{x\mid3\le x\le a\}\)인 \(y=\dfrac{2x+2}{x-2}\)의 치역이 \(\{y\mid3\le y\le b\}\)일 때 \(a+b\)는?`, ch:['12','14','16','18','20'], a:2, hint:R`\(2+\dfrac6{x-2}\).`, sol:R`<div class="step">\(b=8\), \(a=8\). 16.</div>` } },
{ u:'rat', id:'1639', tag:'최솟값으로 최댓값 구하기', c:'c3', t:70, src:MB('1639',283),
  q:R`정의역이 \(\{x\mid-1\le x\le2\}\)인 함수 \(f(x)=\dfrac{2}{3-x}+k\)의 최솟값이 2일 때, 함수 \(f(x)\)의 최댓값은? (단, \(k\)는 상수이다.)`, ch:['3',R`\(\dfrac72\)`,'4',R`\(\dfrac92\)`,'5'], a:1,
  hint:R`\(x<3\)에서 \(3-x\)가 줄어들수록 값이 커져요(증가함수).`,
  sol:R`<div class="step">\(f\)는 \(x<3\)에서 증가. 최솟값 \(f(-1)=\dfrac12+k=2\) → \(k=\dfrac32\).</div><div class="step">최댓값 \(f(2)=2+\dfrac32=\dfrac72\).</div>`,
  v:{ q:R`정의역 \(\{x\mid1\le x\le3\}\)인 \(f(x)=\dfrac{3}{4-x}+k\)의 최솟값이 2일 때 최댓값은?`, ch:['3',R`\(\dfrac72\)`,'4',R`\(\dfrac92\)`,'5'], a:2, hint:R`증가함수.`, sol:R`<div class="step">\(1+k=2\) → \(k=1\), \(f(3)=4\).</div>` } },
{ u:'rat', id:'1641', tag:'최대·최소로 미지수 구하기', c:'c3', t:100, src:MB('1641',283),
  q:R`정의역이 \(\{x\mid3\le x\le a\}\)인 함수 \(f(x)=\dfrac{3x+k}{x-2}\)의 최댓값이 11, 최솟값이 4일 때, 상수 \(a, k\)에 대하여 \(k+a\)의 값은? (단, \(k\ne-6\))`, ch:['4','6','10','12','14'], a:3,
  hint:R`\(3+\dfrac{k+6}{x-2}\). 최솟값 4 > 3이니 감소함수 쪽.`,
  sol:R`<div class="step">\(f=3+\dfrac{k+6}{x-2}\). 값이 3보다 크니 \(k+6>0\), 감소함수.</div><div class="step">최댓값 \(f(3)=9+k=11\) → \(k=2\). 최솟값 \(f(a)=3+\dfrac8{a-2}=4\) → \(a=10\).</div><div class="step">\(k+a=12\).</div>`,
  v:{ q:R`정의역 \(\{x\mid2\le x\le a\}\)인 \(f(x)=\dfrac{2x+k}{x-1}\)의 최댓값 8, 최솟값 3일 때 \(k+a\)는?`, ch:['9','10','11','12','13'], a:2, hint:R`\(2+\dfrac{k+2}{x-1}\).`, sol:R`<div class="step">\(4+k=8\) → \(k=4\). \(2+\dfrac6{a-1}=3\) → \(a=7\). 11.</div>` } },
{ u:'rat', id:'1642', tag:'구간이 문자로 주어진 최대·최소', c:'c3', t:130, src:MB('1642',283),
  q:R`\(a\le x\le a+2\)에서 함수 \(f(x)=\dfrac{4x-5}{2x-3}\)의 최솟값이 \(\dfrac{11}5\)일 때, \(f(x)\)의 최댓값은? (단, \(a\)는 상수이다.)`, ch:[R`\(\dfrac52\)`,'3',R`\(\dfrac92\)`,'5',R`\(\dfrac{11}2\)`], a:1,
  hint:R`\(f=2+\dfrac{1}{2x-3}\). 최솟값이 2보다 크다 → 점근선 오른쪽 구간.`,
  sol:R`<div class="step">\(f=2+\dfrac1{2x-3}\). \(\dfrac{11}5>2\)이니 구간은 \(x>\dfrac32\) 쪽, 거기서 감소.</div><div class="step">최솟값 \(f(a+2)=2+\dfrac1{2a+1}=\dfrac{11}5\) → \(a=2\).</div><div class="step">최댓값 \(f(2)=3\).</div>`,
  v:{ q:R`\(a\le x\le a+1\)에서 \(f(x)=\dfrac{3x-1}{x-1}\)의 최솟값이 \(\dfrac72\)일 때 최댓값은?`, ch:[R`\(\dfrac{10}3\)`,R`\(\dfrac{11}3\)`,'4',R`\(\dfrac{13}3\)`,'5'], a:1, hint:R`\(3+\dfrac2{x-1}\).`, sol:R`<div class="step">\(3+\dfrac2a=\dfrac72\) → \(a=4\). \(f(4)=\dfrac{11}3\).</div>` } },

/* ---------- 무리함수 ---------- */
{ u:'irr', id:'1758', tag:'무리함수의 정의역과 치역', c:'c2', t:40, src:MB('1758',303),
  q:R`함수 \(y=-\sqrt{2x-6}+2\)의 정의역과 치역은?`, ch:[R`정의역 \(x\le3\), 치역 \(y\ge2\)`,R`정의역 \(x\ge3\), 치역 \(y\le2\)`,R`정의역 \(x\le-3\), 치역 \(y\ge2\)`,R`정의역 \(x\ge-3\), 치역 \(y\le-2\)`,R`정의역 \(x\ge\dfrac13\), 치역 \(y\ge2\)`], a:1,
  hint:R`\(\sqrt{2(x-3)}\)로 묶어요.`, sol:R`<div class="step">\(2x-6\ge0\) → \(x\ge3\). 근호 앞 \(-\)라 \(y\le2\).</div>`,
  v:{ q:R`\(y=\sqrt{-3x+6}-1\)의 정의역과 치역은?`, ch:[R`\(x\ge2,\ y\ge-1\)`,R`\(x\le2,\ y\ge-1\)`,R`\(x\le2,\ y\le-1\)`,R`\(x\le-2,\ y\ge-1\)`,R`\(x\ge-2,\ y\le1\)`], a:1, hint:R`\(-3(x-2)\ge0\).`, sol:R`<div class="step">\(x\le2\), \(y\ge-1\).</div>` } },
{ u:'irr', id:'1759', tag:'정의역·치역으로 미지수', c:'c2', t:60, src:MB('1759',303),
  q:R`무리함수 \(f(x)=-\sqrt{ax+2}+3\)의 정의역이 \(\{x\mid x\le2\}\)이고 치역이 \(\{y\mid y\le b\}\)일 때, \(f(a+b)\)의 값은?`, ch:['1','2','3','4','5'], a:2,
  hint:R`왼쪽으로 뻗으니 \(a<0\), \(-\dfrac2a=2\).`,
  sol:R`<div class="step">\(a<0\), \(x\le-\dfrac2a=2\) → \(a=-1\). \(b=3\).</div><div class="step">\(f(2)=-0+3=3\).</div>`,
  v:{ q:R`\(f(x)=\sqrt{ax+9}+1\)의 정의역이 \(\{x\mid x\le3\}\), 치역이 \(\{y\mid y\ge b\}\)일 때 \(a+b\)는?`, ch:['−4','−3','−2','−1','0'], a:2, hint:R`\(-\dfrac9a=3\).`, sol:R`<div class="step">\(a=-3,\ b=1\) → \(-2\).</div>` } },
{ u:'irr', id:'1760', tag:'조건으로 무리함수 결정', c:'c2', t:80, src:MB('1760',303),
  q:R`함수 \(f(x)=-\sqrt{ax+b}+c\)의 정의역이 \(\{x\mid x\le3\}\), 치역이 \(\{y\mid y\le2\}\)이고 \(f(1)=0\)일 때, 상수 \(a, b, c\)에 대하여 \(a+b+c\)의 값은?`, ch:['2','4','6','8','10'], a:2,
  hint:R`\(ax+b=a(x-3)\), \(c=2\).`,
  sol:R`<div class="step">시작점 \((3,2)\): \(f(x)=-\sqrt{a(x-3)}+2\) (\(a<0\)), \(b=-3a\), \(c=2\).</div><div class="step">\(f(1)=-\sqrt{-2a}+2=0\) → \(a=-2\), \(b=6\).</div><div class="step">\(-2+6+2=6\).</div>`,
  v:{ q:R`\(f(x)=\sqrt{ax+b}+c\)의 정의역이 \(\{x\mid x\ge2\}\), 치역이 \(\{y\mid y\ge-1\}\), \(f(4)=1\)일 때 \(a+b+c\)는?`, ch:['−5','−4','−3','−2','−1'], a:2, hint:R`\(\sqrt{a(x-2)}-1\).`, sol:R`<div class="step">\(\sqrt{2a}=2\) → \(a=2,\ b=-4,\ c=-1\). \(-3\).</div>` } },
{ u:'irr', id:'1761', tag:'점근선과 무리함수의 정의역', c:'c2', t:60, src:MB('1761',303),
  q:R`함수 \(y=\dfrac{-6x+5}{x+2}\)의 그래프의 점근선의 방정식이 \(x=a,\ y=b\)일 때, 함수 \(y=\sqrt{ax+b}\)의 정의역은?`, ch:[R`\(\{x\mid x\le-3\}\)`,R`\(\{x\mid x\le-2\}\)`,R`\(\{x\mid x\le-1\}\)`,R`\(\{x\mid x\ge-3\}\)`,R`\(\{x\mid x\ge3\}\)`], a:0,
  hint:R`\(a=-2\), \(b=\dfrac{-6}{1}\).`,
  sol:R`<div class="step">\(a=-2\), \(b=-6\). \(-2x-6\ge0\) → \(x\le-3\).</div>`,
  v:{ q:R`\(y=\dfrac{3x-1}{x-1}\)의 점근선이 \(x=a,\ y=b\)일 때 \(y=\sqrt{ax+b}\)의 정의역은?`, ch:[R`\(x\ge-3\)`,R`\(x\le-3\)`,R`\(x\ge3\)`,R`\(x\ge-1\)`,R`\(x\le1\)`], a:0, hint:R`\(a=1,\ b=3\).`, sol:R`<div class="step">\(x+3\ge0\).</div>` } },
{ u:'irr', id:'1762', tag:'점근선 + 무리함수 결정', c:'c2', t:80, src:MB('1762',303),
  q:R`함수 \(y=\dfrac{6x+10}{x+2}\)의 그래프의 점근선의 방정식이 \(x=a,\ y=b\)이고, 함수 \(f(x)=\sqrt{ax+b}+c\)에 대하여 \(f(1)=-3\)일 때, 함수 \(f(x)\)의 정의역과 치역은?`, ch:[R`\(x\ge2,\ y\le5\)`,R`\(x\ge3,\ y\le-5\)`,R`\(x\le3,\ y\ge-5\)`,R`\(x\le3,\ y\le-2\)`,R`\(x\ge\dfrac13,\ y\ge-2\)`], a:2,
  hint:R`\(a=-2,\ b=6\).`,
  sol:R`<div class="step">\(a=-2,\ b=6\). \(f(1)=\sqrt4+c=-3\) → \(c=-5\).</div><div class="step">\(f(x)=\sqrt{-2(x-3)}-5\): 정의역 \(x\le3\), 치역 \(y\ge-5\).</div>`,
  v:{ q:R`\(y=\dfrac{2x-6}{x-1}\)의 점근선이 \(x=a,\ y=b\), \(f(x)=\sqrt{ax+b}+c\), \(f(2)=0\)일 때 \(f\)의 정의역과 치역은?`, ch:[R`\(x\ge-2,\ y\ge-2\)`,R`\(x\le-2,\ y\ge-2\)`,R`\(x\ge2,\ y\le2\)`,R`\(x\ge-2,\ y\le-2\)`,R`\(x\ge1,\ y\ge2\)`], a:0, hint:R`\(a=1,\ b=2\).`, sol:R`<div class="step">\(\sqrt{x+2}+c\), \(2+c=0\) → \(c=-2\).</div>` } },
{ u:'irr', id:'1763', tag:'두 무리함수로 둘러싸인 직사각형', c:'c2', t:100, input:'14', src:MB('1763',303),
  q:R`무리함수 \(y=\sqrt{3x-2}-1\)의 정의역과 치역이 각각 \(\{x\mid x\ge a\}\), \(\{y\mid y\ge b\}\)이고, 무리함수 \(y=-\sqrt{3-x}+5\)의 정의역과 치역이 각각 \(\{x\mid x\le c\}\), \(\{y\mid y\le d\}\)일 때, 네 직선 \(x=a,\ y=b,\ x=c,\ y=d\)로 둘러싸인 부분의 넓이를 구하시오.`,
  hint:R`\(a=\dfrac23\), \(b=-1\), \(c=3\), \(d=5\).`,
  sol:R`<div class="step">\(a=\dfrac23,\ b=-1,\ c=3,\ d=5\).</div><div class="step">가로 \(3-\dfrac23=\dfrac73\), 세로 6. 넓이 14.</div>`,
  v:{ q:R`\(y=\sqrt{2x-4}+1\)과 \(y=-\sqrt{6-x}+4\)의 정의역·치역 경계로 만든 네 직선이 둘러싼 넓이를 구하시오.`, input:'12', hint:R`\(x\ge2,\ y\ge1,\ x\le6,\ y\le4\).`, sol:R`<div class="step">\(4\times3=12\).</div>` } },
{ u:'irr', id:'1764', tag:'점을 지나는 무리함수의 치역 (학력평가)', c:'c2', t:70, src:MB('1764',303)+' · 2022년 3월 고2 학력평가',
  q:R`함수 \(y=-\sqrt{x-a}+a+2\)의 그래프가 점 \((a,-a)\)를 지날 때, 이 함수의 치역은? (단, \(a\)는 상수이다.)`, ch:[R`\(\{y\mid y\le1\}\)`,R`\(\{y\mid y\ge1\}\)`,R`\(\{y\mid y\le0\}\)`,R`\(\{y\mid y\le-1\}\)`,R`\(\{y\mid y\ge-1\}\)`], a:0,
  hint:R`\(x=a\)를 넣으면 근호가 0.`,
  sol:R`<div class="step">\(-0+a+2=-a\) → \(a=-1\). \(y=-\sqrt{x+1}+1\) → 치역 \(y\le1\).</div>`,
  v:{ q:R`\(y=\sqrt{x+a}-a+1\)의 그래프가 점 \((-a,3)\)을 지날 때 치역은?`, ch:[R`\(y\ge3\)`,R`\(y\le3\)`,R`\(y\ge-1\)`,R`\(y\ge1\)`,R`\(y\le-3\)`], a:0, hint:R`\(-a+1=3\).`, sol:R`<div class="step">\(a=-2\), 시작점 \(y=3\) → \(y\ge3\).</div>` } },
{ u:'irr', id:'1817', tag:'이차함수의 역함수인 무리함수', c:'c4', t:100, src:MB('1817',313),
  q:R`두 함수 \(y=\sqrt{x+a}+b\ (x\ge c)\), \(y=x^2-4x+1\ (x\ge2)\)의 그래프가 직선 \(y=x\)에 대하여 대칭일 때, 상수 \(a, b, c\)에 대하여 \(a+b+c\)의 값은?`, ch:['2','3','5','6','8'], a:0,
  hint:R`\(y=x\) 대칭 = 서로 역함수. 이차함수의 역함수를 구해요.`,
  sol:R`<div class="step">\(y=(x-2)^2-3\ (x\ge2)\): 치역 \(y\ge-3\).</div><div class="step">\(x, y\) 바꾸면 \(x=(y-2)^2-3\) → \(y=\sqrt{x+3}+2\ (x\ge-3)\).</div><div class="step">\(a=3,\ b=2,\ c=-3\) → 2.</div>`,
  v:{ q:R`\(y=\sqrt{x+a}+b\ (x\ge c)\)와 \(y=x^2-2x-1\ (x\ge1)\)이 \(y=x\)에 대칭일 때 \(a+b+c\)는?`, ch:['−1','0','1','2','3'], a:2, hint:R`\((x-1)^2-2\).`, sol:R`<div class="step">\(y=\sqrt{x+2}+1\ (x\ge-2)\) → \(2+1-2=1\).</div>` } },
{ u:'irr', id:'1818', tag:'역함수의 값으로 무리함수 결정', c:'c4', t:80, src:MB('1818',313),
  q:R`함수 \(f(x)=\sqrt{ax+b}\)의 역함수를 \(g(x)\)라 하자. \(f(2)=3,\ g(5)=10\)일 때, \(f(ab)\)의 값은? (단, \(a, b\)는 상수이고 \(a\ne0\))`, ch:['3','5','7','9','11'], a:1,
  hint:R`\(g(5)=10\) ⟺ \(f(10)=5\).`,
  sol:R`<div class="step">\(2a+b=9\), \(10a+b=25\) → \(a=2,\ b=5\).</div><div class="step">\(f(10)=\sqrt{25}=5\).</div>`,
  v:{ q:R`\(f(x)=\sqrt{ax+b}\)의 역함수 \(g\)에 대하여 \(f(2)=2,\ g(4)=6\)일 때 \(f(a+b)\)는?`, ch:['1','2','3','4','5'], a:0, hint:R`\(f(6)=4\).`, sol:R`<div class="step">\(2a+b=4,\ 6a+b=16\) → \(a=3,\ b=-2\). \(f(1)=1\).</div>` } },
{ u:'irr', id:'1819', tag:'함수와 역함수가 같은 점을 지남', c:'c4', t:100, src:MB('1819',313),
  q:R`무리함수 \(f(x)=\sqrt{ax+b}\ (a\ne0)\)에 대하여 함수 \(y=f(x)\)의 그래프와 그 역함수 \(y=f^{-1}(x)\)의 그래프가 모두 원 \(x^2+y^2-4x-6y+4=0\)의 중심을 지날 때, 상수 \(a, b\)에 대하여 \(a+b\)의 값은?`, ch:['14','15','16','17','18'], a:0,
  hint:R`원의 중심은 \((2,3)\). 역함수가 \((2,3)\)을 지나면 \(f\)는 \((3,2)\)를 지나요.`,
  sol:R`<div class="step">중심 \((2,3)\). \(f(2)=3\): \(2a+b=9\). \(f(3)=2\): \(3a+b=4\).</div><div class="step">\(a=-5,\ b=19\) → 14.</div>`,
  v:{ q:R`\(f(x)=\sqrt{ax+b}\)와 그 역함수의 그래프가 모두 원 \(x^2+y^2-2x-4y+1=0\)의 중심을 지날 때 \(ab\)는?`, ch:['−21','−12','−7','12','21'], a:0, hint:R`중심 \((1,2)\).`, sol:R`<div class="step">\(a+b=4,\ 2a+b=1\) → \(a=-3,\ b=7\). \(-21\).</div>` } },
{ u:'irr', id:'1821', tag:'무리함수 그래프의 성질 (옳지 않은 것)', c:'c2', t:120, src:MB('1821',313),
  q:R`함수 \(y=-\sqrt{-2x+1}+2\)에 대한 다음 설명 중 옳지 않은 것은?`,
  ch:[R`정의역은 \(\left\{x\,\middle|\,x\le\dfrac12\right\}\)이다.`,R`치역은 \(\{y\mid y\le2\}\)이다.`,R`그래프는 제4사분면을 지나지 않는다.`,R`그래프는 무리함수 \(y=\sqrt{-2x+1}-2\)의 그래프와 \(x\)축에 대하여 대칭이다.`,R`역함수는 \(y=-\dfrac12(x-2)^2-1\ \left(x\le\dfrac12\right)\)이다.`], a:4,
  hint:R`역함수의 정의역은 원래 함수의 치역이에요.`,
  sol:R`<div class="step">①② 맞아요. ③ 시작점 \(\left(\dfrac12,2\right)\)에서 왼쪽 아래로: \(0<x\le\dfrac12\)에서 \(y>0\)이라 4사분면 X. 맞아요.</div><div class="step">④ \(y\)에 \(-\)를 붙이면 \(y=\sqrt{-2x+1}-2\). 맞아요.</div><div class="step">⑤ \(x\)와 \(y\)를 바꾸면 \(-2x+1=(y-2)^2\)... 정리하면 역함수는 \(y=-\dfrac12(x-2)^2+\dfrac12\ (x\le2)\). 틀려요.</div>`,
  v:{ q:R`\(y=\sqrt{-x+2}-1\)에 대한 설명 중 옳지 않은 것은?`, ch:[R`정의역은 \(x\le2\)`,R`치역은 \(y\ge-1\)`,R`제3사분면을 지나지 않는다`,R`\(y=-\sqrt{-x+2}+1\)과 \(x\)축 대칭`,R`역함수는 \(y=(x+1)^2+2\ (x\ge-1)\)`], a:4, hint:R`역함수 식을 직접 구해요.`, sol:R`<div class="step">역함수: \(x+1=\sqrt{-y+2}\) → \(y=-(x+1)^2+2\ (x\ge-1)\). ⑤ 틀림.</div>` } },
{ u:'irr', id:'1822', tag:'무리함수 그래프의 성질 (옳은 것)', c:'c2', t:120, src:MB('1822',313),
  q:R`함수 \(y=-\sqrt{2x+4}+3\)에 대한 설명으로 옳은 것은?`,
  ch:[R`정의역은 \(\{x\mid x\ge0\}\)이다.`,R`치역은 \(\{y\mid y\ge3\}\)이다.`,R`그래프는 제1, 2, 4사분면을 지난다.`,R`그래프는 함수 \(y=\dfrac12(x-3)^2-2\ (x\ge3)\)의 그래프와 직선 \(y=x\)에 대하여 대칭이다.`,R`그래프는 함수 \(y=-\sqrt{2x}\)의 그래프를 \(x\)축 방향으로 2만큼, \(y\)축 방향으로 3만큼 평행이동한 것이다.`], a:2,
  hint:R`\(\sqrt{2(x+2)}\)로 묶으면 시작점 \((-2,3)\).`,
  sol:R`<div class="step">시작점 \((-2,3)\), 오른쪽 아래로. 정의역 \(x\ge-2\), 치역 \(y\le3\) → ①② 틀림.</div><div class="step">③ 2사분면에서 출발, \(x=0\)일 때 \(y=1\) (1사분면), \(x=\dfrac52\)에서 \(x\)축을 지나 4사분면. 맞음.</div><div class="step">④ 역함수는 \(y=\dfrac12(x-3)^2-2\ (x\le3)\)이라 틀림. ⑤ \(x\)축 방향으로 \(-2\)만큼이라 틀림.</div>`,
  v:{ q:R`\(y=\sqrt{-x+3}-2\)에 대한 설명으로 옳은 것은?`, ch:[R`정의역은 \(x\ge3\)`,R`치역은 \(y\le-2\)`,R`제2, 3, 4사분면을 지난다`,R`\(y=\sqrt{-x}\)를 \(x\)축 방향으로 \(-3\)만큼 옮긴 것`,R`역함수는 \(y=(x+2)^2+3\)`], a:2, hint:R`시작점 \((3,-2)\)에서 왼쪽 위로.`, sol:R`<div class="step">\(x=-1\)에서 \(x\)축을 지나요. 4사분면(0<x<3), 3사분면(−1<x<0), 2사분면(x<−1). ③.</div>` } },
{ u:'irr', id:'1823', tag:'함수와 역함수의 교점 (학력평가)', c:'c4', t:100, src:MB('1823',313)+' · 2018년 3월 고3 학력평가',
  q:R`무리함수 \(f(x)=\sqrt{ax+b}+1\)의 역함수를 \(g(x)\)라 하자. 곡선 \(y=f(x)\)와 곡선 \(y=g(x)\)가 점 \((1,3)\)에서 만날 때, \(g(5)\)의 값은? (단, \(a, b\)는 상수이다.)`, ch:['−5','−4','−3','−2','−1'], a:0,
  hint:R`\(f(1)=3\)이고, \(g(1)=3\) ⟺ \(f(3)=1\).`,
  sol:R`<div class="step">\(f(1)=3\): \(\sqrt{a+b}=2\) → \(a+b=4\). \(f(3)=1\): \(3a+b=0\).</div><div class="step">\(a=-2,\ b=6\). \(g(5)=k\) ⟺ \(\sqrt{-2k+6}+1=5\) → \(-2k+6=16\) → \(k=-5\).</div>`,
  v:{ q:R`\(f(x)=\sqrt{ax+b}+1\)과 그 역함수 \(g\)의 그래프가 점 \((2,4)\)에서 만날 때 \(g(5)\)는?`, ch:[R`\(-\dfrac14\)`,R`\(\dfrac14\)`,R`\(\dfrac12\)`,R`\(\dfrac34\)`,'1'], a:1, hint:R`\(f(2)=4,\ f(4)=2\).`, sol:R`<div class="step">\(2a+b=9,\ 4a+b=1\) → \(a=-4,\ b=17\). \(\sqrt{17-4k}=4\) → \(k=\dfrac14\).</div>` } },
];

{ u:'func', id:'M1-02', tag:'그래프로 함수 판정', c:'c1', t:40, src:MSRC('02',353)+' (그림은 앱에서 다시 그림)', q:R`다음 중 실수 전체의 집합 \(R\)에 대하여 \(R\)에서 \(R\)로의 함수의 그래프가 아닌 것은?`, ch:FUNC5, a:4, hint:R`\(y\)축에 평행한 세로선을 그어 보세요. 두 점에서 만나면 함수가 아니에요.`,

{ u:'inv', id:'M1-04', tag:'대응 그림에서 역함수 값', c:'c2', t:50, src:MSRC('04',353)+' (그림은 앱에서 다시 그림)', q:R`그림은 함수 \(f: X\to X\)를 나타낸 것이다. \(f(2)+f^{-1}(4)\)의 값은? (단, \(f^{-1}\)는 \(f\)의 역함수이다.)`+MAP_M4, ch:['7','8','9','10','11'], a:1, hint:R`\(f^{-1}(4)\)는 ‘4로 화살표가 들어오는 출발점’.`,
  sol:R`<div class="step">\(f(2)=3\) (2에서 나간 화살표가 3에 도착).</div><div class="step">\(f^{-1}(4)\): 4에 도착하는 화살표는 5에서 출발 → 5.</div><div class="step">\(3+5=8\).</div>`,

{ u:'irr', id:'M1-17', tag:'유리함수 그래프 → 무리함수 그래프', c:'c2', t:120, src:MSRC('17',355)+' (그림은 앱에서 다시 그림)', q:R`유리함수 \(y=\dfrac{bx+c}{x+a}\)의 그래프가 아래와 같을 때 (점근선 \(x=-2,\ y=4\), \(y\)절편 \(\dfrac12\)), 무리함수 \(y=\sqrt{ax+b}+c\)의 그래프는?`+RAT(-2,4,-7,0.5,'<text x="62" y="36" font-size="8">4</text><text x="30" y="68" font-size="8">−2</text><text x="64" y="52" font-size="7">1/2</text>'), ch:SQ5, a:2, hint:R`점근선에서 \(a\)와 \(b\), \(y\)절편에서 \(c\).`,
  sol:R`<div class="step">세로 점근선 \(x=-a=-2\) → \(a=2\). 가로 점근선 \(y=b=4\).</div><div class="step">\(y\)절편 \(\dfrac ca=\dfrac12\) → \(c=1\).</div><div class="step">\(y=\sqrt{2x+4}+1=\sqrt{2(x+2)}+1\): 시작점 \((-2,1)\), 오른쪽 위로 → ③.</div>`,
  v:{ q:R`\(y=\dfrac{bx+c}{x+a}\)의 그래프가 아래와 같을 때 (점근선 \(x=1,\ y=2\), \(y\)절편 \(-1\)), \(y=\sqrt{ax+b}+c\)의 그래프는?`+RAT(1,2,3,-1,'<text x="62" y="46" font-size="8">2</text><text x="74" y="68" font-size="8">1</text><text x="64" y="70" font-size="8">−1</text>'), ch:SQ5, a:0, hint:R`\(a=-1,\ b=2\).`, sol:R`<div class="step">\(\dfrac{c}{a}=-1\) → \(c=1\). \(y=\sqrt{-x+2}+1\): 시작점 \((2,1)\), 왼쪽 위 → ①.</div>` } },
{ u:'inv', id:'M1-18', tag:'합성함수의 그래프', c:'c1', t:80, src:MSRC('18',355)+' (그림은 앱에서 다시 그림)', q:R`실수 전체의 집합에서 정의된 두 함수 \(f(x)=|x|,\ g(x)=-2x+1\)에 대하여 합성함수 \(y=(g\circ f)(x)\)의 그래프는?`, ch:ABS5, a:1, hint:R`\(g(f(x))=-2|x|+1\).`,
  sol:R`<div class="step">\((g\circ f)(x)=-2|x|+1\).</div><div class="step">\(x=0\)에서 최대 1, 양쪽으로 기울기 \(\mp2\)로 내려가요. \(x=\pm\dfrac12\)에서 \(x\)축과 만나는 Λ 모양 → ②.</div>`,

{ u:'inv', id:'O6-15', tag:'대응 그림과 반복 합성', c:'c1', t:80, src:OS('06 함수','15',72,BIN)+' (그림은 앱에서 다시 그림)', q:R`집합 \(X=\{1,2,3,4\}\)에 대하여 \(X\)에서 \(X\)로의 함수 \(f\)가 그림과 같고, \(f^1=f,\ f^{n+1}=f\circ f^n\)으로 정의할 때, \(f^{10}(2)+f^{20}(2)\)의 값은?`+MAP_O15, ch:['3','4','5','6','7'], a:2, hint:R`2에서 출발해 화살표를 따라가면 몇 번 만에 돌아오나요?`,

<script>
/* ========== 저장 ========== */
const KEY = 'gongsu2-final-v1';
let S = { att:{}, checks:{}, why:{}, log:[] };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ S.updated = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} if (window.proofCloud) window.proofCloud.push(); }

const $ = (s, el=document) => el.querySelector(s);
let _toastT;

  back.querySelector('p').textContent = msg;
  back.querySelector('[data-r="1"]').textContent = yesLabel || '확인';
  const close = ()=>back.remove();

/* ---------- 로그인·동기화 (Firebase, VOCAP과 같은 프로젝트) ---------- */
window.proofCloud = (()=>{
  let ref=null, uid=null, timer=null, writing=Promise.resolve(), unsub=null, status='local';
  const api = { user:null, login:null, logout:null };
  const TXT = { ok:'기록이 서버와 동기화되고 있어요.', loading:'동기화 연결 중이에요…', err:'동기화가 끊겼어요. 이 기기에는 계속 저장돼요.', local:'' };
  const snap = ()=>JSON.parse(JSON.stringify(S));
  const uniq = (arr, f)=>{ const m = new Map(); arr.forEach(x=>{ const k = f(x); if (!m.has(k)) m.set(k, x); }); return [...m.values()]; };
  // a가 우선(충돌 시), b는 빈 곳을 채움. 풀이 기록·로그는 합집합
  function mergeState(a, b){
    const out = Object.assign({}, b, a);
    const keys = new Set([...Object.keys(a.att||{}), ...Object.keys(b.att||{})]);
    out.att = {}; keys.forEach(k=>{ const x=(a.att||{})[k], y=(b.att||{})[k]; out.att[k] = !x ? y : !y ? x : (y.n > x.n ? y : x); });
    out.checks = Object.assign({}, b.checks, a.checks);
    out.why = Object.assign({}, b.why, a.why);
    out.srs = Object.assign({}, b.srs, a.srs);
    out.log = uniq([...(a.log||[]), ...(b.log||[])], x=>x.at+'|'+x.k).sort((p,q)=>p.at-q.at).slice(-500);
    out.clog = [...new Set([...(a.clog||[]), ...(b.clog||[])])].sort((p,q)=>p-q);
    out.study = uniq([...(a.study||[]), ...(b.study||[])], x=>x.at+'|'+x.min);
    out.exps = uniq([...(a.exps||[]), ...(b.exps||[])], x=>x.start);
    out.reports = uniq([...(a.reports||[]), ...(b.reports||[])], x=>x.at).sort((p,q)=>p.at-q.at).slice(-40);
    out.cnt = Math.max(a.cnt||0, b.cnt||0);
    return out;
  }
  function apply(d){
    S = Object.assign({ att:{}, checks:{}, why:{}, log:[], clog:[], study:[], exps:[], srs:{}, reports:[], cnt:0 }, d);
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
    const top = stack[stack.length-1];
    if (top === renderHome || top === renderMore) top();
  }
  function setStatus(k){ status = k; drawBox(); }
  function push(now){
    if (!ref) return; clearTimeout(timer);
    timer = setTimeout(()=>{ const data = snap(); writing = writing.then(()=>ref && ref.set(data)).then(()=>setStatus('ok')).catch(()=>setStatus('err')); }, now ? 0 : 1000);
  }
  async function connect(r, id){
    if (unsub) { unsub(); unsub = null; }
    ref = r; uid = id; setStatus('loading');
    const flag = KEY+'-synced-'+id; let synced = false; try { synced = !!localStorage.getItem(flag); } catch(e) {}
    try {
      const sn = await r.get();
      const hasLocal = (S.log && S.log.length) || Object.keys(S.att||{}).length;
      if (sn.exists()) {
        const d = sn.data();
        if (!synced && hasLocal) { const m = mergeState((d.updated||0) >= (S.updated||0) ? d : S, (d.updated||0) >= (S.updated||0) ? S : d); m.updated = Date.now(); apply(m); push(true); }
        else if ((d.updated||0) > (S.updated||0)) apply(d);
        else if ((d.updated||0) < (S.updated||0)) push(true);
      } else if (hasLocal) { push(true); }
      try { localStorage.setItem(flag, '1'); } catch(e) {}
      setStatus('ok');
      unsub = r.onSnapshot(x=>{ if (!x.exists()) return; const d = x.data(); if ((d.updated||0) > (S.updated||0)) apply(d); setStatus('ok'); }, ()=>setStatus('err'));
    } catch(e) { console.error(e); setStatus('err'); }
  }
  function disconnect(){ if (unsub) { unsub(); unsub = null; } clearTimeout(timer); ref = null; uid = null; setStatus('local'); }
  function drawBox(){
    const box = document.getElementById('authBox'); if (!box) return;
    const u = api.user;
    if (!api.login) { box.innerHTML = '<b style="display:block;margin-bottom:2px">로그인</b><span class="small">로그인 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</span>'; return; }
    if (u) {
      box.innerHTML = '<b style="display:block;margin-bottom:2px"><span class="who"></span> 로그인됨</b><span class="small"></span><div class="btnrow"><button class="btn line" id="outBtn">로그아웃</button></div>';
      box.querySelector('.who').textContent = (u.displayName||'').split(' ')[0] || '내 계정';
      box.querySelector('.small').textContent = TXT[status] || TXT.ok;
      document.getElementById('outBtn').onclick = ()=>askConfirm('로그아웃할까요?\n이 기기의 기록은 그대로 남아요.', ()=>api.logout(), '로그아웃');
    } else {
      box.innerHTML = '<b style="display:block;margin-bottom:2px">로그인하고 기록 지키기</b><span class="small">구글 계정으로 로그인하면 기록이 서버에 저장돼서, 기기를 바꾸거나 데이터를 지워도 이어서 풀 수 있어요.</span><div class="btnrow"><button class="btn" id="inBtn">구글로 로그인</button></div>';
      document.getElementById('inBtn').onclick = ()=>api.login();
    }
  }
  return Object.assign(api, { push, connect, disconnect, drawBox });
})();
