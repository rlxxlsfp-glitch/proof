<script>
/* ===== 일타 강사 스타일 개념 설명 ===== */

const RC = (t)=>`<div class="recall"><b>${ICON.pin}어디서 봤더라?</b>${t}</div>`;
const SUM = (t)=>`<div class="sum"><b>한 줄 정리</b>${t}</div>`;
const NEWC = {
prop:[
{ id:'c1', title:'명제, 조건, 진리집합', body: R`
${RC(R`바로 앞 단원 <b>집합</b>에서 원소, 부분집합, 여집합 배웠죠? 명제 단원은 사실 그 집합 얘기를 <b>문장</b>으로 다시 하는 거예요. 집합 잘했으면 이미 반은 먹고 들어간 거예요.`)}
<p><b>1. 명제가 뭐냐면</b></p>
<p>참인지 거짓인지 <b>딱 잘라 말할 수 있는</b> 문장이에요.</p>
<ul><li>‘2는 소수이다’ → 참. 명제 O</li><li>‘3 &gt; 5’ → 거짓. 그래도 명제 O (거짓도 명제예요!)</li><li>‘수학은 재밌다’ → 사람마다 달라요. 명제 X</li></ul>
<p><b>2. 조건은 뭐냐면</b></p>
<p>‘\(x+1=3\)’은 \(x\)가 2면 참, 아니면 거짓이죠. 이렇게 <b>\(x\) 값에 따라 참·거짓이 바뀌는</b> 문장을 조건이라고 하고, \(p\), \(q\)처럼 이름을 붙여요.</p>
<p><b>3. 진리집합: 조건을 집합으로 번역</b></p>
<p>조건을 참으로 만드는 애들만 모은 집합이에요. 예를 들어 \(U=\{1,2,3,4,5,6\}\)에서 \(p\): \(x\)는 짝수 → \(P=\{2,4,6\}\).</p>
<p>이 단원은 결국 “조건 → 집합으로 바꾸고, 집합으로 판단하기”예요. 이것만 기억해도 반은 끝나요.</p>
<p><b>4. 부정 \(\sim p\)</b></p>
<p>‘\(p\)가 아니다’예요. 진리집합은 여집합 \(P^C\). 위 예에서 \(\sim p\): \(x\)는 홀수 → \(\{1,3,5\}\).</p>
<div class="key"><b>‘또는’, ‘그리고’의 부정</b>집합에서 \((A\cup B)^C=A^C\cap B^C\) 배운 거 기억나요? 그거랑 똑같아요.<br>‘\(p\) 또는 \(q\)’의 부정 → ‘\(\sim p\) 그리고 \(\sim q\)’<br>‘\(p\) 그리고 \(q\)’의 부정 → ‘\(\sim p\) 또는 \(\sim q\)’</div>
<p>예) \(x\ge1\)의 부정은 \(x<1\). 등호는 반대편으로 넘어가요.<br>\(-1<x\le2\)는 ‘\(x>-1\) 그리고 \(x\le2\)’라서 부정은 ‘\(x\le-1\) 또는 \(x>2\)’.</p>
<div class="warn"><b>시험에 자주 나오는 함정</b>\(ab=0\)은 ‘\(a=0\) <b>또는</b> \(b=0\)’ → 부정은 ‘\(a\ne0\) 그리고 \(b\ne0\)’<br>\(a^2+b^2=0\)은 ‘\(a=0\) <b>그리고</b> \(b=0\)’ → 부정은 ‘\(a\ne0\) 또는 \(b\ne0\)’</div>
${SUM(R`조건은 집합으로 번역한다. 부정은 여집합.`)}`},

{ id:'c2', title:'명제 p → q 의 참, 거짓', body: R`
${RC(R`중학교 도형 단원에서 ‘이등변삼각형<b>이면</b> 두 밑각의 크기가 같다’ 같은 문장 많이 썼죠? 그게 다 ‘\(p\)이면 \(q\)이다’ 꼴이에요. 이제 이걸 집합 그림으로 참·거짓을 판정해요.`)}
<p>‘\(p\)이면 \(q\)이다’에서 \(p\)는 <b>가정</b>, \(q\)는 <b>결론</b>이에요.</p>
<p><b>쉬운 예로 감 잡기</b></p>
<p>‘우리 반 학생이면 김포고 학생이다’ → 우리 반은 김포고 안에 쏙 들어가죠. 참!<br>‘김포고 학생이면 우리 반 학생이다’ → 옆 반 친구는요? 거짓! 옆 반 친구가 바로 <b>반례</b>예요.</p>
${FIG.vennSub}
<div class="key"><b>판정법 딱 하나</b>\(P\subset Q\) 이면 참, 아니면 거짓.<br>작은 쪽에서 큰 쪽으로 가는 화살표만 참이에요.</div>
${FIG.vennCex}
<p>거짓이라고 말하려면 <b>반례 하나</b>만 찾으면 돼요. 반례는 가정은 만족하는데 결론은 안 만족하는 것, 즉 \(P-Q\)에 있는 원소예요.</p>
<div class="tip"><b>반례 찾는 요령</b>제곱이 보이면 <b>음수</b>부터 넣어 보세요. (\(x^2=4\)이면 \(x=2\)? → \(x=-2\)!)<br>‘둘 다 무리수’ 같은 말엔 하나만 무리수인 경우를 넣어 보세요. (\(x=\sqrt2,\ y=0\))<br>0, 1, −1, 2 정도만 넣어 봐도 대부분 걸려요.</div>
${SUM(R`포함되면 참, 삐져나온 게 있으면 그게 반례.`)}`},

{ id:'c3', title:'‘모든’과 ‘어떤’', body: R`
${RC(R`공통수학1 이차부등식에서 ‘모든 실수 \(x\)에 대하여 성립할 조건’ 문제 풀었죠? 그때 판별식 \(D<0\) 쓴 거, 그게 바로 이 개념이에요.`)}
<p><b>교실로 생각해 보세요</b></p>
<ul><li>‘우리 반 <b>모든</b> 학생은 휴대폰이 있다’ → 한 명이라도 없으면 거짓이에요.</li><li>‘우리 반 <b>어떤</b> 학생은 안경을 쓴다’ → 딱 한 명만 써도 참이에요.</li></ul>
<div class="key"><b>집합으로 말하면</b>‘모든 \(x\)에 대하여 \(p\)’는 \(P=U\)일 때 참 (전부 다 만족)<br>‘어떤 \(x\)에 대하여 \(p\)’는 \(P\ne\varnothing\)일 때 참 (하나라도 있으면)</div>
<p><b>부정하는 법</b>: ‘모든’ ↔ ‘어떤’을 바꾸고, 뒤의 조건도 부정해요.</p>
<p>‘모든 학생이 휴대폰이 있다’의 부정은 ‘휴대폰이 <b>없는</b> 학생이 <b>있다</b>’, 즉 ‘어떤 학생은 휴대폰이 없다’예요. ‘모든 학생이 휴대폰이 없다’가 아니에요!</p>
<p>수식으로: ‘모든 실수 \(x\)에 대하여 \(x^2\ge0\)’ → 부정은 ‘어떤 실수 \(x\)에 대하여 \(x^2<0\)’.</p>
${SUM(R`모든은 전부, 어떤은 하나라도. 부정하면 서로 바뀐다.`)}`},

{ id:'c4', title:'역과 대우', body: R`
${RC(R`처음 보는 용어지만 생활에서 늘 쓰는 논리예요. 국어 시간 논증 단원에서 ‘전제가 참이면 결론도 참인가’ 따졌던 것과 같은 결이에요.`)}
<p><b>예시 하나로 전부 이해하기</b>: ‘비가 오면 땅이 젖는다’ (참)</p>
<ul><li><b>역</b>(앞뒤 바꾸기): ‘땅이 젖으면 비가 왔다’ → 누가 물을 뿌렸을 수도 있죠. 거짓!</li><li><b>대우</b>(앞뒤 바꾸고 둘 다 부정): ‘땅이 안 젖었으면 비가 안 왔다’ → 맞아요. 참!</li></ul>
${FIG.contra}
<div class="key"><b>핵심</b>원래 명제와 <b>대우</b>는 참·거짓이 항상 같다.<br>역은 그때그때 따로 확인해야 한다.</div>
<p><b>왜 대우는 같을까?</b> 집합 그림에서 \(P\subset Q\)이면, 밖에서 보면 \(Q\) 바깥(\(Q^C\))은 \(P\) 바깥(\(P^C\)) 안에 들어가요. 그래서 \(Q^C\subset P^C\), 즉 \(\sim q\to\sim p\)도 참이에요.</p>
<div class="tip"><b>문제에서 대우 쓰는 타이밍</b>조건에 <b>‘\(\ne\)’</b>가 보이면 대우로 바꾸세요. ‘\(\ne\)’가 ‘\(=\)’로 바뀌어서 대입만 하면 끝나요.<br>예) ‘\(x^2-ax+3\ne0\)이면 \(x-1\ne0\)’이 참<br>→ 대우: ‘\(x=1\)이면 \(x^2-ax+3=0\)’<br>→ \(1-a+3=0\), \(a=4\)</div>
${SUM(R`대우는 원래 명제랑 운명 공동체, 역은 남남.`)}`},

{ id:'c5', title:'충분조건과 필요조건', body: R`
${RC(R`앞에서 배운 ‘\(p\to q\)가 참 = \(P\subset Q\)’를 그대로 이름만 바꿔 부르는 거예요. 새로운 계산은 없어요.`)}
<p><b>예시로 이해하기</b>: ‘서울에 산다 ⇒ 한국에 산다’ (참)</p>
<ul><li>서울에 산다는 건, 한국에 산다는 걸 알기에 <b>충분</b>해요. → 서울은 한국이기 위한 <b>충분조건</b></li><li>한국에 살지 않으면 서울에 살 수가 없죠. 한국은 서울이기 위해 <b>필요</b>해요. → 한국은 서울이기 위한 <b>필요조건</b></li></ul>
${FIG.vennSub}
<div class="key"><b>정리</b>\(p\Rightarrow q\)이면 \(p\)는 \(q\)이기 위한 충분조건, \(q\)는 \(p\)이기 위한 필요조건.<br><b>작은 집합이 충분, 큰 집합이 필요.</b><br>둘 다 성립(\(P=Q\))하면 필요충분조건.</div>
<div class="warn"><b>문장 읽는 법 (제일 많이 헷갈림)</b>‘\(q\)는 \(p\)이기 위한 필요조건’ → 주어가 \(q\)라도, 화살표는 \(p\Rightarrow q\)예요.<br>요령: ‘<b>A는 B이기 위한 충분</b>’이면 A → B, ‘<b>A는 B이기 위한 필요</b>’면 B → A.</div>
<div class="tip"><b>여러 개 이어 붙이기</b>\(p\Rightarrow q\), \(q\Rightarrow r\)이면 \(p\Rightarrow r\) (삼단논법). 화살표가 안 이어지면 대우로 뒤집어서 이어 보세요.</div>
${SUM(R`작은 게 충분, 큰 게 필요.`)}`},

{ id:'c6', title:'증명: 대우 증명법, 귀류법', body: R`
${RC(R`중2 때 삼각형 합동 증명하면서 ‘가정 → 결론’ 순서로 썼던 거 기억나요? 이번엔 정면 돌파가 어려울 때 쓰는 우회로 두 가지를 배워요.`)}
<p><b>1. 대우를 이용한 증명</b>: 원래 명제가 어려우면 대우를 증명해요. (대우가 참이면 원래도 참이니까!)</p>
<p>예) ‘\(n^2\)이 짝수이면 \(n\)은 짝수’ → 바로는 막막하죠.<br>대우: ‘\(n\)이 홀수이면 \(n^2\)은 홀수’ → \(n=2k+1\)이면 \(n^2=4k^2+4k+1=2(2k^2+2k)+1\), 홀수! 끝.</p>
<p><b>2. 귀류법</b>: “일단 결론이 틀렸다고 쳐 보자 → 말이 안 되는 상황(모순)이 생기네 → 그러니까 결론이 맞다.”</p>
<p>예) \(\sqrt2\)는 무리수다.<br>유리수라고 치면 \(\sqrt2=\dfrac{m}{n}\) (\(m, n\)은 서로소) → \(m^2=2n^2\) → \(m\)은 짝수 → \(m=2k\)를 넣으면 \(n^2=2k^2\) → \(n\)도 짝수 → 둘 다 짝수면 서로소가 아니잖아요! 모순.</p>
<div class="tip"><b>서술형 포인트</b>빈칸 채우기로 자주 나와요. ‘\(m^2\)이 짝수이므로 \(m\)도 짝수’라는 줄이 바로 위 대우 증명 결과를 쓰는 부분이에요.</div>
${SUM(R`정면이 막히면 대우로 돌아가거나, 반대로 가정해서 모순을 찾는다.`)}`},
],

ineq:[
{ id:'c1', title:'절대부등식이 뭐냐면', body: R`
${RC(R`공통수학1 부등식 단원에서는 ‘\(x>3\)’처럼 <b>\(x\)의 범위를 구하는</b> 게 목표였죠. 이번엔 반대예요. 아무 수나 넣어도 <b>항상 참인</b> 부등식을 다뤄요.`)}
<p>‘\(x^2+1>0\)’을 보세요. \(x\)에 뭘 넣어도 참이죠? 이런 게 <b>절대부등식</b>이에요. 반면 ‘\(x>3\)’은 \(x=1\)이면 거짓이라 절대부등식이 아니에요.</p>
<p><b>모든 것의 출발점: (실수)\(^2\ge0\)</b></p>
<p>실수를 제곱하면 절대 음수가 안 되죠. 이 사실 하나로 거의 다 증명돼요.</p>
<p>예) \(a^2+b^2\ge2ab\) 증명: 빼 보면 \(a^2+b^2-2ab=(a-b)^2\ge0\). 끝! 등호는 \(a=b\)일 때.</p>
<div class="key"><b>증명 공식</b>(좌변) − (우변)을 만들어서 완전제곱식으로 바꾼다 → \(\ge0\) 이면 증명 끝.<br>양변이 양수면 제곱해서 비교해도 돼요.</div>
<ul><li>\(a^2\pm ab+b^2\ge0\)</li><li>\(|a|+|b|\ge|a+b|\) (등호는 \(ab\ge0\))</li></ul>
${SUM(R`빼서 완전제곱 만들면 증명 끝.`)}`},

{ id:'c2', title:'산술평균과 기하평균의 관계', body: R`
${RC(R`평균 내는 법은 초등학교 때부터 알죠? \(\dfrac{a+b}{2}\), 이게 <b>산술평균</b>이에요. 오늘은 친구 하나가 더 나와요. 바로 <b>기하평균</b> \(\sqrt{ab}\).`)}
<p><b>기하평균은 뭘까?</b> 가로 \(a\), 세로 \(b\)인 직사각형이 있을 때, 넓이가 똑같은 정사각형의 한 변이 \(\sqrt{ab}\)예요.</p>
<div class="key"><b>공식</b>\(a>0,\ b>0\)일 때 \(\dfrac{a+b}{2}\ge\sqrt{ab}\), 등호는 \(a=b\)일 때.<br>시험에서는 이 모양으로 써요: \(a+b\ge2\sqrt{ab}\)</div>
${FIG.amgm}
<p>그림에서 반지름(산술평균)이 높이(기하평균)보다 항상 길거나 같죠. 딱 가운데(\(a=b\))일 때만 같아요.</p>
<p><b>언제 쓰냐면</b></p>
<ul><li><b>곱이 일정</b> → 합의 최솟값: \(x+\dfrac9x\ge2\sqrt{x\cdot\dfrac9x}=2\sqrt9=6\) (\(x=3\)일 때)</li><li><b>합이 일정</b> → 곱의 최댓값: \(a+b=10\)이면 \(10\ge2\sqrt{ab}\), \(ab\le25\)</li></ul>
<div class="warn"><b>쓰기 전에 체크 2개</b>① 두 수가 둘 다 양수인가?<br>② 등호(\(a=b\))가 실제로 될 수 있나? 안 되면 그 값은 최솟값이 아니에요.</div>
${SUM(R`곱이 일정하면 합의 최소, 합이 일정하면 곱의 최대. 양수랑 등호 확인!`)}`},

{ id:'c3', title:'산술·기하 활용 기술', body: R`
${RC(R`바로 앞 개념의 응용이에요. 문제에서는 공식이 바로 보이게 안 주고, 살짝 꼬아서 줘요. 꼬인 걸 푸는 기술 두 개만 알면 돼요.`)}
<p><b>기술 1. 곱해서 상수 만들기</b></p>
<p>\(x>1\)일 때 \(x+\dfrac{4}{x-1}\)의 최솟값? \(x\cdot\dfrac{4}{x-1}\)은 상수가 아니라서 바로 못 써요.<br>그래서 \(x\)를 \((x-1)+1\)로 쪼개요.</p>
<p>\((x-1)+\dfrac{4}{x-1}+1\ge2\sqrt4+1=5\). 이제 곱하면 4로 상수죠!</p>
<p><b>기술 2. 조건식을 곱해서 펼치기</b></p>
<p>\(x+2y=4\)일 때 \(\dfrac1x+\dfrac2y\)의 최솟값?<br>→ \(\left(\dfrac1x+\dfrac2y\right)(x+2y)\)를 전개하면 \(5+\dfrac{2y}{x}+\dfrac{2x}{y}\)가 나와요. 뒤의 두 항은 곱하면 4, 산술·기하 쓸 수 있어요.</p>
<div class="warn"><b>함정</b>산술·기하를 두 번 쓰면 등호 조건이 서로 달라서 동시에 성립 못 할 수 있어요. 그럴 땐 한 번에 쓸 수 있게 식을 다시 묶으세요.</div>
${SUM(R`곱했을 때 문자가 사라지게 쪼개거나 곱해서 펼친다.`)}`},

{ id:'c4', title:'코시-슈바르츠 부등식', body: R`
${RC(R`이건 진짜 처음 보는 공식이에요. 근데 겁먹을 필요 없어요. 모양만 외우면 대입이 끝이에요.`)}
<div class="key"><b>공식 모양</b>(제곱의 합) × (제곱의 합) ≥ (짝끼리 곱해서 더한 것)\(^2\)<br>\((a^2+b^2)(x^2+y^2)\ge(ax+by)^2\)<br>등호는 \(\dfrac{x}{a}=\dfrac{y}{b}\)일 때 (짝끼리 비율이 같을 때)</div>
<p><b>언제 꺼내냐면</b></p>
<ul><li>일차식 값(\(x+2y=\cdots\))이 주어지고 <b>제곱의 합</b>(\(x^2+y^2\))의 최솟값을 물을 때</li><li>제곱의 합이 주어지고 <b>일차식</b>의 최댓값·최솟값을 물을 때</li></ul>
<p>예) \(x^2+y^2=5\)일 때 \(x+2y\)의 범위<br>\((1^2+2^2)(x^2+y^2)\ge(1\cdot x+2\cdot y)^2\) → \(25\ge(x+2y)^2\) → \(-5\le x+2y\le5\)</p>
<div class="tip"><b>요령</b>계수 맞추기가 전부예요. \(4x^2\)이 보이면 \((2x)^2\)으로 보고 짝을 정하세요.<br>참고로 이 예시는 원 \(x^2+y^2=5\)와 직선 \(x+2y=k\)가 만나는 조건이랑 같아요. 도형의 방정식이랑 연결돼요.</div>
${SUM(R`제곱합 × 제곱합 ≥ (짝곱의 합)².`)}`},
],

func:[
{ id:'c1', title:'함수의 뜻, 정의역·공역·치역', body: R`
${RC(R`중1 때 정비례 \(y=2x\), 반비례 \(y=\dfrac{6}{x}\), 중2 일차함수, 중3 이차함수까지 다 ‘함수’였어요. 그때 “\(x\)를 하나 정하면 \(y\)가 하나 정해지는 관계”라고 배웠죠. 이번엔 그걸 <b>집합</b>으로 다시 보는 거예요.`)}
<p><b>자판기로 생각해 보세요</b></p>
<ul><li>버튼(\(x\))을 누르면 음료(\(y\))가 <b>딱 하나</b> 나와야 정상이에요.</li><li>버튼 하나에 음료 두 개 → 고장! 함수 아님</li><li>아무것도 안 나오는 버튼이 있다 → 고장! 함수 아님</li><li>다른 버튼인데 같은 음료가 나온다 → 괜찮아요. 함수 맞음</li></ul>
${mapDiagram(['1','2','3'],['a','b','c'],[[0,0],[1,0],[2,1]],'함수 O: 1, 2가 같은 곳으로 가도 OK. c가 남아도 OK.')}
${mapDiagram(['1','2','3'],['a','b','c'],[[0,0],[0,1],[1,2]],'함수 X: 1이 두 군데로, 3은 갈 곳이 없음.')}
<div class="key"><b>용어 (자판기 버전)</b><b>정의역 \(X\)</b> = 버튼 전체<br><b>공역 \(Y\)</b> = 진열장에 있는 음료 전체<br><b>치역</b> = 실제로 나오는 음료들 (\(\subset\) 공역)</div>
<p><b>그래프로 판정</b>: 세로선(\(x=k\))을 쭉 그어서 그래프와 항상 한 점에서만 만나면 함수예요.</p>
<div class="tip"><b>문제 유형</b>‘\(X\)에서 \(Y\)로의 함수인가?’ → \(X\)의 원소를 하나씩 다 넣어 보고, 결과가 전부 \(Y\) 안에 있는지 확인.</div>
${SUM(R`버튼 하나에 음료 하나. 남는 음료는 괜찮다.`)}`},

{ id:'c2', title:'서로 같은 함수', body: R`
${RC(R`집합에서 ‘두 집합이 같다’는 원소가 완전히 같다는 뜻이었죠. 함수도 비슷해요.`)}
<p>두 함수 \(f, g\)가 같으려면 세 가지가 다 같아야 해요.</p>
<ul><li>정의역이 같고</li><li>공역이 같고</li><li>정의역의 모든 \(x\)에서 \(f(x)=g(x)\)</li></ul>
<p>예) \(X=\{-1,1\}\)에서 \(f(x)=x^2\), \(g(x)=|x|\) → 식은 다르게 생겼는데 넣어 보면 둘 다 1이에요. 그래서 같은 함수!</p>
${SUM(R`식 모양 말고, 넣었을 때 결과가 같은지 본다.`)}`},

{ id:'c3', title:'일대일함수와 일대일대응', body: R`
${RC(R`중2 일차함수 그래프 기억나요? 계속 올라가거나 계속 내려가는 직선이었죠. 그런 그래프가 바로 일대일대응의 대표 선수예요.`)}
<p><b>교실 사물함으로 생각하기</b></p>
<ul><li><b>일대일함수</b>: 학생마다 <b>서로 다른</b> 사물함을 써요. 두 명이 한 사물함을 같이 쓰면 안 돼요. (빈 사물함은 남아도 OK)</li><li><b>일대일대응</b>: 일대일함수인데, 빈 사물함도 <b>하나도 없어요</b>. 학생 수 = 사물함 수, 딱 맞게 짝지어짐.</li></ul>
<div class="key"><b>정의</b>일대일함수: \(x_1\ne x_2\)이면 \(f(x_1)\ne f(x_2)\)<br>일대일대응: 일대일함수 + 치역 = 공역</div>
${FIG.hline}
<p><b>그래프로 판정</b>: 가로선을 그어서 두 번 이상 만나면 일대일이 아니에요. 이차함수(포물선)는 가로선이 두 번 만나니까 일대일 X.</p>
<div class="warn"><b>구간별 함수 문제</b>\(x\ge0\)과 \(x<0\)에서 식이 다른 함수가 일대일대응이려면<br>① 두 직선 기울기의 <b>부호가 같고</b> (둘 다 올라가거나 둘 다 내려가거나)<br>② 경계에서 <b>끊기지 않고 이어져야</b> 해요.</div>
${SUM(R`가로선 테스트 통과 + 빈자리 없음 = 일대일대응.`)}`},

{ id:'c4', title:'항등함수, 상수함수, 함수의 개수', body: R`
${RC(R`공통수학1 경우의 수에서 순열 \(_n\mathrm{P}_r\), 팩토리얼 \(n!\) 배웠죠? 함수 개수 세는 데 그대로 써요.`)}
<ul><li><b>항등함수</b>: 넣은 그대로 나와요. \(f(x)=x\)</li><li><b>상수함수</b>: 뭘 넣어도 같은 값. \(f(x)=c\)</li></ul>
<p><b>함수 개수 세기</b> (\(n(X)=m\), \(n(Y)=n\))</p>
<p>\(X\)의 원소 하나하나가 \(Y\)의 어디로 갈지 고르는 문제예요.</p>
<ul><li><b>함수</b>: 각자 \(n\)곳 중 아무 데나 → \(n\times n\times\cdots=n^m\)</li><li><b>일대일함수</b>: 겹치면 안 되니까 하나씩 줄어요 → \(n(n-1)(n-2)\cdots=\,_n\mathrm{P}_m\)</li><li><b>일대일대응</b> (\(m=n\)): \(n!\)</li></ul>
<div class="tip"><b>항등함수 문제 꿀팁</b>‘\(f\)가 \(X\)에서 \(X\)로의 항등함수’라고 하면 \(f(x)=x\)를 푸세요. 그 해들이 곧 \(X\)의 원소예요.</div>
${SUM(R`함수 \(n^m\), 일대일 \(_n\mathrm{P}_m\), 일대일대응 \(n!\).`)}`},
],

inv:[
{ id:'c1', title:'합성함수', body: R`
${RC(R`바로 앞의 ‘함수’ 개념에서 이어져요. 함수 두 개를 기계처럼 연결하는 거예요.`)}
<p><b>공장 컨베이어 벨트를 떠올려 보세요</b></p>
<p>재료 \(x\)가 먼저 <b>\(g\) 기계</b>를 통과해서 \(g(x)\)가 되고, 그다음 <b>\(f\) 기계</b>를 통과해서 \(f(g(x))\)가 돼요. 이걸 \((f\circ g)(x)\)라고 써요.</p>
<div class="key"><b>정의</b>\((f\circ g)(x)=f(g(x))\)<br><b>오른쪽(안쪽) \(g\)부터</b> 계산한다!</div>
<p>예) \(f(x)=2x+1,\ g(x)=x^2\)<br>\((f\circ g)(2)=f(g(2))=f(4)=9\)<br>\((g\circ f)(2)=g(f(2))=g(5)=25\) → 순서 바꾸면 결과가 달라요.</p>
<ul><li>교환법칙 X: \(f\circ g\ne g\circ f\) (보통)</li><li>결합법칙 O: \((f\circ g)\circ h=f\circ(g\circ h)\)</li></ul>
<div class="tip"><b>\(f\circ g=h\)에서 \(f(\square)\) 구하기</b>\(f\) 식 전체를 구할 필요 없어요. \(g(x)=\square\)가 되는 \(x\)를 찾아서 \(h(x)\)에 넣으면 끝.</div>
${SUM(R`안쪽부터 차례로 통과.`)}`},

{ id:'c2', title:'역함수의 뜻과 구하는 법', body: R`
${RC(R`일대일대응 개념 기억나죠? 그게 여기서 필요해요. 역함수는 함수를 ‘되감기’하는 거예요.`)}
<p><b>되감기로 생각하기</b>: \(f\)가 “2배 하고 1 더하기”라면, 되돌리는 \(f^{-1}\)은 “1 빼고 2로 나누기”예요.<br>\(f(3)=7\)이면 \(f^{-1}(7)=3\).</p>
<div class="key"><b>핵심 한 줄</b>\(f(a)=b\) ⟺ \(f^{-1}(b)=a\)</div>
<p><b>왜 일대일대응이어야 할까?</b> \(f(1)=5\), \(f(2)=5\)라면 5를 되감을 때 1로 가야 할지 2로 가야 할지 모르잖아요. 그래서 일대일대응일 때만 역함수가 있어요.</p>
<p><b>역함수 구하는 순서</b></p>
<ul><li>① \(y=f(x)\)를 \(x=\cdots\) 꼴로 정리</li><li>② \(x\)와 \(y\)를 바꾸기</li><li>③ 정의역 ↔ 치역도 바뀐다</li></ul>
<p>예) \(y=3x-6\) → \(x=\dfrac{y}{3}+2\) → \(f^{-1}(x)=\dfrac{x}{3}+2\)</p>
<div class="tip"><b>값만 물어보면?</b>\(f^{-1}(5)\)를 구하라고 하면 역함수 식 만들지 말고 \(f(x)=5\)를 풀어요. 훨씬 빨라요.</div>
${SUM(R`\(f(a)=b\)면 \(f^{-1}(b)=a\). 일대일대응만 되감기 가능.`)}`},

{ id:'c3', title:'역함수의 성질', body: R`
${RC(R`합성함수랑 역함수를 섞으면 어떻게 될까요? 성질 3개만 챙기면 돼요.`)}
<ul><li>\((f^{-1})^{-1}=f\) → 되감기를 되감으면 원래대로</li><li>\(f^{-1}\circ f=I\), \(f\circ f^{-1}=I\) → 했다가 되감으면 제자리</li><li>\((f\circ g)^{-1}=g^{-1}\circ f^{-1}\) → <b>순서가 뒤집혀요</b></li></ul>
<p><b>순서가 왜 뒤집힐까? 양말과 신발!</b> 신을 땐 양말(\(g\)) → 신발(\(f\)). 벗을 땐? 신발 먼저 벗고(\(f^{-1}\)), 그다음 양말(\(g^{-1}\)). 그래서 \(g^{-1}\circ f^{-1}\).</p>
<div class="warn"><b>자주 틀림</b>\((g\circ f)^{-1}(2)=f^{-1}(g^{-1}(2))\). \(g^{-1}\)부터 계산해요.</div>
<p>예) \((f\circ g)^{-1}(3x-1)=x\)이면, 양쪽에 \(f\circ g\)를 씌워서 \((f\circ g)(x)=3x-1\).</p>
${SUM(R`벗을 땐 신발부터.`)}`},

{ id:'c4', title:'역함수의 그래프', body: R`
${RC(R`<b>도형의 이동</b> 단원에서 직선 \(y=x\)에 대한 대칭이동은 \(x\)와 \(y\)를 바꾸는 거였죠? 역함수 구할 때도 \(x, y\)를 바꿨어요. 그래서 역함수 그래프는 \(y=x\)에 대칭이에요!`)}
${FIG.inverse}
<div class="key"><b>대칭</b>\(y=f(x)\)와 \(y=f^{-1}(x)\)의 그래프는 직선 \(y=x\)에 대해 대칭.</div>
<p><b>두 그래프의 교점 찾기</b>: \(f\)가 <b>증가함수</b>(계속 올라가는 함수)이면, 두 그래프는 꼭 \(y=x\) 위에서 만나요. 그래서 \(f(x)=x\)만 풀면 돼요.</p>
<div class="warn"><b>감소함수는 예외</b>내려가는 함수는 \(y=x\) 밖에서도 만날 수 있어요. 이 방법 그대로 쓰면 안 돼요.</div>
<p>보너스: 자기 자신이 역함수인 일차함수는 \(y=x\) 또는 기울기가 \(-1\)인 직선(\(y=-x+k\))이에요. \(y=x\)로 접어도 그대로니까요.</p>
${SUM(R`역함수는 \(y=x\)로 접은 그림. 증가함수면 교점은 \(f(x)=x\).`)}`},
],

rat:[
{ id:'c1', title:'유리식 계산과 부분분수', body: R`
${RC(R`중학교 때 분수 통분, 약분 했죠? <b>유리식</b>은 분모에 문자가 있는 분수식일 뿐이에요. 계산 방법은 똑같아요. 공통수학1의 항등식(계수비교법, 수치대입법)도 여기서 다시 써요.`)}
<p>\(\dfrac{1}{x}+\dfrac{1}{x+1}\)처럼 분모에 문자가 들어간 식이 유리식이에요. 덧셈·뺄셈은 통분, 곱셈·나눗셈은 인수분해 후 약분.</p>
<p><b>부분분수: 분수 하나를 두 조각으로 쪼개기</b></p>
<p>통분의 반대 방향이에요. \(\dfrac1x-\dfrac1{x+2}\)를 통분하면 \(\dfrac{2}{x(x+2)}\)이죠? 그러니까 거꾸로 이렇게 쪼갤 수 있어요.</p>
<div class="key"><b>부분분수 공식</b>\[\frac{1}{AB}=\frac{1}{B-A}\left(\frac1A-\frac1B\right)\]분모의 차(\(B-A\))로 나눠 주는 것만 기억!</div>
<p><b>망원 합</b>: 쪼갠 걸 여러 개 더하면 가운데가 다 지워지고 <b>처음과 끝만</b> 남아요. 망원경 접듯이요.</p>
<div class="tip"><b>미정계수 구하기</b>\(\dfrac ax+\dfrac b{x-1}+\dfrac c{x-2}=\dfrac{4}{x(x-1)(x-2)}\) 같은 꼴은 양변에 분모를 곱하고 \(x=0,1,2\)를 하나씩 넣으면 바로 나와요. (공통수학1 수치대입법!)</div>
${SUM(R`쪼개고 더하면 처음과 끝만 남는다.`)}`},

{ id:'c2', title:'y = k/(x−p) + q 의 그래프', body: R`
${RC(R`중1 때 <b>반비례</b> \(y=\dfrac{a}{x}\) 그래프 그렸죠? 두 갈래로 휘어진 곡선. 그게 유리함수의 기본형이에요. 그리고 <b>도형의 이동</b>에서 평행이동은 \(x\to x-p\), \(y\to y-q\)였죠. 이 둘을 합치면 끝이에요.`)}
<p>\(y=\dfrac{k}{x-p}+q\)는 반비례 그래프 \(y=\dfrac kx\)를 <b>오른쪽으로 \(p\), 위로 \(q\)</b>만큼 옮긴 거예요.</p>
${FIG.rational}
<p><b>점근선이 뭐냐면</b>: 그래프가 한없이 가까이 가지만 절대 닿지 않는 선이에요.</p>
<ul><li>세로 점근선 \(x=p\): 분모가 0이 되면 안 되니까 \(x=p\)에서는 그래프가 없어요.</li><li>가로 점근선 \(y=q\): \(\dfrac{k}{x-p}\)는 절대 0이 안 되니까 \(y\)는 \(q\)가 될 수 없어요.</li></ul>
<div class="key"><b>바로 읽기</b>점근선 \(x=p,\ y=q\) / 정의역 \(x\ne p\) / 치역 \(y\ne q\)<br>\(k>0\)이면 1, 3사분면 방향, \(k<0\)이면 2, 4사분면 방향<br>\(|k|\)가 클수록 점근선 교점에서 멀어짐</div>
<div class="tip"><b>대칭</b>그래프는 점근선 교점 \((p,q)\)에 대해 점대칭이고, \((p,q)\)를 지나는 기울기 \(1\), \(-1\)인 두 직선에 대해 선대칭이에요.<br>그래서 ‘직선 \(y=x-1\)에 대해 대칭’이라는 말이 나오면 → \((p,q)\)가 그 직선 위에 있다!</div>
${SUM(R`반비례 그래프를 \((p,q)\)로 옮긴 것. 점근선 교점이 중심.`)}`},

{ id:'c3', title:'y = (ax+b)/(cx+d) 의 변형과 치역', body: R`
${RC(R`공통수학1 다항식의 나눗셈 기억나요? 분자를 분모로 나누는 그 방법으로 모양을 바꿔요.`)}
<p>\(y=\dfrac{5x-6}{x-2}\)처럼 생긴 건 바로 그래프가 안 보이죠. 분자를 분모로 나눠서 \(\dfrac{k}{x-p}+q\) 꼴로 바꿔요.</p>
<p>\(5x-6=5(x-2)+4\)이니까 \(y=\dfrac{5(x-2)+4}{x-2}=5+\dfrac{4}{x-2}\). 이제 점근선 \(x=2,\ y=5\)가 보이죠!</p>
<div class="key"><b>빠른 길</b>\(y=\dfrac{ax+b}{cx+d}\)의 점근선은 \(x=-\dfrac dc\), \(y=\dfrac ac\).<br>(분모가 0 되는 \(x\), 그리고 \(x\)의 계수끼리 나눈 값)</div>
<p><b>정의역이 일부만 주어지면?</b> 그 구간이 점근선 한쪽에만 있으면 그래프가 계속 올라가거나 계속 내려가요. 그래서 <b>양 끝값만 넣으면</b> 치역이 나와요.</p>
${SUM(R`나눠서 \(\dfrac{k}{x-p}+q\)로. 구간이면 양 끝값.`)}`},

{ id:'c4', title:'평행이동, 역함수', body: R`
${RC(R`평행이동은 도형의 이동, 역함수는 바로 앞 단원. 배운 걸 유리함수에 적용만 하면 돼요.`)}
<p><b>평행이동</b>: \(y=\dfrac kx\)를 \(x\)축 방향으로 \(p\), \(y\)축 방향으로 \(q\)만큼 옮기면 \(y=\dfrac{k}{x-p}+q\). 점근선 교점이 \((0,0)\)에서 \((p,q)\)로 이사 가는 거예요.</p>
<div class="tip"><b>문제 패턴</b>원이나 점의 이동으로 ‘얼마나 옮겼는지’를 알려 주는 문제가 많아요. 먼저 이동량부터 구하세요. 원 중심이 \((2,-1)\)에서 \((4,2)\)로 갔다면 이동량은 \((2,3)\).</div>
<div class="key"><b>역함수 공식</b>\(y=\dfrac{ax+b}{cx+d}\)의 역함수는 \(y=\dfrac{-dx+b}{cx-a}\)<br>\(a\)와 \(d\)의 자리를 바꾸고 둘 다 부호를 바꾼다.</div>
${SUM(R`이동량 먼저, 역함수는 \(a\)와 \(d\) 자리 바꾸고 부호 반대.`)}`},
],

irr:[
{ id:'c1', title:'무리식의 조건과 계산', body: R`
${RC(R`중3 때 <b>제곱근</b> 배웠죠? 근호 안에 음수는 안 된다, 분모에 근호가 있으면 유리화한다. 그리고 공통수학1 <b>복소수</b>에서 \(\sqrt{-2}=\sqrt2\,i\)도 했어요. 이게 전부 다시 나와요.`)}
<p><b>무리식</b>은 근호 안에 문자가 있는 식이에요. 예: \(\sqrt{x-1}\)</p>
<div class="key"><b>값이 실수가 되려면</b>근호 안 \(\ge0\), 분모 \(\ne0\). 이 두 개가 정의역을 정해요.</div>
<p><b>분모의 유리화</b> (중3 그대로):</p>
\[\frac{1}{\sqrt a+\sqrt b}=\frac{\sqrt a-\sqrt b}{a-b}\]
<div class="warn"><b>음수의 제곱근 (시험 단골)</b>보통은 \(\sqrt a\sqrt b=\sqrt{ab}\)인데, 이게 깨지는 경우가 딱 하나예요.<br>\(\sqrt a\sqrt b=-\sqrt{ab}\)이면 → \(a<0,\ b<0\)<br>\(\dfrac{\sqrt a}{\sqrt b}=-\sqrt{\dfrac ab}\)이면 → \(a\ge0,\ b<0\)<br>예) \(\sqrt{-8}\sqrt{-2}=(2\sqrt2 i)(\sqrt2 i)=4i^2=-4\)</div>
<p>\(\sqrt{x^2}=|x|\). 절댓값은 \(x\)의 범위를 알아야 풀 수 있어요.</p>
<div class="tip"><b>망원 합 (유리화 버전)</b>\[\frac{1}{\sqrt{n+1}+\sqrt n}=\sqrt{n+1}-\sqrt n\]여러 개 더하면 처음과 끝만 남아요.</div>
${SUM(R`근호 안 0 이상, 음수끼리 곱하면 마이너스가 붙는다.`)}`},

{ id:'c2', title:'y = √(a(x−p)) + q 의 그래프', body: R`
${RC(R`\(y=\sqrt x\)는 사실 중3 이차함수 \(y=x^2\)의 오른쪽 반쪽(\(x\ge0\))을 \(y=x\)로 접은 거예요. 바로 앞에서 배운 역함수! 그래서 모양이 <b>옆으로 누운 포물선 반쪽</b>이에요.`)}
${FIG.sqrt4}
<p>기본 모양 4개만 머리에 넣으세요. 시작점은 다 원점이고, 뻗는 방향만 달라요.</p>
<div class="key"><b>읽는 법 3단계</b>① 시작점은 \((p,q)\)<br>② 근호 <b>안</b> \(a\)의 부호: \(+\)면 오른쪽, \(-\)면 왼쪽<br>③ 근호 <b>앞</b> 부호: \(+\)면 위, \(-\)면 아래</div>
<ul><li>\(y=\sqrt{a(x-p)}+q\) (\(a>0\)): 정의역 \(x\ge p\), 치역 \(y\ge q\)</li><li>\(y=\sqrt{a(x-p)}+q\) (\(a<0\)): 정의역 \(x\le p\), 치역 \(y\ge q\)</li></ul>
<div class="warn"><b>꼭 먼저 묶기</b>\(\sqrt{2x+2}\)는 \(\sqrt{2(x+1)}\)로 묶어야 시작점 \(x=-1\)이 보여요. 안 묶고 \(x=-2\)라고 읽는 실수 진짜 많아요.</div>
${SUM(R`시작점 \((p,q)\), 안쪽 부호는 좌우, 바깥 부호는 위아래.`)}`},

{ id:'c3', title:'평행이동과 대칭이동', body: R`
${RC(R`<b>도형의 이동</b> 단원 내용을 무리함수에 그대로 써요. 식에서 뭘 바꾸면 되는지만 기억하면 돼요.`)}
<ul><li><b>평행이동</b> \((m,n)\): \(x\) 대신 \(x-m\), \(y\) 대신 \(y-n\)</li><li><b>\(x\)축 대칭</b>: \(y\) 대신 \(-y\) → 근호 앞 부호가 바뀜 (위아래 뒤집기)</li><li><b>\(y\)축 대칭</b>: \(x\) 대신 \(-x\) → 근호 안 부호가 바뀜 (좌우 뒤집기)</li><li><b>원점 대칭</b>: 둘 다</li></ul>
<div class="warn"><b>순서 주의</b>‘대칭이동 후 평행이동’과 ‘평행이동 후 대칭이동’은 결과가 달라요. 문제에 적힌 순서대로 식에 하나씩 적용하세요.</div>
<div class="tip"><b>넓이 문제 꿀팁</b>모양이 같은 무리함수 그래프 두 개 사이 넓이는, 한쪽을 잘라서 반대편에 붙이면 <b>직사각형</b>이 되는 경우가 많아요. 적분 없이 풀려요.</div>
${SUM(R`안쪽 바꾸면 좌우, 바깥 바꾸면 위아래.`)}`},

{ id:'c4', title:'역함수와 교점', body: R`
${RC(R`역함수 단원 + 공통수학1 판별식의 합작이에요. 처음엔 어려워 보여도 패턴이 정해져 있어요.`)}
<p><b>역함수</b>: \(y=\sqrt{x-p}+q\)의 역함수는 \(y=(x-q)^2+p\) (\(x\ge q\)). 이차함수의 <b>반쪽</b>이 돼요. 정의역 조건 꼭 붙이세요!</p>
<p><b>직선과 몇 번 만나는지</b>: 직선을 위아래로 움직여 본다고 상상하세요. 개수가 바뀌는 순간이 딱 두 개예요.</p>
<div class="key"><b>경계 두 개</b>① 직선이 그래프의 <b>시작점</b>을 지날 때<br>② 직선이 그래프에 <b>접할 때</b> (양변 제곱해서 판별식 \(D=0\))</div>
<p><b>사분면 문제</b>: 시작점이 어디 있는지 + 어느 방향으로 뻗는지, 이 두 개만 보면 지나는 사분면이 바로 정해져요.</p>
${SUM(R`시작점이랑 접할 때, 이 두 순간이 경계.`)}`},
],
};

const ADD_M1 = [
{ u:'prop', id:'M1-01', tag:'진리집합의 포함 관계', c:'c2', t:70, src:MSRC('01',353),
  q:R`전체집합 \(U\)에 대하여 두 조건 \(p, q\)의 진리집합을 각각 \(P, Q\)라고 하자. \(\sim p\to q\)가 참일 때, 다음 중 항상 옳은 것은?`,
  ch:[R`\(P\subset Q\)`,R`\(Q^C\subset P^C\)`,R`\(P\cap Q^C=\varnothing\)`,R`\(P^C\cup Q=Q\)`,R`\(P^C-Q=P\)`], a:3,
  hint:R`\(\sim p\)의 진리집합은 \(P^C\). 명제가 참이면 진리집합끼리 포함 관계.`,
  sol:R`<div class="step">\(\sim p\to q\)가 참 ⟺ \(P^C\subset Q\).</div>
<div class="step">\(A\subset B\)이면 \(A\cup B=B\)이므로 \(P^C\cup Q=Q\). 그래서 ④.</div>
<div class="step">①은 \(p\to q\), ②는 \(p\to q\)의 대우, ③도 \(P\subset Q\)라서 모두 다른 명제예요.</div>
<div class="key"><b>쓴 개념</b>\(A\subset B\) ⟺ \(A\cup B=B\) ⟺ \(A\cap B=A\) ⟺ \(A-B=\varnothing\)</div>`,
  v:{ q:R`두 조건 \(p, q\)의 진리집합 \(P, Q\)에 대하여 \(p\to\sim q\)가 참일 때, 항상 옳은 것은?`, ch:[R`\(P\subset Q\)`,R`\(P\cap Q=\varnothing\)`,R`\(P\cup Q=U\)`,R`\(Q\subset P\)`,R`\(P^C\subset Q\)`], a:1, hint:R`\(\sim q\)의 진리집합은 \(Q^C\).`,
      sol:R`<div class="step">\(P\subset Q^C\) ⟺ \(P\)와 \(Q\)가 겹치는 부분이 없음 ⟺ \(P\cap Q=\varnothing\).</div>` } },

{ u:'rat', id:'M1-03', tag:'유리함수와 역함수가 지나는 점', c:'c4', t:100, src:MSRC('03',353),
  q:R`유리함수 \(y=\dfrac{ax+b}{x-1}\)의 그래프와 그 역함수의 그래프가 모두 점 \((-1,2)\)를 지날 때, 상수 \(a, b\)에 대하여 \(a+b\)의 값은?`,
  ch:['−2','−1','0','2','4'], a:0,
  hint:R`역함수가 \((-1,2)\)를 지난다 = 원래 함수가 \((2,-1)\)을 지난다.`,
  sol:R`<div class="step">원래 그래프가 \((-1,2)\)를 지나니 \(\dfrac{-a+b}{-2}=2\) → \(-a+b=-4\).</div>
<div class="step">역함수가 \((-1,2)\)를 지나면, 원래 함수는 \(x, y\)를 바꾼 \((2,-1)\)을 지나요: \(\dfrac{2a+b}{1}=-1\) → \(2a+b=-1\).</div>
<div class="step">두 식을 빼면 \(3a=3\), \(a=1\), \(b=-3\). \(a+b=-2\).</div>
<div class="key"><b>쓴 개념</b>\(y=f^{-1}(x)\)가 \((p,q)\)를 지남 ⟺ \(y=f(x)\)가 \((q,p)\)를 지남</div>`,
  v:{ q:R`\(y=\dfrac{ax+b}{x-2}\)의 그래프와 그 역함수의 그래프가 모두 점 \((1,3)\)을 지날 때, \(a-b\)의 값은?`, ch:['3','5','7','9','−7'], a:2, hint:R`원래 함수가 \((1,3)\), \((3,1)\)을 지나요.`,
      sol:R`<div class="step">\(\dfrac{a+b}{-1}=3\) → \(a+b=-3\). \(\dfrac{3a+b}{1}=1\) → \(3a+b=1\).</div><div class="step">\(a=2,\ b=-5\), \(a-b=7\).</div>` } },

{ u:'prop', id:'M1-05', tag:'‘모든’ 명제와 판별식', c:'c3', t:90, src:MSRC('05',353),
  q:R`명제 ‘모든 실수 \(x\)에 대하여 \(2x^2-2kx+3k>0\)이다.’가 거짓이 되도록 하는 자연수 \(k\)의 최솟값은?`,
  ch:['3','4','5','6','8'], a:3,
  hint:R`거짓 = 부정 ‘어떤 \(x\)에 대하여 \(2x^2-2kx+3k\le0\)’이 참.`,
  sol:R`<div class="step">명제가 거짓이려면 부정인 ‘어떤 \(x\)에 대하여 \(2x^2-2kx+3k\le0\)’이 참이어야 해요.</div>
<div class="step">위로 볼록한 포물선이 \(x\)축에 닿거나 아래로 내려가야 하니 판별식 \(\dfrac D4=k^2-6k\ge0\).</div>
<div class="step">\(k(k-6)\ge0\) → \(k\le0\) 또는 \(k\ge6\). 자연수 최솟값 6.</div>
<div class="warn"><b>자주 틀림</b>‘참이 되도록’으로 착각하면 \(D<0\)을 써서 \(0<k<6\)이 나와요. 문제 끝의 ‘거짓’을 꼭 확인!</div>`,
  v:{ q:R`명제 ‘모든 실수 \(x\)에 대하여 \(x^2-2kx+2k+3>0\)이다.’가 거짓이 되도록 하는 자연수 \(k\)의 최솟값은?`, ch:['1','2','3','4','5'], a:2, hint:R`\(\dfrac D4\ge0\).`,
      sol:R`<div class="step">\(\dfrac D4=k^2-2k-3\ge0\) → \((k-3)(k+1)\ge0\) → \(k\ge3\) (자연수). 최솟값 3.</div>` } },

{ u:'irr', id:'M1-06', tag:'무리함수의 정의역과 치역', c:'c2', t:90, src:MSRC('06',353),
  q:R`무리함수 \(f(x)=-\sqrt{ax-4}+2\)의 정의역이 \(\{x\mid x\le-2\}\)이고 치역이 \(\{y\mid y\le b\}\)일 때, \(f(a-b)\)의 값은? (단, \(a, b\)는 상수이다.)`,
  ch:['2','1','0','−1','−2'], a:2,
  hint:R`근호 안 \(\ge0\)을 풀면 \(x\le\dfrac4a\) 꼴이 나와야 해요. 그러려면 \(a\)의 부호는?`,
  sol:R`<div class="step">정의역이 \(x\le-2\)처럼 왼쪽으로 뻗으려면 \(a<0\). 근호 안 \(ax-4\ge0\) → \(x\le\dfrac4a\).</div>
<div class="step">\(\dfrac4a=-2\) → \(a=-2\).</div>
<div class="step">근호 앞이 \(-\)라 그래프는 시작점 \((-2,2)\)에서 아래로: 치역 \(y\le2\), \(b=2\).</div>
<div class="step">\(f(a-b)=f(-4)=-\sqrt{8-4}+2=0\).</div>`,
  v:{ q:R`\(f(x)=\sqrt{ax+4}+1\)의 정의역이 \(\{x\mid x\le2\}\)일 때, \(f(3a)\)의 값은?`, ch:['3','4','5','6','7'], a:2, hint:R`\(-\dfrac4a=2\).`,
      sol:R`<div class="step">\(a<0\), \(x\le-\dfrac4a=2\) → \(a=-2\).</div><div class="step">\(f(-6)=\sqrt{12+4}+1=5\).</div>` } },

{ u:'func', id:'M1-07', tag:'조건으로 함숫값 구하기', c:'c1', t:90, src:MSRC('07',354),
  q:R`정의역이 자연수 전체의 집합이고 공역이 실수 전체의 집합인 함수 \(f\)가 다음 조건을 만족시킨다.<div class="key">(가) \(p\)가 소수이면 \(f(p)=2p\)<br>(나) 임의의 두 자연수 \(a, b\)에 대하여 \(f(ab)=f(a)+f(b)\)</div>\(f(216)\)의 값은? (단, \(f(1)=0\))`,
  ch:['20','24','28','30','32'], a:3,
  hint:R`216을 소인수분해하세요.`,
  sol:R`<div class="step">\(216=2^3\times3^3\).</div>
<div class="step">(나)를 반복하면 곱은 합으로 쪼개져요: \(f(216)=3f(2)+3f(3)\).</div>
<div class="step">(가)에서 \(f(2)=4,\ f(3)=6\). \(3\times4+3\times6=30\).</div>`,
  v:{ q:R`자연수에서 정의된 함수 \(f\)가 (가) 소수 \(p\)에 대하여 \(f(p)=p+1\), (나) \(f(ab)=f(a)+f(b)\)를 만족시킬 때, \(f(72)\)의 값은?`, ch:['13','15','17','19','21'], a:2, hint:R`\(72=2^3\times3^2\).`,
      sol:R`<div class="step">\(f(72)=3f(2)+2f(3)=3\times3+2\times4=17\).</div>` } },

{ u:'rat', id:'M1-08', tag:'모든 사분면을 지나는 조건', c:'c2', t:120, src:MSRC('08',354),
  q:R`유리함수 \(y=\dfrac{4x+a}{x-1}\)의 그래프가 모든 사분면을 지나도록 하는 정수 \(a\)의 최솟값은? (단, \(a\ne-4\))`,
  ch:['−2','−1','0','1','2'], a:3,
  hint:R`\(4+\dfrac{a+4}{x-1}\)로 바꾸고, 점근선 교점 \((1,4)\)를 기준으로 그래프 모양을 그려 보세요. \(y\)절편이 핵심.`,
  sol:R`<div class="step">\(y=4+\dfrac{a+4}{x-1}\). 점근선 \(x=1,\ y=4\), 교점 \((1,4)\)는 1사분면.</div>
<div class="step">\(k=a+4<0\)이면 그래프가 \(y>4\) 쪽(왼쪽)과 \(y<4\) 쪽(오른쪽, 위로 올라가는 가지)에 있는데, 오른쪽 가지는 \(x>1\)이라 3사분면을 못 지나요. 탈락.</div>
<div class="step">\(k>0\)이면 왼쪽 가지(\(x<1\))가 위(\(y\to4\))에서 아래(\(y\to-\infty\))로 내려와요. 2, 4사분면은 지나고, 3사분면까지 지나려면 \(x<0\)에서 \(y<0\)인 곳이 있어야 → \(y\)절편 \(-a<0\).</div>
<figure><svg class="fig" viewBox="0 0 260 200" width="240"><line x1="10" y1="140" x2="250" y2="140" class="ax"/><line x1="110" y1="10" x2="110" y2="195" class="ax"/><line x1="150" y1="5" x2="150" y2="195" class="ds"/><line x1="10" y1="60" x2="250" y2="60" class="ds"/>

<div class="step">\(a>0\)이고 \(a+4>0\) → \(a>0\). 정수 최솟값 1.</div>`,
  v:{ q:R`\(y=\dfrac{2x+a}{x+1}\)의 그래프가 모든 사분면을 지나도록 하는 정수 \(a\)의 최댓값은? (단, \(a\ne2\))`, ch:['−2','−1','0','1','2'], a:1, hint:R`점근선 교점 \((-1,2)\)는 2사분면. 오른쪽 가지가 4사분면을 지나야 해요.`,
      sol:R`<div class="step">\(y=2+\dfrac{a-2}{x+1}\). \(k=a-2>0\)이면 오른쪽 가지가 \(y>2\)라 4사분면 X. 그래서 \(k<0\).</div><div class="step">\(k<0\)일 때 오른쪽 가지는 아래에서 올라와 \(y\to2\). 4사분면을 지나려면 \(y\)절편 \(a<0\). 최댓값 \(-1\).</div>` } },

{ u:'func', id:'M1-09', tag:'치역으로 정의역 찾기', c:'c1', t:80, src:MSRC('09',354),
  q:R`집합 \(X=\{a,b,c\}\)를 정의역으로 하는 함수 \(f(x)=x^2-4x+6\)의 치역이 \(\{2, 11\}\)일 때, \(a-b+c\)의 값은? (단, \(a<b<c\))`,
  ch:['−3','−2','−1','1','2'], a:4,
  hint:R`\(f(x)=2\), \(f(x)=11\)을 각각 풀어 보세요.`,
  sol:R`<div class="step">\(f(x)=(x-2)^2+2\).</div>
<div class="step">\(f(x)=2\) → \(x=2\). \(f(x)=11\) → \((x-2)^2=9\) → \(x=-1\) 또는 \(5\).</div>
<div class="step">원소가 세 개니까 \(X=\{-1,2,5\}\). \(a-b+c=-1-2+5=2\).</div>`,
  v:{ q:R`\(X=\{a,b,c\}\)를 정의역으로 하는 \(f(x)=x^2-2x+3\)의 치역이 \(\{2,6\}\)일 때, \(a-b+c\)의 값은? (단, \(a<b<c\))`, ch:['−3','−1','0','1','3'], a:3, hint:R`\(f(x)=(x-1)^2+2\).`,
      sol:R`<div class="step">\(f=2\) → \(x=1\), \(f=6\) → \(x=-1, 3\). \(-1-1+3=1\).</div>` } },

{ u:'prop', id:'M1-10', tag:'명제가 참이 될 조건', c:'c2', t:60, src:MSRC('10',354),
  q:R`실수 \(x\)에 대하여 두 조건 \(p, q\)가 \(p: x\ge a\), \(q: 1\le x\le3\) 또는 \(x\ge7\)이다. 명제 \(p\to q\)가 참이 되도록 하는 상수 \(a\)의 최솟값은?`,
  ch:['1','3','5','7','9'], a:3,
  hint:R`오른쪽으로 끝없이 뻗는 \(P\)가 \(Q\)의 어느 부분에 쏙 들어갈 수 있을까요?`,
  sol:R`<div class="step">\(P=\{x\mid x\ge a\}\)는 오른쪽으로 끝없이 뻗어요. \(Q\)에서 끝없이 뻗는 부분은 \(x\ge7\)뿐.</div>
<div class="step">\(P\subset Q\) → \(a\ge7\). 최솟값 7.</div>`,
  v:{ q:R`\(p: x\le a\), \(q: x\le-2\) 또는 \(3\le x\le5\)일 때, \(p\to q\)가 참이 되도록 하는 \(a\)의 최댓값은?`, ch:['−3','−2','3','5','−1'], a:1, hint:R`왼쪽으로 끝없이 뻗는 부분.`,
      sol:R`<div class="step">\(x\le a\)가 \(x\le-2\) 안에 들어가야 하니 \(a\le-2\). 최댓값 \(-2\).</div>` } },

{ u:'inv', id:'M1-11', tag:'일대일대응과 역함수의 값', c:'c2', t:120, src:MSRC('11',354),
  q:R`집합 \(X=\{1,2,3,4\}\)에서 집합 \(Y=\{1,2,4,8\}\)로의 함수 \(f\)가 다음 조건을 만족시킨다. \(f(4)+f^{-1}(1)\)의 값은?<div class="key">(가) \(f(1)=4\)<br>(나) 함수 \(f\)는 일대일대응이다.<br>(다) \(x\)가 짝수이면 \(f(x)=ax^2\) (\(a\)는 상수)</div>`,
  ch:['7','9','10','11','12'], a:3,
  hint:R`\(f(4)=16a\)는 \(f(2)=4a\)의 4배. \(Y\)에서 4배 관계인 두 수는?`,
  sol:R`<div class="step">\(f(2)=4a,\ f(4)=16a\)이고 \(f(1)=4\)이니 이 둘은 \(\{1,2,8\}\) 중 서로 다른 값.</div>
<div class="step">\(f(4)=4\times f(2)\)인 쌍은 \((2,8)\)뿐 → \(f(2)=2,\ f(4)=8\), \(a=\dfrac12\).</div>
<div class="step">남은 \(f(3)=1\) → \(f^{-1}(1)=3\).</div>
<div class="step">\(f(4)+f^{-1}(1)=8+3=11\).</div>`,
  v:{ q:R`\(X=\{1,2,3,4\}\)에서 \(Y=\{2,3,8,32\}\)로의 일대일대응 \(f\)가 \(f(1)=2\), 짝수 \(x\)에 대하여 \(f(x)=ax^2\)을 만족시킬 때, \(f(4)+f^{-1}(3)\)의 값은?`, ch:['33','34','35','36','37'], a:2, hint:R`남은 \(\{3,8,32\}\)에서 4배 관계인 쌍.`,
      sol:R`<div class="step">\(f(4)=4f(2)\)인 쌍은 \((8,32)\)뿐 → \(f(2)=8,\ f(4)=32\), \(f(3)=3\).</div><div class="step">\(32+3=35\).</div>` } },

{ u:'rat', id:'M1-12', tag:'평행이동과 점근선의 교점', c:'c4', t:100, src:MSRC('12',354),
  q:R`유리함수 \(f(x)=\dfrac{2x+k}{x+3}\)의 그래프를 \(x\)축의 방향으로 \(-1\)만큼, \(y\)축의 방향으로 2만큼 평행이동한 곡선을 \(y=g(x)\)라 하자. 곡선 \(y=g(x)\)의 두 점근선의 교점이 곡선 \(y=f(x)\) 위의 점일 때, 상수 \(k\)의 값은?`,
  ch:['−6','−4','−2','2','4'], a:4,
  hint:R`\(f\)의 점근선 교점 \((-3,2)\)를 옮기면 \(g\)의 점근선 교점.`,
  sol:R`<div class="step">\(f\)의 점근선: \(x=-3,\ y=2\) → 교점 \((-3,2)\).</div>
<div class="step">평행이동하면 \(g\)의 점근선 교점은 \((-4,4)\).</div>
<div class="step">이 점이 \(y=f(x)\) 위: \(f(-4)=\dfrac{-8+k}{-1}=8-k=4\) → \(k=4\).</div>`,
  v:{ q:R`\(f(x)=\dfrac{3x+k}{x-1}\)의 그래프를 \(x\)축 방향으로 2만큼, \(y\)축 방향으로 \(-1\)만큼 평행이동한 곡선의 두 점근선의 교점이 \(y=f(x)\) 위에 있을 때, \(k\)의 값은?`, ch:['−7','−5','−3','3','5'], a:1, hint:R`교점 \((1,3)\to(3,2)\).`,
      sol:R`<div class="step">\(f(3)=\dfrac{9+k}{2}=2\) → \(k=-5\).</div>` } },

{ u:'prop', id:'M1-13', tag:'필요조건이지만 충분조건이 아닌 것', c:'c5', t:120, src:MSRC('13',355),
  q:R`두 실수 \(a, b\)에 대해 보기 중 \(p\)가 \(q\)이기 위한 필요조건이지만 충분조건이 아닌 것을 있는 대로 고른 것은?<div class="key">ㄱ. \(p: |a|\le3\) &nbsp; \(q: 0\le a\le2\)<br>ㄴ. \(p: a>1\)이고 \(b>1\) &nbsp; \(q: a+b>1\)<br>ㄷ. \(p: a^2+b^2=0\) &nbsp; \(q: |a|+|b|=0\)<br>ㄹ. \(p: |a|+|b|=|a+b|\) &nbsp; \(q: a\ge0\)이고 \(b\ge0\)</div>`,
  ch:['ㄱ, ㄴ','ㄱ, ㄷ','ㄱ, ㄹ','ㄴ, ㄷ','ㄴ, ㄹ'], a:2,
  hint:R`필요조건이지만 충분조건 아님 = \(Q\subset P\)이고 \(P\ne Q\). \(p\)가 더 큰 집합.`,
  sol:R`<div class="step">찾는 것: \(q\Rightarrow p\)는 참, \(p\Rightarrow q\)는 거짓. 즉 \(P\)가 \(Q\)보다 큰 집합.</div>
<div class="step">ㄱ. \(P=[-3,3]\supset Q=[0,2]\) ✔</div>
<div class="step">ㄴ. \(a>1, b>1\)이면 \(a+b>2>1\) → \(P\subset Q\). 거꾸로라 ✘</div>
<div class="step">ㄷ. 둘 다 \(a=b=0\) → 필요충분조건 ✘</div>
<div class="step">ㄹ. \(|a|+|b|=|a+b|\) ⟺ \(ab\ge0\) (둘 다 0 이상 또는 둘 다 0 이하). \(Q\)는 그 일부 ✔</div>
<div class="key"><b>쓴 개념</b>\(|a|+|b|=|a+b|\) ⟺ \(ab\ge0\)</div>`,
  v:{ q:R`두 실수 \(a, b\)에 대해 \(p\)가 \(q\)이기 위한 충분조건이지만 필요조건이 아닌 것을 있는 대로 고른 것은?<div class="key">ㄱ. \(p: |a|\le1\), \(q: |a|\le2\)<br>ㄴ. \(p: ab=0\), \(q: a=0\)<br>ㄷ. \(p: a=b=0\), \(q: a^2+b^2=0\)<br>ㄹ. \(p: a>0\)이고 \(b>0\), \(q: ab>0\)</div>`, ch:['ㄱ, ㄴ','ㄱ, ㄷ','ㄱ, ㄹ','ㄴ, ㄷ','ㄴ, ㄹ'], a:2, hint:R`\(P\subset Q\), \(P\ne Q\).`,
      sol:R`<div class="step">ㄱ ✔ (\(P\subsetneq Q\)). ㄴ: \(Q\subset P\)라 거꾸로 ✘. ㄷ: 같음 ✘. ㄹ: \(ab>0\)은 둘 다 음수도 포함 → \(P\subsetneq Q\) ✔.</div>` } },

{ u:'inv', id:'M1-14', tag:'일대일대응의 합성', c:'c1', t:120, src:MSRC('14',355),
  q:R`집합 \(X=\{1,2,3,4\}\)에 대하여 \(X\)에서 \(X\)로의 두 함수 \(f, g\)가 모두 일대일대응이고, 다음 조건을 만족시킬 때, \((g\circ f)(2)+(f\circ g)(2)\)의 값은?<div class="key">(가) \(f(1)=2,\ g(3)=4,\ g(4)=2\)<br>(나) \((g\circ f)(3)=2,\ (g\circ f)(2)=3\)</div>`,
  ch:['3','4','5','6','7'], a:2,
  hint:R`\(g(f(3))=2\)인데 \(g(4)=2\)이니 \(f(3)\)은?`,
  sol:R`<div class="step">\(g(f(3))=2\)이고 \(g(4)=2\), \(g\)는 일대일 → \(f(3)=4\).</div>
<div class="step">\(f\)의 남은 값은 \(\{1,3\}\) (\(f(2), f(4)\)). \(g\)의 남은 값도 \(\{1,3\}\) (\(g(1), g(2)\)).</div>
<div class="step">\(g(f(2))=3\): \(f(2)=3\)이면 \(g(3)=4\ne3\) ✘. 그래서 \(f(2)=1\), \(g(1)=3\), \(g(2)=1\).</div>
<div class="step">\((g\circ f)(2)=3\), \((f\circ g)(2)=f(1)=2\). 합 5.</div>`,
  v:{ q:R`\(X=\{1,2,3\}\)에서 \(X\)로의 일대일대응 \(f, g\)가 \(f(1)=3,\ f(3)=2,\ g(3)=1,\ (g\circ f)(2)=3\)을 만족시킬 때, \((f\circ g)(2)+(g\circ f)(3)\)의 값은?`, ch:['2','3','4','5','6'], a:1, hint:R`\(f(2)=1\)부터.`,
      sol:R`<div class="step">\(f(2)=1\). \(g(1)=3\), 남은 \(g(2)=2\).</div><div class="step">\((f\circ g)(2)=f(2)=1\), \((g\circ f)(3)=g(2)=2\). 합 3.</div>` } },

{ u:'irr', id:'M1-15', tag:'무리함수의 역함수', c:'c4', t:100, src:MSRC('15',355),
  q:R`함수 \(f(x)=\sqrt{2x+1}+a\)에 대하여 함수 \(g(x)\)가 \((f\circ g)(x)=x\)를 만족시키고 \(g(2)=4\)일 때, \((g\circ g)(2)\)의 값은? (단, \(a\)는 상수이다.)`,
  ch:['10','12','14','16','18'], a:1,
  hint:R`\(f\circ g=I\)이면 \(g=f^{-1}\). \(g(2)=4\) ⟺ \(f(4)=2\).`,
  sol:R`<div class="step">\(g=f^{-1}\). \(g(2)=4\) → \(f(4)=2\): \(\sqrt9+a=2\) → \(a=-1\).</div>
<div class="step">\((g\circ g)(2)=g(4)\). \(g(4)=k\) ⟺ \(f(k)=4\): \(\sqrt{2k+1}-1=4\) → \(2k+1=25\) → \(k=12\).</div>`,
  v:{ q:R`\(f(x)=\sqrt{x+3}+a\)에 대하여 \((f\circ g)(x)=x\), \(g(1)=6\)일 때, \((g\circ g)(1)\)의 값은?`, ch:['33','45','52','61','64'], a:3, hint:R`\(f(6)=1\).`,
      sol:R`<div class="step">\(3+a=1\) → \(a=-2\). \(g(6)=k\): \(\sqrt{k+3}-2=6\) → \(k=61\).</div>` } },

{ u:'func', id:'M1-16', tag:'구간별 함수의 일대일대응', c:'c3', t:90, src:MSRC('16',355),
  q:R`실수 전체의 집합에서 정의된 함수 \(f(x)=\begin{cases}(a+4)x+1&(x<0)\\(3-a)x+b&(x\ge0)\end{cases}\)이 일대일대응이 되도록 하는 모든 정수 \(a\)의 값의 합을 \(S\)라 할 때, \(b-S\)의 값은?`,
  ch:['1','2','3','4','5'], a:3,
  hint:R`이어져야 하고(경계값 같음), 기울기 부호가 같아야 해요.`,
  sol:R`<div class="step">\(x=0\)에서 이어져야 하니 \(b=1\).</div>
<div class="step">기울기 부호 같음: \((a+4)(3-a)>0\) → \(-4<a<3\). 정수 \(-3,-2,\dots,2\), 합 \(S=-3\).</div>
<div class="step">\(b-S=1+3=4\).</div>`,
  v:{ q:R`\(f(x)=\begin{cases}(a+2)x+3&(x<0)\\(5-a)x+b&(x\ge0)\end{cases}\)이 일대일대응이 되도록 하는 모든 정수 \(a\)의 합을 \(S\)라 할 때, \(b+S\)의 값은?`, ch:['9','10','11','12','13'], a:3, hint:R`\(b=3\).`,
      sol:R`<div class="step">\(b=3\), \(-2<a<5\) → \(S=-1+0+1+2+3+4=9\). \(b+S=12\).</div>` } },

{ u:'inv', id:'M1-19', tag:'구간별 함수의 역함수 값', c:'c2', t:150, src:MSRC('19',356),
  q:R`정의역과 공역이 실수 전체의 집합이고 역함수가 존재하는 함수 \(f(x)=\begin{cases}x+2&(x<3)\\x^2-6x+a&(x\ge3)\end{cases}\)의 역함수를 \(g\)라 하자. \((g\circ g)(6)=b\)일 때, 실수 \(a, b\)에 대하여 \(ab\)의 값은?`,
  ch:['12','18','24','28','32'], a:3,
  hint:R`역함수가 있으려면 \(x=3\)에서 이어져야 해요. 그다음 \(g(6)\)은 \(f(x)=6\)의 해.`,
  sol:R`<div class="step">일대일대응이려면 \(x=3\)에서 이어져야: \(3+2=9-18+a\) → \(a=14\).</div>
<div class="step">\(g(6)=k\) ⟺ \(f(k)=6\). \(x<3\)에서는 \(x+2<5\)라 6이 안 나와요. \(x\ge3\): \(x^2-6x+14=6\) → \((x-2)(x-4)=0\) → \(x=4\) (\(x\ge3\)). \(g(6)=4\).</div>
<div class="step">\(g(4)=m\) ⟺ \(f(m)=4\): \(x<3\)에서 \(x+2=4\) → \(x=2\) ✔. \(b=2\).</div>
<div class="step">\(ab=28\).</div>`,
  v:{ q:R`역함수가 존재하는 \(f(x)=\begin{cases}x+1&(x<2)\\x^2-4x+a&(x\ge2)\end{cases}\)의 역함수를 \(g\)라 할 때, \((g\circ g)(4)=b\)이면 \(ab\)의 값은?`, ch:['7','12','14','18','21'], a:2, hint:R`\(a=7\).`,
      sol:R`<div class="step">연결: \(3=4-8+a\) → \(a=7\). \(g(4)\): \(x\ge2\)에서 \(x^2-4x+7=4\) → \(x=3\).</div><div class="step">\(g(3)\): \(x<2\)면 \(x=2\)라 ✘, \(x\ge2\)면 \(x^2-4x+7=3\) → \(x=2\). \(b=2\), \(ab=14\).</div>` } },

{ u:'inv', id:'M1-20', tag:'합성함수 방정식의 실근', c:'c1', t:180, src:MSRC('20',356),
  q:R`이차함수 \(y=f(x)\)의 그래프는 아래로 볼록하고 \(f(-1)=0,\ f(5)=0\)이다. 방정식 \((f\circ f)(x)=0\)의 서로 다른 실근의 개수가 3일 때, 이 서로 다른 세 실근의 곱의 값은?`,
  ch:['−100','−98','−90','−72','−64'], a:0,
  hint:R`\(f(f(x))=0\) ⟺ \(f(x)=-1\) 또는 \(f(x)=5\). 각각 근이 몇 개씩이어야 합이 3개일까요?`,
  sol:R`<div class="step">\(f(t)=0\)의 해가 \(t=-1, 5\)이므로 \(f(f(x))=0\) ⟺ \(f(x)=-1\) 또는 \(f(x)=5\).</div>
<div class="step">\(f(x)=a(x+1)(x-5)\) (\(a>0\)), 꼭짓점 \(x=2\), 최솟값 \(-9a\). 직선 \(y=5\)는 최솟값보다 위라 항상 2개.</div>
<div class="step">합이 3개이려면 \(y=-1\)이 꼭짓점에 딱 닿아야(1개): \(-9a=-1\) → \(a=\dfrac19\). 그 근은 \(x=2\).</div>
<div class="step">\(f(x)=5\): \(\dfrac19(x+1)(x-5)=5\) → \(x^2-4x-50=0\), 두 근의 곱 \(-50\).</div>
<div class="step">세 근의 곱 \(2\times(-50)=-100\).</div>`,
  v:{ q:R`아래로 볼록한 이차함수 \(f\)가 \(f(-2)=0,\ f(4)=0\)이고, \((f\circ f)(x)=0\)의 서로 다른 실근이 3개일 때, 세 실근의 곱은?`, ch:['−52','−26','−13','13','26'], a:1, hint:R`\(f(x)=-2\)가 꼭짓점에서 접해야 해요.`,
      sol:R`<div class="step">\(f(x)=a(x+2)(x-4)\), 최솟값 \(f(1)=-9a=-2\) → \(a=\dfrac29\). 그 근 \(x=1\).</div><div class="step">\(f(x)=4\): \((x+2)(x-4)=18\) → \(x^2-2x-26=0\), 곱 \(-26\). 전체 \(1\times(-26)=-26\).</div>` } },

{ u:'rat', id:'M1-21', tag:'제한된 정의역에서 최대·최소', c:'c3', t:90, input:'8', src:MSRC('21',356),
  q:R`정의역이 \(\{x\mid0\le x\le a\}\)인 함수 \(y=\dfrac{k}{x+1}+3\ (k>0)\)의 최댓값이 9, 최솟값이 5일 때, 상수 \(a, k\)에 대하여 \(k+a\)의 값을 구하시오. (단, \(a>0\))`,
  hint:R`\(k>0\)이고 \(x>-1\) 쪽이니 계속 감소해요. 최대는 \(x=0\), 최소는 \(x=a\).`,
  sol:R`<div class="step">\(k>0\)이면 \(x>-1\)에서 감소. 최댓값 \(x=0\): \(k+3=9\) → \(k=6\).</div>
<div class="step">최솟값 \(x=a\): \(\dfrac{6}{a+1}+3=5\) → \(a+1=3\) → \(a=2\).</div>
<div class="step">\(k+a=8\).</div>`,
  v:{ q:R`정의역이 \(\{x\mid0\le x\le a\}\)인 \(y=\dfrac{k}{x+2}+1\ (k>0)\)의 최댓값이 4, 최솟값이 2일 때, \(k+a\)의 값을 구하시오.`, input:'10', hint:R`\(x=0\)에서 최대.`,
      sol:R`<div class="step">\(\dfrac k2+1=4\) → \(k=6\). \(\dfrac{6}{a+2}+1=2\) → \(a=4\). 합 10.</div>` } },

{ u:'inv', id:'M1-22', tag:'합성함수의 규칙성', c:'c1', t:120, input:'100', src:MSRC('22',356),
  q:R`집합 \(X=\{x\mid0\le x\le2\}\)에 대하여 함수 \(f: X\to X\)를 \(f(x)=\begin{cases}x+1&(0\le x<1)\\x-1&(1\le x\le2)\end{cases}\)라 하고, \(f^1=f,\ f^{n+1}=f\circ f^n\ (n=1,2,3,\dots)\)으로 정의할 때, \(f\left(\dfrac12\right)+f^2\left(\dfrac12\right)+f^3\left(\dfrac12\right)+\cdots+f^{100}\left(\dfrac12\right)\)의 값을 구하시오.`,
  hint:R`처음 몇 개만 직접 계산해서 반복되는 규칙을 찾으세요.`,
  sol:R`<div class="step">\(f\left(\dfrac12\right)=\dfrac32\), \(f^2\left(\dfrac12\right)=f\left(\dfrac32\right)=\dfrac12\), \(f^3\left(\dfrac12\right)=\dfrac32\), …</div>
<div class="step">\(\dfrac32,\ \dfrac12\)이 번갈아 나와요. 두 개씩 묶으면 합이 2, 100개면 50묶음.</div>
<div class="step">\(50\times2=100\).</div>`,
  v:{ q:R`\(X=\{x\mid0\le x\le3\}\)에서 \(f(x)=\begin{cases}x+2&(0\le x<1)\\x-1&(1\le x\le3)\end{cases}\)이고 \(f^{n+1}=f\circ f^n\)일 때, \(f\left(\dfrac12\right)+f^2\left(\dfrac12\right)+\cdots+f^{30}\left(\dfrac12\right)\)의 값을 구하시오.`, input:'45', hint:R`3개씩 반복돼요.`,
      sol:R`<div class="step">\(\dfrac52\to\dfrac32\to\dfrac12\to\dfrac52\to\cdots\), 3개 합 \(\dfrac92\). 30개면 10묶음 → 45.</div>` } },

{ u:'inv', id:'M1-23', tag:'함수와 역함수로 둘러싸인 넓이', c:'c4', t:180, input:'27', src:MSRC('23',356),
  q:R`함수 \(f(x)=\begin{cases}\dfrac12x+4&(x\ge2)\\2x+1&(x<2)\end{cases}\)의 역함수를 \(g(x)\)라 할 때, 두 함수 \(y=f(x)\)와 \(y=g(x)\)의 그래프로 둘러싸인 부분의 넓이를 구하시오.`,
  hint:R`두 그래프는 \(y=x\)에 대칭. \(f\)와 \(y=x\) 사이 넓이의 2배예요.`,
  sol:R`<div class="step">\(f\)는 증가함수라 \(f\)와 \(g\)는 \(y=x\) 위에서 만나요. \(2x+1=x\) → \((-1,-1)\), \(\dfrac12x+4=x\) → \((8,8)\). 꺾이는 점은 \((2,5)\).</div>
<figure><svg class="fig" viewBox="0 0 220 220" width="210"><line x1="10" y1="190" x2="215" y2="190" class="ax"/><line x1="30" y1="215" x2="30" y2="5" class="ax"/>
<polygon points="10,210 70,90 190,30" class="fill1"/><polygon points="10,210 130,150 190,30" class="fill3"/>
<line x1="5" y1="215" x2="205" y2="15" class="ds"/><polyline points="10,210 70,90 190,30" class="c1"/><polyline points="10,210 130,150 190,30" class="c2"/>
<circle cx="70" cy="90" r="3.5" class="dot"/><text x="40" y="84">(2, 5)</text><text x="170" y="22">(8, 8)</text><text x="14" y="204" font-size="11">(−1, −1)</text></svg></figure>
<div class="step">\(f\)와 \(y=x\) 사이는 꼭짓점이 \((-1,-1), (2,5), (8,8)\)인 삼각형. 넓이 \(=\dfrac12\,|3\times9-9\times6|=\dfrac{27}{2}\).</div>
<div class="step">대칭이니 전체는 \(2\times\dfrac{27}{2}=27\).</div>`,
  v:{ q:R`\(f(x)=\begin{cases}\dfrac12x+3&(x\ge2)\\2x&(x<2)\end{cases}\)의 역함수를 \(g\)라 할 때, \(y=f(x)\), \(y=g(x)\)의 그래프로 둘러싸인 넓이를 구하시오.`, input:'12', hint:R`교점 \((0,0), (6,6)\), 꺾인 점 \((2,4)\).`,
      sol:R`<div class="step">삼각형 \((0,0),(2,4),(6,6)\) 넓이 \(=\dfrac12|2\times6-6\times4|=6\). 2배 → 12.</div>` } },
];
