/* ========== 간격 복습·XP·리포트·유형별 ========== */
const IV = [1,3,7];
function ens2(){ S.srs = S.srs || {}; S.reports = S.reports || []; S.cnt = S.cnt || S.log.length; }
ens2();
Object.keys(S.att).forEach(k=>{ if (!k.endsWith('v') && S.att[k].last===false && !S.srs[k]) S.srs[k] = { stage:0, due:Date.now() }; });
function srsUpdate(pid, ok){
  ens2(); const now = Date.now(), t0 = startOfDay(now), s = S.srs[pid];
  if (!ok) { S.srs[pid] = { stage:0, due:t0+DAY }; return; }
  if (s && s.due <= now) { const st = s.stage+1; if (st >= IV.length) delete S.srs[pid]; else S.srs[pid] = { stage:st, due:t0+IV[st]*DAY }; }
}
function dueList(t){ ens2(); return Object.keys(S.srs).filter(k=>S.srs[k].due <= t && findProblem(k)); }
function dueOn(day){ ens2(); return Object.keys(S.srs).filter(k=>{ const d = startOfDay(S.srs[k].due); return d === day; }).length; }
function probTarget(k){ const f = findProblem(k.replace(/v$/,'')); return f ? f.p.t : 120; }
function xpOf(ok, sec, k){ return ok ? 10 + (sec <= probTarget(k) ? 5 : 0) : 0; }
function solveXP(){ return S.log.reduce((s,x)=>s+xpOf(x.ok, x.sec, x.k), 0); }
function groupOf(pid){ const f = findProblem(pid.replace(/v$/,'')); return f ? { key:f.u.id+'|'+f.p.c, name:f.u.name+' · '+conceptTitle(f.u,f.p.c), u:f.u, c:f.p.c } : null; }
function conceptAcc(){
  const g = {};
  UNITS.forEach(u=>u.problems.forEach(p=>{ ['', 'v'].forEach(s=>{ const a = S.att[p.id+s]; if (!a) return; const key = u.id+'|'+p.c; g[key] = g[key] || { name:u.name+' · '+conceptTitle(u,p.c), u, c:p.c, n:0, ok:0, ids:new Set() }; g[key].n += a.n; g[key].ok += a.ok; g[key].ids.add(p.id); }); }));
  return Object.values(g).map(v=>({ ...v, acc: Math.round(v.ok/v.n*100) })).sort((a,b)=>a.acc-b.acc);
}
function makeReport(){
  ens2(); const L = S.log, last = L.slice(-30); if (!last.length) return null;
  const prev = L.slice(Math.max(0, L.length-60), Math.max(0, L.length-30));
  const r = arr=>Math.round(arr.filter(x=>x.ok).length/arr.length*100);
  const g = {}; last.forEach(x=>{ const o = groupOf(x.k); if (!o) return; g[o.key] = g[o.key] || { name:o.name, n:0, ok:0 }; g[o.key].n++; if (x.ok) g[o.key].ok++; });
  const weak = Object.values(g).filter(v=>v.ok<v.n).sort((a,b)=>a.ok/a.n-b.ok/b.n).slice(0,2).map(v=>({ name:v.name, acc:Math.round(v.ok/v.n*100) }));
  const rep = { at:Date.now(), n:last.length, acc:r(last), pacc: prev.length ? r(prev) : null, avg:Math.round(last.reduce((s,x)=>s+x.sec,0)/last.length), weak, due:dueList(Date.now()+DAY*365).length };
  S.reports.push(rep); if (S.reports.length > 40) S.reports.shift(); save(); return rep;
}
function reportSummary(r){
  const diff = r.pacc===null ? null : r.acc - r.pacc;
  return `최근 ${r.n}문항을 풀었고 정답률은 ${r.acc}%${diff===null ? '예요' : diff>=0 ? `로 지난번보다 ${diff}%p 올랐어요` : `로 지난번보다 ${-diff}%p 내려갔어요`}. `
    + (r.weak.length ? `${r.weak.map(w=>`‘${w.name}’`).join(', ')}에서 자주 틀렸어요. 그 개념 카드부터 다시 보고 약한 유형 모아 풀기로 확인하세요.` : '틀린 개념 없이 깔끔했어요. 섞어 풀기로 감을 유지하세요.');
}
function trendSVG(){
  const rs = S.reports.slice(-8); if (rs.length < 2) return '<p class="small" style="margin:6px 2px 0">리포트가 두 개 이상 쌓이면 추이 그래프가 나와요.</p>';

  ${rs.map((r,i)=>`<circle cx="${px(i)}" cy="${py(r.acc)}" r="3.5" class="dot"/>`).join('')}
  <text x="${px(rs.length-1)}" y="${py(rs[rs.length-1].acc)-10}" text-anchor="end" class="tb">${rs[rs.length-1].acc}%</text></svg></div>`;
}
function weakIds(){

/* ========== 기록·통계 ========== */
function record(pid, variant, ok, sec){
  const k = pid + (variant ? 'v' : '');
  const a = S.att[k] || { n:0, ok:0, t:0, last:null, streak:0 };
  a.n++; if (ok) { a.ok++; a.streak++; } else a.streak = 0;
  a.t += sec; a.last = ok;
  S.att[k] = a;
  S.log.push({ k, ok, sec, at:Date.now() });
  if (S.log.length > 500) S.log = S.log.slice(-500);
  ens2(); if (!variant) srsUpdate(pid, ok);
  S.cnt = (S.cnt||0) + 1; if (S.cnt % 30 === 0) { makeReport(); S.newReport = true; }
  save();
}
function unitStats(u){
  let n=0, ok=0, t=0, tgt=0, solved=0; const tagWrong = {}; const why = {};
  u.problems.forEach(p=>{
    ['', 'v'].forEach(s=>{
      const a = S.att[p.id+s]; if (!a) return;
      n += a.n; ok += a.ok; t += a.t; tgt += p.t * a.n;
      if (a.n - a.ok > 0) tagWrong[p.tag] = (tagWrong[p.tag]||0) + (a.n - a.ok);
    });
    if (S.att[p.id]) solved++;
    const w = S.why[p.id]; if (w) w.forEach(x=>why[x]=(why[x]||0)+1);
  });
  return { n, ok, acc: n ? ok/n : null, avg: n ? t/n : 0, ratio: tgt ? t/tgt : 0, solved, tagWrong, why };
}
function conceptWrongCount(u, cid){
  let w = 0;
  u.problems.filter(p=>p.c===cid).forEach(p=>{ ['', 'v'].forEach(s=>{ const a=S.att[p.id+s]; if (a) w += a.n-a.ok; }); });
  const ck = u.checks.filter(c=>c.c===cid);
  ck.forEach((c,i)=>{ const r = S.checks[u.id+':'+u.checks.indexOf(c)]; if (r===false) w++; });
  return w;
}
function advice(u){
  const s = unitStats(u);
  const out = [];
  if (!s.n) return ['아직 푼 기록이 없어요. 개념 카드를 한 번 훑고, 개념 확인 문제부터 풀어 보세요.'];
  const pct = Math.round(s.acc*100);
  const topTag = Object.entries(s.tagWrong).sort((a,b)=>b[1]-a[1])[0];
  const topWhy = Object.entries(s.why).sort((a,b)=>b[1]-a[1])[0];
  if (s.acc < .5) {
    out.push(`정답률 ${pct}%면 문제를 더 푸는 것보다 개념으로 돌아가는 게 빨라요. 개념 카드를 다시 읽고, 해설을 덮은 채 직접 설명할 수 있을 때 실전으로 넘어오세요.`);
  } else if (s.acc < .8) {
    out.push(`정답률 ${pct}%. 기본은 잡혔는데 구멍이 있어요.` + (topTag ? ` 가장 많이 틀린 건 '${topTag[0]}' 유형이니 그 개념 카드와 변형 문제를 먼저 처리하세요.` : ''));
  } else {
    out.push(`정답률 ${pct}%, 안정권이에요.` + (s.ratio > 1.3 ? ' 다만 목표 시간보다 꽤 오래 걸려요.' : ' 이 단원은 오답만 한 번 더 돌리고 다음 단원으로 가도 돼요.'));
  }
  if (s.ratio > 1.3) out.push(`평균 풀이 시간이 목표의 ${Math.round(s.ratio*100)}%예요. 풀이 첫 줄(무슨 개념을 쓸지)을 30초 안에 정하는 연습을 하세요. 막히면 1분 넘기기 전에 힌트를 보고, 해설의 첫 줄만 외워 두는 것도 방법이에요.`);
  else if (s.ratio && s.ratio < .6 && s.acc < .8) out.push('너무 빨리 풀고 틀리는 편이에요. 보기 고르기 전에 조건(정의역, 양수 조건, 등호 성립)을 한 번 더 확인하세요.');
  if (topWhy) {
    const m = {
      '개념을 몰랐다':'틀린 이유로 개념 부족을 가장 많이 골랐어요. 실전 문제는 잠깐 멈추고 개념 확인 문제를 다시 맞혀 보세요.',
      '공식·성질이 헷갈렸다':'공식이 헷갈린다고 자주 골랐어요. 공식 탭의 내용을 손으로 3번 써 보고, 각 공식이 언제 쓰이는지 한 줄씩 적어 두세요.',
      '문제 해석을 잘못했다':'문제 해석 실수가 많아요. 조건에 밑줄을 치고, "구하는 것"을 문제 옆에 따로 적고 시작하세요.',
      '계산 실수':'계산 실수가 많아요. 검산은 끝에 몰아서 하지 말고 한 줄 넘어갈 때마다 부호와 괄호만 확인하세요.',
      '시간이 부족했다':'시간 부족을 자주 골랐어요. 아는 문제는 목표 시간 안에 끊는 연습부터. 모르는 문제는 2분 넘기면 넘기는 습관을 들이세요.'
    };
    out.push(m[topWhy[0]]);
  }
  return out;
}
function todayTodo(){

  return { text:'모든 단원이 80% 이상이에요. 섞어 풀기로 실전 감각을 유지하세요.', act:'섞어 풀기', go:()=>startSession(null, 'mix') };
}

/* ========== 풀이 세션 ========== */
let SES = null;
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startSession(uid, mode, one){
  let list = [];
  const pool = uid ? unitById(uid).problems.map(p=>p.id) : UNITS.flatMap(u=>u.problems.map(p=>p.id));
  if (mode==='all') list = pool;
  else if (mode==='new') list = pool.filter(id=>!S.att[id]);
  else if (mode==='wrong') list = pool.filter(id=>S.att[id] && S.att[id].last===false);
  else if (mode==='one') list = [one];
  else if (mode==='mix') list = shuffle(pool.slice()).slice(0,10);
  else if (mode==='due') list = dueList(Date.now()).filter(id=>pool.includes(id));
  else if (mode==='list') list = (one||[]).slice();
  if (!list.length) { toast(mode==='wrong'||mode==='due' ? '지금 다시 풀 문제가 없어요.' : '풀 문제가 없어요. 처음부터 풀기를 눌러 보세요.'); return; }
  SES = { uid, mode, queue: list.map(id=>({ id, variant:false, retry:false })), i:0, ok:0, done:0, requeued:{}, conceptAlerted:{} };
  go(renderSolve);
}
function curItem(){ return SES.queue[SES.i]; }
function numOf(s){ s=String(s).replace(/\s/g,'').replace(/[−–]/g,'-'); const m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/); if(m) return (+m[1])/(+m[2]); return s!==''&&!isNaN(+s)?+s:NaN; }
function ansEq(a,b){ if(a===b) return true; const x=numOf(a), y=numOf(b); return !isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<1e-9; }
function renderSolve(){
  const it = curItem();
  if (!it) return renderSessionEnd();
  const { u, p } = findProblem(it.id);
  const P = it.variant ? Object.assign({}, p, { input:undefined }, p.v, { id:p.id, t:p.t }) : p;
  setTitle(`${SES.i+1} / ${SES.queue.length}`, true);
  const src = it.variant ? `자체 제작 — ${p.id}번 변형 문제` : p.src;
  app.innerHTML = `
    <div class="progress"><i style="width:${SES.i/SES.queue.length*100}%"></i></div>
    <div class="q-meta">
      <span class="chip">${u.name}</span><span class="chip g">${p.tag}</span>
      ${it.variant?'<span class="chip r">변형 문제</span>':''}${it.retry?'<span class="chip r">다시 풀기</span>':''}
    </div>
    <div class="src">출처: ${src}</div>
    <div class="timer" id="tmr">
      <svg viewBox="0 0 46 46"><circle class="trk" cx="23" cy="23" r="19" fill="none" stroke-width="5"/><circle class="arc" id="arc" cx="23" cy="23" r="19" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4"/></svg>
      <div><div class="tt" id="tt">0:00</div><div class="tg">목표 ${fmt(P.t)}</div></div>
      <button class="btn line pz" id="hintBtn">힌트</button>
    </div>
    <div class="qtext">${P.q}</div>
    ${P.qfig||''}
    <div id="ans">${P.input!==undefined
      ? `<div class="inputrow"><input id="inp" inputmode="decimal" placeholder="답 입력" aria-label="답 입력"><button class="btn" id="sub">제출</button></div>`
      : `<div class="choices ${P.ch.some(c=>String(c).includes('<svg'))?'figs':''}">${P.ch.map((x,j)=>`<button class="choice" data-j="${j}"><span class="n">${NUM[j]}</span><span>${x}</span></button>`).join('')}</div>`}
    </div>
    <div id="hint"></div>
    <div id="after"></div>`;
  const t0 = Date.now(); let paused = 0;
  const tick = ()=>{
    const sec = (Date.now()-t0)/1000;
    $('#tt').textContent = fmt(sec);
    const r = Math.min(1, sec/P.t);
    $('#arc').style.strokeDashoffset = 119.4*(1-r);
    $('#tmr').classList.toggle('over', sec > P.t);
  };
  tickTimer = setInterval(tick, 1000); tick();
  $('#hintBtn').onclick = ()=>{ $('#hint').innerHTML = `<div class="tip"><b>힌트</b>${P.hint}</div>`; $('#hintBtn').disabled = true; typeset($('#hint')); };
  const finish = (ok, chosen)=>{
    stopTick();
    const sec = (Date.now()-t0)/1000;
    record(p.id, it.variant, ok, sec);
    SES.done++; if (ok) SES.ok++;
    showAfter(u, p, P, it, ok, sec, chosen);
    if (ok) sparkle();
  };
  if (P.input!==undefined) {
    const sub = ()=>{ const v = $('#inp').value.trim().replace(/\s/g,'').replace(/[−–]/g,'-'); if (!v) return; $('#inp').disabled = true; $('#sub').disabled = true; finish(ansEq(v, String(P.input)), v); };
    $('#sub').onclick = sub; $('#inp').onkeydown = e=>{ if (e.key==='Enter') sub(); };
  } else {
    app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      const j = +b.dataset.j;
      app.querySelectorAll('.choice').forEach(x=>{ x.disabled = true; const jj=+x.dataset.j; if (jj===P.a) x.classList.add('right'); else if (jj===j) x.classList.add('wrong'); });
      finish(j===P.a, j);
    });
  }
  typeset(app);
}
function showAfter(u, p, P, it, ok, sec, chosen){
  const over = sec > P.t;
  const ansText = P.input!==undefined ? P.input : NUM[P.a];
  const af = $('#after');
  let html = ok
    ? `<div class="result ok">정답!<span class="xpchip">+${xpOf(true, sec, p.id+(it.variant?'v':''))} XP</span>${(()=>{ const m = String(P.sol).match(/<div class="key"><b>쓴 개념<\/b>(.*?)<\/div>/); return m ? `<span class="why1">${m[1]}</span>` : `<span class="why1">${p.tag}</span>`; })()}<small>${fmt(sec)} · ${over ? `목표 시간 ${fmt(P.t)}을 넘겼어요. 해설에서 더 짧은 길을 확인하세요.` : '목표 시간 안에 풀어서 보너스 +5 XP'}</small></div>`
    : `<div class="result no">오답 (${fmt(sec)})<small>정답은 ${ansText}${P.input!==undefined?` (입력한 답: ${esc(chosen)})`:''}</small></div>`;
  if (!ok) {
    html += `<div class="why"><p>어디서 틀렸나요? 고르면 리포트의 훈수에 반영돼요.</p><div class="opts">${WHY.map(w=>`<button data-w="${w}">${w}</button>`).join('')}</div></div>`;
  }
  html += `<div class="sol"><h4>풀이</h4>${P.sol}</div>`;
  if (S.newReport) { S.newReport = false; save(); html += `<div class="alert"><b>새 리포트가 나왔어요</b>방금 30문제를 채웠어요. 코치 탭에서 약점 리포트를 확인하세요.</div>`; }
  html += `<div id="cAlert"></div><div class="btnrow" id="nav"></div>`;
  af.innerHTML = html;

  // 같은 개념에서 반복해서 틀리면 개념 복습 권장
  const cw = conceptWrongCount(u, p.c);
  const needConcept = !ok && (cw >= 2 || over && sec > P.t*2);
  const showConcept = ()=>{
    $('#cAlert').innerHTML = `<div class="alert"><b>개념 복습을 먼저 권해요</b>'${conceptTitle(u,p.c)}'에서 ${cw>=2?`벌써 ${cw}번 틀렸어요`:'시간이 목표의 두 배를 넘겼어요'}. 문제를 더 푸는 것보다 개념 카드를 다시 보는 게 빨라요.<div class="btnrow"><button class="btn ghost" id="goConcept">개념 카드 보기</button></div></div>`;
    $('#goConcept').onclick = ()=>{ stopTick(); stack.push(()=>renderUnit(u.id,'concept',p.c)); renderUnit(u.id,'concept',p.c); };
  };
  if (needConcept) showConcept();

  af.querySelectorAll('.why button').forEach(b=>b.onclick=()=>{
    b.classList.toggle('on');
    const sel = [...af.querySelectorAll('.why button.on')].map(x=>x.dataset.w);
    S.why[p.id] = sel; save();
    if (sel.includes('개념을 몰랐다')) showConcept();
  });

  // 오답이면 변형 문제 → 그리고 원래 문제를 뒤에 다시
  const nav = $('#nav');
  if (!ok && !it.variant) {
    nav.innerHTML = `<button class="btn warnb" id="toVar">변형 문제 풀기</button><button class="btn line" id="next">다음 문제</button>`;
    $('#toVar').onclick = ()=>{ SES.queue.splice(SES.i+1, 0, { id:p.id, variant:true, retry:false }); requeue(p.id); SES.i++; renderSolve(); window.scrollTo(0,0); };
    $('#next').onclick = ()=>{ requeue(p.id); SES.i++; renderSolve(); window.scrollTo(0,0); };
  } else {
    nav.innerHTML = `<button class="btn" id="next">${SES.i+1 >= SES.queue.length ? '결과 보기' : '다음 문제'}</button>`;
    $('#next').onclick = ()=>{ if (!ok && it.variant) requeue(p.id, true); SES.i++; renderSolve(); window.scrollTo(0,0); };
  }
  typeset(af);
  af.scrollIntoView({ block:'start', behavior:'smooth' });
}
function sparkle(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = document.querySelector('.choice.right, #after .result')?.getBoundingClientRect(); if (!r) return;
  const cx = r.left + r.width/2, cy = r.top + r.height/2, cols = ['#7452F7','#A06DFF','#FFC94D','#4FD1A5','#FF7AB6'];
  for (let i=0;i<18;i++){ const s=document.createElement('i'); s.className='spark'; const a=Math.random()*Math.PI*2, d=40+Math.random()*70;
    s.style.left=cx+'px'; s.style.top=cy+'px'; s.style.background=cols[i%5]; s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),850); }
}
function requeue(pid, asVariant){
  const k = pid + (asVariant?'v':'');
  if (SES.requeued[k]) return; SES.requeued[k] = true;
  const pos = Math.min(SES.queue.length, SES.i + 3);
  SES.queue.splice(pos, 0, { id:pid, variant:!!asVariant, retry:true });
}
function renderSessionEnd(){
  setTitle('결과', true);
  const pct = SES.done ? Math.round(SES.ok/SES.done*100) : 0;
  const u = SES.uid ? unitById(SES.uid) : null;
  const adv = u ? advice(u) : (pct < 60 ? ['섞어 풀기 정답률이 낮아요. 리포트에서 가장 약한 단원을 골라 개념부터 다시 보세요.'] : ['좋아요. 리포트에서 단원별 시간도 함께 확인하세요.']);
  app.innerHTML = `
    <div class="panel" style="margin-top:20px">
      <div class="stat" style="margin:0"><div><b>${SES.ok}/${SES.done}</b><span>맞힌 문제</span></div><div><b>${pct}%</b><span>정답률</span></div><div><b>${SES.queue.filter(q=>q.retry).length}</b><span>다시 푼 문제</span></div></div>
    </div>
    <div class="todo"><b>훈수</b>${adv.map(a=>`<p style="margin:6px 0">${a}</p>`).join('')}</div>
    <div class="btnrow"><button class="btn" id="home2">홈으로</button>${u?`<button class="btn ghost" id="again">이 단원 오답만 다시</button>`:''}</div>`;
  $('#home2').onclick = ()=>{ stack=[]; go(renderHome); };
  if (u) $('#again').onclick = ()=>startSession(u.id, 'wrong');
}

/* ========== 오답노트 ========== */
function renderWrong(){
  setTitle('복습', stack.length>1); if(stack.length<=1) document.querySelector('.fab')?.remove();
  ens2();
  const items = [];
  UNITS.forEach(u=>u.problems.forEach(p=>{ const a=S.att[p.id]; if (a && a.n-a.ok>0) items.push({u,p,a}); }));
  const t0 = startOfDay(Date.now()), due = dueList(Date.now()).length;
  const head = `<section class="phead"><h2>복습</h2><p>틀린 문제는 1일, 3일, 7일 뒤에 다시 나와요</p></section>
    <button class="hero" id="dueBtn"><span class="hl">오늘 복습</span><span class="hn">${due}개</span><span class="hs">${due ? '눌러서 바로 시작해요' : '오늘은 다 했어요'}</span></button>
    <h3 class="sh">다음 복습</h3>
    <div class="nextrow"><span>내일</span><b>${dueOn(t0+DAY)}개</b></div><div class="nextrow"><span>모레</span><b>${dueOn(t0+2*DAY)}개</b></div><div class="nextrow"><span>그 이후</span><b>${Object.keys(S.srs).filter(k=>S.srs[k].due>=t0+3*DAY).length}개</b></div>`;
  if (!items.length) { app.innerHTML = head + `<div class="empty"><b>아직 틀린 문제가 없어요</b><p>실전 문제를 풀면 틀린 문제가 여기 모여요.</p><button class="btn" id="g">문제 풀러 가기</button></div>`; $('#g').onclick=()=>{ setTab('home'); stack=[]; go(renderHome); }; $('#dueBtn').onclick=()=>{}; return; }
  const still = items.filter(x=>x.a.last===false);
  const stLabel = id=>{ const s = S.srs[id]; if (!s) return ''; const d = Math.round((startOfDay(s.due)-t0)/DAY); return `<span class="srsbadge">${d<=0?'오늘':d===1?'내일':d+'일 뒤'}</span>`; };
  app.innerHTML = head + `
    <div class="btnrow"><button class="btn line" id="rw">아직 못 맞힌 ${still.length}문제 지금 풀기</button></div>
    <h2 class="sec">틀린 적 있는 문제</h2>
    <div class="plist">${items.map(({u,p,a})=>`<button class="pitem" data-p="${p.id}" data-u="${u.id}"><span class="id">${p.id}</span><span><span>${u.name}, ${p.tag}${stLabel(p.id)}</span><br><span class="m">${a.n-a.ok}번 틀림${S.why[p.id]&&S.why[p.id].length?`, 이유: ${S.why[p.id].join(', ')}`:''}</span></span>${S.srs[p.id]?'<span class="st no">복습 중</span>':'<span class="st ok">졸업</span>'}</button>`).join('')}</div>`;
  $('#dueBtn').onclick = ()=> due ? startSession(null,'due') : null;
  $('#rw').onclick = ()=>startSession(null,'wrong');
  if (!still.length) $('#rw').disabled = true;
  app.querySelectorAll('.pitem').forEach(b=>b.onclick=()=>startSession(b.dataset.u,'one',b.dataset.p));
}

/* ========== 리포트 ========== */
function renderReport(){
  setTitle('학습 리포트', stack.length>1); document.querySelector('.fab')?.remove();
  let N=0, OK=0, T=0;
  UNITS.forEach(u=>{ const s=unitStats(u); N+=s.n; OK+=s.ok; T+=s.avg*s.n; });
  const whyAll = {};
  Object.values(S.why).forEach(arr=>arr.forEach(w=>whyAll[w]=(whyAll[w]||0)+1));
  const whyTot = Object.values(whyAll).reduce((a,b)=>a+b,0);
  app.innerHTML = `<section class="phead"><h2>코치</h2><p>푼 기록을 보고 단원별로 훈수를 둬요</p></section>
    ${coachTop()}
    <h2 class="sec">전체 기록</h2>
    <div class="stat"><div><b>${N}</b><span>총 풀이</span></div><div><b>${N?Math.round(OK/N*100)+'%':'—'}</b><span>전체 정답률</span></div><div><b>${N?fmt(T/N):'—'}</b><span>평균 시간</span></div></div>
    <h2 class="sec">단원별 진단과 훈수</h2>
    <div class="panel">${UNITS.map(u=>{
      const s = unitStats(u); const pct = s.acc===null?0:Math.round(s.acc*100);
      const col = s.acc===null ? 'var(--line)' : s.acc<.5 ? 'var(--bad)' : s.acc<.8 ? 'var(--gold)' : 'var(--ok)';
      return `<div class="rrow"><div class="h"><span>${u.name}</span><span>${s.acc===null?'기록 없음':pct+'%'}${s.n?`, 평균 ${fmt(s.avg)}`:''}</span></div>
        <div class="bars"><i style="width:${pct}%;background:${col}"></i></div>
        <div class="adv">${advice(u).join(' ')}</div></div>`;
    }).join('')}</div>
    <h2 class="sec">틀린 이유</h2>
    <div class="panel">${whyTot ? WHY.map(w=>{ const n=whyAll[w]||0; return `<div class="rrow"><div class="h"><span>${w}</span><span>${n}번</span></div><div class="bars"><i style="width:${n/whyTot*100}%;background:var(--bad)"></i></div></div>`; }).join('') : '<p class="small" style="margin:0">틀린 문제에서 이유를 고르면 여기에 모여요.</p>'}</div>
    <div class="btnrow"><button class="btn line" id="reset">기록 전체 지우기</button></div>`;
  bindCoachTop();
  $('#reset').onclick = ()=>askConfirm('풀이 기록을 모두 지울까요?\n되돌릴 수 없어요.', ()=>{ S = { att:{}, checks:{}, why:{}, log:[], clog:[], study:[], exps:[], srs:{}, reports:[], cnt:0 }; save(); renderReport(); toast('기록을 지웠어요.'); }, '지우기');
}

/* ========== 공식 ========== */
function renderSheet(){
  setTitle('공식 모아보기', true);
  app.innerHTML = `<section class="phead"><h2>공식 모아보기</h2><p>시험 직전에 한 번 훑기</p></section>` + UNITS.map(u=>`<h2 class="sec">${u.name}</h2><div class="formula">${u.sheet.map(([t,f])=>`<div class="f"><b>${t}</b><div class="fx">${f}</div></div>`).join('')}</div>`).join('');
  typeset(app);
}

function renderOnboard(i=0){
  setTitle('', false); document.querySelector('.fab')?.remove();
  const ic = d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const steps = [
    [ic('<path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-4a2 2 0 0 0-2 2"/>'),'개념부터','단원마다 개념을 먼저 정리하고, 바로 확인 문제로 이해했는지 체크해요.'],
    [ic('<path d="M15 4l5 5L9 20H4v-5z"/>'),'실전 문제 풀기','교재 문제를 시간 재며 풀어요. 틀리면 상세 풀이와 변형 문제가 바로 나와요.'],
    [ic('<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>'),'복습하고 코치 받기','틀린 문제는 복습 탭에 모이고, 코치가 오답 패턴을 보고 훈수를 둬요.']
  ];
  const [svg,t,d] = steps[i];
  app.innerHTML = `<section class="phead center"><h2>반가워요${ICON.hand}</h2><p>Proof는 이렇게 써요.</p></section>
  <div class="onb"><div class="oc"><div class="oi">${svg}</div><span class="step">${i+1} / 3</span><h3>${t}</h3><p>${d}</p></div>
  <div class="dots">${steps.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
  <div class="obtn"><button class="btn line" id="oPrev" ${i===0?'disabled':''}>이전</button><button class="btn" id="oNext">${i===2?'시작하기':'다음'}</button></div></div>`;
  $('#oPrev').onclick = ()=>{ renderOnboard(i-1); anim('enter-r'); };
  $('#oNext').onclick = ()=>{ if (i<2) { renderOnboard(i+1); anim('enter-l'); } else { try{ localStorage.setItem(KEY+'-onb','1'); }catch(e){} stack=[renderHome]; renderHome(); anim('enter-up'); } };
}
let seenOnb = false; try { seenOnb = !!localStorage.getItem(KEY+'-onb'); } catch(e) {}
if (seenOnb) { stack = [renderHome]; renderHome(); } else { stack = [()=>renderOnboard(0)]; renderOnboard(0); }
setTimeout(()=>{ $('#splash').classList.add('hide'); anim('enter-up'); setTimeout(()=>$('#splash')?.remove(), 500); }, 1150);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBX63hV8FnrkrtAuh9644yw4BSV2GTUPv4",
  authDomain: "vocap-e3e9e.firebaseapp.com",
  projectId: "vocap-e3e9e",
  storageBucket: "vocap-e3e9e.firebasestorage.app",
  messagingSenderId: "322645613396",
  appId: "1:322645613396:web:9b73e58558018c972fc6c1"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = "ko";
const db = getFirestore(app);
const cloud = window.proofCloud;

// VOCAP은 users/{uid} 문서를 통째로 쓰기 때문에, Proof는 겹치지 않게 하위 문서에 저장해요.
const wrap = ref => ({
  get: () => getDoc(ref),
  set: d => setDoc(ref, d),
  onSnapshot: (cb, err) => onSnapshot(ref, cb, err)
});

cloud.login = async () => {
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      await signInWithRedirect(auth, provider);
    } else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      toast("로그인이 안 됐어요. (" + e.code + ")");
    }
  }
};
cloud.logout = () => signOut(auth);

onAuthStateChanged(auth, user => {
  cloud.user = user;
  if (user) cloud.connect(wrap(doc(db, "users", user.uid, "apps", "proof")), user.uid);
  else cloud.disconnect();
  cloud.drawBox();
});
cloud.drawBox();
</script>
