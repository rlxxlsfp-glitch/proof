{ u:'prop', id:'O5-07', tag:'명제가 참이 될 조건', c:'c2', t:50, src:OS('05 명제','07',57,BIN), q:R`실수 \(x\)에 대한 두 조건 \(p: x^2\le9\), \(q: x\le a\)에 대하여 명제 \(p\to q\)가 참이 되도록 하는 실수 \(a\)의 최솟값은?`, ch:['1','2','3','4','5'], a:2, hint:R`\(x^2\le9\)는 \(-3\le x\le3\).`,
  sol:R`<div class="step">\(P=[-3,3]\)이 \(x\le a\) 안에 쏙 들어가려면 오른쪽 끝 3까지 덮어야 해요.</div><div class="step">\(a\ge3\) → 최솟값 3.</div>`,
  v:{ q:R`\(p: x^2\le4\), \(q: x\ge a\)일 때 \(p\to q\)가 참이 되는 \(a\)의 최댓값은?`, ch:['−4','−2','0','2','4'], a:1, hint:R`\(-2\le x\le2\).`, sol:R`<div class="step">\(a\le-2\) → \(-2\).</div>` } },
{ u:'prop', id:'O5-08', tag:'명제가 거짓이 되는 원소', c:'c2', t:60, input:'26', src:OS('05 명제','08',57,BIN), q:R`20 이하의 자연수 \(n\)에 대하여 명제 ‘\(n\)이 18의 양의 약수이면 \(n^2\)은 홀수이다.’가 거짓이 되도록 하는 \(n\)의 값의 합을 구하시오.`, hint:R`거짓이 되게 하는 \(n\) = 반례 = 18의 약수인데 \(n^2\)이 짝수.`,
  sol:R`<div class="step">18의 약수: 1, 2, 3, 6, 9, 18.</div><div class="step">\(n^2\)이 짝수 ⟺ \(n\)이 짝수. 반례는 2, 6, 18 → 합 26.</div>`,
  v:{ q:R`‘\(n\)이 12의 양의 약수이면 \(n\)은 홀수이다’가 거짓이 되게 하는 \(n\)의 합을 구하시오.`, input:'24', hint:R`12의 짝수 약수.`, sol:R`<div class="step">2+4+6+12=24.</div>` } },
{ u:'prop', id:'O5-10', tag:'‘모든’ 명제가 참일 조건', c:'c3', t:60, src:OS('05 명제','10',57,BIN), q:R`명제 ‘모든 양의 실수 \(x\)에 대하여 \(2x-a+\dfrac72>0\)이다.’가 참이 되도록 하는 모든 자연수 \(a\)의 값의 합은?`, ch:['5','6','7','8','9'], a:1, hint:R`\(x\)가 0에 아주 가까울 때가 제일 위험해요.`,
  sol:R`<div class="step">\(2x\)는 양수라 \(x\)가 0에 가까울수록 좌변이 작아져요. 그래도 양수이려면 \(-a+\dfrac72\ge0\).</div><div class="step">\(a\le\dfrac72\) → 자연수 1, 2, 3 → 합 6.</div><div class="tip"><b>등호가 되는 이유</b>\(x>0\)이라 \(2x\)는 0이 될 수 없어서, \(-a+\frac72=0\)이어도 전체는 양수예요.</div>`,
  v:{ q:R`‘모든 양의 실수 \(x\)에 대하여 \(x-a+3>0\)’이 참인 자연수 \(a\)의 합은?`, ch:['3','6','10','15','21'], a:1, hint:R`\(a\le3\).`, sol:R`<div class="step">1+2+3=6.</div>` } },
{ u:'prop', id:'O5-12', tag:'~p→~q (대우 이용)', c:'c4', t:50, src:OS('05 명제','12',57,BIN), q:R`두 조건 \(p: x<a\), \(q: -1<x<3\)에 대하여 명제 \(\sim p\to\sim q\)가 참일 때, 실수 \(a\)의 최솟값은?`, ch:['−1','0','1','2','3'], a:4, hint:R`대우 \(q\to p\)가 참.`,
  sol:R`<div class="step">대우 \(q\to p\): \((-1,3)\subset(-\infty,a)\) → \(a\ge3\).</div>`,
  v:{ q:R`\(p: x>a\), \(q: 2<x<5\)에서 \(\sim p\to\sim q\)가 참일 때 \(a\)의 최댓값은?`, ch:['2','3','4','5','6'], a:0, hint:R`\(q\to p\).`, sol:R`<div class="step">\(a\le2\).</div>` } },
{ u:'prop', id:'O5-13', tag:'참인 명제 연결', c:'c5', t:50, src:OS('05 명제','13',58,BIN), q:R`세 조건 \(p, q, r\)에 대하여 두 명제 \(p\to\sim q\)와 \(r\to p\)가 모두 참일 때, 다음 중 항상 참인 명제는?`, ch:[R`\(p\to\sim r\)`,R`\(\sim p\to r\)`,R`\(q\to\sim r\)`,R`\(\sim q\to r\)`,R`\(r\to q\)`], a:2, hint:R`\(r\to p\to\sim q\), 그리고 대우.`,
  sol:R`<div class="step">\(r\to p\to\sim q\)라서 \(r\to\sim q\).</div><div class="step">그 대우가 \(q\to\sim r\) → ③.</div>`,
  v:{ q:R`\(p\to q\), \(\sim r\to\sim q\)가 참일 때 항상 참인 것은?`, ch:[R`\(r\to p\)`,R`\(p\to r\)`,R`\(q\to p\)`,R`\(\sim p\to\sim r\)`,R`\(r\to q\)`], a:1, hint:R`\(q\to r\) (대우).`, sol:R`<div class="step">\(p\to q\to r\).</div>` } },
{ u:'prop', id:'O5-14', tag:'역과 대우가 모두 참', c:'c4', t:60, src:OS('05 명제','14',58,BIN), q:R`보기에서 역과 대우가 모두 참인 명제만을 있는 대로 고른 것은?<div class="key">ㄱ. 실수이면 유리수이다.<br>ㄴ. \(x\)가 실수이면 \(x^2\ge0\)이다.<br>ㄷ. \(x>1\) 또는 \(y>1\)이면 \(xy>1\)이다.</div>`, ch:['ㄱ','ㄴ','ㄷ','ㄱ, ㄴ','ㄴ, ㄷ'], a:1, hint:R`대우가 참 = 원래 명제가 참. 먼저 원래 명제부터.`,
  sol:R`<div class="step">ㄱ: \(\sqrt2\)는 실수인데 유리수 아님 → 원래 거짓 ✘.</div><div class="step">ㄷ: \(x=2, y=0\) → 원래 거짓 ✘.</div><div class="step">ㄴ: 원래 참. 역 ‘\(x^2\ge0\)이면 \(x\)는 실수’도 참(허수는 제곱이 음수 될 수 있어서 크기 비교 자체가 실수에서만). ✔</div>`,
  v:{ q:R`역과 대우가 모두 참인 것은?<div class="key">ㄱ. \(x=1\)이면 \(x^2=1\) ㄴ. \(x>0\)이면 \(x^3>0\) ㄷ. \(x\)가 4의 배수이면 짝수</div>`, ch:['ㄱ','ㄴ','ㄷ','ㄱ, ㄴ','ㄴ, ㄷ'], a:1, hint:R`역도 확인.`, sol:R`<div class="step">ㄱ 역 거짓(\(-1\)). ㄷ 역 거짓(2). ㄴ ✔.</div>` } },
{ u:'prop', id:'O5-15', tag:'귀류법 (√3)', c:'c6', t:60, src:OS('05 명제','15',58,BIN), q:R`명제 ‘\(\sqrt3\)은 무리수이다.’를 증명하는 과정에서 \(a^2=3b^2\)이므로 \(a\)는 (가)의 배수이고, \(a=3k\)로 놓으면 \(b^2=\)(나)이다. (가)에 알맞은 수를 \(p\), (나)에 알맞은 식을 \(f(k)\)라 할 때, \(f(p)\)의 값은?`, ch:['18','21','24','27','30'], a:3, hint:R`\(a=3k\)를 \(a^2=3b^2\)에 넣어 보세요.`,
  sol:R`<div class="step">\(a^2\)이 3의 배수면 \(a\)도 3의 배수 → \(p=3\).</div><div class="step">\(9k^2=3b^2\) → \(b^2=3k^2\) → \(f(k)=3k^2\).</div><div class="step">\(f(3)=27\).</div>`,
  v:{ q:R`‘\(\sqrt2\)는 무리수’ 증명에서 \(a^2=2b^2\), \(a=2k\)이면 \(b^2=\)(나)이다. (나)를 \(f(k)\)라 할 때 \(f(4)\)는?`, ch:['8','16','32','64','4'], a:2, hint:R`\(4k^2=2b^2\).`, sol:R`<div class="step">\(b^2=2k^2\) → 32.</div>` } },
{ u:'prop', id:'O5-16', tag:'생활 속 삼단논법', c:'c5', t:50, src:OS('05 명제','16',58,BIN), q:R`다음 두 명제가 모두 참일 때, 다음 중 참인 명제는?<div class="key">(가) 지각하는 학생은 아침밥을 먹지 않는다.<br>(나) 지각하지 않는 학생은 운동을 좋아한다.</div>`, ch:['지각하는 학생은 운동을 좋아한다.','아침밥을 먹는 학생은 운동을 좋아한다.','운동을 좋아하는 학생은 지각하지 않는다.','아침밥을 먹지 않는 학생은 운동을 좋아한다.','운동을 좋아하는 학생은 아침밥을 먹지 않는다.'], a:1, hint:R`(가)의 대우부터.`,
  sol:R`<div class="step">(가)의 대우: 아침밥을 먹으면 → 지각하지 않는다.</div><div class="step">이어서 (나): 지각하지 않으면 → 운동을 좋아한다. 연결하면 ②.</div>`,
  v:{ q:R`(가) 비가 오면 소풍을 안 간다. (나) 소풍을 안 가면 집에서 책을 읽는다. 참인 것은?`, ch:['책을 읽으면 비가 온다','비가 오면 책을 읽는다','소풍을 가면 비가 온다','책을 안 읽으면 비가 온다','비가 안 오면 소풍을 간다'], a:1, hint:R`그대로 연결.`, sol:R`<div class="step">비 → 소풍 X → 책.</div>` } },
{ u:'prop', id:'O5-17', tag:'필요충분조건', c:'c5', t:50, src:OS('05 명제','17',58,BIN), q:R`두 실수 \(x, y\)에 대하여 다음 중 \(|x|+|y|=0\)이기 위한 필요충분조건인 것은?`, ch:[R`\(x+y=0\)`,R`\(xy=0\)`,R`\(\dfrac yx=0\)`,R`\(x^2+y^2=0\)`,R`\(x^3+y^3=0\)`], a:3, hint:R`\(|x|+|y|=0\)은 \(x=y=0\).`,
  sol:R`<div class="step">\(|x|+|y|=0\) ⟺ \(x=y=0\). 똑같이 ‘둘 다 0’을 뜻하는 건 \(x^2+y^2=0\).</div><div class="step">①⑤는 \(x=1, y=-1\)도 됨. ②는 하나만 0이어도 됨. ③은 \(x=0\)이면 정의가 안 됨.</div>`,
  v:{ q:R`\(x=y\)이기 위한 필요충분조건은? (\(x, y\) 실수)`, ch:[R`\(x^2=y^2\)`,R`\(x^3=y^3\)`,R`\(|x|=|y|\)`,R`\(xy>0\)`,R`\(x+y=0\)`], a:1, hint:R`세제곱은 부호를 지켜요.`, sol:R`<div class="step">②.</div>` } },
{ u:'prop', id:'O5-18', tag:'충분·필요와 포함 관계', c:'c5', t:50, src:OS('05 명제','18',58,BIN), q:R`세 조건 \(p, q, r\)의 진리집합을 각각 \(P, Q, R\)이라 하자. \(q\)는 \(r\)이기 위한 충분조건, \(r\)은 \(p\)이기 위한 필요조건일 때, 다음 중 항상 옳은 것은?`, ch:[R`\(P\subset Q\subset R\)`,R`\(Q\subset R\subset P\)`,R`\(R\subset P\subset Q\)`,R`\((P\cup Q)\subset R\)`,R`\((Q\cup R)\subset P\)`], a:3, hint:R`\(q\Rightarrow r\), \(p\Rightarrow r\).`,
  sol:R`<div class="step">\(Q\subset R\), \(P\subset R\). 둘 다 \(R\) 안이니 합집합도 \(R\) 안 → ④.</div><div class="step">\(P\)와 \(Q\) 사이 관계는 알 수 없어요.</div>`,
  v:{ q:R`\(p\)는 \(q\)이기 위한 필요조건, \(p\)는 \(r\)이기 위한 필요조건일 때 항상 옳은 것은?`, ch:[R`\(P\subset Q\)`,R`\((Q\cup R)\subset P\)`,R`\(Q\subset R\)`,R`\(P\subset(Q\cap R)\)`,R`\(R\subset Q\)`], a:1, hint:R`\(q\Rightarrow p\), \(r\Rightarrow p\).`, sol:R`<div class="step">②.</div>` } },
{ u:'prop', id:'O5-19', tag:'필요조건이 되는 자연수', c:'c5', t:90, src:OS('05 명제','19',59,BIN), q:R`두 조건 \(p, q\)의 진리집합을 \(P=\{x\mid a\le x<2a\}\), \(Q=\{x\mid x^2-10x+16\ge0\}\)이라 하자. \(\sim q\)가 \(p\)이기 위한 필요조건이 되도록 하는 자연수 \(a\)의 개수는?`, ch:['1','2','3','4','5'], a:1, hint:R`\(p\Rightarrow\sim q\): \(P\subset Q^C\).`,
  sol:R`<div class="step">\(Q\): \((x-2)(x-8)\ge0\) → \(Q^C=(2,8)\).</div><div class="step">\([a,2a)\subset(2,8)\): \(a>2\), \(2a\le8\) → \(a=3, 4\). 2개.</div>`,
  v:{ q:R`\(P=\{x\mid a\le x<a+2\}\), \(Q=\{x\mid x^2-6x+5\ge0\}\)일 때 \(\sim q\)가 \(p\)이기 위한 필요조건이 되는 정수 \(a\)의 개수는?`, ch:['1','2','3','4','5'], a:1, hint:R`\(Q^C=(1,5)\).`, sol:R`<div class="step">\(a>1\), \(a+2\le5\) → 2, 3.</div>` } },
{ u:'ineq', id:'O5-20', tag:'곱 전개 후 산술·기하', c:'c3', t:60, src:OS('05 명제','20',59,BIN), q:R`두 양수 \(a, b\)에 대하여 \(\left(3a+\dfrac1b\right)\left(\dfrac1a+12b\right)\)의 최솟값은?`, ch:['21','23','25','27','29'], a:3, hint:R`전개하면 \(36ab+\dfrac1{ab}+15\).`,
  sol:R`<div class="step">전개: \(3+36ab+\dfrac1{ab}+12\).</div><div class="step">\(36ab+\dfrac1{ab}\ge2\sqrt{36}=12\) → 최솟값 27.</div>`,
  v:{ q:R`\(a, b>0\)일 때 \(\left(a+\dfrac2b\right)\left(\dfrac1a+8b\right)\)의 최솟값은?`, ch:['9','13','17','21','25'], a:2, hint:R`\(8ab+\dfrac2{ab}+9\).`, sol:R`<div class="step">\(2\sqrt{16}=8\), \(8+9=17\).</div>` } },
{ u:'ineq', id:'O5-21', tag:'식 변형 후 산술·기하', c:'c3', t:50, src:OS('05 명제','21',59,BIN), q:R`\(x>1\)인 실수 \(x\)에 대하여 \(x+\dfrac{4}{x-1}\)의 최솟값을 \(a\), 그때의 \(x\)의 값을 \(b\)라 할 때, \(a+b\)의 값은?`, ch:['6','7','8','9','10'], a:2, hint:R`\(x=(x-1)+1\).`,
  sol:R`<div class="step">\((x-1)+\dfrac4{x-1}+1\ge4+1=5\), 등호 \(x=3\).</div><div class="step">\(5+3=8\).</div>`,
  v:{ q:R`\(x>3\)일 때 \(x+\dfrac{9}{x-3}\)의 최솟값 \(a\), 그때 \(x=b\)라 하면 \(a+b\)는?`, ch:['12','13','14','15','16'], a:3, hint:R`\(6+3\).`, sol:R`<div class="step">\(a=9,\ b=6\) → 15.</div>` } },
{ u:'prop', id:'O5-22', tag:'대우로 미지수 (서술형)', c:'c4', t:60, input:'7', src:OS('05 명제','22',59,'서술형 문제'), q:R`명제 ‘\(x^2-7x+6\ne0\)이면 \(x-a\ne0\)이다.’가 참이 되도록 하는 모든 실수 \(a\)의 값의 합을 구하시오.`, hint:R`대우: \(x=a\)이면 \(x^2-7x+6=0\).`,
  sol:R`<div class="step">대우가 참이 되려면 \(a\)가 \(x^2-7x+6=0\)의 해여야 해요.</div><div class="step">\((x-1)(x-6)=0\) → \(a=1, 6\), 합 7.</div>`,
  v:{ q:R`‘\(x^2-5x+4\ne0\)이면 \(x-a\ne0\)’이 참이 되는 \(a\)의 합을 구하시오.`, input:'5', hint:R`인수분해.`, sol:R`<div class="step">1+4=5.</div>` } },
{ u:'prop', id:'O5-24', tag:'약수·배수 조건 (서술형)', c:'c5', t:120, input:'30', src:OS('05 명제','24',59,'서술형 문제'), q:R`자연수 \(x\)에 대한 두 조건 \(p\): \(x\)는 20 이하의 \(n\)의 양의 배수이다., \(q\): \(x\)는 20의 양의 약수이다.에 대하여 \(q\)가 \(p\)이기 위한 필요조건이 되도록 하는 20 이하의 모든 자연수 \(n\)의 값의 합을 구하시오.`, hint:R`\(p\Rightarrow q\): 20 이하의 \(n\)의 배수가 전부 20의 약수여야 해요.`,
  sol:R`<div class="step">\(P\subset Q\), \(Q=\{1,2,4,5,10,20\}\).</div><div class="step">\(n\le10\)이면 \(n\)과 \(2n\)이 들어가요. \(n=10\): \(\{10,20\}\) ✔. \(n=5\): 15가 걸려요 ✘. \(n=4\): 8 ✘ … 더 작은 건 다 ✘.</div><div class="step">\(n>10\)이면 \(P=\{n\}\), \(n\)이 20의 약수여야 → \(n=20\). 합 30.</div>`,
  v:{ q:R`\(p\): \(x\)는 12 이하의 \(n\)의 양의 배수, \(q\): \(x\)는 12의 양의 약수일 때 \(q\)가 \(p\)이기 위한 필요조건이 되는 12 이하의 \(n\)의 합을 구하시오.`, input:'18', hint:R`\(n=6\)이면 \(\{6,12\}\).`, sol:R`<div class="step">\(n=6\): \(\{6,12\}\) ✔, \(n=12\) ✔. \(n=4\)는 8, \(n=3\)은 9, \(n=7\sim11\)은 12의 약수가 아니라 ✘. 합 18.</div>` } },
{ u:'prop', id:'O5-25', tag:'여집합의 교집합', c:'c1', t:80, src:OS('05 명제','25',60,GO), q:R`자연수 \(x\)에 대한 세 조건 \(p: x^2-7x+10=0\), \(q\): \(x\)는 12의 양의 약수이다., \(r: (x-1)(x-9)\ge0\)의 진리집합을 각각 \(P, Q, R\)이라 할 때, 집합 \(P^C\cap Q^C\cap R^C\)의 모든 원소의 합은?`, ch:['12','15','18','21','24'], a:1, hint:R`\(R^C\)부터: \(1<x<9\).`,
  sol:R`<div class="step">\(R^C=\{2,3,\dots,8\}\). 여기서 \(P=\{2,5\}\)와 \(Q=\{1,2,3,4,6,12\}\)에 있는 걸 빼요.</div><div class="step">남는 건 7, 8 → 15.</div>`,
  v:{ q:R`자연수 \(x\)에서 \(p: x^2-5x+6=0\), \(q\): \(x\)는 10의 양의 약수, \(r: (x-2)(x-10)\ge0\)일 때 \(P^C\cap Q^C\cap R^C\)의 원소의 합은?`, ch:['28','31','34','37','40'], a:2, hint:R`\(R^C=\{3,\dots,9\}\).`, sol:R`<div class="step">\(\{3,\dots,9\}\)에서 \(P=\{2,3\}\), \(Q=\{1,2,5,10\}\)을 빼면 \(\{4,6,7,8,9\}\) → 34.</div>` } },
{ u:'prop', id:'O5-26', tag:'조건의 부정 바르게 짝짓기', c:'c1', t:60, src:OS('05 명제','26',60,GO), q:R`보기에서 조건 \(p\)와 그 부정 \(\sim p\)가 바르게 연결된 것만을 있는 대로 고른 것은?<div class="key">ㄱ. \(p\): \(x^2\)은 0보다 크다. / \(\sim p\): \(x^2\)은 0보다 작다.<br>ㄴ. \(p\): \(a>0\)이고 \(b\le0\)이다. / \(\sim p\): \(a\le0\) 또는 \(b>0\)이다.<br>ㄷ. \(p\): \(ab\ne0\) / \(\sim p\): \(a, b\) 중 적어도 하나는 0이다.</div>`, ch:['ㄱ','ㄴ','ㄷ','ㄱ, ㄴ','ㄴ, ㄷ'], a:4, hint:R`‘크다’의 반대는 ‘작거나 같다’.`,
  sol:R`<div class="step">ㄱ: \(x^2>0\)의 부정은 \(x^2\le0\). ‘같다’가 빠졌어요 ✘.</div><div class="step">ㄴ: ‘그리고’ → ‘또는’, 각각 부정 ✔.</div><div class="step">ㄷ: \(ab\ne0\)은 둘 다 0 아님 → 부정은 하나라도 0 ✔.</div>`,
  v:{ q:R`\(p\)와 \(\sim p\)가 바르게 연결된 것은?<div class="key">ㄱ. \(x\ge2\) / \(x<2\)<br>ㄴ. \(a=0\) 또는 \(b=0\) / \(a\ne0\) 또는 \(b\ne0\)<br>ㄷ. \(0<x\le1\) / \(x\le0\) 또는 \(x>1\)</div>`, ch:['ㄱ','ㄴ','ㄷ','ㄱ, ㄷ','ㄴ, ㄷ'], a:3, hint:R`ㄴ의 ‘또는’.`, sol:R`<div class="step">ㄴ의 부정은 ‘\(a\ne0\) 그리고 \(b\ne0\)’. ㄱ, ㄷ ✔.</div>` } },
{ u:'prop', id:'O5-27', tag:'참인 명제 고르기', c:'c2', t:50, src:OS('05 명제','27',60,GO), q:R`보기에서 참인 명제만을 있는 대로 고른 것은?<div class="key">ㄱ. 123은 소수이다.<br>ㄴ. \(x^2+x-2=0\)이면 \(x\)는 정수이다.<br>ㄷ. 두 실수 \(a, b\)에 대하여 \(ab=0\)이면 \(a=b=0\)이다.</div>`, ch:['ㄱ','ㄴ','ㄷ','ㄱ, ㄴ','ㄴ, ㄷ'], a:1, hint:R`123의 각 자리 합은?`,
  sol:R`<div class="step">ㄱ: \(1+2+3=6\)이라 3의 배수 (\(123=3\times41\)) ✘.</div><div class="step">ㄴ: \((x+2)(x-1)=0\) → \(-2, 1\) 정수 ✔. ㄷ: \(a=0, b=5\) ✘.</div>`,
  v:{ q:R`참인 명제는?<div class="key">ㄱ. 91은 소수이다. ㄴ. \(x^2-4=0\)이면 \(x\)는 정수이다. ㄷ. \(ab>0\)이면 \(a>0\)이고 \(b>0\)이다.</div>`, ch:['ㄱ','ㄴ','ㄷ','ㄱ, ㄴ','ㄴ, ㄷ'], a:1, hint:R`\(91=7\times13\).`, sol:R`<div class="step">ㄴ만 참. ㄷ은 둘 다 음수 반례.</div>` } },
{ u:'prop', id:'O5-28', tag:'P⊂(Q−R)과 명제', c:'c5', t:70, src:OS('05 명제','28',60,GO), q:R`전체집합 \(U\)에 대하여 세 조건 \(p, q, r\)의 진리집합을 각각 \(P, Q, R\)이라 하자. \(P\subset(Q-R)\)일 때, 다음 중 항상 참인 명제가 아닌 것은?`, ch:[R`\(p\to q\)`,R`\(p\to\sim r\)`,R`\(q\to\sim p\)`,R`\(\sim q\to\sim p\)`,R`\(r\to\sim p\)`], a:2, hint:R`\(P\subset Q\)이고 \(P\)는 \(R\)과 안 겹쳐요.`,
  sol:R`<div class="step">\(P\subset Q\), \(P\cap R=\varnothing\).</div><div class="step">①④ 참 (④는 ①의 대우). ②⑤ 참 (서로 대우).</div><div class="step">③ \(Q\subset P^C\)? \(P\)가 \(Q\) 안에 있으니 거짓.</div>`,
  v:{ q:R`\(P\subset(Q\cap R)\)일 때 항상 참이 아닌 것은?`, ch:[R`\(p\to q\)`,R`\(p\to r\)`,R`\(\sim q\to\sim p\)`,R`\(q\to p\)`,R`\(\sim r\to\sim p\)`], a:3, hint:R`역은 모름.`, sol:R`<div class="step">④는 \(Q\subset P\)가 필요해요.</div>` } },
{ u:'prop', id:'O5-29', tag:'반례가 하나뿐일 조건', c:'c2', t:150, src:OS('05 명제','29',60,GO), q:R`실수 \(x\)에 대한 두 조건 \(p: x^2-5x+4\ge0\), \(q: 3x^2-kx\le0\)에 대하여 명제 \(\sim q\to p\)가 거짓임을 보이는 정수인 반례가 \(x=3\)뿐이도록 하는 모든 자연수 \(k\)의 값의 합은?`, ch:['21','23','25','27','29'], a:0, hint:R`반례 = \(\sim q\)는 만족, \(p\)는 불만족. \(p\)가 아닌 정수는 2, 3뿐.`,
  sol:R`<div class="step">\(p\): \(x\le1\) 또는 \(x\ge4\). \(p\)가 아닌 정수는 2, 3.</div><div class="step">\(\sim q\): \(x(3x-k)>0\) → \(x<0\) 또는 \(x>\dfrac k3\).</div><div class="step">3은 \(\sim q\)에 들어가고 2는 빠져야: \(2\le\dfrac k3<3\) → \(6\le k<9\).</div><div class="step">\(6+7+8=21\).</div>`,
  v:{ q:R`\(p: x^2-6x+5\ge0\), \(q: 2x^2-kx\le0\)에서 \(\sim q\to p\)의 정수 반례가 \(x=4\)뿐일 때 자연수 \(k\)의 합은?`, ch:['11','13','15','17','19'], a:1, hint:R`\(3\le\dfrac k2<4\).`, sol:R`<div class="step">\(p\)가 아닌 정수 2, 3, 4. 4만 \(x>\dfrac k2\)에 들어가야 → \(6\le k<8\) → 13.</div>` } },
{ u:'prop', id:'O5-30', tag:'절댓값 조건과 포함 관계', c:'c2', t:100, input:'15', src:OS('05 명제','30',61,GO), q:R`두 조건 \(p, q\)의 진리집합을 각각 \(P=\{x\mid(x+4)(x-7)\le0\}\), \(Q=\{x\mid|x-2|>a\}\)라 하자. 명제 \(\sim p\to q\)가 참이 되도록 하는 모든 자연수 \(a\)의 값의 합을 구하시오.`, hint:R`\(Q\): \(x<2-a\) 또는 \(x>2+a\).`,
  sol:R`<div class="step">\(\sim p\): \(x<-4\) 또는 \(x>7\).</div><div class="step">\(x<-4\)가 \(x<2-a\) 안에 → \(2-a\ge-4\) → \(a\le6\). \(x>7\)이 \(x>2+a\) 안에 → \(a\le5\).</div><div class="step">\(a=1\sim5\), 합 15.</div>`,
  v:{ q:R`\(P=\{x\mid(x+2)(x-6)\le0\}\), \(Q=\{x\mid|x-2|>a\}\)에서 \(\sim p\to q\)가 참인 자연수 \(a\)의 합을 구하시오.`, input:'10', hint:R`\(a\le4\).`, sol:R`<div class="step">1+2+3+4=10.</div>` } },
{ u:'prop', id:'O5-31', tag:'명제가 참이 되는 집합의 개수', c:'c2', t:120, input:'256', src:OS('05 명제','31',61,GO), q:R`전체집합 \(U=\{x\mid x\)는 10 이하의 자연수\(\}\)에 대하여 \(p\): \(x\)는 6의 양의 약수이다., \(q\): \(x\)는 2의 배수이거나 3의 배수이다.일 때, 명제 \((\sim p\)이고 \(\sim q)\to r\)이 참이 되도록 하는 집합 \(R\)의 개수를 구하시오.`, hint:R`\(P^C\cap Q^C\)가 \(R\) 안에 들어가면 돼요.`,
  sol:R`<div class="step">\(P=\{1,2,3,6\}\), \(Q=\{2,3,4,6,8,9,10\}\). 둘 다 아닌 것: \(\{5,7\}\).</div><div class="step">\(R\)은 5, 7을 꼭 포함하고 나머지 8개는 자유 → \(2^8=256\).</div>`,
  v:{ q:R`\(U=\{1,\dots,8\}\), \(p\): 4의 약수, \(q\): 3의 배수일 때 \((\sim p\)이고 \(\sim q)\to r\)이 참인 \(R\)의 개수를 구하시오.`, input:'32', hint:R`\(\{5,7,8\}\) 포함.`, sol:R`<div class="step">\(2^5=32\).</div>` } },
{ u:'prop', id:'O5-32', tag:'‘어떤’ 명제가 거짓', c:'c3', t:60, src:OS('05 명제','32',61,GO), q:R`전체집합 \(U\)에 대하여 명제 ‘\(x\in U\)인 어떤 \(x\)에 대하여 \(p\) 그리고 \(\sim q\)이다.’가 거짓일 때, 두 집합 \(P, Q\)의 관계로 항상 옳은 것은?`, ch:[R`\(P\cap Q=\varnothing\)`,R`\(P\cup Q=U\)`,R`\(P^C\cup Q=U\)`,R`\(P\cup Q^C=\varnothing\)`,R`\(P^C\cap Q^C=\varnothing\)`], a:2, hint:R`‘\(p\) 그리고 \(\sim q\)’인 원소가 하나도 없다 → \(P\cap Q^C=\varnothing\).`,
  sol:R`<div class="step">\(P\cap Q^C=\varnothing\) ⟺ \(P\subset Q\).</div><div class="step">\(P\subset Q\)이면 \(P^C\cup Q=U\) (여집합 취하면 \((P\cap Q^C)^C=U\)) → ③.</div>`,
  v:{ q:R`‘모든 \(x\)에 대하여 \(p\)이거나 \(\sim q\)이다’가 참일 때 항상 옳은 것은?`, ch:[R`\(P\subset Q\)`,R`\(Q\subset P\)`,R`\(P\cap Q=\varnothing\)`,R`\(P\cup Q=U\)`,R`\(P=Q\)`], a:1, hint:R`\(P\cup Q^C=U\).`, sol:R`<div class="step">\(Q\cap P^C=\varnothing\) → \(Q\subset P\).</div>` } },
{ u:'prop', id:'O5-33', tag:'‘모든’ 명제의 부정 (문장)', c:'c3', t:30, src:OS('05 명제','33',61,GO), q:R`명제 ‘철수네 농장에서 수확한 모든 수박의 당도는 12 Brix 이상이다.’의 부정은?`, ch:['철수네 농장에서 수확한 어떤 수박의 당도는 12 Brix 이상이다.','철수네 농장에서 수확한 모든 수박의 당도는 12 Brix 미만이다.','철수네 농장에서 수확한 수박 중 당도가 12 Brix 이상인 것이 있다.','철수네 농장에서 수확한 수박 중 당도가 12 Brix 미만인 것이 있다.','철수네 농장에서 수확한 수박 중 당도가 12 Brix 미만인 것은 없다.'], a:3, hint:R`‘모든’ → ‘어떤(있다)’, ‘이상’ → ‘미만’.`,
  sol:R`<div class="step">‘전부 12 이상’이 틀렸다는 건, 12 미만인 수박이 하나라도 있다는 뜻 → ④.</div>`,
  v:{ q:R`‘우리 반 어떤 학생은 안경을 쓴다.’의 부정은?`, ch:['모든 학생은 안경을 쓴다.','모든 학생은 안경을 쓰지 않는다.','어떤 학생은 안경을 쓰지 않는다.','안경 쓴 학생이 있다.','어떤 학생도 안경을 쓴다.'], a:1, hint:R`‘어떤’ → ‘모든’.`, sol:R`<div class="step">②.</div>` } },
{ u:'prop', id:'O5-34', tag:'‘어떤 x: p이고 q’가 거짓', c:'c3', t:90, src:OS('05 명제','34',61,GO), q:R`\(x\)에 대한 두 조건 \(p: x^2-7x+10\le0\), \(q: x^2-2kx+k^2-9\ge0\)에 대하여 명제 ‘어떤 실수 \(x\)에 대하여 \(p\)이고 \(q\)이다.’가 거짓이 되도록 하는 모든 정수 \(k\)의 값의 합은?`, ch:['6','7','8','9','10'], a:1, hint:R`\(P\cap Q=\varnothing\), 즉 \(P\subset Q^C\).`,
  sol:R`<div class="step">\(P=[2,5]\). \(q\): \((x-k)^2\ge9\) → \(Q^C=(k-3,k+3)\).</div><div class="step">\([2,5]\subset(k-3,k+3)\): \(k-3<2\), \(k+3>5\) → \(2<k<5\).</div><div class="step">\(3+4=7\).</div>`,
  v:{ q:R`\(p: x^2-5x+4\le0\), \(q: x^2-2kx+k^2-9\ge0\)에서 ‘어떤 \(x\)에 대하여 \(p\)이고 \(q\)’가 거짓인 정수 \(k\)의 합은?`, ch:['3','4','5','6','7'], a:2, hint:R`\([1,4]\subset(k-3,k+3)\).`, sol:R`<div class="step">\(1<k<4\) → 2+3=5.</div>` } },
{ u:'prop', id:'O5-35', tag:'‘어떤’ 명제가 참 (방정식)', c:'c3', t:120, src:OS('05 명제','35',61,GO), q:R`함수 \(f(x)=x^3+ax^2+2ax+4\)에 대하여 명제 ‘어떤 양수 \(x\)에 대하여 \(f(x)=3x+4\)이다.’가 참이 되도록 하는 정수 \(a\)의 최댓값은?`, ch:['1','2','3','4','5'], a:0, hint:R`\(x(x^2+ax+2a-3)=0\). 괄호 안이 양수 근을 가져야 해요.`,
  sol:R`<div class="step">\(x^3+ax^2+(2a-3)x=0\) → \(x\ne0\)이니 \(x^2+ax+2a-3=0\)이 양수 근을 가져야.</div><div class="step">\(a=1\): \(x^2+x-1=0\), 두 근의 곱이 음수라 양수 근 하나 ✔.</div><div class="step">\(a\ge2\): 두 근의 합 \(-a<0\), 곱 \(2a-3>0\) → 둘 다 음수거나 허근 ✘. 최댓값 1.</div>`,
  v:{ q:R`\(f(x)=x^3+ax^2+3ax+2\)에서 ‘어떤 양수 \(x\)에 대하여 \(f(x)=4x+2\)’가 참이 되는 정수 \(a\)의 최댓값은?`, ch:['1','2','3','4','5'], a:0, hint:R`\(x^2+ax+3a-4=0\).`, sol:R`<div class="step">\(a=1\): 곱 \(-1\) ✔. \(a\ge2\): 합 음수, 곱 양수 ✘.</div>` } },

/* ---- 06 함수 ---- */
{ u:'func', id:'O6-07', tag:'항등·상수함수와 일대일대응', c:'c4', t:100, input:'9', src:OS('06 함수','07',71,BIN), q:R`집합 \(X=\{2,3,5\}\)에 대하여 \(X\)에서 \(X\)로의 세 함수 \(f, g, h\)가 다음 조건을 만족시킨다.<div class="key">(가) 함수 \(f\)는 항등함수가 아닌 일대일대응이다.<br>(나) 함수 \(g\)는 항등함수이고, 함수 \(h\)는 상수함수이다.<br>(다) \(g(2)+h(3)=f(5)\)</div>\(f(2)+g(3)+h(5)\)의 값을 구하시오.`, hint:R`\(g(2)=2\), \(h\)는 늘 같은 값 \(c\). \(2+c\)가 \(X\) 안에 있어야.`,
  sol:R`<div class="step">\(2+c=f(5)\in\{2,3,5\}\), \(c\in X\) → \(c=3\), \(f(5)=5\).</div><div class="step">\(f(5)=5\)인데 항등함수가 아니니 \(f(2)=3,\ f(3)=2\).</div><div class="step">\(3+3+3=9\).</div>`,
  v:{ q:R`\(X=\{1,2,4\}\)에서 \(f\)는 항등함수가 아닌 일대일대응, \(g\)는 항등함수, \(h\)는 상수함수, \(g(1)+h(2)=f(4)\)일 때 \(f(4)+g(2)+h(1)\)을 구하시오.`, input:'5', hint:R`\(1+c\in X\).`, sol:R`<div class="step">\(c=1\), \(f(4)=2\). \(2+2+1=5\).</div>` } },
{ u:'func', id:'O6-08', tag:'항등함수가 되는 집합', c:'c4', t:60, src:OS('06 함수','08',71,BIN), q:R`함수 \(f(x)=x^3-x^2-2x+3\)이 집합 \(X\)에서 \(X\)로의 항등함수가 되도록 하는 집합 \(X\)의 개수는? (단, \(X\)는 공집합이 아니다.)`, ch:['4','5','6','7','8'], a:3, hint:R`\(f(x)=x\)의 해가 \(X\)의 후보.`,
  sol:R`<div class="step">\(x^3-x^2-3x+3=0\) → \((x-1)(x^2-3)=0\) → \(1, \pm\sqrt3\).</div><div class="step">\(X\)는 이 세 개로 만든 공집합 아닌 부분집합: \(2^3-1=7\).</div>`,
  v:{ q:R`\(f(x)=x^2-2\)가 \(X\)에서 \(X\)로의 항등함수가 되는 공집합 아닌 \(X\)의 개수는?`, ch:['1','2','3','4','7'], a:2, hint:R`\(x^2-x-2=0\).`, sol:R`<div class="step">해 2개 → \(2^2-1=3\).</div>` } },
{ u:'func', id:'O6-09', tag:'일대일함수·상수함수 개수', c:'c4', t:50, src:OS('06 함수','09',71,BIN), q:R`두 집합 \(X=\{1,2,3\}\), \(Y=\{a,b,c,d,e\}\)에 대하여 \(X\)에서 \(Y\)로의 함수 중 일대일함수의 개수를 \(m\), 상수함수의 개수를 \(n\)이라 할 때, \(m+n\)의 값은?`, ch:['50','55','60','65','70'], a:3, hint:R`\(5\times4\times3\)과 5.`,
  sol:R`<div class="step">\(m=5\times4\times3=60\), \(n=5\). 합 65.</div>`,
  v:{ q:R`\(X\) 원소 2개, \(Y\) 원소 4개일 때 일대일함수 개수와 상수함수 개수의 합은?`, ch:['12','14','16','18','20'], a:2, hint:R`\(4\times3+4\).`, sol:R`<div class="step">16.</div>` } },
{ u:'inv', id:'O6-12', tag:'합성의 교환 조건', c:'c1', t:60, src:OS('06 함수','12',71,BIN), q:R`두 함수 \(f(x)=2x+a,\ g(x)=3x+1\)이 모든 실수 \(x\)에 대하여 \(f\circ g=g\circ f\)를 만족시킬 때, \(f(a)\)의 값은? (단, \(a\)는 상수이다.)`, ch:[R`\(\dfrac12\)`,'1',R`\(\dfrac32\)`,'2',R`\(\dfrac52\)`], a:2, hint:R`두 합성의 상수항 비교.`,
  sol:R`<div class="step">\(f(g(x))=6x+2+a\), \(g(f(x))=6x+3a+1\). \(2+a=3a+1\) → \(a=\dfrac12\).</div><div class="step">\(f\left(\dfrac12\right)=1+\dfrac12=\dfrac32\).</div>`,
  v:{ q:R`\(f(x)=3x+a\), \(g(x)=2x-1\)에서 \(f\circ g=g\circ f\)일 때 \(f(a)\)는?`, ch:['−8','−6','−4','−2','0'], a:0, hint:R`\(-3+a=2a-1\).`, sol:R`<div class="step">\(a=-2\), \(f(-2)=-8\).</div>` } },
{ u:'func', id:'O6-13', tag:'치환으로 이차식 결정', c:'c1', t:90, input:'65', src:OS('06 함수','13',72,BIN), q:R`두 함수 \(f(x)=x^2+2x\), \(g(x)=ax^2+bx+c\)가 모든 실수 \(x\)에 대하여 \(g\left(\dfrac{x+1}2\right)=2f(x)+1\)을 만족시킬 때, \(a^2+b^2+c^2\)의 값을 구하시오.`, hint:R`\(t=\dfrac{x+1}2\)로 놓으면 \(x=2t-1\).`,
  sol:R`<div class="step">\(x=2t-1\): \(g(t)=2\{(2t-1)^2+2(2t-1)\}+1\).</div><div class="step">\((2t-1)^2+2(2t-1)=4t^2-1\) → \(g(t)=8t^2-1\).</div><div class="step">\(64+0+1=65\).</div>`,
  v:{ q:R`\(g\left(\dfrac{x+1}2\right)=x^2+1\), \(g(x)=ax^2+bx+c\)일 때 \(a^2+b^2+c^2\)을 구하시오.`, input:'36', hint:R`\(x=2t-1\).`, sol:R`<div class="step">\(4t^2-4t+2\) → 16+16+4=36.</div>` } },
{ u:'inv', id:'O6-14', tag:'f∘h = g 에서 h 구하기', c:'c1', t:50, src:OS('06 함수','14',72,BIN), q:R`두 함수 \(f(x)=\dfrac12x+1,\ g(x)=2x^2-1\)이 있다. 함수 \(h(x)\)가 모든 실수 \(x\)에 대하여 \((f\circ h)(x)=g(x)\)를 만족시킬 때, \(h(2)\)의 값은?`, ch:['11','12','13','14','15'], a:1, hint:R`\(\dfrac12h(2)+1=g(2)\).`,
  sol:R`<div class="step">\(f(h(2))=g(2)=7\) → \(\dfrac12h(2)+1=7\) → \(h(2)=12\).</div>`,
  v:{ q:R`\(f(x)=2x-1\), \(g(x)=x^2+3\), \((f\circ h)(x)=g(x)\)일 때 \(h(2)\)는?`, ch:['2','3','4','5','6'], a:2, hint:R`\(2h(2)-1=7\).`, sol:R`<div class="step">4.</div>` } },
{ u:'inv', id:'O6-16', tag:'일차함수의 역함수', c:'c2', t:40, src:OS('06 함수','16',72,BIN), q:R`함수 \(f(x)=ax+b\)의 역함수가 \(f^{-1}(x)=5x-3\)일 때, \(ab\)의 값은?`, ch:[R`\(\dfrac1{25}\)`,R`\(\dfrac3{25}\)`,R`\(\dfrac15\)`,R`\(\dfrac7{25}\)`,R`\(\dfrac9{25}\)`], a:1, hint:R`\(f\)는 \(f^{-1}\)의 역함수.`,
  sol:R`<div class="step">\(y=5x-3\)의 역함수: \(x=\dfrac{y+3}5\) → \(f(x)=\dfrac15x+\dfrac35\).</div><div class="step">\(ab=\dfrac3{25}\).</div>`,
  v:{ q:R`\(f(x)=ax+b\)의 역함수가 \(2x+4\)일 때 \(ab\)는?`, ch:['−2','−1',R`\(-\dfrac12\)`,'1','2'], a:1, hint:R`\(f(x)=\dfrac x2-2\).`, sol:R`<div class="step">\(-1\).</div>` } },
{ u:'inv', id:'O6-17', tag:'역함수 조건으로 일차함수', c:'c2', t:60, src:OS('06 함수','17',72,BIN), q:R`일차함수 \(f(x)=ax+b\)에 대하여 \(f^{-1}(3)=2\), \((f\circ f)(2)=5\)일 때, \(f^{-1}(-1)\)의 값은?`, ch:['−2','−1','0','1','2'], a:2, hint:R`\(f(2)=3\), \(f(3)=5\).`,
  sol:R`<div class="step">\(f(2)=3\), \(f(f(2))=f(3)=5\). 기울기 2 → \(f(x)=2x-1\).</div><div class="step">\(2x-1=-1\) → \(x=0\).</div>`,
  v:{ q:R`\(f(x)=ax+b\)에서 \(f^{-1}(1)=3\), \((f\circ f)(3)=5\)일 때 \(f^{-1}(3)\)은?`, ch:['0','1','2','3','4'], a:2, hint:R`\(f(3)=1\), \(f(1)=5\).`, sol:R`<div class="step">\(f(x)=-2x+7\), \(-2x+7=3\) → 2.</div>` } },
{ u:'inv', id:'O6-18', tag:'역함수가 존재할 조건', c:'c2', t:60, src:OS('06 함수','18',72,BIN), q:R`함수 \(f(x)=\begin{cases}3x+8&(x<0)\\(a+1)x+b&(x\ge0)\end{cases}\)의 역함수가 존재하도록 하는 두 정수 \(a, b\)에 대하여 \(a+b\)의 최솟값은?`, ch:['6','7','8','9','10'], a:2, hint:R`이어지고(\(b=8\)), 기울기 부호 같음.`,
  sol:R`<div class="step">\(x=0\)에서 이어짐: \(b=8\). 기울기 3이 양수니 \(a+1>0\) → 정수 \(a\ge0\).</div><div class="step">최솟값 \(0+8=8\).</div>`,
  v:{ q:R`\(f(x)=\begin{cases}x+3&(x<0)\\(a+3)x+b&(x\ge0)\end{cases}\)의 역함수가 존재하는 정수 \(a, b\)에 대하여 \(a+b\)의 최솟값은?`, ch:['−1','0','1','2','3'], a:2, hint:R`\(b=3\), \(a>-3\).`, sol:R`<div class="step">\(-2+3=1\).</div>` } },
{ u:'inv', id:'O6-19', tag:'역함수 성질로 계산', c:'c3', t:70, src:OS('06 함수','19',73,BIN), q:R`두 함수 \(f(x)=-3x+2,\ g(x)=2x-3\)에 대하여 \(f^{-1}(-1)+((f^{-1}\circ g)^{-1}\circ f^{-1})(5)\)의 값은?`, ch:['1','2','3','4','5'], a:4, hint:R`\((f^{-1}\circ g)^{-1}=g^{-1}\circ f\).`,
  sol:R`<div class="step">\(f^{-1}(-1)\): \(-3x+2=-1\) → 1.</div><div class="step">\(g^{-1}\circ f\circ f^{-1}=g^{-1}\). \(g^{-1}(5)\): \(2x-3=5\) → 4.</div><div class="step">합 5.</div>`,
  v:{ q:R`\(f(x)=2x+1\), \(g(x)=x-4\)일 때 \(f^{-1}(5)+((f^{-1}\circ g)^{-1}\circ f^{-1})(3)\)은?`, ch:['5','7','9','11','13'], a:2, hint:R`\(2+g^{-1}(3)\).`, sol:R`<div class="step">2+7=9.</div>` } },
{ u:'inv', id:'O6-20', tag:'y=f(4x+5)의 역함수', c:'c2', t:80, src:OS('06 함수','20',73,BIN), q:R`일차함수 \(f\)의 역함수를 \(g\)라 할 때, 함수 \(y=f(4x+5)\)의 역함수는 \(y=ag(x)+b\)로 나타낼 수 있다. \(a+b\)의 값은? (단, \(a, b\)는 상수이다.)`, ch:[R`\(-\dfrac52\)`,'−2',R`\(-\dfrac32\)`,'−1',R`\(-\dfrac12\)`], a:3, hint:R`\(x, y\) 바꾸고 양변에 \(g\)를 씌워요.`,
  sol:R`<div class="step">\(x=f(4y+5)\) → \(g(x)=4y+5\) → \(y=\dfrac14g(x)-\dfrac54\).</div><div class="step">\(\dfrac14-\dfrac54=-1\).</div>`,
  v:{ q:R`\(y=f(2x-3)\)의 역함수가 \(ag(x)+b\)일 때 \(a+b\)는? (\(g=f^{-1}\))`, ch:['1',R`\(\dfrac32\)`,'2',R`\(\dfrac52\)`,'3'], a:2, hint:R`\(g(x)=2y-3\).`, sol:R`<div class="step">\(\dfrac12+\dfrac32=2\).</div>` } },
{ u:'inv', id:'O6-21', tag:'함수와 역함수의 교점 거리', c:'c4', t:80, src:OS('06 함수','21',73,BIN), q:R`정의역이 \(\{x\mid x\ge2\}\)인 함수 \(f(x)=x^2-4x+6\)과 그 역함수 \(f^{-1}\)에 대하여 두 그래프는 두 점에서 만난다. 이 두 점 사이의 거리는?`, ch:[R`\(\sqrt2\)`,'2',R`\(2\sqrt2\)`,'4',R`\(4\sqrt2\)`], a:0, hint:R`증가함수 → 교점은 \(y=x\) 위.`,
  sol:R`<div class="step">\(x^2-4x+6=x\) → \((x-2)(x-3)=0\). 교점 \((2,2), (3,3)\).</div><div class="step">거리 \(\sqrt{1+1}=\sqrt2\).</div>`,
  v:{ q:R`정의역 \(x\ge4\)인 \(f(x)=x^2-8x+20\)과 역함수의 두 교점 사이 거리는?`, ch:[R`\(\sqrt2\)`,'2',R`\(2\sqrt2\)`,'4',R`\(4\sqrt2\)`], a:0, hint:R`\(x^2-9x+20=0\).`, sol:R`<div class="step">(4,4), (5,5) → \(\sqrt2\).</div>` } },
{ u:'func', id:'O6-24', tag:'일의 자리 함수', c:'c1', t:60, src:OS('06 함수','24',74,GO), q:R`집합 \(X=\{1,3,5,7,9\}\)에 대하여 \(X\)에서 \(X\)로의 함수 \(f\)를 \(f(x)=(x^2\)의 일의 자리의 숫자)라 하자. \(f(a)=1,\ f(b)=9\)를 만족시키는 \(X\)의 두 원소 \(a, b\)에 대하여 \(a+b\)의 최댓값은?`, ch:['8','10','12','14','16'], a:4, hint:R`1, 9, 25, 49, 81의 일의 자리.`,
  sol:R`<div class="step">\(f(1)=1, f(3)=9, f(5)=5, f(7)=9, f(9)=1\).</div><div class="step">\(a\in\{1,9\}\), \(b\in\{3,7\}\) → 최대 \(9+7=16\).</div>`,
  v:{ q:R`\(X=\{2,4,6,8\}\)에서 \(f(x)=(x^2\)의 일의 자리)일 때 \(f(a)=4\), \(f(b)=6\)인 \(a+b\)의 최댓값은?`, ch:['10','12','14','16','18'], a:2, hint:R`4, 16, 36, 64.`, sol:R`<div class="step">\(a\in\{2,8\}\), \(b\in\{4,6\}\) → 14.</div>` } },
{ u:'func', id:'O6-25', tag:'서로 같은 함수 (절댓값)', c:'c2', t:100, src:OS('06 함수','25',74,GO), q:R`집합 \(X=\{0,1,a\}\)를 정의역으로 하는 두 함수 \(f(x)=b|x-1|+c\), \(g(x)=(x-1)^2+4\)에 대하여 \(f=g\)일 때, \(f(a)+bc\)의 값은? (단, \(a\ne0,\ a\ne1\)이고 \(a, b, c\)는 상수이다.)`, ch:['6','7','8','9','10'], a:3, hint:R`\(x=1\), \(x=0\)부터 넣어 \(b, c\) 구하기.`,
  sol:R`<div class="step">\(x=1\): \(c=4\). \(x=0\): \(b+4=5\) → \(b=1\).</div><div class="step">\(x=a\): \(|a-1|+4=(a-1)^2+4\) → \(|a-1|=1\) (0은 \(a=1\)이라 제외) → \(a=2\) (\(a=0\) 제외).</div><div class="step">\(f(2)=5\), \(bc=4\) → 9.</div>`,
  v:{ q:R`\(X=\{0,2,a\}\)에서 \(f(x)=b|x-2|+c\), \(g(x)=(x-2)^2+1\)이 같을 때 \(f(a)+bc\)는? (\(a\ne0, 2\))`, ch:['5','6','7','8','9'], a:2, hint:R`\(c=1\), \(2b+1=5\).`, sol:R`<div class="step">\(b=2\). \(2|a-2|=(a-2)^2\) → \(a=4\). \(f(4)=5\), 5+2=7.</div>` } },
{ u:'func', id:'O6-26', tag:'주기를 가진 함수', c:'c1', t:50, src:OS('06 함수','26',74,GO), q:R`실수 전체의 집합에서 정의된 함수 \(f\)가 (가) \(0\le x\le3\)일 때 \(f(x)=x^2-3x\), (나) 모든 실수 \(x\)에 대하여 \(f(x)=f(x+3)\)을 만족시킨다. \(f(16)\)의 값은?`, ch:['−2','−1','0','1','2'], a:0, hint:R`3씩 빼서 0~3 안으로.`,
  sol:R`<div class="step">\(f(16)=f(13)=\cdots=f(1)\).</div><div class="step">\(1-3=-2\).</div>`,
  v:{ q:R`\(0\le x\le2\)에서 \(f(x)=x^2-2x\), \(f(x)=f(x+2)\)일 때 \(f(11)\)은?`, ch:['−2','−1','0','1','2'], a:1, hint:R`\(f(1)\).`, sol:R`<div class="step">\(-1\).</div>` } },
{ u:'func', id:'O6-27', tag:'절댓값 함수의 일대일', c:'c3', t:100, src:OS('06 함수','27',74,GO), q:R`함수 \(f(x)=2ax+(3a-4)|x-1|\)이 일대일함수가 되도록 하는 정수 \(a\)의 개수는?`, ch:['1','2','3','4','5'], a:2, hint:R`\(x\ge1\), \(x<1\)로 나눠 기울기 부호 비교.`,
  sol:R`<div class="step">\(x\ge1\): 기울기 \(2a+3a-4=5a-4\). \(x<1\): 기울기 \(2a-3a+4=4-a\).</div><div class="step">\((5a-4)(4-a)>0\) → \(\dfrac45<a<4\) → 1, 2, 3. 3개.</div>`,
  v:{ q:R`\(f(x)=ax+(2a-3)|x-2|\)가 일대일함수가 되는 정수 \(a\)의 개수는?`, ch:['1','2','3','4','5'], a:0, hint:R`기울기 \(3a-3\), \(3-a\).`, sol:R`<div class="step">\(1<a<3\) → 2. 1개.</div>` } },
{ u:'func', id:'O6-28', tag:'일대일대응의 미지수', c:'c3', t:80, src:OS('06 함수','28',74,GO), q:R`두 집합 \(X=\{0,1,a\}\), \(Y=\{4,5,8\}\)에 대하여 \(X\)에서 \(Y\)로의 함수 \(f(x)=x^2+b\)가 일대일대응일 때, \(a+b\)의 최댓값은? (단, \(a\ne0,\ a\ne1\))`, ch:['6','7','8','9','10'], a:0, hint:R`\(f(0)=b\), \(f(1)=b+1\)은 연속한 두 수.`,
  sol:R`<div class="step">\(b, b+1\)이 \(Y\)에 있어야 → \(b=4\).</div><div class="step">\(a^2+4=8\) → \(a=\pm2\). 최댓값 \(2+4=6\).</div>`,
  v:{ q:R`\(X=\{0,1,a\}\), \(Y=\{2,3,11\}\)에서 \(f(x)=x^2+b\)가 일대일대응일 때 \(a+b\)의 최댓값은?`, ch:['3','4','5','6','7'], a:2, hint:R`\(b=2\).`, sol:R`<div class="step">\(a=3\) → 5.</div>` } },
{ u:'func', id:'O6-29', tag:'항등함수 조건', c:'c4', t:60, src:OS('06 함수','29',74,GO), q:R`집합 \(X=\{-2,2\}\)에 대하여 \(X\)에서 \(X\)로의 함수 \(f(x)=\begin{cases}-2x+a&(x<0)\\2x^2-x+b&(x\ge0)\end{cases}\)이 항등함수일 때, \(b-a\)의 값은?`, ch:['1','2','3','4','5'], a:1, hint:R`\(f(-2)=-2\), \(f(2)=2\).`,
  sol:R`<div class="step">\(4+a=-2\) → \(a=-6\). \(8-2+b=2\) → \(b=-4\).</div><div class="step">\(b-a=2\).</div>`,
  v:{ q:R`\(X=\{-1,3\}\)에서 \(f(x)=\begin{cases}-3x+a&(x<0)\\x^2-2x+b&(x\ge0)\end{cases}\)가 항등함수일 때 \(b-a\)는?`, ch:['2','3','4','5','6'], a:2, hint:R`\(f(-1)=-1\).`, sol:R`<div class="step">\(a=-4,\ b=0\) → 4.</div>` } },

/* ---- 07 유리·무리 ---- */
{ u:'rat', id:'O7-07', tag:'대칭점과 지나는 점', c:'c2', t:70, src:OS('07 유리함수와 무리함수','07',85,BIN), q:R`서로 다른 두 상수 \(a, b\)에 대하여 유리함수 \(y=\dfrac{x+b}{x+a}\)의 그래프가 점 \((4,2)\)를 지나고 점 \((3,c)\)에 대하여 대칭일 때, \(a+b+c\)의 값은?`, ch:['−5','−4','−3','−2','−1'], a:1, hint:R`대칭점 = 점근선 교점 \((-a, 1)\).`,
  sol:R`<div class="step">점근선 \(x=-a,\ y=1\) → \(a=-3,\ c=1\).</div><div class="step">\((4,2)\): \(\dfrac{4+b}{1}=2\) → \(b=-2\).</div><div class="step">\(-3-2+1=-4\).</div>`,
  v:{ q:R`\(y=\dfrac{x+b}{x+a}\)가 \((3,2)\)를 지나고 \((-1,c)\)에 대해 대칭일 때 \(a+b+c\)는?`, ch:['5','6','7','8','9'], a:2, hint:R`\(a=1,\ c=1\).`, sol:R`<div class="step">\(\dfrac{3+b}4=2\) → \(b=5\). 7.</div>` } },
{ u:'rat', id:'O7-08', tag:'구간의 최대·최소', c:'c3', t:70, src:OS('07 유리함수와 무리함수','08',85,BIN), q:R`\(2\le x\le a\)에서 함수 \(y=\dfrac{5-3x}{x-1}\)의 최솟값이 \(-2\), 최댓값이 \(b\)일 때, \(a+b\)의 값은? (단, \(a>2\))`, ch:['1','2','3','4','5'], a:1, hint:R`\(-3+\dfrac2{x-1}\): 감소.`,
  sol:R`<div class="step">\(y=-3+\dfrac{2}{x-1}\), \(x>1\)에서 감소.</div><div class="step">최댓값 \(f(2)=-1=b\). 최솟값 \(-3+\dfrac2{a-1}=-2\) → \(a=3\).</div><div class="step">\(a+b=2\).</div>`,
  v:{ q:R`\(2\le x\le a\)에서 \(y=\dfrac{4-2x}{x-1}\)의 최솟값 \(-1\), 최댓값 \(b\)일 때 \(a+b\)는?`, ch:['1','2','3','4','5'], a:2, hint:R`\(-2+\dfrac2{x-1}\).`, sol:R`<div class="step">\(b=0\), \(a=3\) → 3.</div>` } },
{ u:'rat', id:'O7-09', tag:'유리함수 그래프의 성질', c:'c2', t:80, src:OS('07 유리함수와 무리함수','09',85,BIN), q:R`함수 \(y=\dfrac{2x+3}{x-1}\)의 그래프에 대하여 보기에서 옳은 것만을 있는 대로 고른 것은?<div class="key">ㄱ. 점근선의 방정식은 \(x=1,\ y=3\)이다.<br>ㄴ. 그래프는 모든 사분면을 지난다.<br>ㄷ. 그래프는 직선 \(y=x+3\)에 대하여 대칭이다.</div>`, ch:['ㄱ','ㄴ','ㄱ, ㄴ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'], a:1, hint:R`\(2+\dfrac5{x-1}\).`,
  sol:R`<div class="step">\(y=2+\dfrac5{x-1}\) → 점근선 \(x=1,\ y=2\). ㄱ ✘.</div><div class="step">ㄴ: 오른쪽 가지는 1사분면. 왼쪽 가지는 \(y\)절편이 \(-3\)이라 \(y\)축 아래를 지나고, 멀리 가면 \(y\to2\) → 2, 3, 4사분면 ✔.</div><div class="step">ㄷ: 대칭축은 \((1,2)\)를 지나야 하는데 \(y=x+3\)은 \((1,4)\)를 지나요 ✘.</div>`,
  v:{ q:R`\(y=\dfrac{x+1}{x-2}\)에 대하여 옳은 것은?<div class="key">ㄱ. 점근선은 \(x=2,\ y=1\) ㄴ. 모든 사분면을 지난다 ㄷ. 직선 \(y=x-1\)에 대하여 대칭</div>`, ch:['ㄱ','ㄴ','ㄱ, ㄴ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'], a:4, hint:R`\(1+\dfrac3{x-2}\).`, sol:R`<div class="step">모두 ✔ (\(y=x-1\)은 \((2,1)\)을 지남).</div>` } },
{ u:'rat', id:'O7-11', tag:'직선과 한 점에서 만남', c:'c2', t:100, src:OS('07 유리함수와 무리함수','11',85,BIN), q:R`함수 \(y=\dfrac{x+2}{x+3}\)의 그래프와 직선 \(y=x+k\)가 오직 한 점에서만 만나도록 하는 모든 실수 \(k\)의 값의 합은?`, ch:['2','4','6','8','10'], a:3, hint:R`연립해서 판별식 \(D=0\).`,
  sol:R`<div class="step">\(x+2=(x+k)(x+3)\) → \(x^2+(k+2)x+3k-2=0\).</div><div class="step">\(D=(k+2)^2-4(3k-2)=k^2-8k+12=0\) → \(k=2, 6\). 합 8.</div>`,
  v:{ q:R`\(y=\dfrac{x+1}{x+2}\)와 \(y=x+k\)가 한 점에서만 만나는 \(k\)의 합은?`, ch:['4','5','6','7','8'], a:2, hint:R`\(k^2-6k+5=0\).`, sol:R`<div class="step">1+5=6.</div>` } },
{ u:'rat', id:'O7-12', tag:'역함수 공식', c:'c4', t:60, src:OS('07 유리함수와 무리함수','12',85,BIN), q:R`함수 \(f(x)=\dfrac{3x+2}{x-4}\)의 역함수가 \(g(x)=\dfrac{ax+2}{bx+c}\)일 때, \(g(a+b+c)\)의 값은?`, ch:['−10','−8','−6','−4','−2'], a:0, hint:R`\(a\)와 \(d\) 자리 바꾸고 부호 반대.`,
  sol:R`<div class="step">\(g(x)=\dfrac{4x+2}{x-3}\) → \(a=4,\ b=1,\ c=-3\), 합 2.</div><div class="step">\(g(2)=\dfrac{10}{-1}=-10\).</div>`,
  v:{ q:R`\(f(x)=\dfrac{2x+1}{x-3}\)의 역함수 \(g(x)=\dfrac{ax+1}{bx+c}\)에서 \(g(a)\)는?`, ch:['−10','5','10',R`\(\dfrac{13}2\)`,'8'], a:2, hint:R`\(g=\dfrac{3x+1}{x-2}\).`, sol:R`<div class="step">\(g(3)=10\).</div>` } },
{ u:'irr', id:'O7-13', tag:'무리식이 실수일 조건', c:'c1', t:40, src:OS('07 유리함수와 무리함수','13',86,BIN), q:R`두 무리식 \(\sqrt{x-3}\), \(\dfrac3{\sqrt{5-x}}\)의 값이 모두 실수가 되도록 하는 모든 정수 \(x\)의 값의 합은?`, ch:['6','7','8','9','10'], a:1, hint:R`분모 근호는 0 안 됨.`,
  sol:R`<div class="step">\(x\ge3\), \(x<5\) → 3, 4. 합 7.</div>`,
  v:{ q:R`\(\sqrt{x+1}\), \(\dfrac2{\sqrt{4-x}}\)이 모두 실수인 정수 \(x\)의 합은?`, ch:['3','4','5','6','7'], a:2, hint:R`\(-1\le x<4\).`, sol:R`<div class="step">\(-1+0+1+2+3=5\).</div>` } },
{ u:'irr', id:'O7-14', tag:'유리화로 간단히', c:'c1', t:60, src:OS('07 유리함수와 무리함수','14',86,BIN), q:R`\(\dfrac1{\sqrt{x+3}+\sqrt{x-3}}-\dfrac1{\sqrt{x+3}-\sqrt{x-3}}\)을 간단히 하면?`, ch:[R`\(-\dfrac13\sqrt{x-3}\)`,R`\(-\dfrac13\sqrt{x+3}\)`,R`\(\dfrac13\sqrt{x-3}\)`,R`\(\dfrac13\sqrt{x+3}\)`,R`\(\dfrac{\sqrt{x-3}-\sqrt{x+3}}6\)`], a:0, hint:R`각각 유리화. 분모는 \((x+3)-(x-3)=6\).`,
  sol:R`<div class="step">첫째 \(=\dfrac{\sqrt{x+3}-\sqrt{x-3}}6\), 둘째 \(=\dfrac{\sqrt{x+3}+\sqrt{x-3}}6\).</div><div class="step">빼면 \(\dfrac{-2\sqrt{x-3}}6=-\dfrac13\sqrt{x-3}\).</div>`,
  v:{ q:R`\(\dfrac1{\sqrt{x+2}+\sqrt{x-2}}+\dfrac1{\sqrt{x+2}-\sqrt{x-2}}\)을 간단히 하면?`, ch:[R`\(\dfrac12\sqrt{x+2}\)`,R`\(\dfrac12\sqrt{x-2}\)`,R`\(-\dfrac12\sqrt{x+2}\)`,R`\(\sqrt{x+2}\)`,R`\(\sqrt{x-2}\)`], a:0, hint:R`분모 4.`, sol:R`<div class="step">\(\dfrac{2\sqrt{x+2}}4\).</div>` } },
{ u:'irr', id:'O7-15', tag:'정의역·치역으로 결정', c:'c2', t:60, src:OS('07 유리함수와 무리함수','15',86,BIN), q:R`무리함수 \(f(x)=\sqrt{ax+4}+b\ (a\ne0)\)의 정의역이 \(\{x\mid x\le2\}\)이고 치역이 \(\{y\mid y\ge1\}\)일 때, \(a+f(b)\)의 값은?`, ch:[R`\(-1+\sqrt2\)`,R`\(-1+2\sqrt2\)`,R`\(2+\sqrt2\)`,R`\(3+\sqrt2\)`,R`\(2+2\sqrt2\)`], a:0, hint:R`\(-\dfrac4a=2\).`,
  sol:R`<div class="step">\(a=-2\), \(b=1\).</div><div class="step">\(f(1)=\sqrt2+1\) → \(-2+\sqrt2+1=-1+\sqrt2\).</div>`,
  v:{ q:R`\(f(x)=\sqrt{ax+6}+b\)의 정의역 \(x\le3\), 치역 \(y\ge-1\)일 때 \(a+f(b)\)는?`, ch:[R`\(-3+2\sqrt2\)`,R`\(-1+2\sqrt2\)`,R`\(-3+\sqrt2\)`,R`\(1+\sqrt2\)`,R`\(2\sqrt2\)`], a:0, hint:R`\(a=-2,\ b=-1\).`, sol:R`<div class="step">\(f(-1)=\sqrt8-1\) → \(-2+2\sqrt2-1\).</div>` } },
{ u:'irr', id:'O7-16', tag:'이동 후 일치', c:'c3', t:100, src:OS('07 유리함수와 무리함수','16',86,BIN), q:R`무리함수 \(y=\sqrt{ax+1}+1\ (a\ne0)\)의 그래프를 \(x\)축의 방향으로 \(b\)만큼 평행이동한 다음, \(y\)축에 대하여 대칭이동하면 무리함수 \(y=\sqrt{-4x-1}\)의 그래프를 \(y\)축의 방향으로 \(c\)만큼 평행이동한 그래프와 일치한다. \(a+b+c\)의 값은?`, ch:[R`\(\dfrac{11}2\)`,'6',R`\(\dfrac{13}2\)`,'7',R`\(\dfrac{15}2\)`], a:0, hint:R`순서대로: \(x\to x-b\), 그다음 \(x\to-x\).`,
  sol:R`<div class="step">평행이동: \(y=\sqrt{a(x-b)+1}+1\). \(y\)축 대칭: \(y=\sqrt{-ax-ab+1}+1\).</div><div class="step">목표 \(y=\sqrt{-4x-1}+c\): \(a=4\), \(-4b+1=-1\) → \(b=\dfrac12\), \(c=1\).</div><div class="step">\(4+\dfrac12+1=\dfrac{11}2\).</div>`,
  v:{ q:R`\(y=\sqrt{ax+2}+1\)을 \(x\)축 방향 \(b\)만큼 옮긴 뒤 \(y\)축 대칭하면 \(y=\sqrt{-2x+4}+c\)일 때 \(a+b+c\)는?`, ch:['1','2','3','4','5'], a:1, hint:R`\(-2b+2=4\).`, sol:R`<div class="step">\(a=2, b=-1, c=1\) → 2.</div>` } },
{ u:'irr', id:'O7-18', tag:'구간의 최대·최소', c:'c2', t:60, src:OS('07 유리함수와 무리함수','18',86,BIN), q:R`\(a\le x\le-2\)에서 함수 \(y=\sqrt{1-4x}+2\)의 최댓값이 7, 최솟값이 \(b\)일 때, \(a+b\)의 값은? (단, \(a<-2\))`, ch:['−2','−1','0','1','2'], a:1, hint:R`감소함수.`,
  sol:R`<div class="step">감소하니 최댓값은 \(x=a\): \(\sqrt{1-4a}=5\) → \(a=-6\).</div><div class="step">최솟값 \(x=-2\): \(3+2=5=b\). 합 \(-1\).</div>`,
  v:{ q:R`\(a\le x\le-1\)에서 \(y=\sqrt{3-x}+1\)의 최댓값 4, 최솟값 \(b\)일 때 \(a+b\)는?`, ch:['−5','−4','−3','−2','−1'], a:2, hint:R`\(\sqrt{3-a}=3\).`, sol:R`<div class="step">\(a=-6\), \(b=3\) → \(-3\).</div>` } },
{ u:'irr', id:'O7-19', tag:'역함수와 합성', c:'c4', t:50, src:OS('07 유리함수와 무리함수','19',87,BIN), q:R`두 함수 \(f(x)=\sqrt{2x-1}\), \(g(x)=\sqrt{x+4}-1\)에 대하여 \((g^{-1}\circ f)(5)\)의 값은?`, ch:['6','8','10','12','14'], a:3, hint:R`\(f(5)=3\), \(g(k)=3\).`,
  sol:R`<div class="step">\(f(5)=3\). \(\sqrt{k+4}-1=3\) → \(k=12\).</div>`,
  v:{ q:R`\(f(x)=\sqrt{3x+1}\), \(g(x)=\sqrt{x+5}-2\)일 때 \((g^{-1}\circ f)(5)\)는?`, ch:['25','27','29','31','33'], a:3, hint:R`\(f(5)=4\).`, sol:R`<div class="step">\(\sqrt{k+5}=6\) → 31.</div>` } },
{ u:'irr', id:'O7-20', tag:'함수와 역함수의 교점 거리', c:'c4', t:70, src:OS('07 유리함수와 무리함수','20',87,BIN), q:R`함수 \(f(x)=\sqrt{3x+3}-1\)의 그래프와 역함수 \(f^{-1}\)의 그래프는 두 점 P, Q에서 만난다. 선분 PQ의 길이는?`, ch:[R`\(\sqrt2\)`,R`\(2\sqrt2\)`,R`\(3\sqrt2\)`,R`\(4\sqrt2\)`,R`\(5\sqrt2\)`], a:2, hint:R`증가함수 → \(f(x)=x\).`,
  sol:R`<div class="step">\(\sqrt{3x+3}=x+1\) → \(3x+3=(x+1)^2\) → \(x^2-x-2=0\) → \(-1, 2\).</div><div class="step">\((-1,-1), (2,2)\) → \(3\sqrt2\).</div>`,
  v:{ q:R`\(f(x)=\sqrt{2x+2}-1\)과 역함수의 두 교점 사이 거리는?`, ch:[R`\(\sqrt2\)`,R`\(2\sqrt2\)`,R`\(3\sqrt2\)`,R`\(4\sqrt2\)`,'2'], a:1, hint:R`\(x^2-1=0\).`, sol:R`<div class="step">\((-1,-1),(1,1)\) → \(2\sqrt2\).</div>` } },
{ u:'irr', id:'O7-21', tag:'무리함수 성질 판단', c:'c2', t:100, src:OS('07 유리함수와 무리함수','21',87,BIN), q:R`함수 \(f(x)=-\sqrt{2x-3}+4\)에 대하여 보기에서 옳은 것만을 있는 대로 고른 것은?<div class="key">ㄱ. \(y=f(x)\)의 그래프는 평행이동하여 \(y=-\sqrt{2x}\)의 그래프와 일치시킬 수 있다.<br>ㄴ. \(y=f(x)\)의 그래프는 제1사분면과 제4사분면을 지난다.<br>ㄷ. \(f\)의 역함수는 \(f^{-1}(x)=\dfrac12(x-4)^2-\dfrac32\ (x\le4)\)이다.</div>`, ch:['ㄱ','ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'], a:1, hint:R`ㄷ은 직접 구해서 상수항 확인.`,
  sol:R`<div class="step">ㄱ: \(-\sqrt{2(x-\frac32)}+4\) ✔.</div><div class="step">ㄴ: 시작점 \(\left(\dfrac32,4\right)\)에서 오른쪽 아래로, \(x=\dfrac{19}2\)에서 \(x\)축 통과 → 1, 4사분면 ✔.</div><div class="step">ㄷ: \(\sqrt{2x-3}=4-y\) → \(x=\dfrac12(y-4)^2+\dfrac32\). 역함수 상수항은 \(+\dfrac32\) ✘.</div>`,
  v:{ q:R`\(f(x)=\sqrt{2x-4}-3\)에 대하여 옳은 것은?<div class="key">ㄱ. 평행이동하면 \(y=\sqrt{2x}\)와 일치 ㄴ. 제1, 4사분면을 지난다 ㄷ. 역함수는 \(\dfrac12(x+3)^2+2\ (x\le-3)\)</div>`, ch:['ㄱ','ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'], a:1, hint:R`역함수 정의역은 원래 치역 \(y\ge-3\).`, sol:R`<div class="step">ㄷ은 \(x\ge-3\)이어야 해서 ✘.</div>` } },
{ u:'rat', id:'O7-22', tag:'자기 자신이 역함수 (서술형)', c:'c4', t:90, input:'-1/4', src:OS('07 유리함수와 무리함수','22',87,'서술형 문제'), q:R`유리함수 \(f(x)=\dfrac{ax+1}{x+b}\)의 그래프가 점 \((1,3)\)을 지나고 \(f=f^{-1}\)일 때, \(ab\)의 값을 구하시오. (단, \(a, b\)는 \(ab\ne1\)인 상수이다.) <span class="small">분수는 -1/4처럼 입력</span>`, hint:R`\(f^{-1}(x)=\dfrac{-bx+1}{x-a}\). 같으려면 \(a=-b\).`,
  sol:R`<div class="step">역함수 공식으로 \(f^{-1}=\dfrac{-bx+1}{x-a}\). \(f=f^{-1}\) → \(a=-b\).</div><div class="step">\((1,3)\): \(\dfrac{a+1}{1+b}=3\), \(b=-a\) → \(a+1=3-3a\) → \(a=\dfrac12,\ b=-\dfrac12\).</div><div class="step">\(ab=-\dfrac14\).</div>`,
  v:{ q:R`\(f(x)=\dfrac{ax+1}{x+b}\)가 \((2,1)\)을 지나고 \(f=f^{-1}\)일 때 \(ab\)를 구하시오. (분수는 a/b로 입력)`, input:'-1/9', hint:R`\(a=-b\).`, sol:R`<div class="step">\(\dfrac{2a+1}{2-a}=1\) → \(a=\dfrac13\). \(ab=-\dfrac19\).</div>` } },
{ u:'irr', id:'O7-23', tag:'이동 후 점을 지남 (서술형)', c:'c3', t:100, input:'1', src:OS('07 유리함수와 무리함수','23',87,'서술형 문제'), q:R`함수 \(y=\sqrt{5x+1}-3\)의 그래프를 \(x\)축의 방향으로 \(-4\)만큼, \(y\)축의 방향으로 \(m\)만큼 평행이동한 후, 원점에 대하여 대칭이동한 그래프의 식을 \(y=f(x)\)라 하자. 함수 \(y=f(x)\)의 그래프가 점 \((1,-2)\)를 지날 때, 상수 \(m\)의 값을 구하시오.`, hint:R`원점 대칭: \(x\to-x\), \(y\to-y\).`,
  sol:R`<div class="step">이동: \(y=\sqrt{5x+21}-3+m\).</div><div class="step">원점 대칭: \(-y=\sqrt{-5x+21}-3+m\) → \(y=-\sqrt{-5x+21}+3-m\).</div><div class="step">\((1,-2)\): \(-4+3-m=-2\) → \(m=1\).</div>`,
  v:{ q:R`\(y=\sqrt{2x+1}-2\)를 \(x\)축 방향 \(-1\), \(y\)축 방향 \(m\)만큼 옮긴 후 원점 대칭한 그래프가 \((1,-2)\)를 지날 때 \(m\)을 구하시오.`, input:'3', hint:R`\(y=-\sqrt{-2x+3}+2-m\).`, sol:R`<div class="step">\(-1+2-m=-2\) → 3.</div>` } },
{ u:'rat', id:'O7-24', tag:'평행이동 후 일치', c:'c4', t:60, src:OS('07 유리함수와 무리함수','24',88,GO), q:R`함수 \(y=\dfrac2{x+1}\)의 그래프를 \(x\)축의 방향으로 \(-1\)만큼, \(y\)축의 방향으로 3만큼 평행이동하면 함수 \(y=\dfrac{ax+b}{x+c}\)의 그래프와 일치할 때, \(a+b+c\)의 값은? (단, \(ac\ne b\))`, ch:['11','12','13','14','15'], a:2, hint:R`\(\dfrac2{x+2}+3\)을 통분.`,
  sol:R`<div class="step">\(y=\dfrac2{x+2}+3=\dfrac{3x+8}{x+2}\).</div><div class="step">\(3+8+2=13\).</div>`,
  v:{ q:R`\(y=\dfrac3{x-2}\)를 \(x\)축 방향 \(-1\), \(y\)축 방향 2만큼 옮기면 \(\dfrac{ax+b}{x+c}\)일 때 \(a+b+c\)는?`, ch:['0','1','2','3','4'], a:2, hint:R`\(\dfrac3{x-1}+2\).`, sol:R`<div class="step">\(\dfrac{2x+1}{x-1}\) → 2.</div>` } },
{ u:'rat', id:'O7-25', tag:'점근선과 지나는 점', c:'c3', t:90, src:OS('07 유리함수와 무리함수','25',88,GO), q:R`유리함수 \(y=\dfrac{ax+3}{2x+b}\)의 그래프가 점 \((2,1)\)을 지나고 이 그래프의 점근선의 방정식이 \(x=b+3,\ y=c\)일 때, \(a+b+c\)의 값은? (단, \(ab\ne6\))`, ch:[R`\(-\dfrac{11}4\)`,R`\(-\dfrac52\)`,R`\(-\dfrac94\)`,'−2',R`\(-\dfrac74\)`], a:0, hint:R`세로 점근선 \(x=-\dfrac b2\).`,
  sol:R`<div class="step">\(-\dfrac b2=b+3\) → \(b=-2\). 가로 점근선 \(c=\dfrac a2\).</div><div class="step">\((2,1)\): \(\dfrac{2a+3}{2}=1\) → \(a=-\dfrac12\), \(c=-\dfrac14\).</div><div class="step">\(-\dfrac12-2-\dfrac14=-\dfrac{11}4\).</div>`,
  v:{ q:R`\(y=\dfrac{ax+1}{x+b}\)의 점근선이 \(x=b+2,\ y=c\)이고 \((3,2)\)를 지날 때 \(a+b+c\)는?`, ch:['−1','0','1','2','3'], a:2, hint:R`\(-b=b+2\).`, sol:R`<div class="step">\(b=-1\), \(\dfrac{3a+1}2=2\) → \(a=1=c\). 1.</div>` } },
{ u:'rat', id:'O7-26', tag:'세 점이 한 직선 위', c:'c2', t:150, src:OS('07 유리함수와 무리함수','26',88,GO), q:R`양수 \(k\)에 대하여 유리함수 \(y=\dfrac{k}{x+3}+1\)의 그래프가 \(x\)축, \(y\)축과 만나는 점을 각각 A, B라 하고, 이 그래프의 두 점근선의 교점을 C라 하자. 세 점 A, B, C가 한 직선 위에 있을 때, \(k\times\overline{AB}\)의 값은?`, ch:[R`\(2\sqrt{10}\)`,R`\(4\sqrt{10}\)`,R`\(6\sqrt{10}\)`,R`\(8\sqrt{10}\)`,R`\(10\sqrt{10}\)`], a:2, hint:R`A, B, C 좌표를 \(k\)로 쓰고 기울기 비교.`,
  sol:R`<div class="step">A: \(\dfrac{k}{x+3}=-1\) → \((-3-k,0)\). B: \(\left(0,\dfrac k3+1\right)\). C: \((-3,1)\).</div><div class="step">기울기 CA \(=\dfrac1k\), CB \(=\dfrac{k/3}{3}=\dfrac k9\). 같으려면 \(k^2=9\) → \(k=3\).</div><div class="step">A\((-6,0)\), B\((0,2)\) → \(\overline{AB}=2\sqrt{10}\). \(3\times2\sqrt{10}=6\sqrt{10}\).</div>`,
  v:{ q:R`양수 \(k\)에 대하여 \(y=\dfrac{k}{x+1}+2\)의 \(x\)절편 A, \(y\)절편 B, 점근선 교점 C가 한 직선 위에 있을 때 \(k\times\overline{AB}\)는?`, ch:[R`\(2\sqrt5\)`,R`\(3\sqrt5\)`,R`\(4\sqrt5\)`,R`\(5\sqrt5\)`,R`\(6\sqrt5\)`], a:2, hint:R`기울기 \(\dfrac4k\)와 \(k\).`, sol:R`<div class="step">\(k=2\), A\((-2,0)\), B\((0,4)\) → \(2\times2\sqrt5\).</div>` } },
{ u:'rat', id:'O7-27', tag:'이동·대칭으로 겹치는 그래프', c:'c4', t:90, src:OS('07 유리함수와 무리함수','27',88,GO), q:R`보기의 함수의 그래프에서 함수 \(y=\dfrac3x\)의 그래프와 평행이동하거나 대칭이동하였을 때 일치하는 것만을 있는 대로 고른 것은?<div class="key">ㄱ. \(y=\dfrac{2x+1}{x-1}\) &nbsp; ㄴ. \(y=\dfrac{2x-3}{x}\)<br>ㄷ. \(y=\dfrac{3x-3}{2x-4}\) &nbsp; ㄹ. \(y=\dfrac{x+2}{1-x}\)</div>`, ch:['ㄱ, ㄴ','ㄱ, ㄷ','ㄷ, ㄹ','ㄱ, ㄴ, ㄹ','ㄴ, ㄷ, ㄹ'], a:3, hint:R`\(\dfrac{k}{x-p}+q\)로 바꿨을 때 \(|k|=3\)이면 OK.`,
  sol:R`<div class="step">ㄱ \(2+\dfrac3{x-1}\) ✔. ㄴ \(2-\dfrac3x\) (\(k=-3\), 대칭이동) ✔.</div><div class="step">ㄷ \(\dfrac32+\dfrac{3/2}{x-2}\) → \(k=\dfrac32\) ✘. ㄹ \(-1-\dfrac3{x-1}\) ✔.</div>`,
  v:{ q:R`\(y=\dfrac2x\)와 이동·대칭으로 일치하는 것은?<div class="key">ㄱ. \(\dfrac{x+1}{x-1}\) ㄴ. \(\dfrac{3x-2}x\) ㄷ. \(\dfrac{2x}{x+1}\) ㄹ. \(\dfrac{x+1}{2x}\)</div>`, ch:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ, ㄷ','ㄴ, ㄷ, ㄹ'], a:3, hint:R`ㄹ은 \(k=\dfrac12\).`, sol:R`<div class="step">ㄱ, ㄴ, ㄷ.</div>` } },
{ u:'rat', id:'O7-28', tag:'세 사분면만 지날 조건', c:'c2', t:150, src:OS('07 유리함수와 무리함수','28',88,GO), q:R`집합 \(X=\{k\mid|k|<10\)인 정수\(\}\)의 원소 \(k\)에 대하여 유리함수 \(y=\dfrac{x+k}{x-1}\)의 그래프가 3개의 사분면만을 지나도록 하는 \(k\)의 개수는? (단, \(k\ne-1\))`, ch:['6','7','8','9','10'], a:3, hint:R`\(1+\dfrac{k+1}{x-1}\). \(k+1\)의 부호와 \(y\)절편 \(-k\)로 나눠 그려 보세요.`,
  sol:R`<div class="step">중심 \((1,1)\). \(k+1>0\)이고 \(y\)절편 \(-k<0\)(\(k>0\))이면 왼쪽 가지가 2, 3, 4사분면 + 오른쪽 1사분면 → 4개 ✘.</div><div class="step">\(k=0\): 원점을 지나서 3사분면을 못 가요 → 1, 2, 4사분면 ✔.</div><div class="step">\(k+1<0\) (\(k\le-2\)): 오른쪽 가지 1, 4사분면, 왼쪽 가지 1, 2사분면 → 3개 ✔. \(k=-2\sim-9\): 8개.</div><div class="step">\(8+1=9\).</div>`,
  v:{ q:R`정수 \(k\) (\(|k|<6\), \(k\ne1\))에 대하여 \(y=\dfrac{x+k}{x+1}\)이 3개의 사분면만 지나는 \(k\)의 개수는?`, ch:['3','4','5','6','7'], a:2, hint:R`\(1+\dfrac{k-1}{x+1}\).`, sol:R`<div class="step">\(k>1\): 1, 2, 3사분면 ✔ (2, 3, 4, 5). \(k=0\) ✔. \(k<0\): 4개 사분면 ✘. 총 5.</div>` } },
{ u:'rat', id:'O7-29', tag:'합성함수의 점근선', c:'c4', t:90, src:OS('07 유리함수와 무리함수','29',88,GO), q:R`두 함수 \(f(x)=\dfrac{x+3}{x-2}\), \(g(x)=(f\circ f)(x)\)에 대하여 함수 \(y=g(x)\)의 그래프의 점근선의 방정식이 \(x=a,\ y=b\)일 때, \(a+b\)의 값은?`, ch:['1','2','3','4','5'], a:2, hint:R`\(f(f(x))\)를 분자·분모에 \((x-2)\)를 곱해 정리.`,
  sol:R`<div class="step">\(f(f(x))=\dfrac{\frac{x+3}{x-2}+3}{\frac{x+3}{x-2}-2}=\dfrac{4x-3}{-x+7}\).</div><div class="step">점근선 \(x=7,\ y=-4\) → 3.</div>`,
  v:{ q:R`\(f(x)=\dfrac{2x+1}{x-1}\), \(g=f\circ f\)의 점근선이 \(x=a, y=b\)일 때 \(a+b\)는?`, ch:['1','2','3','4','5'], a:2, hint:R`\(\dfrac{5x+1}{x+2}\).`, sol:R`<div class="step">\(-2+5=3\).</div>` } },
{ u:'rat', id:'O7-30', tag:'합성의 반복 (주기)', c:'c1', t:80, src:OS('07 유리함수와 무리함수','30',89,GO), q:R`함수 \(f(x)=\dfrac{1-x}{1+x}\)에 대하여 \(f^1=f,\ f^{n+1}=f\circ f^n\)으로 정의할 때, \(f^{25}(3)\)의 값은?`, ch:['−2',R`\(-\dfrac12\)`,R`\(-\dfrac13\)`,R`\(\dfrac12\)`,'3'], a:1, hint:R`\(f(3)\), \(f(f(3))\)만 계산.`,
  sol:R`<div class="step">\(f(3)=-\dfrac12\), \(f\left(-\dfrac12\right)=3\). 2번마다 제자리.</div><div class="step">25는 홀수 → \(-\dfrac12\).</div>`,
  v:{ q:R`\(f(x)=\dfrac{1+x}{1-x}\)일 때 \(f^{30}(2)\)는?`, ch:['−3',R`\(-\dfrac12\)`,R`\(\dfrac13\)`,'2','3'], a:1, hint:R`4번마다 제자리.`, sol:R`<div class="step">\(2\to-3\to-\frac12\to\frac13\to2\). \(30=4\times7+2\) → \(-\dfrac12\).</div>` } },
{ u:'rat', id:'O7-31', tag:'y=x 대칭 = 역함수', c:'c4', t:60, src:OS('07 유리함수와 무리함수','31',89,GO), q:R`두 유리함수 \(f(x)=\dfrac{2x+4}{3x-5}\), \(g(x)=\dfrac{ax+b}{3x+c}\)의 그래프가 직선 \(y=x\)에 대하여 대칭일 때, \(a+b+c\)의 값은? (단, \(a, b, c\)는 \(ac\ne3b\)인 상수이다.)`, ch:['6','7','8','9','10'], a:1, hint:R`\(g=f^{-1}\).`,
  sol:R`<div class="step">\(f^{-1}=\dfrac{5x+4}{3x-2}\) → \(a=5,\ b=4,\ c=-2\). 합 7.</div>`,
  v:{ q:R`\(f(x)=\dfrac{3x+1}{2x-3}\)과 \(g(x)=\dfrac{ax+b}{2x+c}\)가 \(y=x\)에 대칭일 때 \(a+b+c\)는?`, ch:['−1','0','1','2','3'], a:2, hint:R`\(f^{-1}=f\).`, sol:R`<div class="step">\(3+1-3=1\).</div>` } },
{ u:'inv', id:'O7-32', tag:'합성함수에서 역함수 값', c:'c2', t:90, src:OS('07 유리함수와 무리함수','32',89,GO), q:R`두 함수 \(f, g\)에 대하여 \(f(x)=\dfrac{x}{x+1}\), \((g\circ f)(x)=\dfrac{x-2}{x-1}\)일 때, \(g^{-1}(4)\)의 값은?`, ch:[R`\(\dfrac15\)`,R`\(\dfrac25\)`,R`\(\dfrac35\)`,R`\(\dfrac45\)`,'1'], a:1, hint:R`\(g(f(x))=4\)인 \(x\)를 먼저 찾고, 그 \(f(x)\)가 답.`,
  sol:R`<div class="step">\(\dfrac{x-2}{x-1}=4\) → \(x=\dfrac23\).</div><div class="step">그때 \(g(f(\frac23))=4\) → \(g^{-1}(4)=f\left(\dfrac23\right)=\dfrac25\).</div>`,
  v:{ q:R`\(f(x)=\dfrac{x}{x-1}\), \((g\circ f)(x)=\dfrac{x+1}{x}\)일 때 \(g^{-1}(3)\)은?`, ch:['−2','−1','0','1','2'], a:1, hint:R`\(x=\dfrac12\).`, sol:R`<div class="step">\(f(\frac12)=-1\).</div>` } },
{ u:'rat', id:'O7-33', tag:'최댓값으로 최솟값', c:'c3', t:90, src:OS('07 유리함수와 무리함수','33',89,GO), q:R`\(2\le x\le4\)에서 유리함수 \(y=\dfrac{ax+2}{x-1}\)의 최댓값이 8일 때, 최솟값을 \(m\)이라 하자. \(a+m\)의 값은? (단, \(a\)는 \(a\ne-2\)인 상수이다.)`, ch:['7',R`\(\dfrac{22}3\)`,R`\(\dfrac{23}3\)`,'8',R`\(\dfrac{25}3\)`], a:2, hint:R`\(a+\dfrac{a+2}{x-1}\). 감소 가정하고 확인.`,
  sol:R`<div class="step">\(a+2>0\)이면 감소: \(f(2)=2a+2=8\) → \(a=3\) (✔ \(a+2>0\)).</div><div class="step">\(m=f(4)=\dfrac{14}3\). \(3+\dfrac{14}3=\dfrac{23}3\).</div><div class="step">(증가라 가정하면 \(f(4)=8\) → \(a=\dfrac{11}2\)인데 \(a+2<0\)과 모순.)</div>`,
  v:{ q:R`\(2\le x\le3\)에서 \(y=\dfrac{ax+1}{x-1}\)의 최댓값이 5일 때 최솟값 \(m\)에 대해 \(a+m\)은?`, ch:[R`\(\dfrac92\)`,'5',R`\(\dfrac{11}2\)`,'6',R`\(\dfrac{13}2\)`], a:2, hint:R`\(f(2)=2a+1=5\).`, sol:R`<div class="step">\(a=2\), \(m=\dfrac72\) → \(\dfrac{11}2\).</div>` } },
{ u:'rat', id:'O7-34', tag:'곡선과 직선이 만날 범위', c:'c2', t:100, src:OS('07 유리함수와 무리함수','34',89,GO), q:R`\(2\le x\le4\)에서 정의된 함수 \(y=\dfrac{3x}{x-1}\)의 그래프와 직선 \(y=a(x-1)\)이 만나도록 하는 실수 \(a\)의 최댓값을 \(M\), 최솟값을 \(m\)이라 할 때, \(Mm\)의 값은?`, ch:['4','5','6','7','8'], a:4, hint:R`직선은 항상 \((1,0)\)을 지나요. 곡선의 양 끝점을 지날 때가 경계.`,
  sol:R`<div class="step">곡선 끝점: \((2,6)\), \((4,4)\). 직선은 \((1,0)\)을 축으로 돌아요.</div><div class="step">\((2,6)\)을 지날 때 \(a=6\), \((4,4)\)를 지날 때 \(a=\dfrac43\).</div><div class="step">\(Mm=6\times\dfrac43=8\).</div>`,
  v:{ q:R`\(2\le x\le3\)에서 \(y=\dfrac{2x}{x-1}\)과 \(y=a(x-1)\)이 만나는 \(a\)의 최댓값과 최솟값의 곱은?`, ch:['4','5','6','7','8'], a:2, hint:R`끝점 \((2,4), (3,3)\).`, sol:R`<div class="step">\(4\times\dfrac32=6\).</div>` } },
{ u:'rat', id:'O7-35', tag:'수선의 길이 합의 최솟값', c:'c3', t:100, src:OS('07 유리함수와 무리함수','35',89,GO), q:R`함수 \(y=\dfrac{2x-1}{x-2}\ (x>2)\)의 그래프 위의 한 점 P에서 \(x\)축과 \(y\)축에 내린 수선의 발을 각각 A, B라 할 때, \(\overline{PA}+\overline{PB}\)의 최솟값은?`, ch:[R`\(2+\sqrt3\)`,R`\(2+2\sqrt3\)`,R`\(4+\sqrt3\)`,R`\(4+2\sqrt3\)`,R`\(6+\sqrt3\)`], a:3, hint:R`P\((t, 2+\frac3{t-2})\). PA는 \(y\)좌표, PB는 \(x\)좌표.`,
  sol:R`<div class="step">\(\overline{PA}+\overline{PB}=t+2+\dfrac3{t-2}=(t-2)+\dfrac3{t-2}+4\).</div><div class="step">\(\ge2\sqrt3+4\).</div>`,
  v:{ q:R`\(y=\dfrac{x+1}{x-1}\ (x>1)\) 위의 점 P에서 두 축에 내린 수선의 길이 합의 최솟값은?`, ch:[R`\(2+\sqrt2\)`,R`\(2+2\sqrt2\)`,R`\(3+2\sqrt2\)`,R`\(4+\sqrt2\)`,R`\(4+2\sqrt2\)`], a:1, hint:R`\((t-1)+\dfrac2{t-1}+2\).`, sol:R`<div class="step">\(2\sqrt2+2\).</div>` } },
];
